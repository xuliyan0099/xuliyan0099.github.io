<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0, lane: 0 };
var state = { step: INIT.step, lane: INIT.lane };

var STEPS = [
  { h: '四线全双工 + 双向 FIFO', hint: '64×32 · 4 片选',
    note: 'ECSPI 是四线同步全双工：SCLK、MOSI、MISO、SS。收发各 64 条 32 位深度 FIFO，四路片选可以挂四颗从机。参考时钟来自 CCM 的 ecspi_clk_root，不是模块自己产生。' },
  { h: 'SPI 时钟怎么算', hint: 'PRE / POST / 等待',
    note: '两级分频：SCLK = 参考时钟 / (PRE_DIVIDER+1) / 2^POST_DIVIDER。60 MHz 进、想要 10 MHz 就 PRE=5；想要慢到 1 MHz 以下就靠 POST。PERIODREG 还能在帧之间插等待，慢器件全靠它。' },
  { h: '三个控制寄存器', hint: 'CONREG · CONFIGREG',
    note: 'CONREG 定位宽、片选、分频、通道主从和使能；CONFIGREG 定每路通道的 POL/PHA、片选极性、片选波形。两者都是「每通道一位」的位域，写之前先想清楚是哪一路。' },
  { h: '四种时序与握手', hint: 'POL/PHA · SPI_RDY',
    note: 'POL/PHA 四个组合就是 SPI mode 0–3，配错就是从机认不出数据。SS_CTL 决定一帧一拉还是多帧连续；SMC=1 写 FIFO 就发；DRCTL 让外部 SPI_RDY 决定什么时候发。' },
  { h: 'FIFO 水位与 burst', hint: 'THRESHOLD · 64 深',
    note: '收发各 64 条 32 位；THRESHOLD 决定“水到多少才请求 DMA/发中断”。水位设太高 → 一次搬得爽但延迟大；设太低 → 中断风暴。' },
  { h: '四片选与多从机', hint: 'SS0–3 · 独立时序',
    note: '四路片选可挂四颗从机，但 POL/PHA、位宽、分频都是“每通道一位”，换通道就得整组一起改；SS_CTL 决定连续拉还是分帧拉。' },
  { h: '收发流程与判据', hint: 'EN · XCH · STATREG',
    note: 'EN=0 时其余寄存器读出来全是 0、写进去也不生效，这是第一个坑。填 TXFIFO、置 XCH、等 TC 或轮询 XCH 自动清零、读 RXFIFO —— 四个动作构成一次完整交换。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }

function drawRole() {
  txt(scene, 56, 146, '四根线、两个 64 深 FIFO、四路片选：这是全双工同步串行，不是「发完再收」', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '四根线各干什么');
  txt(scene, 80, 252, 'SCLK：主机出的时钟，从机跟着它移', 't20w');
  txt(scene, 80, 288, 'MOSI：主出从入，一次一位', 't20w');
  txt(scene, 80, 324, 'MISO：主入从出，和 MOSI 同时发生', 't20w');
  txt(scene, 80, 360, 'SS[3:0]：四路片选，一次只拉一根', 't20w');
  txt(scene, 80, 396, '全双工的意思是「发一个字节就收一个」', 't20w');
  txt(scene, 80, 432, '所以只读不写也要往 TXFIFO 塞哑数据', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'FIFO 与中断');
  txt(scene, 680, 252, 'TX / RX 各 64 条 32 位，不是一个字节', 't20w');
  txt(scene, 680, 288, '写满 64 字再置 XCH，可连发 64 次', 't20w');
  txt(scene, 680, 324, 'RX 到阈值才中断，少打很多次', 't20w');
  txt(scene, 680, 360, '溢出会置 RO，硬件直接丢数据', 't20w');
  txt(scene, 680, 396, 'FIFO 深度是「64 个 32 位字」，别按字节算', 't20w');
  txt(scene, 680, 432, '一次传输的位数由 BURST_LENGTH 定', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '四个基址，四路通道');
  txt(scene, 1280, 252, 'ECSPI1 0x0200_8000', 't20s');
  txt(scene, 1280, 288, 'ECSPI2 0x0200_C000', 't20s');
  txt(scene, 1280, 324, 'ECSPI3 0x0201_0000', 't20s');
  txt(scene, 1280, 360, 'ECSPI4 0x0201_4000', 't20s');
  txt(scene, 1280, 396, '每路内部还有 4 条通道（SS0–SS3）', 't20w');
  txt(scene, 1280, 432, '「4 路 ECSPI」×「4 条通道」= 16 个片选', 't20w');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, '七个特性，决定了它适合接什么');
  txt(scene, 80, 522, '① 主从可配：CHANNEL_MODE 每位管一条通道，同一颗芯片可以一路当主、另一路当从。', 't20w');
  txt(scene, 80, 556, '② 四路片选：SS[3:0] 由 CHANNEL_SELECT 选，挂四颗从机不用外加译码器。', 't20w');
  txt(scene, 80, 590, '③ 续传：BURST_LENGTH 大于 31 时一个字接一个字地发，理论上一帧可以无限长。', 't20w');
  txt(scene, 80, 658, '④ 极性相位可配：每通道独立 SCLK_POL / SCLK_PHA，配出 mode 0–3。', 't20w');
  txt(scene, 80, 624, '⑤ 片选也带极性与波形：SS_POL 决定有效电平，SS_CTL 决定帧间是否抬起。', 't20w');
  txt(scene, 80, 692, '⑥ 支持 DMA：DMAREG 里配阈值与长度，FIFO 到水位就发请求，CPU 不用管。', 't20w');
  txt(scene, 80, 726, '⑦ 最高频率等于参考时钟 —— 也就是分频系数全为 1 时的那一档，实际不会这么用。', 't20w');
  txt(scene, 80, 760, '低功耗注意：ECSPI 在低功耗模式下不工作，门一关主模式就停、从模式干脆不响应。', 't20w');
}

function drawClock() {
  txt(scene, 56, 146, 'SCLK = 参考时钟 ÷ (PRE+1) ÷ 2^POST；算不出来就是分频位写错了', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '两级分频');
  txt(scene, 80, 252, 'PRE_DIVIDER[15:12]：值 +1 才是除数', 't20w');
  txt(scene, 80, 288, '0000→÷1 … 1111→÷16，最大 16', 't20w');
  txt(scene, 80, 324, 'POST_DIVIDER[11:8]：÷2^n，n=0–15', 't20w');
  txt(scene, 80, 360, 'POST=0 就是 ÷1，别当成「关掉」', 't20w');
  txt(scene, 80, 396, '参考时钟来自 CCM 的 ecspi_clk_root', 't20w');
  txt(scene, 80, 432, '6ULL 上可选 60 MHz 或 24 MHz 晶振', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '按 60 MHz 算四档');
  txt(scene, 680, 252, 'PRE=0、POST=0 → 60 MHz（极限）', 't20s');
  txt(scene, 680, 288, 'PRE=5、POST=0 → 10 MHz', 't20s');
  txt(scene, 680, 324, 'PRE=1、POST=2 → 60/2/4 = 7.5 MHz', 't20s');
  txt(scene, 680, 360, 'PRE=14、POST=2 → 60/15/4 = 1 MHz', 't20s');
  txt(scene, 680, 396, 'PRE=15、POST=15 → 60/16/32768 ≈ 114 Hz', 't20s');
  txt(scene, 680, 432, '慢到这种程度只能靠 SAMPLE_PERIOD 帮忙', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '慢器件的三个旋钮');
  txt(scene, 1280, 252, 'SAMPLE_PERIOD[14:0]：帧间插等待', 't20w');
  txt(scene, 1280, 288, 'CSRC=0 用 SCLK 计，=1 用 32.768 kHz', 't20w');
  txt(scene, 1280, 324, '32767 个 32 k 周期≈1 秒', 't20w');
  txt(scene, 1280, 360, 'CSD_CTL[21:16]：片选到第一个时钟的间隔', 't20w');
  txt(scene, 1280, 396, '0–63 个 SCLK，给需要建立时间的从机', 't20w');
  txt(scene, 1280, 432, '两者都只在主模式下有效', 't20w');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, '三个容易算错的账');
  txt(scene, 80, 522, '第一：PRE 是「值 + 1」而不是「值」。写 0 是 ÷1，写 15 是 ÷16，写 16 就越界了。', 't20w');
  txt(scene, 80, 556, '第二：POST 是指数。写 3 是 ÷8，写 8 是 ÷256，差一位就是 32 倍，示波器一看就懵。', 't20w');
  txt(scene, 80, 590, '第三：参考时钟不是固定 60 M —— CCM 里 ECSPI 的根可以选 60 M 或 OSC 24 M，先查 CBCMR。', 't20w');
  txt(scene, 80, 624, '验证方法：把 SCLK 频率量出来，除以你写的分频，反算参考时钟；对不上就是根选错了。', 't20w');
  txt(scene, 80, 658, 'CSD_CTL 不写 0 以外的值也有代价：默认 0 表示片选一拉就出时钟，某些从机需要几纳秒建立时间。', 't20w');
  txt(scene, 80, 692, 'SAMPLE_PERIOD 是「帧间」等待，不是「帧内」；帧内的位间隔由 SCLK 决定，改不了。', 't20w');
  txt(scene, 80, 726, '用 32 k 做时基时（CSRC=1），等待时间与 SCLK 无关，适合「每 100 ms 采一次」这种慢活。', 't20w');
  txt(scene, 80, 760, '记住这个顺序：先定参考时钟 → 再定 SCLK → 最后用 PERIODREG 补时序余量。', 't20w');
}

function drawRegs() {
  txt(scene, 56, 146, 'CONREG 定「怎么发」，CONFIGREG 定「电气长什么样」，两者都是每通道一位的位域', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, 'CONREG（+0x08）');
  txt(scene, 80, 252, '[31:20] BURST_LENGTH：位数 −1', 't20w');
  txt(scene, 80, 288, '[19:18] CHANNEL_SELECT：选 SS0–SS3', 't20w');
  txt(scene, 80, 324, '[17:16] DRCTL：SPI_RDY 用法', 't20w');
  txt(scene, 80, 360, '[15:12] PRE ÷1–16、[11:8] POST ÷2^n', 't20w');
  txt(scene, 80, 396, '[7:4] CHANNEL_MODE：每位一路，1=主', 't20w');
  txt(scene, 80, 432, '[3] SMC · [2] XCH · [1] HT · [0] EN', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'CONFIGREG（+0x0C）');
  txt(scene, 680, 252, '[3:0] SCLK_PHA：每通道一位', 't20w');
  txt(scene, 680, 288, '[7:4] SCLK_POL：每通道一位', 't20w');
  txt(scene, 680, 324, '[11:8] SS_CTL：每通道一位', 't20w');
  txt(scene, 680, 360, '[15:12] SS_POL：0 低有效 / 1 高有效', 't20w');
  txt(scene, 680, 396, '[19:16] DATA_CTL：空闲时数据线电平', 't20w');
  txt(scene, 680, 432, '[23:20] SCLK_CTL：空闲时 SCLK 电平', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '其余四个寄存器');
  txt(scene, 1280, 252, '+0x14 DMAREG：阈值 + 长度 + 使能', 't20w');
  txt(scene, 1280, 288, '+0x18 STATREG，复位 0x0000_0003', 't20s');
  txt(scene, 1280, 324, 'bit0 TE、bit1 TDR 复位即 1', 't20w');
  txt(scene, 1280, 360, '+0x1C PERIODREG：CSRC + 等待 + CSD', 't20w');
  txt(scene, 1280, 396, '+0x20 TESTREG：内部环回自测', 't20w');
  txt(scene, 1280, 432, '+0x40 MSGDATA：HT 模式专用，本芯片不支持', 't20w');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, 'STATREG 五位 + INTREG 八位，读状态比读文档快');
  txt(scene, 80, 522, 'STATREG bit7 TC：一次交换完成（写 1 清）；bit3 RR：RXFIFO 里至少有一个字。', 't20w');
  txt(scene, 80, 556, 'bit6 RO：RXFIFO 溢出，写 1 清；bit5 RF 满、bit2 TF 满、bit1 TDR 可写、bit0 TE 空。', 't20w');
  txt(scene, 80, 590, 'INTREG：bit7 TCEN、bit6 ROEN、bit5 RFEN、bit4 RDREN、bit3 RREN、bit2 TFEN、bit1 TDREN、bit0 TEEN。', 't20w');
  txt(scene, 80, 624, '复位值 0x3 很容易骗人：TE=1 表示 TXFIFO 空、TDR=1 表示「还能写」—— 这是空闲状态，不是错误。', 't20w');
  txt(scene, 80, 658, 'BURST_LENGTH 的语义：0x00 只发最低 1 位、0x1F 发满 32 位；0x20 表示「首字 1 位 + 后续整字」。', 't20w');
  txt(scene, 80, 692, '续传就是这样实现的：一个 XCH 把 FIFO 里所有字按 BURST_LENGTH 规则串成一帧发出去。', 't20w');
  txt(scene, 80, 726, 'HT 位与 MSGDATA 在本芯片上无效，手册明写「not supported by this product」，别照老驱动抄。', 't20w');
  txt(scene, 80, 760, 'EN=0 时所有寄存器读回 0：这不是「复位失败」，是模块被关掉了 —— 调试先读 EN。', 't20w');
}

function drawTiming() {
  txt(scene, 56, 146, 'POL/PHA 四个组合就是 SPI mode 0–3；配错就是从机能收到时钟、却认不出数据', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '四个组合');
  txt(scene, 80, 252, 'POL=0 PHA=0 → mode 0，空闲低、上升沿采', 't20w');
  txt(scene, 80, 288, 'POL=0 PHA=1 → mode 1，空闲低、下降沿采', 't20w');
  txt(scene, 80, 324, 'POL=1 PHA=0 → mode 2，空闲高、下降沿采', 't20w');
  txt(scene, 80, 360, 'POL=1 PHA=1 → mode 3，空闲高、上升沿采', 't20w');
  txt(scene, 80, 396, '从机手册写的 CPOL/CPHA 就是这两位', 't20w');
  txt(scene, 80, 432, '配错的典型症状：读回 0x00 或 0xFF', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '片选怎么拉');
  txt(scene, 680, 252, 'SS_CTL=0：整帧只拉一次，帧间抬起', 't20w');
  txt(scene, 680, 288, 'SS_CTL=1：每帧之间都抬一次再拉', 't20w');
  txt(scene, 680, 324, '多帧连续发时用 1，从机靠边沿分帧', 't20w');
  txt(scene, 680, 360, 'SS_POL=0 低有效（绝大多数器件）', 't20w');
  txt(scene, 680, 396, 'SS_CTL 在从机模式必须为 0', 't20w');
  txt(scene, 680, 432, '从机靠 SS 边沿结束一帧并推进 RXFIFO', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '什么时候开始发');
  txt(scene, 1280, 252, 'SMC=0：靠 XCH 位启动（最常用）', 't20w');
  txt(scene, 1280, 288, 'SMC=1：写 TXFIFO 就立刻发', 't20w');
  txt(scene, 1280, 324, 'DRCTL=00：不管 SPI_RDY', 't20w');
  txt(scene, 1280, 360, 'DRCTL=01：等 SPI_RDY 下降沿', 't20w');
  txt(scene, 1280, 396, 'DRCTL=10：SPI_RDY 低电平期间连发', 't20w');
  txt(scene, 1280, 432, 'SPI_RDY 是给 ADC/从机「我准备好了」用的', 't20w');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, '三种模式判据 + 一个必须记住的细节');
  txt(scene, 80, 522, '典型主模式：拉 SS → 出 SCLK → MOSI 在上升沿变、MISO 在下降沿被采（mode 0 的时序）。', 't20w');
  txt(scene, 80, 556, '带 SPI_RDY 的主模式：从机没准备好就不发时钟，省掉固定延时，适合 ADC 转换期间等待。', 't20w');
  txt(scene, 80, 590, '带等待的主模式：帧与帧之间插 SAMPLE_PERIOD 个节拍，靠 PERIODREG 补齐从机的恢复时间。', 't20w');
  txt(scene, 80, 624, '从模式：SS 是输入，主机拉低才开始收；BURST_LENGTH 必须写准，否则帧边界错、数据全移位。', 't20w');
  txt(scene, 80, 658, '细节：SS_CTL 在从机模式必须为 0（手册明写不支持 1），照主模式的配置抄过去会直接不通。', 't20w');
  txt(scene, 80, 692, '另一个细节：从机靠 SS 边沿把移位寄存器的内容推进 RXFIFO，边沿极性由 SS_POL 决定。', 't20w');
  txt(scene, 80, 726, '主模式全双工：发 N 个字节必然收 N 个字节，只读器件也要塞 N 个哑字进 TXFIFO。', 't20w');
  txt(scene, 80, 760, '判据顺序：先量 SCLK 有没有 → 再量 SS 有没有拉 → 再查 POL/PHA → 最后看 MISO 上有没有数据。', 't20w');
}

function drawFlow() {
  txt(scene, 56, 146, 'EN=0 时一切都是假象：寄存器读回 0，写进去也不生效', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '主模式五步');
  txt(scene, 80, 252, '① EN=0 复位模块，开 CCM 的门', 't20w');
  txt(scene, 80, 288, '② 配 CONREG：分频、位宽、通道', 't20w');
  txt(scene, 80, 324, '③ 配 CONFIGREG：POL/PHA/SS', 't20w');
  txt(scene, 80, 360, '④ 置 EN=1，再配 IOMUX', 't20w');
  txt(scene, 80, 396, '⑤ 填 TXFIFO → 置 XCH → 等完成', 't20w');
  txt(scene, 80, 432, '顺序反了就会「写了没反应」', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '判据三件套');
  txt(scene, 680, 252, 'STATREG bit7 TC：交换完成', 't20w');
  txt(scene, 680, 288, 'CONREG bit2 XCH：忙时自动为 1', 't20w');
  txt(scene, 680, 324, 'XCH 清零 = 发完了，不用等 TC', 't20w');
  txt(scene, 680, 360, 'STATREG bit3 RR：RXFIFO 有数据', 't20w');
  txt(scene, 680, 396, 'STATREG bit6 RO：溢出，数据丢了', 't20w');
  txt(scene, 680, 432, '溢出只能写 1 清标志，数据回不来', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '四个坑');
  txt(scene, 1280, 252, '坑一：EN=0 时读到全 0，误判「硬件坏了」', 't20w');
  txt(scene, 1280, 288, '坑二：只置 EN 不配 IOMUX，引脚还是 GPIO', 't20w');
  txt(scene, 1280, 324, '坑三：CHANNEL_MODE 配错路，SS0 不动', 't20w');
  txt(scene, 1280, 360, '坑四：读 RXFIFO 前没看 RR，读到旧值', 't20w');
  txt(scene, 1280, 396, '补充：TXFIFO 只有 64 深，循环写要查 TF', 't20w');
  txt(scene, 1280, 432, '补充：DMA 阈值配错，请求永远不来', 't20w');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, '板级真相：四路 SPI 的脚几乎都和别的外设抢');
  txt(scene, 80, 522, 'ECSPI2 的 SCLK/SS0/MOSI/MISO 与 CSI_DATA00–03 共用 E4/E3/E2/E1 —— 接了摄像头就不能接 SPI2。', 't20w');
  txt(scene, 80, 556, 'ECSPI3 占 NAND_CE0/CE1/CLE（C5/B5/A4）与 MISO，ECSPI4 占 NAND_DATA04–07（C6/B6/A6/A5）。', 't20w');
  txt(scene, 80, 590, '也就是说：跑 NAND 就用不了 ECSPI3/4；MINI 板把 ECSPI3 引到排针，正好是「不用 NAND 时可用」。', 't20w');
  txt(scene, 80, 624, '板上没有 SPI Flash 走 ECSPI1，所以这四路里最容易空出来的是 ECSPI1 与 ECSPI2。', 't20w');
  txt(scene, 80, 658, '接 SPI 屏/传感器前先查原理图这三行，比在驱动里改半天便宜得多。', 't20w');
  txt(scene, 80, 692, 'Linux 侧：spidev 挂 /dev/spidevB.C，用 SPI_IOC_MESSAGE 一次提交多段，正好对应 FIFO 连续发。', 't20w');
  txt(scene, 80, 726, '自测顺序：TESTREG 环回先确认模块活着 → 再往外接器件 → 最后量 SCLK 频率。', 't20w');
  txt(scene, 80, 760, '三条同时成立才算通：XCH 会自己清零、TC 会置、读回的字和你发的一致（或从机确实应答）。', 't20w');
}

function drawFifo() {
  txt(scene, 56, 146, 'ECSPI 的吞吐全在 FIFO 上：64 条 32 位、收发各一，水位决定什么时候找 CPU 或 DMA 要数据', 't24w');

  box(56, 176, 560, 236, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '容量');
  txt(scene, 80, 252, 'TXFIFO 64 × 32 bit', 't20w');
  txt(scene, 80, 288, 'RXFIFO 64 × 32 bit', 't20w');
  txt(scene, 80, 324, '每帧 1–32 位可配', 't20w');
  txt(scene, 80, 360, '32 位一帧时刚好 64 次交换', 't20w');
  txt(scene, 80, 396, '满/空各有状态位', 't20w');

  box(656, 176, 560, 236, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '水位（THRESHOLD）');
  txt(scene, 680, 252, 'TX 低于阈值 → 请求填充', 't20w');
  txt(scene, 680, 288, 'RX 高于阈值 → 请求取走', 't20w');
  txt(scene, 680, 324, '中断与 DMA 都看这个数', 't20w');
  txt(scene, 680, 360, '设一半（32）最常用', 't20w');
  txt(scene, 680, 396, '设太高 → 延迟大、易欠载', 't20w');

  box(1256, 176, 612, 236, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '三种搬运方式');
  txt(scene, 1280, 252, '① 轮询：读 STATREG 的 TE/RE', 't20w');
  txt(scene, 1280, 288, '② 中断：按水位触发', 't20w');
  txt(scene, 1280, 360, '③ DMA：SDMA 按请求搬', 't20w');
  txt(scene, 1280, 396, '长帧用 DMA 最省 CPU', 't20w');
  txt(scene, 1280, 324, '短帧用轮询最简单', 't20w');

  box(56, 432, 1812, 360, 'var(--surface)', 'var(--guide)');
  head(80, 470, '水位设错的两种典型症状');
  txt(scene, 80, 508, '症状一：数据偶发错位。TX 水位设太高，FIFO 被一次灌满后 SCKL 连续跑，中途没补上就出现空帧。', 't20w');
  txt(scene, 80, 542, '症状二：CPU 占用 100%。水位设太低（比如 4），每 4 个字就中断一次，中断开销比搬数据还大。', 't20w');
  txt(scene, 80, 576, '经验值：DMA 模式设 32（半满），中断模式设 16，纯轮询不需要设水位。', 't20w');
  txt(scene, 80, 610, 'burst 长度要与水位匹配：一次 DMA 搬的字节数应是水位整数倍，否则会出现“搬一半、剩一半”。', 't20w');
  txt(scene, 80, 644, 'SPI 是“发一个收一个”的：只发不收也会把 RXFIFO 灌满，所以读操作必须同时把假数据发出去。', 't20w');
  txt(scene, 80, 678, '判据：连续发 1000 帧，RXFIFO 溢出位应始终为 0、TX 欠载位不应置 1。', 't20w');
  txt(scene, 80, 712, '若溢出位置 1，先查水位与 burst 是否匹配，再查从机是否“回得比你要得慢”。', 't20w');
}

function drawMulti() {
  txt(scene, 56, 146, '四路片选能挂四颗从机，但时分复用一条总线：谁的时序、谁的位宽，都要在换通道时一起改', 't24w');

  box(56, 176, 560, 236, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '四路片选');
  txt(scene, 80, 252, 'SS0–SS3 各一根低有效线', 't20w');
  txt(scene, 80, 288, 'CONREG 里 CHANNEL_MODE 选当前路', 't20w');
  txt(scene, 80, 324, '一次只有一路在动', 't20w');
  txt(scene, 80, 360, '换路前要等上一帧结束', 't20w');
  txt(scene, 80, 396, '别在两帧之间硬切', 't20w');

  box(656, 176, 560, 236, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '每通道独立项');
  txt(scene, 680, 252, 'POL / PHA（mode 0–3）', 't20w');
  txt(scene, 680, 288, '位宽（1–32 bit）', 't20w');
  txt(scene, 680, 324, '片选极性与波形', 't20w');
  txt(scene, 680, 360, '分频是全局还是每路', 't20w');
  txt(scene, 680, 396, '以 CONREG 位域为准', 't20w');

  box(1256, 176, 612, 236, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '总线上挂多颗的坑');
  txt(scene, 1280, 252, 'MISO 是三态，未选中的必须高阻', 't20w');
  txt(scene, 1280, 288, '否则两颗同时驱动 → 数据打架', 't20w');
  txt(scene, 1280, 324, '上拉/下拉决定空闲电平', 't20w');
  txt(scene, 1280, 360, '片选间要留空隙（PERIODREG）', 't20w');
  txt(scene, 1280, 396, '太密 → 从机来不及释放', 't20w');

  box(56, 432, 1812, 360, 'var(--surface)', 'var(--guide)');
  head(80, 470, '换通道的正确姿势');
  txt(scene, 80, 508, '① 等 TC（当前帧结束）→ ② 改 CONREG 的通道与位宽 → ③ 改 CONFIGREG 的 POL/PHA → ④ 填 TXFIFO → ⑤ 置 XCH。', 't20w');
  txt(scene, 80, 542, '顺序错在第①步最常见：上一帧还在发就切通道，从机会收到一串“半个时钟”的垃圾。', 't20w');
  txt(scene, 80, 576, '若两颗从机的 mode 不同（一颗 mode0、一颗 mode3），必须整组改 POL/PHA，不能只改片选。', 't20w');
  txt(scene, 80, 610, '分频若是全局的，两颗从机就只能共用同一个 SCLK；想各跑各的，就得用两路 ECSPI。', 't20w');
  txt(scene, 80, 644, '用逻辑分析仪同时抓 SCLK、MOSI、SS：换通道时应该看到 SS 先高、再低，中间没有多余时钟。', 't20w');
  txt(scene, 80, 678, '判据：切换后用示波器量未选中从机的 MISO 应为高阻（电平由上拉决定），不是被拉低。', 't20w');
  txt(scene, 80, 712, '多从机项目里最值的投资是一份“通道表”：路号、从机、mode、位宽、分频，写死一处，别散在驱动里。', 't20w');
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawRole();
  else if (s === 1) drawClock();
  else if (s === 2) drawRegs();
  else if (s === 3) drawTiming();
  else if (s === 4) drawFifo();
  else if (s === 5) drawMulti();
  else drawFlow();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () {
  state.step = INIT.step; state.lane = INIT.lane; draw();
});
fitCanvas($('viewport'), $('canvas'), draw);
</script>
