<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0 };
var state = { step: INIT.step };

var STEPS = [
  { h: '三个看门狗', hint: '0x020B_C000 起',
    note: 'WDOG1/2/3 各管一块：WDOG1 常在 A7 侧，WDOG3 管 M4，复位范围不同。' },
  { h: '超时是 0.5 秒一格', hint: 'WT 8 位',
    note: '超时 =(WT+1)×0.5 s，从 0.5 s 到 128 s；喂狗是写两个魔数，顺序不能反。' },
  { h: 'WCR 的锁', hint: '写一次就定终身',
    note: 'WDE 一旦置 1 软件再也关不掉；WDT 要到下次 POR 才能改 —— 这是保险，也是陷阱。' },
  { h: '提前预警', hint: 'WICT 预中断',
    note: '在超时前 WICT×0.5 s 产生中断，给你最后一次机会记录现场或优雅收尾。' },
  { h: '谁复位了我', hint: 'WRSR 溯源',
    note: 'POR / TOUT / SFTW 三位，配合 SRC 的 SRSR 就能分清“掉电、狗咬、软复位”。' },
  { h: '上电 16 秒陷阱', hint: 'PDE 默认开',
    note: '复位后电源关断计数器就开跑，固定 16 s 后拉 WDOG_B；不清 PDE 就会莫名重启。' },
  { h: '板上判据', hint: '故意咬一次',
    note: '不喂狗、计时、读 WRSR、量 WDOG_B，四步走完才算真正验证了看门狗。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}
function three(a, b, c) {
  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(a[0], 214, a[1]); for (var i = 0; i < a[2].length; i++) txt(scene, a[0], 252 + i * 36, a[2][i], a[3] || 't20w');
  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(b[0], 214, b[1]); for (var j = 0; j < b[2].length; j++) txt(scene, b[0], 252 + j * 36, b[2][j], b[3] || 't20w');
  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(c[0], 214, c[1]); for (var k = 0; k < c[2].length; k++) txt(scene, c[0], 252 + k * 36, c[2][k], c[3] || 't20w');
}
function prose(title, lines) {
  wide(456, 330);
  txt(scene, 80, 490, title, 't24');
  for (var i = 0; i < lines.length; i++) txt(scene, 80, 522 + i * 34, lines[i], 't20w');
}

function drawTop() {
  txt(scene, 56, 146, '看门狗是“最后一道保险”：软件跑飞了它替你按复位；但它的配置几乎全是写一次就锁死的', 't24w');
  three([80, '三个实例', ['WDOG1  0x020B_C000', 'WDOG2  0x020C_0000', 'WDOG3  0x021E_4000', '各占 0x10 字节', '寄存器全为 16 位', '复位范围由 SRC 决定'], 't20s'],
        [680, '五个寄存器', ['+0x00 WCR 控制', '+0x02 WSR 服务（喂狗）', '+0x04 WRSR 复位原因', '+0x06 WICR 预中断', '+0x08 WMCR 杂项', '复位值 0030/0000/0000/0004/0001'], 't20s'],
        [1280, '访问约束', ['只支持 16 位访问', '8 位也可以', '32 位访问不报错但危险', '可能让系统进未知状态', '只读寄存器写会总线报错', '别用 memcpy 批量写']]);
  prose('“复位范围不同”这句最重要：WDOG3 的复位默认可能只作用于 M4 域（由 SRC 的 SCR[24] 选择），所以它未必能救 A7', [
    'WDOG1 与 WDOG2 分别服务不同的复位域与时钟域，具体哪一路能复位整片要看 SRC 的掩码与选项位（第 51 章）。',
    '16 位访问是硬约束：用 32 位写会把相邻寄存器的内容一起改掉，而硬件不会报错，属于最阴的一类 bug。',
    'WRSR 写一下就直接总线报错，这条设计是故意的：防止软件把“谁复位了我”的证据抹掉。',
    '三个看门狗同时开容易互相“打架”：一个喂了另一个没喂，结果复位时间比你预期的短。',
    '实际产品通常只用一个，另一个留给安全域或协处理器；把三个都开着不是“更安全”，而是更难定位。',
    '一句话：先确认“哪一路的复位真的能重启整机”，再谈超时时间与喂狗策略。']);
}

function drawTimeout() {
  txt(scene, 56, 146, '超时时间是 8 位字段换算出来的：0.5 秒一格，最大 128 秒；喂狗则是两个固定魔数', 't24w');
  three([80, 'WT 的算法', ['WCR[15:8] = WT', '超时 =(WT+1)×0.5 s', 'WT=0x00 → 0.5 s', 'WT=0x03 → 2.0 s', 'WT=0xFF → 128 s', '写 WT 后才置 WDE'], 't20s'],
        [680, '喂狗序列', ['先写 0x5555', '再写 0xAAAA', '顺序不能反', '两次都在超时前完成', '中间可执行任意指令', '写完计数器重装'], 't20s'],
        [1280, '常见错误', ['只写 0xAAAA', '等于没喂', '喂在超时之后', '下一次照样复位', '在中断里喂但中断被关', '狗照样咬']]);
  prose('0.5 秒一格意味着“2 秒”是 WT=0x03，而不是 0x04；把“格数”当“秒数”是最常见的算错方式', [
    '喂狗的两次写必须成对：只写 0x5555 或只写 0xAAAA 都不算完成服务，计数器照样走到底。',
    '两次写之间可以执行任意指令（手册明确允许），但必须都在超时窗口内 —— 所以别在中间插入可能阻塞的调用。',
    '如果程序里有长时间关中断的临界区，要把这个最坏时长算进超时值，否则“关中断保护数据”会变成“被狗咬”。',
    '喂狗最好放在“主循环心跳”里，而不是放在某个高频中断里：后者即使主循环死了也照样喂，等于没保护。',
    '反过来，喂狗任务本身的优先级要够低，才能证明“整个系统还活着”，而不只是“这个中断还活着”。',
    '判据：把超时设成 1 s，主循环里加 3 s 延时，应观察到稳定复位；读 WRSR 的 TOUT 应为 1。']);
}

function drawWcr() {
  txt(scene, 56, 146, 'WCR 十六位里有五个是“写一次就锁”：WDW/WDBG/WDW、WDE、WDT —— 配错就得复位甚至换电', 't24w');
  three([80, '关键位', ['[2] WDE 使能（写一次）', '[3] WDT 超时拉 WDOG_B', '[4] SRS 软件复位（自清）', '[5] WDA 软件拉 WDOG_B', '[1] WDBG 调试时暂停', '[0] WDZST 低功耗暂停'], 't20s'],
        [680, '写一次的含义', ['WDE 一旦置 1', '软件再也清不掉', '只有复位能关', 'WDT 要到下次 POR 才解锁', 'WDW/WDBG/WDZST 同样锁', '所以“先想清楚再写”'], 't20s'],
        [1280, '调试期怎么办', ['WDBG=1 调试时停狗', '否则断点就被复位', '量产构建里必须清 0', '或者用 SRC 掩码', 'SCR[10:7]=0101 掩掉', '两者不要同时依赖']]);
  prose('调试时先把 WDBG 置 1 是常规操作：否则你在断点上停超过超时时间，芯片就被自己咬复位，调试会话直接断', [
    '但 WDBG 是写一次的，改了就得复位才能改回来 —— 所以要用“编译期开关”决定这一次到底置不置。',
    'SRS 是软件复位位：写 0 触发一次系统复位，硬件随后把它自动置回 1；它可以用来做“软重启”，但注意它不是清 WDE 的手段。',
    'WDA 与 WDT 的区别：WDA 是“软件主动拉 WDOG_B”，WDT 是“超时时拉 WDOG_B”。有的板子 WDOG_B 接 PMIC，拉它等于断电。',
    'SRE 选择软件复位的新旧方式：新方式更抗干扰，但要求复位电路配合，改之前先看板子是否支持。',
    'WCR 复位值 0x0030 表示 WDA=1、SRS=1（都是“无效”状态），WDE=0 即默认关闭；所以“默认开着”是错觉。',
    '判据：置 WDE 后尝试清 0，读回仍为 1 —— 确认锁生效；此时只能靠复位关闭，这一点必须在设计文档里写明。']);
}

function drawIrq() {
  txt(scene, 56, 146, '看门狗能在咬之前先叫一声：WICT 决定提前多久，这是保存现场的最后窗口', 't24w');
  three([80, 'WICR 位域', ['[15] WIE 中断使能（写一次）', '[14] WTIS 中断状态（写 1 清）', '[7:0] WICT 提前量', 'WICT 单位也是 0.5 s', '复位值 WICT=4 → 提前 2 s', '最大 127.5 s'], 't20s'],
        [680, '怎么用', ['中断里写日志/存寄存器', '或做安全关机', '然后继续等超时', '也可以主动触发 SRS 软复位', '不处理就等着被咬', '别指望中断能“取消”超时'], 't20w'],
        [1280, '设计要点', ['WICT 要小于超时', '否则永远不预警', '中断优先级要够高', '日志缓冲要预先分配', '别在中断里 malloc', '存完让狗继续跑']]);
  prose('注意 WICT 是“提前量”而不是“第二次超时”：写 4 表示比超时早 2 秒触发，所以它必须小于整个超时时间', [
    '如果 WICT 设得比超时还大，中断永远不会来 —— 这是“预警功能配了却没用”的典型原因。',
    '中断里最该做的是“把关键状态写进保留内存或 flash”，而不是打印：串口打印可能来不及，且会阻塞。',
    '有些实现会在预警中断里直接触发软复位（写 SRS），这样复位原因就是 SFTW 而不是 TOUT，日志里能区分。',
    'WTIS 是写 1 清：不清就会反复进中断，看起来像“中断风暴”，实际是标志没清。',
    'WIE 也是写一次的：开了就锁，所以调试阶段想临时关中断只能靠复位。',
    '判据：把超时设 4 s、WICT 设 4（提前 2 s），应在第 2 s 左右进一次中断，第 4 s 复位；两个时间点都能实测到。']);
}

function drawWrsr() {
  txt(scene, 56, 146, '复位之后先读 WRSR：POR 说明是上电，TOUT 说明是狗咬，SFTW 说明是软件自己按的', 't24w');
  three([80, 'WRSR 位', ['[4] POR 上电复位', '[1] TOUT 看门狗超时', '[0] SFTW 软件复位', '[3:2] 保留', '只读，写会总线报错', '不会被硬复位清掉'], 't20s'],
        [680, '与 SRC 配合', ['SRC SRSR[4] = wdog_rst_b', 'SRSR[3] = 用户复位', 'SRSR[0] = 上电', '两个寄存器互为印证', 'WRSR 只说“狗”', 'SRSR 说“全片”'], 't20s'],
        [1280, '读的顺序', ['启动最早期就读', '早于任何可能清零的代码', '先存到保留内存', '再打印或上报', '否则证据会丢', '这也是“黑匣子”思路']]);
  prose('WRSR “不会被硬复位清掉”意味着它能跨多次复位保留：这也是它比日志更可靠的原因', [
    '优先级是“超时 > 软件复位”，两者同时成立时读出来是 TOUT —— 所以看到 TOUT 就不要怀疑是软复位。',
    '如果 WRSR 全是 0，可能是你读得太晚（被别的代码清了），或者这一次真不是看门狗导致的复位。',
    'POR 位能区分“断电重启”与“狗咬重启”，这对现场故障归因极有价值：现场说“它自己重启了”，一读就知道是哪种。',
    '配合 SRC 的 SRSR 可以交叉验证：若 SRSR 的 bit4 也置了，说明确实是 WDOG 路径；若只有 SRSR[0]，那是掉电。',
    '注意 SRC 可以“掩掉”看门狗复位（SCR[10:7]=0101），掩掉期间超时会发生但系统不复位，只在 WRSR 留痕。',
    '判据：手动触发一次超时，复位后读 WRSR 应见 TOUT=1 且 POR=0；再断电重启，应见 POR=1、TOUT=0。']);
}

function drawPde() {
  txt(scene, 56, 146, '最容易忽视的一条：复位后“电源关断计数器”默认就开着，固定 16 秒后拉 WDOG_B', 't24w');
  three([80, '这个计数器', ['WMCR[0] PDE', '复位值 0001，即默认使能', '超时固定 16 秒', '不看 WT 字段', '不喂狗也无所谓', '只管“有没有被清掉”'], 't20s'],
        [680, '后果', ['上电 16 s 后拉 WDOG_B', 'WDOG_B 常接 PMIC', '表现为“开机十几秒就重启”', '日志还没来得及打完', '很像电源问题', '实际是看门狗'], 't20w'],
        [1280, '正确做法', ['启动最早期清 PDE', '在串口初始化之前', '在 DDR 初始化之前更好', '或由 bootloader 清', '清完再按需配 WT/WDE', '两者是独立机制']]);
  prose('“16 秒”这个数字要背下来：现象是“每次开机十几秒后自己重启”，而代码里明明没开看门狗 —— 就是 PDE 没清', [
    '手册的初始化步骤第一条就是“清 PDE 关掉电源关断计数器”，它排在“配 WT”“置 WDE”之前，说明这是前置条件。',
    '这个计数器与正常的超时计数器是两套逻辑：清 PDE 只关前者，不影响你后面用 WT/WDE 开正常的看门狗。',
    'bootloader 若已经清了 PDE，内核就不必再清；但内核也不能假设“一定清过”，读一次 WMCR 最稳。',
    'WDOG_B 是板级信号，通常接 PMIC 的复位输入或电源使能；所以它“拉低”可能等价于整机断电重启，而不是简单的 CPU 复位。',
    'WDOG_RESET_B_DEB 才是芯片内部的复位信号；WDT 位置 1 时两者会一起动作，这是“超时同时复位整机”的配置方式。',
    '判据：上电后立刻读 WMCR 应为 0（已清）；若为 1 且在 16 s 左右复位，就确认是 PDE 没处理。']);
}

function drawBoard() {
  txt(scene, 56, 146, '验证看门狗要“故意让它咬”：计时、读原因、量信号，三步缺一不可', 't24w');
  three([80, '实验步骤', ['① 清 PDE，配 WT=1 s', '② 置 WDE，不开 WDBG', '③ 主循环加 3 s 延时', '④ 用示波器量 WDOG_B', '⑤ 记录复位时刻', '⑥ 复位后读 WRSR'], 't20w'],
        [680, '预期结果', ['约 1 s 后 WDOG_B 拉低', '随后整机复位', 'WRSR 的 TOUT=1', 'SRSR[4]=1', '日志从启动头重新开始', '重复三次时间一致'], 't20w'],
        [1280, '常见坑', ['调试器连着不复位', 'WDBG 被置 1 了', 'SRC 里被掩掉了', 'SCR[10:7]=0101', 'WDOG_B 没接任何东西', '板子根本不复位']]);
  prose('“SRC 里被掩掉”是最隐蔽的一种：看门狗确实超时了，但 SRC 按掩码把复位过滤掉了，现象是“时间到了却什么都不发生”', [
    '此时唯一的痕迹是 WRSR 的 TOUT 位与 SRC 的 SRSR[4]，所以“不复位”也要读这两处，而不是断定看门狗坏了。',
    'WDOG_B 若在板上悬空，你只能看到寄存器变化而看不到电平；先查原理图它接到了哪里（PMIC、复位芯片还是 LED）。',
    '调试器连着时，很多调试器会周期性访问 CPU 而让狗“看起来没咬”；把调试器断开再做实验最可信。',
    '量产配置建议：超时值留 2–3 倍余量、开预中断存日志、WDBG 在发布版清 0，并把“最后复位原因”上报到服务器。',
    '如果产品要求“永不复位”（如某些实时控制），就不要用看门狗复位，改用预中断做降级处理；但那是产品决策，不是默认行为。',
    '判据：三次实验复位时间一致（抖动 < 5%）、WRSR 与 SRSR 都能对上、WDOG_B 波形可见 —— 三条齐了才叫验证完成。']);
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawTop();
  else if (s === 1) drawTimeout();
  else if (s === 2) drawWcr();
  else if (s === 3) drawIrq();
  else if (s === 4) drawWrsr();
  else if (s === 5) drawPde();
  else drawBoard();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () { state.step = INIT.step; draw(); });
fitCanvas($('viewport'), $('canvas'), draw);
</script>
</body>
</html>
