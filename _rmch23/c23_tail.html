<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0, lane: 0 };
var state = { step: INIT.step, lane: INIT.lane };

var STEPS = [
  { h: '两块拼成一块', hint: 'MBM + TCE · 64 LUT',
    note: 'EPDC 分成 MBM 与 TCE：MBM 管内存、波形装载与更新队列，TCE 管 TFT 扫描时序。寄存器在 MBM（APB），扫描节拍在 TCE（pixclk）。64 个 LUT 分成 4 个 bank、每个 16 个，一次更新占一个 LUT。' },
  { h: '三个缓冲区', hint: 'WB · UPD · 波形',
    note: '三块内存三个算法：工作缓冲 WB 是面板的「影子」，更新缓冲 UPD 是这次要显示的灰度图，波形数据是厂商提供的电压序列。三者的尺寸与对齐都由寄存器钉死。' },
  { h: '寄存器四个地址', hint: 'SET / CLR / TOG',
    note: '每个 32 位寄存器占四个字：+0 写、+4 置位、+8 清零、+C 翻转。中断状态位只能用 +8 的 CLR 地址清，往 +0 写 0 等于没写 —— 这是 EPDC 最容易踩的坑。' },
  { h: '行场时序怎么算', hint: 'LT · FT · Ratio',
    note: '行时间 LT = TPIXCLK×(LS+LB+(HRES/PIXELS_PER_SDCLK)×Ratio+LE)，帧时间 FT = LT×总行数。Ratio 由 DDR 与 PIXELS_PER_SDCLK 决定（DDR 或 8 像素/时钟时取 4，否则 2）。' },
  { h: '一次更新五件套', hint: 'ADDR · CORD · SIZE · CTRL',
    note: '更新就是四次写加一次触发：UPD_ADDR 给缓冲地址、UPD_CORD 给左上角、UPD_SIZE 给宽高、UPD_CTRL 最后写（写它就启动）。LUT_SEL 要从 NEXTLUT 读，波形模式 0–255 选 INIT/DU/GC16 之类。' },
  { h: '冲突与判据', hint: 'BUSY · VOID · COLLISION',
    note: '波形一旦开始不能被打断，所以 EPDC 用 WB_BUSY/LUTS_BUSY 卡住新请求，并用冲突检测挡住重叠更新。全刷看矩形并集，局部刷看像素差分并集 —— 后者允许矩形相交但内容相同。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}

function drawRole() {
  txt(scene, 56, 146, 'EPDC 是「电子纸专用显示控制器」：不是刷像素，而是按波形序列给每个像素加电压', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '两个子模块');
  txt(scene, 80, 252, 'MBM：内存、更新队列、波形装载', 't20w');
  txt(scene, 80, 288, 'TCE：行场时序、SDCLK/GDCLK 生成', 't20w');
  txt(scene, 80, 324, 'MBM 跑 aclk，TCE 跑 pixclk', 't20w');
  txt(scene, 80, 360, '寄存器在 APB（pclk）上', 't20w');
  txt(scene, 80, 396, '三者时钟域独立、可异步', 't20w');
  txt(scene, 80, 432, '数据经 PIX_FIFO 与 LUTRAM 交接', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '硬指标');
  txt(scene, 680, 252, '4096×4096 @20 Hz（可到 8191）', 't20w');
  txt(scene, 680, 288, '1650×2332 @106 Hz', 't20w');
  txt(scene, 680, 324, '每像素最多 5 位 → 32 级灰', 't20w');
  txt(scene, 680, 360, '最多 64 个并发更新（5 位灰时 16 个）', 't20w');
  txt(scene, 680, 396, '最多 256 种波形模式', 't20w');
  txt(scene, 680, 432, '4 LUT bank × 16 = 64 个 LUT', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '它不是什么');
  txt(scene, 1280, 252, '不是 LCDIF：不给 RGB 屏出 24 位像素', 't20w');
  txt(scene, 1280, 288, '不是「画完就亮」：一帧要扫几十次', 't20w');
  txt(scene, 1280, 324, '不做颜色：只有灰度/波形电压', 't20w');
  txt(scene, 1280, 360, '不管电源：面板 PMIC 与上电序列归软件', 't20w');
  txt(scene, 1280, 396, '不管边框：边框靠 GPIO 打', 't20w');
  txt(scene, 1280, 432, '不解析波形文件：厂商格式，驱动自己拆', 't20w');

  wide(456, 330);
  head(80, 494, '理解 EPDC 的关键：把「显示」和「刷新」拆成两件事');
  txt(scene, 80, 522, '显示 = 一次更新：软件把新灰度图（更新缓冲）交给 MBM，MBM 做差分、算矩形、选波形、装 LUT，最后把结果写进工作缓冲 WB。', 't20w');
  txt(scene, 80, 556, '刷新 = 一直扫：TCE 按行场时序不停地扫 WB，把每个像素的 2/4 位电压码送到源极驱动，把行选信号送到栅极驱动。', 't20w');
  txt(scene, 80, 590, '所以 EPDC 的寄存器分两组：一组是更新命令（UPD_*），一组是面板时序（TCE_*）。两组互不干扰，可以边刷边排队。', 't20w');
  txt(scene, 80, 624, '一个 LUT 就是一段电压波形：64 个 LUT 并发，意味着最多 64 块不同区域同时在不同波形里「洗」。超过就等 LUTS_BUSY。', 't20w');
  txt(scene, 80, 658, '5 位灰阶为什么只有 16 个并发？因为每个 LUT 要为 32 个灰度值各存一段波形，LUTRAM 装不下 64 套，只能折半。', 't20w');
  txt(scene, 80, 692, '手册明确说波形格式是供应商私有：EPDC 只负责「按格式读」，读不懂波形就驱动不起来 —— 这是电子纸开发的第一道门槛。', 't20w');
  txt(scene, 80, 726, '一句话：LCDIF 是「推像素」，EPDC 是「按剧本给像素加电压，并且保证剧本不被打断」。', 't20w');
  txt(scene, 80, 760, '记住 MBM/TCE 分工，后面所有寄存器都能归位：带 UPD 的归 MBM，带 TCE/PIGEON 的归 TCE。', 't20w');
}

function drawMem() {
  txt(scene, 56, 146, '三块内存三套对齐规则：WB 要 2 字节/像素、更新缓冲要 8 像素对齐、波形按厂商格式', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '工作缓冲 WB');
  txt(scene, 80, 252, 'WB_ADDR（+0x30）指向它', 't20s');
  txt(scene, 80, 288, '大小 = roundup4(W) × H × 2 字节', 't20w');
  txt(scene, 80, 324, '每像素 2 字节：存当前灰度与状态', 't20w');
  txt(scene, 80, 360, '每行按 64 位边界构造 → W 要 4 对齐', 't20w');
  txt(scene, 80, 396, 'TCE 也读它（WB_ADDR_TCE 可另指）', 't20w');
  txt(scene, 80, 432, 'WB_ADDR_NO_COPY=1 时不自动同步', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '更新缓冲 UPD');
  txt(scene, 680, 252, 'UPD_ADDR（+0x100）每次可换', 't20s');
  txt(scene, 680, 288, '无 stride：roundup8(W) × H 字节', 't20w');
  txt(scene, 680, 324, '有 stride：UPD_STRIDE × H 字节', 't20w');
  txt(scene, 680, 360, '每行 64 位对齐（PXP 输出天然满足）', 't20w');
  txt(scene, 680, 396, '8 位灰度，取高 2/3/4/5 位使用', 't20w');
  txt(scene, 680, 432, '宽高由 UPD_SIZE 给，位置由 CORD 给', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '波形与温度');
  txt(scene, 1280, 252, 'WVADDR（+0x20）指向波形数据', 't20s');
  txt(scene, 1280, 288, '格式厂商私有，驱动负责解包重排', 't20w');
  txt(scene, 1280, 324, 'TEMP（+0x1A0）是索引不是温度值', 't20s');
  txt(scene, 1280, 360, '同一模式在不同温度有不同表', 't20w');
  txt(scene, 1280, 396, '索引错 → 洗出来的灰阶偏色', 't20w');
  txt(scene, 1280, 432, 'AUTOWV_LUT（+0x1C0）存灰阶→模式映射', 't20s');

  wide(456, 330);
  head(80, 494, '把三个公式抄下来，分配内存时不会返工');
  txt(scene, 80, 522, 'WB 字节数 = roundup4(HRES) × VRES × 2。800×600 的屏 → 800×600×2 = 960,000 字节，约 938 KB，DRAM 里要留够。', 't20w');
  txt(scene, 80, 556, '更新缓冲（无 stride）= roundup8(WIDTH) × HEIGHT。若 WIDTH=200，roundup8 得 200（已是 8 的倍数）；WIDTH=201 就要按 208 算。', 't20w');
  txt(scene, 80, 590, '有 stride 时 = UPD_STRIDE × HEIGHT，好处是「只更新大图里的一小块」，把整屏缓冲当源，不必为每块另拷一份。', 't20w');
  txt(scene, 80, 624, '为什么 WB 每像素 2 字节？因为它要存「当前灰阶 + 是否有未完成波形」这类状态，比 8 位灰度多一倍。', 't20w');
  txt(scene, 80, 658, '波形数据不是「一张图」：它按模式 × 温度 × 帧序组织，驱动解包后按 EPDC 期望的排布写进内存，再由 WVADDR 指过去。', 't20w');
  txt(scene, 80, 692, '温度补偿的做法：驱动读面板温度传感器 → 查表得索引 → 写 TEMP → 同一次更新会用对应温度的波形表。', 't20w');
  txt(scene, 80, 726, 'PXP 的角色：把应用层的 RGB/ARGB 转成 8 位灰度并按 64 位行对齐，EPDC 只吃这种格式。跳过 PXP 自己拷，很容易对齐出错。', 't20w');
  txt(scene, 80, 760, '内存算错的典型现象：更新区域右边缘出现一条错位斜线 —— 那就是 roundup8 少算了几个像素。', 't20w');
}

function drawRegs() {
  txt(scene, 56, 146, '基址 0x0228_C000：一次更新只碰 5 个寄存器，一次上电只碰 4 个，其余是时序与状态', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '更新侧（MBM）');
  txt(scene, 80, 252, '+0x100 UPD_ADDR：更新缓冲地址', 't20s');
  txt(scene, 80, 288, '+0x110 UPD_STRIDE：行跨距', 't20s');
  txt(scene, 80, 324, '+0x120 UPD_CORD：左上角 X/Y', 't20s');
  txt(scene, 80, 360, '+0x140 UPD_SIZE：宽/高', 't20s');
  txt(scene, 80, 396, '+0x160 UPD_CTRL：写它即启动', 't20s');
  txt(scene, 80, 432, '+0x180 UPD_FIXED：整块填色/初始化', 't20s');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '面板侧（TCE）');
  txt(scene, 680, 252, '+0x200 TCE_CTRL：SDDO 宽度、VCOM、LVDS', 't20s');
  txt(scene, 680, 288, '+0x220 TCE_SDCFG：NUM_CE、PIXELS_PER_CE', 't20s');
  txt(scene, 680, 324, '+0x240 TCE_GDCFG：GDOE/GDSP 模式', 't20s');
  txt(scene, 680, 360, '+0x260/+0x280 HSCAN1/2：行时序', 't20s');
  txt(scene, 680, 396, '+0x2A0 VSCAN：场时序', 't20s');
  txt(scene, 680, 432, '+0x2C0/+0x2E0 OE 与极性', 't20s');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '状态与中断');
  txt(scene, 1280, 252, '+0x420 IRQ：中断汇总（用 +0x428 清）', 't20s');
  txt(scene, 1280, 288, '+0x3E0/+0x3F0 IRQ1/IRQ2：64 个 LUT', 't20s');
  txt(scene, 1280, 324, '+0x400 IRQ_MASK：总掩码', 't20s');
  txt(scene, 1280, 360, '+0x4A0 STATUS：BUSY/VOID/欠载', 't20s');
  txt(scene, 1280, 396, '+0x460 NEXTLUT：下一个可用 LUT', 't20s');
  txt(scene, 1280, 432, '+0x7F0 VERSION：复位 0x0300_0000', 't20s');

  wide(456, 330);
  head(80, 494, '四个地址的写法，决定了「为什么我写了但没生效」');
  txt(scene, 80, 522, 'EPDC_CTRL 复位 0xC000_0000：bit31 SFTRST=1（复位中）、bit30 CLKGATE=1（时钟关）。上电第一件事就是把这两位都清掉。', 't20w');
  txt(scene, 80, 556, '清法有两种：往 +0x008（CLR 地址）写 1；或直接读 +0x000、改、写回。前者是原子的，推荐。', 't20w');
  txt(scene, 80, 590, '中断必须用 CLR 地址：EPDC_IRQ 的 +0x420 是「读状态」，+0x428 才是「清」。往 +0x420 写 0 不会清任何位。', 't20w');
  txt(scene, 80, 624, '整套寄存器都有 SET(+4)/CLR(+8)/TOG(+C) 别名：改一位不用读改写，写一次就够；写 0 无副作用。', 't20w');
  txt(scene, 80, 658, '子系统时钟门控在 CCM 里，EPDC_CTRL 的 CLKGATE 是模块内部门控 —— 两层门都开了才有寄存器响应。', 't20w');
  txt(scene, 80, 692, 'STATUS 复位 0x0000_0008：bit3 UPD_VOID=1，表示「当前没有有效更新」，不是错误。', 't20w');
  txt(scene, 80, 726, 'NEXTLUT 复位 0x013F：低 6 位是下一个空闲 LUT 号，高位有有效标志；驱动不该猜 LUT 号，读它。', 't20w');
  txt(scene, 80, 760, '版本寄存器是「这块硅在不在」的最快判据：读 +0x7F0 得 0x0300_0000，说明 EPDC 活着且是 v3。', 't20w');
}

function drawTiming() {
  txt(scene, 56, 146, '行时间与帧时间是两个乘法：先把 SDCLK 定下来，再倒推 pixclk 与刷新率', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '两个公式');
  txt(scene, 80, 252, 'LT = TPIXCLK×(LS+LB+HRES/PPC×R+LE)', 't20s');
  txt(scene, 80, 288, 'FT = LT × 总行数（FS+FB+VRES）', 't20s');
  txt(scene, 80, 324, 'PPC = PIXELS_PER_SDCLK', 't20w');
  txt(scene, 80, 360, 'R = Ratio（下面三条规则）', 't20w');
  txt(scene, 80, 396, 'LS/LB/LE：行同步/行开始/行结束', 't20w');
  txt(scene, 80, 432, 'FS/FB：场同步/场开始', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'Ratio 怎么取');
  txt(scene, 680, 252, 'DDR_MODE=1 → R=4', 't20w');
  txt(scene, 680, 288, 'DDR=0 且 PPC=8 → R=4', 't20w');
  txt(scene, 680, 324, 'DDR=0 且 PPC≠8 → R=2', 't20w');
  txt(scene, 680, 360, 'R 是 pixclk 与 SDCLK 的比值', 't20w');
  txt(scene, 680, 396, '算错 R，行时间就差一倍', 't20w');
  txt(scene, 680, 432, 'EPDC 会按配置自动定 R', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '刷新率必须匹配');
  txt(scene, 1280, 252, '50 Hz 波形就要 50 Hz 扫描', 't20w');
  txt(scene, 1280, 288, '偏了：短期偏色，长期灰阶漂移', 't20w');
  txt(scene, 1280, 324, 'FT 的倒数就是刷新率', 't20w');
  txt(scene, 1280, 360, 'SDCLK 有上限（看驱动 IC 的 CL）', 't20w');
  txt(scene, 1280, 396, '先定 SDCLK，再分配消隐，最后看 FT', 't20w');
  txt(scene, 1280, 432, '行数可以加 dummy 行调频率', 't20w');

  wide(456, 330);
  head(80, 494, '一个 800×600、PPC=8、DDR=0 的实算');
  txt(scene, 80, 522, '取 R=4（PPC=8）。若 SDCLK 目标 20 MHz，则 pixclk = 4×20 = 80 MHz，TPIXCLK = 12.5 ns。', 't20w');
  txt(scene, 80, 556, '设 LS=4、LB=8、LE=8：一行有效段 = HRES/PPC×R = 800/8×4 = 400 pixclk，合计 420 pixclk → LT = 5.25 µs。', 't20w');
  txt(scene, 80, 590, '要 50 Hz，FT 必须是 20 ms → 总行数 = 20 ms / 5.25 µs ≈ 3810 行。VRES=600，剩下 3210 行要靠 FS/FB 补。', 't20w');
  txt(scene, 80, 624, '这就是为什么电子纸的场消隐长得离谱：不是屏慢，是波形要求恰好 50 Hz，而每行的有效时间很短。', 't20w');
  txt(scene, 80, 658, '换个思路：如果 SDCLK 必须 20 MHz、行时间又被波形卡死，就得加 dummy 行或延长 VSCAN_HOLDOFF 来凑整。', 't20w');
  txt(scene, 80, 692, 'PIGEON 模式是给「不按标准行场节拍」的屏用的：17 根信号各自配本计数器与掩码，能从 17 种状态里任选起点。', 't20w');
  txt(scene, 80, 726, 'TCE_TIMING1/2/3 是细分旋钮（各信号相对行/场起点的延迟），配错的表现是「图像整体偏移或被裁掉几列」。', 't20w');
  txt(scene, 80, 760, '算完一定要实测：量 SDCLK 频率、量一帧的时间，两者与公式对不上就是 R 或 PPC 配错了。', 't20w');
}

function drawUpdate() {
  txt(scene, 56, 146, '一次更新 = 四次写 + 一次触发；UPD_CTRL 一落笔，波形就开始走，不能反悔', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '五件套');
  txt(scene, 80, 252, 'UPD_ADDR：8 位灰度缓冲地址', 't20w');
  txt(scene, 80, 288, 'UPD_CORD：[28:16] Y、[11:0] X', 't20w');
  txt(scene, 80, 324, 'UPD_SIZE：[28:16] H、[11:0] W', 't20w');
  txt(scene, 80, 360, 'UPD_TEMP：先写温度索引', 't20w');
  txt(scene, 80, 396, 'UPD_CTRL：最后写，写即启动', 't20w');
  txt(scene, 80, 432, 'UPD_FIXED：固定像素（初始化用）', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'UPD_CTRL 位域');
  txt(scene, 680, 252, 'bit31 USE_FIXED：用固定像素值', 't20w');
  txt(scene, 680, 288, '[21:16] LUT_SEL：0–63，读 NEXTLUT', 't20w');
  txt(scene, 680, 324, '[15:8] WAVEFORM_MODE：0–255', 't20w');
  txt(scene, 680, 360, 'bit3 PAUSE：只分析不启动', 't20w');
  txt(scene, 680, 396, 'bit2 AUTOWV：自动选波形模式', 't20w');
  txt(scene, 680, 432, 'bit1 DRY_RUN / bit0 全刷或局刷', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '两种更新模式');
  txt(scene, 1280, 252, 'PARTIAL：只对变化像素加波形', 't20w');
  txt(scene, 1280, 288, '未变化像素输出 DEFAULT_TFT_PIXEL', 't20w');
  txt(scene, 1280, 324, 'FULL：矩形内所有像素都加波形', 't20w');
  txt(scene, 1280, 360, '初始化、清残影用 FULL', 't20w');
  txt(scene, 1280, 396, '日常翻页用 PARTIAL，快得多', 't20w');
  txt(scene, 1280, 432, 'DEFAULT_TFT_PIXEL 必须等于「不加压」态', 't20w');

  wide(456, 330);
  head(80, 494, '七步走完一次更新（顺序不能变）');
  txt(scene, 80, 522, '① 等 STATUS 的 WB_BUSY=0 且 LUTS_BUSY=0；② 写 TEMP 温度索引；③ 写 UPD_ADDR/CORD/SIZE；④ 读 NEXTLUT 取可用 LUT 号。', 't20w');
  txt(scene, 80, 556, '⑤ 写 UPD_CTRL（USE_FIXED/LUT_SEL/WAVEFORM_MODE/UPDATE_MODE），这一笔就是「开始」；⑥ 等 WB_CMPLT_IRQ；⑦ 等 LUT 完成中断后回收 LUT。', 't20w');
  txt(scene, 80, 590, '波形模式怎么选：INIT 用于上电初始化（全屏闪黑闪白），DU 用于快速局部刷新，GC16 用于 16 级灰的高质量刷新。号数来自波形文件。', 't20w');
  txt(scene, 80, 624, 'AUTOWV 的机制：先做直方图统计 → 判断本次只用到 2/4/8/16 级灰 → 从 AUTOWV_LUT 查出对应模式 → 直接开洗。省掉一次软件往返。', 't20w');
  txt(scene, 80, 658, 'PAUSE=1 时 EPDC 只做分析和直方图就停下，等软件写第二遍 UPD_CTRL 带上选定模式 —— 这是「手动挡」的用法。', 't20w');
  txt(scene, 80, 692, 'DRY_RUN=1 时不改 WB、忽略 LUT_SEL：可以拿它来验证地址/坐标/尺寸是否算对，而不用等一个 LUT 空闲。', 't20w');
  txt(scene, 80, 726, 'LUT 号千万别自己编号：并发时 NEXTLUT 一直在变，写死 0 号会让两个更新抢同一 LUT，表现为「一块区域反复闪」。', 't20w');
  txt(scene, 80, 760, '判据：写完 UPD_CTRL 后 STATUS 的 WB_BUSY 应立刻变 1；不变说明参数没通过校验（尺寸越界或地址未对齐）。', 't20w');
}

function drawCollision() {
  txt(scene, 56, 146, '波形不能被打断，所以 EPDC 用两个 BUSY 位和一套冲突检测把并发管起来', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, 'STATUS（+0x4A0）');
  txt(scene, 80, 252, 'bit0 WB_BUSY：正在算更新', 't20w');
  txt(scene, 80, 288, 'bit1 LUTS_BUSY：64 个 LUT 全忙', 't20w');
  txt(scene, 80, 324, 'bit2 LUTS_UNDERRUN：消隐期没装满', 't20w');
  txt(scene, 80, 360, 'bit3 UPD_VOID：本次更新无有效像素', 't20w');
  txt(scene, 80, 396, '[20:16] HISTOGRAM_CP：处理前灰阶', 't20w');
  txt(scene, 80, 432, '[12:8] HISTOGRAM_NP：处理后灰阶', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '冲突怎么判');
  txt(scene, 680, 252, 'FULL：矩形时空并集即冲突', 't20w');
  txt(scene, 680, 288, 'PARTIAL：再看像素差分', 't20w');
  txt(scene, 680, 324, '矩形相交但目标灰相同 → 不算冲突', 't20w');
  txt(scene, 680, 360, '冲突结果写 STATUS_COL1/2', 't20w');
  txt(scene, 680, 396, 'UPD_COL_CORD/SIZE 给出冲突矩形', 't20w');
  txt(scene, 680, 432, 'LUT_COL_IRQ 上报，清它同时清 COL 状态', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, 'LUT 生命周期');
  txt(scene, 1280, 252, '一个 LUT 服务一次更新直到波形走完', 't20w');
  txt(scene, 1280, 288, '走完置 LUTn 完成中断（IRQ1/2）', 't20w');
  txt(scene, 1280, 324, '软件清中断后才算释放', 't20w');
  txt(scene, 1280, 360, '64 个并发；5 位灰时只有 16 个', 't20w');
  txt(scene, 1280, 396, '不够就排队，别硬塞', 't20w');
  txt(scene, 1280, 432, 'LUT_STANDBY1/2 可预装待命波形', 't20s');

  wide(456, 330);
  head(80, 494, '并发与原子性：电子纸驱动真正的难点在这里');
  txt(scene, 80, 522, '为什么不能打断：波形是一串精确计时的电压脉冲（比如先 +15 V 洗 20 帧、再 -15 V 洗 20 帧）；中途换波形，像素就停在半路，出现残影甚至损伤。', 't20w');
  txt(scene, 80, 556, '所以「更新 A 还在洗屏，用户又点了一下」这件事必须由硬件挡住：新请求要么等，要么被判冲突后作废（UPD_VOID）。', 't20w');
  txt(scene, 80, 590, '局部刷新的冲突判据很聪明：两个矩形重叠，但重叠区像素的目标灰阶一样，就不冲突 —— 因为两次洗的目标一致，波形可以继续。', 't20w');
  txt(scene, 80, 624, '反过来，重叠区目标灰不同就必须让后来者等：否则同一个像素会被两段波形拉扯，灰阶不可控。', 't20w');
  txt(scene, 80, 658, 'STATUS_COL 只记「哪些 LUT 撞了」，具体撞在哪由 UPD_COL_CORD/SIZE 给出矩形；驱动据此重排更新队列。', 't20w');
  txt(scene, 80, 692, 'LUTS_UNDERRUN 是性能信号：说明消隐期不够把 LUT 装满，下一帧可能缺波形 → 提高 pixclk 或减少并发。', 't20w');
  txt(scene, 80, 726, '工程做法：驱动维护一个更新队列，按「同区域串行、异区域并行」调度，把 64 个 LUT 当成 64 个令牌。', 't20w');
  txt(scene, 80, 760, '记住这条判据：WB_BUSY 卡住说明 MBM 在算；LUTS_BUSY 卡住说明屏在洗。两种「忙」的处理完全不同。', 't20w');
}

function drawBoard() {
  txt(scene, 56, 146, '本板没有电子纸屏：EPDC 只能做寄存器级实测，引脚与面板都在「纸面」这一侧', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '引脚现状');
  txt(scene, 80, 252, '核心板只引出 EPDC_PWRCTRL01–03', 't20w');
  txt(scene, 80, 288, 'G16 / F17 / G13 三个球', 't20s');
  txt(scene, 80, 324, '显示总线与 LCDIF 共用 LCD_DATA/LCD_CLK 组', 't20w');
  txt(scene, 80, 360, 'MINI 板 FPC 是 RGB 屏定义', 't20w');
  txt(scene, 80, 396, '没有 SDCE/GDCLK 的屏接口', 't20w');
  txt(scene, 80, 432, '接电子纸要另做底板', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '五步寄存器实测');
  txt(scene, 680, 252, '① 读 VERSION(+0x7F0) = 0x0300_0000', 't20s');
  txt(scene, 680, 288, '② 清 CTRL 的 SFTRST 与 CLKGATE', 't20w');
  txt(scene, 680, 324, '③ 写 RES=0x0320_0258（800×600）回读', 't20s');
  txt(scene, 680, 360, '④ 写 FORMAT：TFT=2B、BUF=P4N', 't20w');
  txt(scene, 680, 396, '⑤ 读 STATUS，确认 UPD_VOID=1', 't20w');
  txt(scene, 680, 432, '全过说明模块与总线都活着', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '六个坑');
  txt(scene, 1280, 252, '坑一：忘记清 CLKGATE，读回全 0', 't20w');
  txt(scene, 1280, 288, '坑二：往 IRQ 的 +0 地址写 0 想清中断', 't20w');
  txt(scene, 1280, 324, '坑三：UPD_SIZE 的宽不是 8 的倍数', 't20w');
  txt(scene, 1280, 360, '坑四：DEFAULT_TFT_PIXEL 写了非「不加压」值', 't20w');
  txt(scene, 1280, 396, '坑五：自选 LUT 号导致互相踩', 't20w');
  txt(scene, 1280, 432, '坑六：刷新率与波形不匹配', 't20w');

  wide(456, 330);
  head(80, 494, '把「跑不了」也写清楚，比假装跑通更有价值');
  txt(scene, 80, 522, '本板的现实：LCD 接口是按 RGB 屏（40/50 pin FPC）设计的。', 't20w');
  txt(scene, 80, 556, '电子纸要的是 SDCLK、SDCE[9:0]、GDCLK、GDSP、GDOE、DATA[15:0]，这些在 FPC 上没按 EPDC 走线。', 't20w');
  txt(scene, 80, 590, '再进一步可以做 DRY_RUN：给一个假缓冲地址、设 UPD_SIZE=64×64、置 DRY_RUN=1 与 PAUSE=1，看直方图统计是否出来 —— 不碰面板也能验证坐标/尺寸/地址逻辑。', 't20w');
  txt(scene, 80, 624, '要真点亮电子纸，缺的是三样：EPD 屏与源/栅驱动 IC、面板电源（+15/-15 V 与 VCOM）、厂商波形文件；三者缺一，EPDC 都无法出图。', 't20w');
  txt(scene, 80, 658, 'Linux 侧：内核有 epdc 驱动 + pxp 驱动，DT 里要写 panel 节点（分辨率、时序、波形）；主线 imx6ull.dtsi 没有 epdc 节点，需要自己补。', 't20w');
  txt(scene, 80, 692, '工程顺序建议：先寄存器自测 → 再补 DT 与驱动 → 再接屏测波形 → 最后调刷新策略（局刷/全刷比例）。反过来做，前一步的错会被后一步的现象掩盖。', 't20w');
  txt(scene, 80, 726, '最后一句：EPDC 是「时序 + 电源 + 波形」三件事绑在一起的模块，单看寄存器永远调不通；本章的意义是把寄存器和公式钉死，等硬件到位就能直接上手。', 't20w');
  txt(scene, 80, 760, '下一步 RM24 是 EPIT 定时器（1167–1178 页，仅 12 页）：一个能立刻实测的小模块。', 't20w');
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawRole();
  else if (s === 1) drawMem();
  else if (s === 2) drawRegs();
  else if (s === 3) drawTiming();
  else if (s === 4) drawUpdate();
  else if (s === 5) drawCollision();
  else drawBoard();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () {
  state.step = INIT.step; state.lane = INIT.lane; draw();
});
fitCanvas($('viewport'), $('canvas'), draw);
</script>
