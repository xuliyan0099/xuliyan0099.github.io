.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }

.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0 };
var state = { step: INIT.step };

var STEPS = [
  { h: '只有三个寄存器位', hint: 'GPIO 直推功放 · 20 dB SNR',
    note: 'MQS 没有自己的寄存器，全部配置都在 IOMUXC_GPR2 的 4 个位域里。' },
  { h: '信号从 SAI1 来', hint: 'bclk / fs / sdata',
    note: '三根线，左对齐 16 位；输出脚与 JTAG、LCD_DATA 复用，板子上要抢脚。' },
  { h: '六个功能块', hint: '拆分 → 整形 → PWM',
    note: '声道拆分、sigma-delta 噪声整形、PWM 生成，外加 mclk 与复位使能。' },
  { h: 'GPR2 的四个位域', hint: '0x020E_4004',
    note: 'OSR、使能、软复位、mclk 分频；一个 32 位寄存器解决全部配置。' },
  { h: 'mclk 与过采样', hint: 'fs × OSR = mclk',
    note: '44.1k 与 48k 两族要两套时钟源，除不尽就会出现音调偏移。' },
  { h: '板级与判据', hint: '外部 RC · 无 pop 抑制',
    note: '必须外部低通 + 功放；上电顺序不对会「啪」一声，手册明说不做抑制。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}

function drawTop() {
  txt(scene, 56, 146, 'MQS 是「省掉 codec」的方案：把 16 位 PCM 整形后直接 PWM 出去，靠外部功放推喇叭', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '它是什么');
  txt(scene, 80, 252, '用普通 GPIO 输出音频', 't20w');
  txt(scene, 80, 288, '外部只加功放，不加 DAC', 't20w');
  txt(scene, 80, 324, '输入来自 SAI1 的 I2S', 't20w');
  txt(scene, 80, 360, '2 声道、16 位、MSB 先出', 't20w');
  txt(scene, 80, 396, '44.1 kHz 或 48 kHz', 't20w');
  txt(scene, 80, 432, '左对齐（left justified）', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '质量边界');
  txt(scene, 680, 252, '设计目标：SNR ≤ 20 dB', 't20w');
  txt(scene, 680, 288, '仅对 10 kHz 以下信号', 't20w');
  txt(scene, 680, 324, '10 kHz 以上 THD+N 更差', 't20w');
  txt(scene, 680, 360, '没有 pop / click 抑制', 't20w');
  txt(scene, 680, 396, '没有失真校正', 't20w');
  txt(scene, 680, 432, '定位：提示音、语音播报', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '为什么这么差');
  txt(scene, 1280, 252, '一位 PWM 只有两个电平', 't20w');
  txt(scene, 1280, 288, '靠过采样把噪声推到高频', 't20w');
  txt(scene, 1280, 324, '外部 RC 滤掉高频噪声', 't20w');
  txt(scene, 1280, 360, '滤波不干净 → 听得到载波', 't20w');
  txt(scene, 1280, 396, '20 dB 意味着噪声比信号只低 20 dB', 't20w');
  txt(scene, 1280, 432, '人耳听感：像老式对讲机', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '20 dB 是什么概念：CD 是 96 dB，电话是 30–40 dB，MQS 只有 20 dB', 't24');
  txt(scene, 80, 522, '换算成电压比是 10 倍：信号幅度如果是 1 V，噪声可以有 100 mV。这个指标决定了它只能做「听得清」而不是「听得好」的场合。', 't20w');
  txt(scene, 80, 556, '它省掉的是 codec 芯片（I2S DAC + 耳放），代价是音质和外部滤波。板子上省一颗料、省两平方厘米，这是它在车载提示音、家电蜂鸣里仍然常见的原因。', 't20w');
  txt(scene, 80, 590, '过采样的作用是把量化噪声搬到高频：一阶 sigma-delta 每翻一倍过采样率，带内噪声降 9 dB；64 倍比 32 倍好 9 dB，所以 GPR2[26] 这一位直接决定听感。', 't20w');
  txt(scene, 80, 624, '注意它是单向的：MQS 只做输出（扬声器方向），不能录音。需要麦克风就得另配 ADC，或者用 SAI + 外部 codec。', 't20w');
  txt(scene, 80, 658, '一句话：MQS = 16 位 PCM → 噪声整形 → 一位 PWM → 引脚 → RC 低通 → 功放。中间没有任何反馈与校正。', 't20w');
}

function drawSignals() {
  txt(scene, 56, 146, '三根输入线来自 SAI1，输出脚却和 JTAG、LCD_DATA 复用 —— 这是选型时最容易踩的坑', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '输入三根线');
  txt(scene, 80, 252, 'bclk：位时钟', 't20w');
  txt(scene, 80, 288, '上升沿移出数据', 't20w');
  txt(scene, 80, 324, 'fs：帧同步', 't20w');
  txt(scene, 80, 360, '帧第一位就拉有效', 't20w');
  txt(scene, 80, 396, 'sdata：串行数据', 't20w');
  txt(scene, 80, 432, '16 位 MSB 先出、左对齐', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '输出引脚');
  txt(scene, 680, 252, 'MQS_LEFT：GPIO1_IO01 ALT4', 't20s');
  txt(scene, 680, 288, '同脚 JTAG_TDI（ALT6）', 't20w');
  txt(scene, 680, 324, '同脚 LCD_DATA23（ALT1）', 't20w');
  txt(scene, 680, 360, 'MQS_RIGHT：GPIO1_IO00 ALT4', 't20s');
  txt(scene, 680, 396, '同脚 JTAG_TDO（ALT6）', 't20w');
  txt(scene, 680, 432, '同脚 LCD_DATA22（ALT1）', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '冲突代价');
  txt(scene, 1280, 252, '用 MQS 就失去 JTAG', 't20w');
  txt(scene, 1280, 288, '调试口只能靠 USB 串行下载', 't20w');
  txt(scene, 1280, 324, '同时占掉 LCD 两条数据线', 't20w');
  txt(scene, 1280, 360, 'RGB565 16 位屏正好用不到 D23/D22？', 't20w');
  txt(scene, 1280, 396, 'RGB888 24 位屏会被挖掉两位', 't20w');
  txt(scene, 1280, 432, '选屏与选调试方式要一起定', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, 'I2S 时序只有一句话：fs 有效那拍开始，bclk 每个上升沿送出下一位，先高位', 't24');
  txt(scene, 80, 522, '「LSB-valid、MSB 先出」的意思是数据在帧内左对齐：16 位数据紧跟在 fs 边沿之后，后面补 0 到帧尾。写 SAI 时要选 left justified，不能用 I2S 标准模式（那会右对齐并延后一拍）。', 't20w');
  txt(scene, 80, 556, 'SAI1 的配置：主模式、位时钟 = 64 × fs、帧长 2 × 32 位、数据 16 位。MQS 只关心 fs 与 bclk 的频率关系，不关心帧里塞了几路通道。', 't20w');
  txt(scene, 80, 590, '引脚冲突是硬约束，不是软件能绕的：ALT4 抢过来，JTAG 的 TDI/TDO 就没了。量产板上常见做法是留 JTAG 测试点、靠 USB OTG 串行下载（SDP）救砖。', 't20w');
  txt(scene, 80, 624, '还有一层：GPIO1_IO00/01 在 SNVS 域还是普通域？它们属于 GPIO1，掉电即失效 —— 所以 MQS 不能在低功耗语音待机时工作。', 't20w');
  txt(scene, 80, 658, '核对办法：查板级 IOMUX 表看这两个球焊到了什么；如果同时接了 LCD_DATA22/23 又接了屏，就必须在设备树里做 pinmux 冲突检查。', 't20w');
}

function drawBlocks() {
  txt(scene, 56, 146, '六个块串成一条链：声道拆分 → sigma-delta 整形 → PWM，另有 mclk 与复位控制', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '数据通路');
  txt(scene, 80, 252, '① Channel Split', 't20w');
  txt(scene, 80, 288, '把 I2S 拆成左右两路', 't20w');
  txt(scene, 80, 324, '② Noise Shaping', 't20w');
  txt(scene, 80, 360, 'sigma-delta，1 位化', 't20w');
  txt(scene, 80, 396, '③ PWM Generation', 't20w');
  txt(scene, 80, 432, '输出到 MQS_LEFT / RIGHT', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '时钟通路');
  txt(scene, 680, 252, '④ mclk generation', 't20w');
  txt(scene, 680, 288, '由 hmclk 分频得到', 't20w');
  txt(scene, 680, 324, '⑤ mclk control', 't20w');
  txt(scene, 680, 360, '像节拍器，协调各块同步', 't20w');
  txt(scene, 680, 396, '⑥ Reset and Enable', 't20w');
  txt(scene, 680, 432, '跨时钟域的复位与使能', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '关键认识');
  txt(scene, 1280, 252, '整条链没有一个可编程寄存器', 't20w');
  txt(scene, 1280, 288, '参数全在 IOMUXC_GPR2', 't20w');
  txt(scene, 1280, 324, '也就是说：没有 «音量» 寄存器', 't20w');
  txt(scene, 1280, 360, '音量只能改 PCM 数据本身', 't20w');
  txt(scene, 1280, 396, '或在功放上用数字电位器', 't20w');
  txt(scene, 1280, 432, '软件调音量 = 乘一个系数', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '没有音量寄存器是设计结果，不是缺陷：PWM 的占空比已经被音频信息占满', 't24');
  txt(scene, 80, 522, '一位 PWM 的占空比只能表达「这位是高还是低」，没有余地再表达幅度。所以要调音量，只能在送进 MQS 之前改 PCM 样本值（软件混音）。', 't20w');
  txt(scene, 80, 556, '噪声整形的代价是「高频残留」：它把量化误差整形到 10 kHz 以上，带内干净、带外很脏。外部 RC 低通就是干这个的，滤不干净就会听到 300–600 kHz 的载波啸叫。', 't20w');
  txt(scene, 80, 590, '两个声道是独立的 PWM 通道，各走一个引脚；它们共享 mclk 与 fs，所以左右永远同步，不存在「左右相位差」这种可调项。', 't20w');
  txt(scene, 80, 624, '复位要写两次：先置 MQS_SW_RST=1 保持，配好 SAI 与引脚后再清 0。顺序反了，PWM 会在时钟还没稳定时开始翻转，输出一段乱码噪声。', 't20w');
  txt(scene, 80, 658, '判据：使能后用示波器看 MQS_LEFT，应看到载波频率 = mclk、占空比随音频变化的方波；看不到载波说明 mclk 没来或模块没使能。', 't20w');
}

function drawGPR() {
  txt(scene, 56, 146, '全部配置只有一个寄存器：IOMUXC_GPR2（基址 0x020E_4000 + 0x04）', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '四个位域');
  txt(scene, 80, 252, 'GPR2[26] MQS_OVERSAMPLE', 't20s');
  txt(scene, 80, 288, '1 = 64 倍，0 = 32 倍', 't20w');
  txt(scene, 80, 324, 'GPR2[25] MQS_EN', 't20s');
  txt(scene, 80, 360, '1 使能、0 关闭', 't20w');
  txt(scene, 80, 396, 'GPR2[24] MQS_SW_RST', 't20s');
  txt(scene, 80, 432, '1 复位、0 退出复位', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '分频位域');
  txt(scene, 680, 252, 'GPR2[23:16] MQS_CLK_DIV', 't20s');
  txt(scene, 680, 288, '8 位，0–255', 't20w');
  txt(scene, 680, 324, 'mclk = hmclk / (n + 1)', 't20s');
  txt(scene, 680, 360, '0 → mclk = hmclk', 't20w');
  txt(scene, 680, 396, '7 → mclk = hmclk / 8', 't20w');
  txt(scene, 680, 432, '复位后为 0（未分频）', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '写一个例子');
  txt(scene, 1280, 252, 'hmclk = 24.576 MHz', 't20w');
  txt(scene, 1280, 288, 'fs = 48 kHz，OSR = 64', 't20w');
  txt(scene, 1280, 324, 'mclk 需 3.072 MHz', 't20w');
  txt(scene, 1280, 360, 'div = 24.576/3.072 − 1 = 7', 't20w');
  txt(scene, 1280, 396, 'GPR2 = 0x07C0_0000 | 使能位', 't20s');
  txt(scene, 1280, 432, '即 bit25=1、bit23:16=0x07', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '这个寄存器在 IOMUXC_GPR 里，不在 MQS 里 —— 找 MQS 寄存器表会一无所获', 't24');
  txt(scene, 80, 522, 'IOMUXC_GPR 基址 0x020E_4000，GPR2 偏移 0x04，所以地址是 0x020E_4004。它是「通用寄存器」区，同一个寄存器里还躺着 LCD/ENET/GPT 的复用控制位。', 't20w');
  txt(scene, 80, 556, '读-改-写是必须的：直接写 0x07C0_0000 会把同一寄存器里别的功能位清掉（比如 LCD 的 vsync 极性），结果屏幕跟着一起坏。', 't20w');
  txt(scene, 80, 590, '上电默认 OSR=0（32 倍），也就是默认音质更差一档。追求好一点就置 bit26；这是「免费的 9 dB」，没有别的地方能补回来。', 't20w');
  txt(scene, 80, 624, '分频值是「n+1」，不是 n：写 0 表示不分频，这与 MDCFG 那类「减一」编码方向一致，但切记 MQS_CLK_DIV 的 0 是「1 分频」。', 't20w');
  txt(scene, 80, 658, '核对：读回 GPR2 看 bit26/25/24 与 [23:16]；使能后 mclk 应该出现在引脚上（示波器 10x 探头，注意 3.3 V 幅度）。', 't20w');
}

function drawClock() {
  txt(scene, 56, 146, '整条链的频率关系只有一条：mclk = fs × 过采样率，hmclk 再除 (n+1) 得到 mclk', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '48 kHz 一族');
  txt(scene, 80, 252, 'hmclk = 24.576 MHz', 't20w');
  txt(scene, 80, 288, 'fs = 48 kHz，OSR = 64', 't20w');
  txt(scene, 80, 324, 'mclk = 3.072 MHz', 't20w');
  txt(scene, 80, 360, 'div = 7（24.576/8）', 't20w');
  txt(scene, 80, 396, '24.576 = 48k × 512', 't20w');
  txt(scene, 80, 432, '整除，音调准确', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '44.1 kHz 一族');
  txt(scene, 680, 252, 'fs = 44.1 kHz，OSR = 64', 't20w');
  txt(scene, 680, 288, 'mclk 需 2.8224 MHz', 't20w');
  txt(scene, 680, 324, '用 24.576 除 8 = 3.072 MHz', 't20w');
  txt(scene, 680, 360, '偏高 8.8%，音调升半音', 't20w');
  txt(scene, 680, 396, '正解：hmclk = 22.5792 MHz', 't20w');
  txt(scene, 680, 432, '除 8 正好 2.8224 MHz', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, 'hmclk 从哪来');
  txt(scene, 1280, 252, '手册：最高 66.5 MHz', 't20w');
  txt(scene, 1280, 288, '典型值 24.576 MHz', 't20w');
  txt(scene, 1280, 324, '通常由 SAI1 的 MCLK 提供', 't20w');
  txt(scene, 1280, 360, '即 SAI1 主时钟输出', 't20w');
  txt(scene, 1280, 396, '也可来自 PLL4/PLL5 分频', 't20w');
  txt(scene, 1280, 432, '前提：SAI1 必须先跑起来', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '「除不尽」是 MQS 最常见的隐性 bug：声音能出来，但音调偏高、像快放', 't24');
  txt(scene, 80, 522, '原因很物理：PWM 的载波与 PCM 采样率必须严格成整数倍关系，否则每个采样点的占空比都在「借位」，等效于采样率漂移，听感就是跑调。', 't20w');
  txt(scene, 80, 556, '24.576 MHz = 48 kHz × 512 = 44.1 kHz × 557.28，所以它天生属于 48k 家族；44.1k 家族的标准时钟是 22.5792 MHz = 44.1k × 512。两个时钟不能互相顶替。', 't20w');
  txt(scene, 80, 590, '把 44.1k 硬塞进 24.576 的板子：可以选 OSR=32，让 mclk = 1.4112 MHz；24.576/1.4112 = 17.4，仍除不尽。只能改晶振或改 PLL 分频，软件救不了。', 't20w');
  txt(scene, 80, 624, '反过来，48k 用 OSR=32 需要 mclk = 1.536 MHz，div = 15（24.576/16）。这时音质降 9 dB，但频率关系仍然成立 —— 宁可降 OSR，也不要让频率关系破掉。', 't20w');
  txt(scene, 80, 658, '验证：示波器量 MQS 输出载波周期，应等于 1/mclk；再用音频分析仪或手机录一段 1 kHz 正弦，看频谱峰值是否正好在 1 kHz。', 't20w');
}

function drawBoard() {
  txt(scene, 56, 146, '上板就三件事：外部 RC 低通、功放增益与上电顺序 —— 手册明说不做 pop 抑制', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '外部滤波');
  txt(scene, 80, 252, '引脚出来先串电阻', 't20w');
  txt(scene, 80, 288, '再并电容到地', 't20w');
  txt(scene, 80, 324, '一阶 RC 截止约 30–50 kHz', 't20w');
  txt(scene, 80, 360, '载波 300 kHz 以上被压 20 dB', 't20w');
  txt(scene, 80, 396, '二阶 LC 效果更好', 't20w');
  txt(scene, 80, 432, '电阻别太大，否则驱动不足', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '功放');
  txt(scene, 680, 252, 'MQS 输出是数字方波', 't20w');
  txt(scene, 680, 288, '不能直接接扬声器', 't20w');
  txt(scene, 680, 324, '要接 D 类功放或运放', 't20w');
  txt(scene, 680, 360, '增益按 20 dB SNR 定', 't20w');
  txt(scene, 680, 396, '别放大微弱噪声', 't20w');
  txt(scene, 680, 432, '静音脚用来消 pop', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '上电与静音');
  txt(scene, 1280, 252, '先给电，再开 MQS_EN', 't20w');
  txt(scene, 1280, 288, '先关功放静音，再动时钟', 't20w');
  txt(scene, 1280, 324, '关断顺序反过来', 't20w');
  txt(scene, 1280, 360, '手册：无 pop/click 抑制', 't20w');
  txt(scene, 1280, 396, '所以「啪」声只能外部解决', 't20w');
  txt(scene, 1280, 432, '常见做法：静音脚 + 延时', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, 'MQS 的价值不在音质，而在「少一颗芯片、少一组 I2S 走线」—— 用错场景就会觉得它很烂', 't24');
  txt(scene, 80, 522, '适合：开机提示音、按键音、报警声、语音播报（8 kHz 采样的人声）。不适合：音乐播放、免提通话、任何需要 40 dB 以上 SNR 的场合。', 't20w');
  txt(scene, 80, 556, '外部 RC 的取值要和载波频率匹配：载波 = mclk（3.072 MHz 时），RC 截止 30 kHz 意味着 3 MHz 处衰减约 40 dB；若载波只有 384 kHz，同样 RC 只衰减 22 dB，会听到啸叫。', 't20w');
  txt(scene, 80, 590, 'D 类功放本身就在开关，和 PWM 输入是「同频段」的，容易互相调制；板子上常见做法是把 MQS 先 RC 成模拟波形，再进 AB 类功放，牺牲效率换干净。', 't20w');
  txt(scene, 80, 624, '判据三条：示波器有载波、频谱峰值在预期频率、静音时输出为直流（无残余载波）。三条缺一条，就还在「能响」而不是「能用」。', 't20w');
  txt(scene, 80, 658, '成本账：MQS 省掉 codec（约 1–3 元）与两对 I2S 走线，代价是外部 RC/功放与调试时间；量产十万片时这笔账才划得来。', 't20w');
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawTop();
  else if (s === 1) drawSignals();
  else if (s === 2) drawBlocks();
  else if (s === 3) drawGPR();
  else if (s === 4) drawClock();
  else drawBoard();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () { state.step = INIT.step; draw(); });
fitCanvas($('viewport'), $('canvas'), draw);
</script>
