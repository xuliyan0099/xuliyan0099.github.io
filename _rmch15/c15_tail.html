<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0, lane: 0 };
var state = { step: INIT.step, lane: INIT.lane };

var STEPS = [
  { h: '一根 APBH，三样东西', hint: 'PIO · DMA · 中断',
    note: 'APBH 是挂在 AHB 上的一条同步外设总线（H 就是 HCLK）：桥里同时住着 AHB→APB 的 PIO 通路、一套中央 DMA（16 个通道，其中 0–3 归 NAND）、以及一个给 Arm 用的向量中断控制器。它不在 AIPS 后面，而是自己一条路。' },
  { h: '寄存器地图：两段', hint: '+0x100 + 0x70×i',
    note: '公共段在 0x0180_4000 起的头 0x70 字节里：CTRL0/1/2、CHANNEL_CTRL、BURST_SIZE、VERSION。通道段从 +0x100 开始，每个通道占 0x70：CURCMDAR、NXTCMDAR、CMD、BAR、SEMA、DEBUG1、DEBUG2。i 取 0–15。' },
  { h: '命令字：四个字一条', hint: 'CCW 与方向陷阱',
    note: '一条命令结构（CCW）最少三个字：下一个命令地址、命令字、缓冲区地址，后面可以跟 0–15 个 PIO 字。命令字里塞了字节数、PIO 个数、六个控制位和两位命令类型；两位类型的方向是站在内存角度命名的，最容易搞反。' },
  { h: '链、闸与信号量', hint: 'CHAIN · SEMA · SENSE',
    note: 'DMA 靠 CHAIN 位顺着命令链走，靠 8 位计数信号量决定「跑不跑」，靠 WAIT4ENDCMD / NANDLOCK / NANDWAIT4READY 与设备对齐节奏，靠 DMA_SENSE 做条件分支——NAND 的读状态轮询就是它最经典的用法。' },
  { h: '实测：先验活着，再验会动', hint: 'VERSION → SEMA → DEBUG',
    note: '四步定位：VERSION 与 CTRL0 判断桥有没有出复位；CHANNEL_CTRL 与 SEMA 判断通道有没有被启动；DEBUG1 的状态机与 DEBUG2 的剩余字节判断卡在哪；CTRL2 判断为什么停（总线错误还是设备提前终止）。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function arrow(x1, y1, x2, y2) {
  svgEl(scene, 'line', { x1: x1, y1: y1, x2: x2, y2: y2, stroke: 'var(--text-2)', 'stroke-width': 4 });
  var a = Math.atan2(y2 - y1, x2 - x1), L = 18, W = 9;
  svgEl(scene, 'path', {
    d: 'M' + x2 + ' ' + y2 + ' L' + (x2 - L * Math.cos(a) + W * Math.sin(a)) + ' ' + (y2 - L * Math.sin(a) - W * Math.cos(a)) +
      ' L' + (x2 - L * Math.cos(a) - W * Math.sin(a)) + ' ' + (y2 - L * Math.sin(a) + W * Math.cos(a)) + ' Z',
    fill: 'var(--text-2)', stroke: 'none'
  });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }

function drawBridge() {
  txt(scene, 56, 146, '一根 APBH 总线，三样东西：PIO 通路、中央 DMA、向量中断', 't24w');

  box(56, 176, 456, 120, 'var(--page)', 'var(--observe-line)', 4);
  txt(scene, 80, 214, 'AHB 主口', 't24');
  txt(scene, 80, 248, 'A7 / SDMA 发来的读写', 't20w');
  txt(scene, 80, 280, '只有主设备身份', 't20w');
  arrow(520, 236, 556, 236);

  box(566, 168, 760, 136, 'var(--page)', 'var(--guide)', 2);
  txt(scene, 590, 204, 'APBH 桥（hclk 同步）', 't24');
  box(588, 220, 222, 68, 'var(--surface)', 'var(--line)', 2);
  txt(scene, 604, 262, 'PIO 通路', 't20w');
  box(822, 220, 222, 68, 'var(--surface)', 'var(--line)', 2);
  txt(scene, 838, 262, 'DMA 16 通道', 't20w');
  box(1056, 220, 248, 68, 'var(--surface)', 'var(--line)', 2);
  txt(scene, 1072, 262, '向量中断控制', 't20w');
  arrow(1334, 236, 1370, 236);

  box(1372, 176, 496, 120, 'var(--page)', 'var(--observe-line)', 4);
  txt(scene, 1396, 214, 'APBH 侧设备', 't24');
  txt(scene, 1396, 248, 'GPMI 0x0180_6000（NAND）', 't20w');
  txt(scene, 1396, 280, 'BCH 0x0180_8000（ECC）', 't20w');

  var ROWS = [
    ['APBH DMA', '0x0180_4000', '32 KB：CTRL、通道寄存器、VERSION 都在这'],
    ['GPMI', '0x0180_6000', '8 KB：NAND 的命令/地址/数据 FIFO'],
    ['BCH', '0x0180_8000', '16 KB：ECC 编解码器，NAND 擦写读写都要它']
  ];
  ROWS.forEach(function (r, i) {
    var y = 316 + i * 62;
    box(56, y, 300, 52, 'var(--page)', 'var(--observe-line)', i === 0 ? 3 : 2);
    txt(scene, 76, y + 34, r[0], 't24');
    box(366, y, 300, 52, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 386, y + 34, r[1], 't24w');
    box(676, y, 1192, 52, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 700, y + 34, r[2], 't20w');
  });

  box(56, 512, 1812, 276, 'var(--surface)', 'var(--guide)');
  head(80, 550, '为什么它不归 AIPSTZ 管');
  txt(scene, 80, 590, 'APBH 是挂在 AHB 上的一条独立外设总线，桥自带 PIO 通路，请求根本不经过 AIPS-1/2/3。', 't20w');
  txt(scene, 80, 624, '所以第 14 章的 OPACR 特权位、第 11 章的 CSU 矩阵，都管不到 GPMI 与 BCH —— 这是另一条路。', 't20w');
  txt(scene, 80, 658, '代价很直接：这里没有权限门禁，谁能读写内存、谁能发起 DMA，全靠软件自己守。', 't20w');
  txt(scene, 80, 692, '争用规则写死在硬件里：DMA 优先，AHB 从口把 HREADY 拉低，仲裁器每 4 次反转让 Arm 过 1 次。', 't20w');
  txt(scene, 80, 726, '一句话记：AIPS 是「有门卫的大楼」，APBH 是「自己一条快车道」。', 't20w');
}

function drawMap() {
  txt(scene, 56, 146, '寄存器分两段：公共段 +0x000，通道段 +0x100 + 0x70 × i', 't24w');

  var ROWS = [
    ['CTRL0', '+0x00', '0xE000_0000', '复位是「关机态」：bit31 SFTRST、bit30 CLKGATE 都为 1，跑之前必须清'],
    ['CTRL1', '+0x10', '0x0000_0000', 'bit31–16 每通道完成中断使能，bit15–0 粘滞状态位，写 1 清'],
    ['CTRL2', '+0x20', '0x0000_0000', 'bit31–16 错误类型（1=AHB 总线错，0=设备提前终止），bit15–0 错误 IRQ'],
    ['CHANNEL_CTRL', '+0x30', '0x0000_0000', 'bit31–16 复位通道，bit15–0 冻结通道；写 1 后硬件自清'],
    ['BURST_SIZE', '+0x50', '0x0055_5555', '每通道 2 bit，01 就是 BURST4；GPMI 只支持 4，手册明说别改'],
    ['VERSION', '+0x800', '0x0301_0000', 'MAJOR=3 / MINOR=1 / STEP=0，用来证明「桥活着」']
  ];
  ROWS.forEach(function (r, i) {
    var y = 186 + i * 56;
    box(56, y, 310, 52, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 76, y + 34, r[0], 't24');
    box(376, y, 150, 52, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 396, y + 34, r[1], 't20w');
    box(536, y, 250, 52, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 556, y + 34, r[2], 't20w');
    box(796, y, 1072, 52, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 816, y + 34, r[3], 't20w');
  });

  box(56, 528, 1812, 260, 'var(--surface)', 'var(--guide)');
  head(80, 566, '通道段：+0x100 + 0x70 × i（i = 0…15，CH15 落在 +0x790）');
  txt(scene, 80, 604, '+0x100 CURCMDAR 正在执行的命令地址：卡住时先读它，能直接抓现场。', 't20w');
  txt(scene, 80, 638, '+0x110 NXTCMDAR 下一条命令地址：写它 + 给信号量加 1，就是「启动」的全部动作。', 't20w');
  txt(scene, 80, 672, '+0x120 CMD 当前命令字；+0x130 BAR 数据缓冲区地址（字节地址，不要求对齐）。', 't20w');
  txt(scene, 80, 706, '+0x140 SEMA 8 位计数信号量：bit23–16 PHORE 读当前值，bit7–0 写入即加。', 't20w');
  txt(scene, 80, 740, '+0x150 DEBUG1 状态机与 FIFO 标志；+0x160 DEBUG2 还剩多少 APB / AHB 字节。', 't20w');
  txt(scene, 80, 774, '验算：0x4000 + 0x100 + 0x70 × 15 = 0x4790，正好是手册里 CH15_CURCMDAR 的绝对地址。', 't20w');
}

function drawCcw() {
  txt(scene, 56, 146, '一条命令结构（CCW）最少三个字，后面可以跟 0–15 个 PIO 字', 't24w');

  box(56, 176, 540, 240, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '四字布局');
  txt(scene, 80, 252, 'WORD0 NEXTCMD_ADDR 下一条 CCW 的地址', 't20w');
  txt(scene, 80, 288, 'WORD1 命令字（位域见下方面板）', 't20w');
  txt(scene, 80, 324, 'WORD2 BAR（或 DMA_SENSE 的备用链）', 't20w');
  txt(scene, 80, 360, 'WORD3… PIO 字，逐字 +4 写进外设', 't20w');

  box(624, 176, 660, 240, 'var(--page)', 'var(--alert-line)', 4);
  head(648, 214, '一条 512 字节页读，算给你看');
  txt(scene, 648, 252, 'XFER_COUNT = 512 = 0x0200 → bit31–16', 't20w');
  txt(scene, 648, 288, 'COMMAND = 01（DMA_WRITE，见下方陷阱）', 't20w');
  txt(scene, 648, 324, 'IRQONCMPLT = 1（bit3）、CHAIN = 1（bit2）', 't20w');
  txt(scene, 648, 360, '命令字 = 0x0200_000D，写进 CH0_CMD', 't20w');

  box(1312, 176, 556, 240, 'var(--page)', 'var(--guide)', 2);
  head(1336, 214, 'COMMAND 的四个值');
  txt(scene, 1336, 252, '00 NO_DMA_XFER：只发 PIO，不搬数据', 't20w');
  txt(scene, 1336, 288, '01 DMA_WRITE：外设 → 内存（读页）', 't20w');
  txt(scene, 1336, 324, '10 DMA_READ：内存 → 外设（写页）', 't20w');
  txt(scene, 1336, 360, '11 DMA_SENSE：按 sense 选分支', 't20w');

  box(56, 436, 1812, 352, 'var(--surface)', 'var(--guide)');
  head(80, 474, '位域逐条，以及那个反直觉的方向');
  txt(scene, 80, 512, 'bit31–16 XFER_COUNT：本次搬多少字节。写 0 表示 64 KB，不是「0 字节」——最容易踩的一处。', 't20w');
  txt(scene, 80, 546, 'bit15–12 CMDWORDS：带几个 PIO 字（0–15）；它们从外设 base+0 起，每个 +4 依次写下去。', 't20w');
  txt(scene, 80, 580, 'bit8 HALTONTERMINATE：设备报错（HOT）时立刻终止本条并置错误 IRQ；建议永远置 1。', 't20w');
  txt(scene, 80, 614, 'bit7 WAIT4ENDCMD：等设备拉一次 endcmd 再走下一结构；bit6 SEMAPHORE：完成时把计数减 1。', 't20w');
  txt(scene, 80, 648, 'bit5 NANDWAIT4READY / bit4 NANDLOCK：只对通道 0–3 有效——等 NAND 就绪、抢占原子序列。', 't20w');
  txt(scene, 80, 682, 'bit3 IRQONCMPLT：完成时置 CTRL1 对应状态位；bit2 CHAIN：NEXTCMD_ADDR 有效，可以续链。', 't20w');
  txt(scene, 80, 716, 'bit1–0 COMMAND：00 只发 PIO、01 外设→内存、10 内存→外设、11 条件分支。', 't20w');
  txt(scene, 80, 750, '方向陷阱：DMA_WRITE 是「写进内存」，也就是从 NAND 读一页；名字站的是内存视角，不是外设视角。', 't20w');
}

function drawChain() {
  txt(scene, 56, 146, '链靠 CHAIN 走，节奏靠信号量与 WAIT 位对齐', 't24w');

  box(56, 176, 580, 232, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '启动只有两步');
  txt(scene, 80, 252, '① 写 CHn_NXTCMDAR = 第一条 CCW 的地址', 't20w');
  txt(scene, 80, 288, '② 写 CHn_SEMA：INCREMENT_SEMA = 1', 't20w');
  txt(scene, 80, 324, '硬件把 CCW 取进 CURCMDAR，然后逐条执行', 't20w');
  txt(scene, 80, 360, '少了第②步：地址写了也纹丝不动', 't20w');

  box(656, 176, 620, 232, 'var(--page)', 'var(--alert-line)', 4);
  head(680, 214, 'DMA_SENSE 轮询');
  txt(scene, 680, 252, 'NO_DMA_XFER 发 CHECKSTATUS（PIO 带期望值）', 't20w');
  txt(scene, 680, 288, '设备比较结果驱动 sense 线', 't20w');
  txt(scene, 680, 324, 'DMA_SENSE 按 sense 选 NEXTCMD 或 BAR 链', 't20w');
  txt(scene, 680, 360, '手册 15.3 与 15.5.10 的真/假方向相反，先实测', 't20w');

  box(1296, 176, 572, 232, 'var(--page)', 'var(--guide)', 2);
  head(1320, 214, '六个位，各管一件事');
  txt(scene, 1320, 252, 'WAIT4ENDCMD 等设备「这一条做完了」', 't20w');
  txt(scene, 1320, 288, 'NANDLOCK 让本通道独占仲裁到序列结束', 't20w');
  txt(scene, 1320, 324, 'NANDWAIT4READY 等 NAND 的 ready 线', 't20w');
  txt(scene, 1320, 360, 'HALTONTERMINATE 出错就停，不再往下走', 't20w');

  box(56, 428, 1812, 360, 'var(--surface)', 'var(--guide)');
  head(80, 466, '信号量是这套机制的心脏');
  txt(scene, 80, 504, '每个通道一个 8 位计数信号量：非 0 = 可以跑；减到 0 立刻 idle，直到软件再加。', 't20w');
  txt(scene, 80, 538, 'PHORE（bit23–16）是只读快照：想知道卡在哪，读它比猜快；写 0 不会清零。', 't20w');
  txt(scene, 80, 572, '硬件减、软件加碰在同一拍也不会丢：写入值直接加到计数上，不是覆盖。', 't20w');
  txt(scene, 80, 606, '这套「双重间接」允许软件在链跑动中追加命令，把新加的与跑完的用计数对齐。', 't20w');
  txt(scene, 80, 640, 'NAND 原子序列：第一条开始锁定，序列最后一条不带 NANDLOCK，结束后自动放开。', 't20w');
  txt(scene, 80, 674, 'sense 命令忽略 CHAIN 位：NEXTCMD 与 BAR 两条指针都必须有效，否则一分支就飞。', 't20w');
  txt(scene, 80, 708, '判据：STATEMACHINE = 0x1E 表示 CHAIN=0 停住；0x1F 表示在等 NAND ready；0x1D 是出错停机。', 't20w');
  txt(scene, 80, 742, '判据：SEMA.PHORE = 0 且 CURCMDAR = 0，说明启动两步里的第②步根本没做。', 't20w');
}

function drawVerify() {
  txt(scene, 56, 146, '四步定位：先验它活着，再验它会动，再验它卡在哪，最后验它为什么停', 't24w');

  box(56, 176, 560, 236, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '① 桥活着吗');
  txt(scene, 80, 252, '读 0x0180_4800 = 0x0301_0000', 't20w');
  txt(scene, 80, 288, '读 CTRL0，复位 0xE000_0000', 't20w');
  txt(scene, 80, 324, '清 bit31 / bit30 后应读回 0x2000_0000', 't20w');
  txt(scene, 80, 360, '读不到或全 0：先查 CCM 的 bch_clk_root 门控', 't20w');

  box(656, 176, 560, 236, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '② 通道会动吗');
  txt(scene, 680, 252, 'CHANNEL_CTRL 对应位写 1 复位通道', 't20w');
  txt(scene, 680, 288, 'DEBUG1 复位 0x00A0_0000（两个 FIFO 空）', 't20w');
  txt(scene, 680, 324, '写 NXTCMDAR、SEMA 加 1 后离 IDLE', 't20w');
  txt(scene, 680, 360, 'STATEMACHINE 从 0x00 变成 0x0C/0x0D 才算真跑', 't20w');

  box(1256, 176, 612, 236, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '③ 卡在哪、为什么停');
  txt(scene, 1280, 252, 'DEBUG1：状态机、NEXTCMDADDRVALID、FIFO 标志', 't20w');
  txt(scene, 1280, 288, 'DEBUG2：APB_BYTES / AHB_BYTES 还剩多少', 't20w');
  txt(scene, 1280, 324, '两边不等 → 堵在 AHB 侧，不是设备慢', 't20w');
  txt(scene, 1280, 360, 'CTRL2：1 = AHB 总线错，0 = 设备提前终止', 't20w');

  box(56, 432, 1812, 360, 'var(--surface)', 'var(--guide)');
  head(80, 470, '板级真相与观察点');
  txt(scene, 80, 508, '核心板上 eMMC（U3）走 SD2；NAND 位是 48-pin TSOP（U4），信号经 R35–R37 10Ω 串阻，CE0 另有 R39 0Ω + 10K 上拉。', 't20w');
  txt(scene, 80, 542, '出厂镜像若走 eMMC，这条 APBH 通路就是闲置的：/proc/mtd 为空、dmesg 里没有 gpmi —— 不是驱动坏了。', 't20w');
  txt(scene, 80, 576, '要练手：U-Boot 里 nand info / nand read；或裸机自己拼 CCW，把一页 512 字节读进 OCRAM。', 't20w');
  txt(scene, 80, 610, 'Linux 观察点：devmem 0x01804800（版本）、0x01804140（CH0 信号量）、/sys/kernel/debug/gpmi-nand。', 't20w');
  txt(scene, 80, 644, '顺序别乱：VERSION（时钟）→ SEMA.PHORE（启动）→ DEBUG1/2（进度）→ CTRL2（原因）。', 't20w');
  txt(scene, 80, 678, '实测量级：GPMI 一页 512 B + 16 B 校验，BURST4 下约几次总线突发；比 PIO 逐字节快一个数量级。', 't20w');
  txt(scene, 80, 712, '别拿这颗芯片 EPDC 说事：i.MX6ULL 没有 EPDC，APBH 侧只剩 GPMI 与 BCH 两个常客。', 't20w');
  txt(scene, 80, 746, '最后一条经验：调 APBH 永远先读回再怀疑代码——寄存器读回值比单步调试更能说明它跑没跑。', 't20w');
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawBridge();
  else if (s === 1) drawMap();
  else if (s === 2) drawCcw();
  else if (s === 3) drawChain();
  else drawVerify();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () {
  state.step = INIT.step; state.lane = INIT.lane; draw();
});
fitCanvas($('viewport'), $('canvas'), draw);
</script>
</body>
</html>
