<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人知识库</title>
<meta name="description" content="个人知识分享：按主题归档，每个主题一个入口。">
<meta name="theme-color" content="#08090c">
<style>
:root{
  --bg:#08090c; --line:#20242e; --line2:#2b3140;
  --fg:#e7eaf0; --muted:#98a1b2; --dim:#6b7385;
  --ac:#7c9cff; --ac2:#43d6a8;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono","Consolas",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
  font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  overflow-x:hidden;
}
.bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 520px at 12% -10%, rgba(124,156,255,.15), transparent 70%),
    radial-gradient(760px 460px at 92% 8%, rgba(67,214,168,.09), transparent 72%),
    linear-gradient(180deg,#0a0c11 0%,#08090c 46%,#07080a 100%);
}
.bg::after{
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(70% 55% at 50% 0%,#000 30%,transparent 100%);
}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:clamp(30px,7vw,92px) clamp(18px,4vw,40px) 40px}

.hero .badge{
  display:inline-flex;align-items:center;gap:8px;
  font:600 11px/1 var(--mono);letter-spacing:.18em;color:#9fb0d8;
  padding:7px 12px;border:1px solid var(--line2);border-radius:999px;background:rgba(124,156,255,.06);
  text-transform:uppercase;
}
.hero .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac2);box-shadow:0 0 10px var(--ac2)}
h1{
  margin:24px 0 0;font-size:clamp(30px,6vw,56px);line-height:1.18;letter-spacing:-.01em;font-weight:800;
  background:linear-gradient(96deg,#ffffff 8%,#cfd8ff 46%,#8fe9cf 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .lead{margin:18px 0 0;max-width:56ch;color:#b6bfcd;font-size:clamp(15px,1.7vw,17px)}

.list{margin:clamp(40px,7vw,68px) 0 0;padding:0;list-style:none}
.item{
  display:flex;align-items:center;gap:clamp(14px,2.4vw,22px);
  padding:clamp(18px,2.6vw,26px);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;
  text-decoration:none;color:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));
  transition:border-color .2s,transform .2s,background .2s;
}
.item:hover{border-color:#3a4560;transform:translateY(-2px);background:linear-gradient(180deg,rgba(124,156,255,.07),rgba(255,255,255,.012))}
.item .no{flex:none;align-self:flex-start;margin-top:5px;font:700 11px/1 var(--mono);letter-spacing:.14em;color:var(--dim)}
.item .body{flex:1;min-width:0}
.item .body b{display:block;font-size:clamp(17px,2.2vw,19.5px);line-height:1.4;letter-spacing:.01em}
.item .body span{display:block;margin-top:6px;font-size:13.5px;line-height:1.7;color:#a5aebd}
.item .cta{
  flex:none;display:inline-flex;align-items:center;gap:7px;
  font:600 12.5px/1.1 var(--mono);letter-spacing:.02em;color:#a9c2ff;
  padding:8px 13px;border:1px solid rgba(124,156,255,.26);border-radius:9px;background:rgba(124,156,255,.06);
  transition:border-color .2s,color .2s,background .2s;
}
.item:hover .cta{border-color:rgba(67,214,168,.55);color:#7ff0c9;background:rgba(67,214,168,.07)}

footer{
  display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:space-between;align-items:center;
  margin-top:clamp(52px,9vw,96px);padding-top:20px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--dim);
}

@media (max-width:560px){
  .wrap{padding-top:36px}
  .item{flex-wrap:wrap;gap:10px}
  .item .no{order:1}
  .item .body{flex:1 1 100%;order:2}
  .item .cta{order:3;margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="wrap">

  <header class="hero">
    <div class="badge">knowledge base</div>
    <h1>个人知识库</h1>
    <p class="lead">个人知识分享</p>
  </header>

  <ul class="list">
    <li>
      <a class="item" href="imx6ull/index.html">
        <span class="no">01</span>
        <span class="body">
          <b>i.MX6ULL · 从裸机到 Linux 驱动</b>
          <span>手写汇编、芯片手册研读、板级硬件、互动演示与驱动主线</span>
        </span>
        <span class="cta">进入 →</span>
      </a>
    </li>
    <li>
      <a class="item" href="software/design-patterns/index.html">
        <span class="no">02</span>
        <span class="body">
          <b>设计模式 · C / C++ 双实现</b>
          <span>三篇 10 章：基础、行为型、结构型与创建型；每章问题、结构图、C 与 C++ 双实现、真实运行输出、可点演示</span>
        </span>
        <span class="cta">进入 →</span>
      </a>
    </li>
  </ul>

  <footer>
    <span>静态页面 · 无统计脚本 · 无第三方请求</span>
  </footer>

</div>
</body>
</html>
