<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0 };
var state = { step: INIT.step };

var STEPS = [
  { h: 'DDR 门口的门卫', hint: 'TrustZone 落地',
    note: '它在 MMDC 前面查每一笔 AXI 事务的 NS 位，决定放行还是拒绝。' },
  { h: '拒绝一次访问', hint: '记录 + 中断',
    note: '不匹配不是“读出错值”，而是直接拒绝：总线错误 + fail address + 中断。' },
  { h: '16 个区域', hint: '第 0 区是底板',
    note: '区域 0 必须覆盖整段 DDR 当背景，其余 15 个才是真正的保护区。' },
  { h: '权限矩阵', hint: '安全/非安全 × 读/写',
    note: '每个区域各有一套 secure 与 non-secure 的读写开关，这才是“隔离”的实体。' },
  { h: '别名陷阱', hint: '没接满就镜像',
    note: 'DDR 只焊了 512 MB 时整段 2 GB 空间会被镜像，每份别名都要单独保护。' },
  { h: '打开与锁定', hint: '默认是旁路',
    note: 'i.MX 上默认 bypass，要靠 CSU 打开；一旦锁定，就只能复位才改回来。' },
  { h: '实战判据', hint: '用 abort 验证',
    note: 'Linux 侧访问保护区应得到 abort；TEE 侧读写正常，这条对照就是隔离生效的证据。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}
function three(a, b, c) {
  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(a[0], 214, a[1]); for (var i = 0; i < a[2].length; i++) txt(scene, a[0], 252 + i * 36, a[2][i], a[3] || 't20w');
  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(b[0], 214, b[1]); for (var j = 0; j < b[2].length; j++) txt(scene, b[0], 252 + j * 36, b[2][j], b[3] || 't20w');
  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(c[0], 214, c[1]); for (var k = 0; k < c[2].length; k++) txt(scene, c[0], 252 + k * 36, c[2][k], c[3] || 't20w');
}
function prose(title, lines) {
  wide(456, 330);
  txt(scene, 80, 490, title, 't24');
  for (var i = 0; i < lines.length; i++) txt(scene, 80, 522 + i * 34, lines[i], 't20w');
}

function drawTop() {
  txt(scene, 56, 146, 'TrustZone 在 CPU 里只是一个“标记”，真正让它变成隔离墙的，是 DDR 前面这道检查', 't24w');
  three([80, '位置', ['DDR 控制器之前', '坐在 AXI 主从之间', '每一笔 DDR 访问都过它', 'APB 从口给软件配置', '时钟 mmdc_axi_clk_root', '本质是 ARM TZC-380 IP'], 't20w'],
        [680, '凭什么判断', ['AXI 事务自带 NS 位', 'NS=1 是非安全世界', 'NS=0 是安全世界', '区域有自己的安全属性', '两者相符才放行', '这就是“地址级”隔离'], 't20w'],
        [1280, '与 CPU 的分工', ['CPU 的 NS 位来自 SCR.NS', '进入 secure 走 monitor', 'TZASC 只信总线上的位', '所以它是最后一道闸', 'CPU 被攻破也拦得住', '但配错了就形同虚设']]);
  prose('为什么需要它：CPU 里的 TrustZone 只保证“安全世界的内存不可被非安全世界寻址”，一旦有人绕过 MMU 直接发起 DMA，就只有总线级检查能拦', [
    '这就是“DMA 攻击”的防线：外设（SDMA、USB、网卡）发起的事务也带 NS 位，TZASC 一样会检查，从而阻止非安全驱动读写 TEE 的内存。',
    '代价是性能与复杂度：所有 DDR 事务都要过一遍区域匹配；区域越多、匹配逻辑越复杂，但 16 个区对嵌入式足够。',
    '本手册第 54 章只有两页，没有寄存器表 —— 因为它是 ARM 的标准 IP，编程模型要照 TZC-380 的技术参考手册，i.MX 只在集成上做了裁剪。',
    '在 i.MX 上它还默认处于旁路状态：不经过 CSU 打开，这个门卫根本不在链路上，你以为的隔离其实不存在。',
    '实际使用者主要是 OP-TEE 这类方案：DDR 划一块给 secure 世界，剩下交给 Linux，两者靠 TZASC 隔开。',
    '一句话：TrustZone 的“信任”必须由硬件地址检查来兑现，TZASC 就是那个兑现者。']);
}

function drawDeny() {
  txt(scene, 56, 146, '被拒绝的访问不是“读到错数据”，而是当场失败：总线报错、地址被记下、还能发中断', 't24w');
  three([80, '三种反应', ['AXI 返回 SLVERR/DECERR', '发起方收到总线错误', 'ARM 侧表现为 abort', '地址写进 fail 寄存器', '可编程产生中断', '便于取证与告警'], 't20w'],
        [680, 'fail 寄存器', ['记录违规地址', '区分安全/非安全访问', '区分读还是写', '区分方向（主→从）', '多次违规则保留第一次', '是排查配置错的唯一线索'], 't20w'],
        [1280, '为什么这么设计', ['静默改数据最危险', '宁可让攻击者拿到 abort', '也不让它读到内容', '中断可让 monitor 记录', '但中断本身可被屏蔽', '所以取证要靠 fail 地址']]);
  prose('Linux 侧看到的现象很具体：内核日志里一条 “Unhandled kernel paging request” 或 “Synchronous Abort”，地址正是 fail 寄存器里那个', [
    '这类 abort 不是页表问题，而是总线拒绝：页表允许访问，但 TZASC 说不许 —— 排查时先读 fail address，别一头扎进 MMU。',
    '反过来，如果配置写错把 Linux 自己的内存划进了保护区，表现就是“内核随机崩、崩在不同函数”，非常像内存坏了。',
    '因此启用 TZASC 必须先在“只保护不用区”上验证：先划一块没人用的地址，确认访问它会 abort，再逐步扩大范围。',
    '中断只是个便利：真正可靠的证据是 fail 地址寄存器，因为攻击者可以先关中断再访问。',
    '注意我也要防“误放行”：区域没覆盖到的地址会落到区域 0（背景区），如果区域 0 被设成全放行，未覆盖的部分就完全不设防。',
    '判据：故意从非安全世界读保护区，应得到 abort 且 fail 地址与预期一致；读安全世界同一地址应正常 —— 两侧对照才算验证。']);
}

function drawRegions() {
  txt(scene, 56, 146, '16 个区域像 16 把尺子：区域 0 量整段 DDR 当底板，区域 1–15 各自圈一块并单独设权限', 't24w');
  three([80, '区域 0 特殊', ['必须覆盖全部 DDR', '当作“默认策略”区', '不能设成保护', '通常全放行或全禁止', '它决定未匹配地址的命运', '改它等于改全局默认'], 't20w'],
        [680, '区域 1–15', ['各自 base + size', 'size 是 2 的幂', 'base 按 size 对齐', '互相可重叠（高编号优先）', '每区一套读写权限', '可单独使能/关闭'], 't20s'],
        [1280, '编程顺序', ['① 先关总使能', '② 配区域 0 覆盖全区', '③ 逐个配保护区', '④ 最后置总使能位', '⑤ 需要时锁定寄存器', '顺序错了会中途误拒']]);
  prose('“base 按 size 对齐”是硬要求：想保护 64 KB，基址必须 64 KB 对齐，否则低位被忽略、范围更大', [
    '典型错误：写 base=0x8F00_1000、size=64 KB，硬件会把基址对齐到 0x8F00_0000，保护区悄悄变大。',
    '区域重叠时高编号优先：这让“在保护区里挖一个小洞”成为可能（用区域 N+1 覆盖区域 N 的一小段并放行）。',
    '区域 0 的设计意图是“背景”：所有没被 1–15 覆盖的地址都由它决定，所以它必须覆盖整段地址空间，且通常设为全放行。',
    '如果芯片只焊了部分 DDR，区域 0 仍要按“芯片支持的最大空间”来覆盖，否则别名区会落到未定义行为。',
    '出于安全，很多实现要求先写区域 0 再写其他区：因为总使能打开那一刻，未配置的区域会按默认策略拒绝，可能直接把自己锁死。',
    '判据：配完后从安全世界读每个区的边界地址（base 与 base+size）都应成功，非安全世界读保护区应失败 —— 边界两侧各测一次。']);
}

function drawPerm() {
  txt(scene, 56, 146, '隔离的实体是权限位：每个区域对“安全/非安全”“读/写”四个组合各有一个开关', 't24w');
  three([80, '四个开关', ['安全读 / 安全写', '非安全读 / 非安全写', '可自由组合', '例如：安全可读写、非安全全禁', '这是最典型的 TEE 区', '也可设成非安全只读共享'], 't20w'],
        [680, '常见三种策略', ['① TEE 私有：非安全全禁', '② 共享缓冲：非安全可读写', '③ 只读共享：非安全只读', '三种覆盖 90% 场景', '共享区要 cache 一致', '否则数据看不见'], 't20w'],
        [1280, '易错点', ['忘了关“非安全写”', '等于给了破坏权', '共享区用 write-back', '安全侧改了非安全看不到', '应设 non-cache 或显式 flush', '权限与属性要一起想']]);
  prose('最常被忽略的是 cache：TZASC 只管“能不能访问”，不管“看到的是不是最新的”，共享内存必须自己处理一致性', [
    '共享缓冲区的标准做法：两块内存属性都设成 non-cacheable 或 write-through，或者每次交接时做 clean/invalidate。',
    '另一个易错点：安全世界写共享区后忘了 flush，非安全世界读到旧值，看起来像“TEE 没写成功”。',
    '只读共享（非安全可读、不可写）适合放“证书/公钥/配置”，既能读又不给改的机会。',
    '权限位是“与”关系：一笔访问必须同时满足“世界匹配”与“读/写允许”，任一不满足就拒绝。',
    '不要试图用 TZASC 做“进程间隔离”：它只区分安全/非安全两个世界，没有进程概念，那要靠 MMU。',
    '判据：非安全侧对 TEE 区做一次写，应 abort 且 fail 地址正确；对共享区写应成功且安全侧立刻能读到 —— 两条都验。']);
}

function drawAlias() {
  txt(scene, 56, 146, 'DDR 没插满时整段空间会被硬件“镜像”：同一块物理内存出现在多个地址上，保护必须覆盖每一份', 't24w');
  three([80, '为什么会别名', ['控制器支持 2 GB 空间', '只焊了 512 MB', '地址高位被忽略', '于是 4 份镜像', 'base+0/512M/1G/1.5G', '都指向同一块颗粒'], 't20w'],
        [680, '后果', ['只保护 0x8000_0000 起', '攻击者改走 0x9000_0000', '读到的是同一块内存', '保护形同虚设', '这是最常见的安全漏洞', '也是“写对却没用”的原因'], 't20w'],
        [1280, '怎么办', ['先确认实际颗粒容量', '按最大空间配区域 0', '每份别名都单独设区', '或用“覆盖整段”的粗粒度策略', '区域数会因此变紧张', '16 个区要精打细算']]);
  prose('算别名很简单：控制器寻址 2 GB、实际 512 MB，就是 2 GB/512 MB = 4 份镜像；每份都要保护，等于一个保护区吃掉 4 个区域', [
    '本板若只焊 512 MB，而你只保护了 0x8000_0000–0x9FFF_FFFF 这一份，非安全世界换用 0xA000_0000 起访问同一颗粒，TZASC 会认为“这是另一个区”，直接放行。',
    '所以安全配置的第一步是确认 DDR 实际容量，然后按“最大寻址空间”来规划区域，而不是按“实际容量”。',
    '这也是为什么很多方案干脆把区域 0 设成“非安全全禁”，只把明确要共享的小窗口做白名单 —— 白名单更不容易漏。',
    '别名不只是安全问题：调试时“同一变量两个地址读到不同值”的错觉，往往就是别名与 cache 属性不一致造成的。',
    '另一个思路是用区域 1 的“小洞”策略：大范围禁止、少量地址放行，把 16 个区用在“允许列表”上。',
    '判据：在非安全世界分别从每份别名读保护区地址，全部应 abort 且 fail 地址不同 —— 只要有一份成功，就说明漏配了。']);
}

function drawEnable() {
  txt(scene, 56, 146, '在 i.MX6ULL 上它默认是旁路：要由 CSU 打开，而打开与锁定往往是不可逆的', 't24w');
  three([80, '谁管开关', ['CSU 是安全配置总控', 'CSU 里有 TZASC1_BYP 位', '清该位 = 不再旁路', '熔丝 TZASC1_BOOT_LOCK', '烧了则启动即锁死配置', '量产常用熔丝'], 't20w'],
        [680, '锁定机制', ['部分寄存器可 lock', '锁定后写无效', '直到下一次复位', '防止运行期被改', '也防止你自己改回来', '调试期慎用'], 't20w'],
        [1280, '顺序建议', ['① 先不打开，只写配置', '② 验证边界地址行为', '③ 再清 BYP 使能', '④ 立即测正反两侧', '⑤ 量产才烧熔丝', '任何一步都可回退']]);
  prose('熔丝的不可逆性决定了策略：开发阶段用 CSU 运行时开关，量产阶段才烧 TZASC1_BOOT_LOCK，把配置钉死在启动时刻', [
    'TZASC1_BOOT_LOCK 的作用是“启动后配置即锁定”，从此运行期任何软件（包括 secure 侧被攻破的代码）都改不了区域表。',
    '因此它必须与“正确的配置”一起烧：先烧熔丝再发现配错，只能换芯片 —— 这是量产前必须反复验证的一步。',
    '运行时开关（BYP 位）则灵活得多：调试时可以打开/关闭对照，出问题就复位恢复。',
    '注意 CSU 自身也有锁定与 challenge-response 机制（见第 32 章），两者常常一起用：CSU 锁定配置入口，TZASC 执行地址策略。',
    '打开旁路的时机很关键：必须在 DDR 初始化之后、任何非安全代码运行之前；太早会把启动代码自己挡在外面。',
    '判据：清 BYP 后立刻读 fail 寄存器（应为 0），再做一次越权访问看它是否被记下 —— 说明门卫确实上线了。']);
}

function drawProof() {
  txt(scene, 56, 146, '验证隔离只有一种可靠办法：两侧对照 —— 同一地址，非安全侧失败、安全侧成功', 't24w');
  three([80, '正反测试', ['非安全读保护区 → abort', '安全读同一地址 → 成功', '非安全写保护区 → abort', '安全写同一地址 → 成功', '四条全对才算通', '只测一侧容易自欺'], 't20w'],
        [680, '取证三件套', ['fail 地址寄存器', '总线错误日志', '中断计数', '三者指向同一地址', '才确定是 TZASC 拒绝', '否则可能是 MMU'], 't20w'],
        [1280, '上板顺序', ['先划一块闲置地址验证', '再划真实 TEE 区', '最后才启用熔丝锁定', '每步都留回滚路径', '别一次改完再测', '出错无法定位']]);
  prose('本板做这套实验的现实做法：用 OP-TEE 或自写 monitor 建一个 secure 世界，把 DDR 高 32 MB 划给它，Linux 侧试着读写那一段', [
    '预期结果：Linux 一读就 abort（fail 地址正是那段），TEE 里读写正常；两边日志一对，隔离就证明了。',
    '如果 Linux 侧居然能读到内容，先查三件事：BYP 是否真的清了、区域是否覆盖了别名、区域是否真的使能了。',
    '如果 TEE 侧自己也 abort，多半是区域把 secure 权限也关了，或者区域 0 被设成了全禁。',
    '这套机制无法防“物理攻击”（拆焊颗粒直接读），它防的是软件与 DMA 越权；安全等级的边界要说清楚。',
    '性能上要有预期：开启后 DDR 访问多一级匹配，实测带宽通常损失个位数百分比，比想象的小。',
    '判据：连续跑 24 小时压力测试不出现意外 abort（说明没把自己挡住），同时越权测试每次都失败（说明门卫真在岗）—— 两者同时成立才算合格。']);
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawTop();
  else if (s === 1) drawDeny();
  else if (s === 2) drawRegions();
  else if (s === 3) drawPerm();
  else if (s === 4) drawAlias();
  else if (s === 5) drawEnable();
  else drawProof();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () { state.step = INIT.step; draw(); });
fitCanvas($('viewport'), $('canvas'), draw);
</script>
</body>
</html>
