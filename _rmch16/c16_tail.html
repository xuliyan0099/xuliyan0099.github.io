<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0, lane: 0 };
var state = { step: INIT.step, lane: INIT.lane };

var STEPS = [
  { h: '异步重采样', hint: '10 通道 · 3 对',
    note: '两路数字音频各自带时钟，44.1 kHz 与 48 kHz 不同源时不能直接对接：ASRC 就是夹在中间的那级重采样器。它最多同时转 10 个通道、支持三对独立的输入/输出速率，THD+N 约 −120 dB，建立时间 40 ms。' },
  { h: '三对通道与 FIFO', hint: 'A/B/C · 64/32',
    note: '通道按对分组：A、B、C 各 0–10 路，合计不超过 10。每对一组 FIFO，每组 64 个样本、阈值 32。写输入必须按通道顺序循环，硬件再按 ASRCCR 的当前通道号把样本分回各自通道。' },
  { h: '比率与分频', hint: 'Q6.26 · 76K/56K',
    note: '比率就是 Fsin/Fsout，用一个 32 位定点数表示，其中 26 位是小数：1.0 等于 0x0400_0000。比率可以来自硬件实测（两路采样时钟都在），也可以来自软件写的理想值。另外两个寄存器 ASR76K、ASR56K 是滤波器自动选择的标尺，按处理时钟折算。' },
  { h: '比率算例与漂移', hint: 'Q6.26 手算',
    note: '44.1k→48k 的比率 0.91875，乘 2^26 得 61 656 268.8，截断为 0x03AC_CCCC；48k→44.1k 的 1.088435… 恰好落在 0x045A_8ECD。一个 LSB 等于 2^-26 ≈ 1.5×10^-8，截断误差在百万分之一量级，够用。' },
  { h: '寄存器地图：0xC8 字节', hint: '0x0203_4000',
    note: '全部寄存器挤在 0x0203_4000 起的 0xC8 字节里：控制、中断、通道数、时钟、分频、状态、数据、理想比率、标尺、FIFO 阈值、字对齐。' },
  { h: '五步启动，顺序不能翻', hint: 'SRST → 通道 → 比率',
    note: '软复位（9 个处理时钟后自清）→ 使能 → 写三对通道数 → 选时钟配分频并重算标尺 → 选比率模式写 ASRIDR → 置使能与中断、按通道顺序灌数据。漏第一步的典型症状是写进去读回全 0。' },
  { h: '实测与板级', hint: '标尺 · 状态 · codec',
    note: '四个观察点：ASR76K/ASR56K 是否与实际处理时钟匹配、ASRSTR 三个关键位、ASRFSTx 的 FIFO 计数、以及比率方向有没有写反。板级还要确认一件事：这块 MINI 底板上到底有没有能被驱动的音频 codec。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }

function drawWhy() {
  txt(scene, 56, 146, '44.1 kHz 与 48 kHz 不同源，中间必须有一级重采样 —— 这就是 ASRC', 't24w');

  box(56, 176, 560, 250, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '它替谁干活');
  txt(scene, 80, 252, '两路音频各带各的时钟，不能直接对接', 't20w');
  txt(scene, 80, 288, '同时转 10 个通道，支持 3 对速率', 't20w');
  txt(scene, 80, 324, 'THD+N ≈ −120 dB，动态范围 144 dB', 't20w');
  txt(scene, 80, 360, '建立时间 40 ms，信号带宽 <24 kHz', 't20w');
  txt(scene, 80, 396, '输入 8–200 kHz，输出 30–200 kHz', 't20w');

  box(656, 176, 560, 250, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '片上是个小 DSP');
  txt(scene, 680, 252, 'FIFO 控制 + 地址生成 AGU + ALU', 't20w');
  txt(scene, 680, 288, 'PROM 存系数、DP RAM 存状态', 't20w');
  txt(scene, 680, 324, 'task queue 把任务排队执行', 't20w');
  txt(scene, 680, 360, 'CPU 只负责搬样本，转换它自己做', 't20w');
  txt(scene, 680, 396, '所以它叫协处理器，不叫外设', 't20w');

  box(1256, 176, 612, 250, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '三对通道 A / B / C');
  txt(scene, 1280, 252, '每对独立配输入时钟与输出时钟', 't20w');
  txt(scene, 1280, 288, '每对 0–10 路，三对合计不超过 10', 't20w');
  txt(scene, 1280, 324, '某对写 0 路就等于禁用（即使使能位置了）', 't20w');
  txt(scene, 1280, 360, '典型：A 收 44.1k→48k，B 走 SPDIF', 't20w');
  txt(scene, 1280, 396, 'ASRCNCR 里 ANCA/ANCB/ANCC 各 4 位', 't20w');

  box(56, 446, 1812, 346, 'var(--surface)', 'var(--guide)');
  head(80, 484, '地址、时钟从哪来');
  txt(scene, 80, 522, '基址 0x0203_4000，落在 AIPS-1 段 —— 第 14 章的 AIPSTZ1 特权位、第 11 章的 CSU 都管得着它。', 't20w');
  txt(scene, 80, 556, 'asrck_0 … asrck_9 是 10 个可选采样率时钟输入：SAI 的位时钟、SPDIF 收发时钟、外部引脚都行。', 't20w');
  txt(scene, 80, 590, 'asrck_6 是三选一：KEY_ROW3 / GPIO_0 / GPIO_18，由 IOMUXC_ASRC_CLOCK_6_SELECT_INPUT[DAISY] 决定。', 't20w');
  txt(scene, 80, 624, 'ASRCKI 由 CCM 的 CDCDR 里 SPDIF1_CLK_PRED / PODF 控制 —— 这一级没配好，转换就是慢动作或干脆不动。', 't20w');
  txt(scene, 80, 658, '典型链路：SAI 收 44.1 kHz 样本 → ASRC 按 48 kHz 输出 → SAI 发出去，两侧时钟各不相干。', 't20w');
  txt(scene, 80, 692, '另一种：SPDIF 输入接外部设备，ASRC 把它的速率对齐到本板音频时钟，避免每过一段就丢/重一个样本。', 't20w');
  txt(scene, 80, 726, '注意它和 SDMA 的关系：数据搬运走 SDMA，转换本身在 ASRC 内部，两件事别混。', 't20w');
  txt(scene, 80, 760, '这也是为什么 6ULL 的音频子系统里，ASRC 常被当成「可选的一级」：不用它也能播，只是会漂。', 't20w');
}

function drawFifo() {
  txt(scene, 56, 146, '三对通道、三组 FIFO、三种搬运模式，全部由 ASRCNCR 与 ASRIER 定调', 't24w');

  box(56, 176, 560, 238, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '通道数怎么写');
  txt(scene, 80, 252, 'ANCA[3:0]：0–10 路，写 0 即禁用', 't20w');
  txt(scene, 80, 288, 'ANCB[7:4]、ANCC[11:8] 同构', 't20w');
  txt(scene, 80, 324, '三对之和 ≤ 10（硬件只有 10 路）', 't20w');
  txt(scene, 80, 360, '通道是连续的：A 占 0..n-1，B 接着排', 't20w');
  txt(scene, 80, 396, '禁用的对：FIFO 不动，也不产生状态', 't20w');

  box(656, 176, 560, 238, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'FIFO 的规矩');
  txt(scene, 680, 252, '每组 64 个样本，阈值默认 32', 't20w');
  txt(scene, 680, 288, '阈值由 ASRMCRA/B/C 改写', 't20w');
  txt(scene, 680, 324, '输入低于阈值 → AIDE 状态位置起', 't20w');
  txt(scene, 680, 360, '输出高于阈值 → AODF 状态位置起', 't20w');
  txt(scene, 680, 396, '空读或满写 → AOLE 溢出位置起', 't20w');

  box(1256, 176, 612, 238, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '三种搬运模式');
  txt(scene, 1280, 252, '轮询：清 ADIE/ADOE 位，软件盯着状态位', 't20w');
  txt(scene, 1280, 288, '中断：置 ADIE/ADOE，阈值越界就进中断', 't20w');
  txt(scene, 1280, 324, 'DMA：清中断位，把 ASRC 当 SDMA 请求源', 't20w');
  txt(scene, 1280, 360, '三种模式可对 A/B/C 分别设置', 't20w');
  txt(scene, 1280, 396, 'DMA 只搬数据，比率与滤波仍由 ASRC 做', 't20w');

  box(56, 434, 1812, 358, 'var(--surface)', 'var(--guide)');
  head(80, 472, '一个容易被忽略的顺序要求');
  txt(scene, 80, 510, '写 ASRDIA 时不能乱序：必须 channel_0、channel_1 … channel_n 循环，硬件才知道每个样本属于谁。', 't20w');
  txt(scene, 80, 544, '它靠 ASRCCR 的 ACI 字段知道「现在该收第几个通道」；读 ASRCCR 就能查出当前通道号。', 't20w');
  txt(scene, 80, 578, '乱序写入不会报错，只会把左右声道对调、或把 A 对的样本喂进 B 对 —— 症状是听感错位但数值正常。', 't20w');
  txt(scene, 80, 612, '同理，输出 FIFO 也按同样顺序排：读 ASRDOA 拿到的第一个样本，就是当初写进去的第一个通道。', 't20w');
  txt(scene, 80, 646, '阈值不是「水位线」，是「请求线」：低于它就说明该补货，高于它就说明有货可取，中间那段是正常波动区。', 't20w');
  txt(scene, 80, 680, 'AOLE 是唯一的硬错误：输入断供或输出没人取都会走到它；调试时先清 AOLE 再看它是否马上复发。', 't20w');
  txt(scene, 80, 714, '中断模式下，写够数据把水位拉过阈值，中断自动消；不用手动清状态位（AOLE 例外，要写 1 清）。', 't20w');
  txt(scene, 80, 748, 'DMA 模式下别再开 ADIE/ADOE，否则同一件事会被中断和 DMA 抢两遍，表现是样本重复。', 't20w');
}

function drawRatio() {
  txt(scene, 56, 146, '比率决定音高，标尺决定滤波器；两个都错，输出听起来就「不对但说不出哪不对」', 't24w');

  box(56, 176, 560, 232, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '比率从哪来');
  txt(scene, 80, 252, 'USRA=0：不用比率，硬件全程实测', 't20w');
  txt(scene, 80, 288, 'USRA=1、IDRA=0：用实测比率', 't20w');
  txt(scene, 80, 324, 'USRA=1、IDRA=1：用软件写的理想值', 't20w');
  txt(scene, 80, 360, 'B、C 两对同构：USRB/IDRB、USRC/IDRC', 't20w');
  txt(scene, 80, 396, '输入时钟拿不到时才需要理想值', 't20w');

  box(656, 176, 560, 232, 'var(--page)', 'var(--alert-line)', 4);
  head(680, 214, '1.0 就是 0x0400_0000');
  txt(scene, 680, 252, 'ratio = Fsin / Fsout（别写反）', 't20w');
  txt(scene, 680, 288, '44.1k → 48k：0x03AC_CCCC', 't20w');
  txt(scene, 680, 324, '48k → 44.1k：0x045A_8ECD', 't20w');
  txt(scene, 680, 360, '高半字写 ASRIDRHA，低半字写 ASRIDRLA', 't20w');
  txt(scene, 680, 396, '算错一位听着像走音，算反方向会越跑越偏', 't20w');

  box(1256, 176, 612, 232, 'var(--page)', 'var(--guide)', 2);
  head(1280, 214, '分频链在 ASRCDR1');
  txt(scene, 1280, 252, '输入侧：AICPA 2^n（1–128）、AICDA 1–8', 't20w');
  txt(scene, 1280, 288, '输出侧：AOCPA 2^n、AOCDA 1–8', 't20w');
  txt(scene, 1280, 324, 'B 对另有三组位，C 对看 ASRCDR2', 't20w');
  txt(scene, 1280, 360, '分频是给「所选时钟」降频，不是改比率', 't20w');
  txt(scene, 1280, 396, '分频改错 → 检测到的频率错 → 比率跟着错', 't20w');

  box(56, 428, 1812, 364, 'var(--surface)', 'var(--guide)');
  head(80, 466, 'ASR76K / ASR56K：两个「标尺」，不是分频值');
  txt(scene, 80, 504, '它们表示「在处理时钟下，76 kHz 与 56 kHz 各占多少拍」，给滤波器自动选择当尺子用。', 't20w');
  txt(scene, 80, 538, '复位值 0x0A47 = 2631、0x0DF3 = 3571，正好是 200 MHz 下的 200 MHz/76 kHz 与 200 MHz/56 kHz。', 't20w');
  txt(scene, 80, 572, '处理时钟不是 200 MHz 就必须重算这两个数，否则 PREMOD/POSTMOD 会被自动选错，高频被削或混叠。', 't20w');
  txt(scene, 80, 606, 'ASRCTR 的 ATSA/ATSB/ATSC 就是「自动挑选项」开关；配错标尺时它挑得自信又准确——准确地错。', 't20w');
  txt(scene, 80, 640, '手算判据：写进去的 ASR76K × 76 kHz 应≈处理时钟；偏差超过 5%，说明时钟或标尺有一个错了。', 't20w');
  txt(scene, 80, 674, '反过来也成立：读回 ASR76K 就知道「软件以为处理时钟是多少」，比翻设备树快。', 't20w');
  txt(scene, 80, 708, '例：133 MHz 处理时钟，76 kHz 标尺应是 133e6/76e3 ≈ 1750（0x06D6），不是 2631。', 't20w');
  txt(scene, 80, 742, '最后：比率与标尺是两套数，别用比率去算标尺；前者管音高，后者管滤波器选择。', 't20w');
}

function drawRegs() {
  txt(scene, 56, 146, '全部寄存器在 0x0203_4000 + 0x00 … +0xC8，两列排开', 't24w');

  var L = [
    ['ASRCTR', '0x00', '总使能、三对使能、比率模式、软复位'],
    ['ASRIER', '0x04', '六路中断：3 入 / 3 出 / 溢出'],
    ['ASRCNCR', '0x0C', 'ANCA / ANCB / ANCC 三对通道数'],
    ['ASRCFG', '0x10', '前处理 / 后处理模式选择'],
    ['ASRCSR', '0x14', '三对通道选哪个 asrck 时钟'],
    ['ASRCDR1', '0x18', 'A/B 两对的输入输出分频'],
    ['ASRCDR2', '0x1C', 'C 对分频'],
    ['ASRSTR', '0x20', '状态只读：AIDE / AODF / AOLE 等']
  ];
  var R = [
    ['ASRCCR', '0x5C', '当前正在分配第几个通道（ACI）'],
    ['ASRDIA/B/C', '0x60/68/70', '写输入样本，按通道顺序'],
    ['ASRDOA/B/C', '0x64/6C/74', '读输出样本，同样按顺序'],
    ['ASRIDR', '0x80–0x94', '三对的理想比率，Q6.26 高低两半'],
    ['ASR76K / 56K', '0x98/0x9C', '76 kHz / 56 kHz 两个标尺'],
    ['ASRMCRA/B/C', '0xA0/A8/B0', '每组 FIFO 的阈值'],
    ['ASRFSTA/B/C', '0xA4/AC/B4', 'FIFO 当前计数（只读）'],
    ['ASRMCR1A/B/C', '0xC0/C4/C8', '输入/输出字宽与对齐方式']
  ];
  L.forEach(function (r, i) {
    var y = 186 + i * 48;
    box(56, y, 250, 44, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 76, y + 30, r[0], 't24');
    box(316, y, 130, 44, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 336, y + 30, r[1], 't20w');
    box(456, y, 424, 44, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 476, y + 30, r[2], 't20w');
  });
  R.forEach(function (r, i) {
    var y = 186 + i * 48;
    box(920, y, 250, 44, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 940, y + 30, r[0], 't24');
    box(1180, y, 200, 44, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 1200, y + 30, r[1], 't20w');
    box(1390, y, 478, 44, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 1410, y + 30, r[2], 't20w');
  });

  box(56, 580, 1812, 212, 'var(--surface)', 'var(--guide)');
  head(80, 618, '看表的方法');
  txt(scene, 80, 654, '左边一列是“控制与配置”，右边一列是“数据与比率”；调不通时先看左、读回时先看右。', 't20w');
  txt(scene, 80, 688, 'ASRSTR 在 0x20 只读，状态问题只能靠它和 ASRFSTx 判断，写它没用。', 't20w');
  txt(scene, 80, 722, 'ASRIDR 是 32 位定点数，但寄存器是 16 位宽：高半字 0x80–0x88、低半字 0x84–0x94，别写反。', 't20w');
  txt(scene, 80, 756, '地址差 4 的成对寄存器（0x60/0x64）就是“输入/输出”一对，读写方向别混。', 't20w');
}

  head(1280, 484, '⑤ 使能与灌数据');

  txt(scene, 1280, 692, '只置 ASREA 不写 ANCA 不动', 't20w');
  txt(scene, 1280, 726, '使能位与通道数是两个开关', 't20w');
}

function drawMath() {
  txt(scene, 56, 146, '比率是一个 Q6.26 定点数：整数占 6 位、小数占 26 位，1.0 就是 0x0400_0000', 't24w');

  box(56, 176, 560, 250, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '定义');
  txt(scene, 80, 252, '比率 R = Fsin / Fsout', 't20w');
  txt(scene, 80, 288, '编码值 = R × 2^26', 't20w');
  txt(scene, 80, 324, '1.0 → 0x0400_0000', 't20w');
  txt(scene, 80, 360, '1 LSB = 2^-26 ≈ 1.49e-8', 't20w');
  txt(scene, 80, 396, '按 6.26 定点存放', 't20w');

  box(656, 176, 560, 250, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '例：44.1k → 48k');
  txt(scene, 680, 252, 'R = 44100 / 48000', 't20w');
  txt(scene, 680, 288, 'R = 0.918 75（精确）', 't20w');
  txt(scene, 680, 324, '× 2^26 = 61 656 268.8', 't20w');
  txt(scene, 680, 360, '截断 → 0x03AC_CCCC', 't20w');
  txt(scene, 680, 396, '进位 → 0x03AC_CCCD', 't20w');

  box(1256, 176, 612, 250, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '例：48k → 44.1k');
  txt(scene, 1280, 252, 'R = 48000 / 44100', 't20w');
  txt(scene, 1280, 288, 'R ≈ 1.088 435 37', 't20w');
  txt(scene, 1280, 324, '× 2^26 = 73 043 661.1', 't20w');
  txt(scene, 1280, 360, '取整 → 0x045A_8ECD', 't20w');
  txt(scene, 1280, 396, '与手册给的值一致', 't20w');

  box(56, 446, 1812, 346, 'var(--surface)', 'var(--guide)');
  head(80, 484, '误差有多小、什么时候才需要关心');
  txt(scene, 80, 522, '截断与舍入只差 1 个 LSB，相对误差约 1.5e-8；对应 48 kHz 上漂移约 0.7 个样本/小时，可以忽略。', 't20w');
  txt(scene, 80, 556, '真正麻烦的是“时钟本身不准”：晶振偏 100 ppm 时，一小时就漂 17 万个样本 —— 这才是 ASRC 要解决的问题。', 't20w');
  txt(scene, 80, 590, '所以比率有两种来源：两路采样时钟都在时让硬件实测，省掉软件估算的偏差；只有一路时才写理想值。', 't20w');
  txt(scene, 80, 624, '写理想值时必须用“输入/输出”而不是“输出/输入”，写反的结果是音调变了、并且随时间持续漂移。', 't20w');
  txt(scene, 80, 658, '单通道调试技巧：先把 ANCA 写成 1、其余为 0，比率写 1.0（0x0400_0000），确认数据能原样穿过再改比率。', 't20w');
  txt(scene, 80, 692, '“1.0 直通”是最有用的基线：直通都不通，说明问题在通道、时钟或 FIFO，不在重采样算法。', 't20w');
  txt(scene, 80, 726, '判据：写 0x0400_0000 时输入输出样本数 1:1；改成 0x03AC_CCCC 后每 48 个输入应产出约 44.1 个输出。', 't20w');
}

function drawVerify() {
  txt(scene, 56, 146, '四个观察点，按顺序看：标尺 → 状态 → 计数 → 比率方向', 't24w');

  box(56, 176, 560, 250, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '① 标尺与时钟');
  txt(scene, 80, 252, '读 0x0203_4098 = ASR76K', 't20w');
  txt(scene, 80, 288, '200 MHz 下应为 0x0A47（2631）', 't20w');
  txt(scene, 80, 324, '133 MHz 下应约 0x06D6（1750）', 't20w');
  txt(scene, 80, 360, '读回不变 → 你没改，或时钟不是你以为的', 't20w');
  txt(scene, 80, 396, 'ASRCSR/ASRCDR1 的分频也一起核对', 't20w');

  box(656, 176, 560, 250, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '② 状态三个位');
  txt(scene, 680, 252, 'AIDE：输入饥饿，该补数据了', 't20w');
  txt(scene, 680, 288, 'AODF：输出有货，该取走了', 't20w');
  txt(scene, 680, 324, 'AOLE：溢出，输入断供或输出没人取', 't20w');
  txt(scene, 680, 360, '这三个覆盖 90% 的问题；AOLE 写 1 清', 't20w');
  txt(scene, 680, 396, 'ASRSTR 只读，别指望写它复位', 't20w');

  box(1256, 176, 612, 250, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '③ 计数与板级真相');
  txt(scene, 1280, 252, 'ASRFSTA：FIFO 里现在有几个样本', 't20w');
  txt(scene, 1280, 288, '恒 0 → 数据没进去；恒 64 → 没人取', 't20w');
  txt(scene, 1280, 324, 'MINI 底板没有 codec 芯片', 't20w');
  txt(scene, 1280, 360, 'SAI2 只把 BCLK/SYNC/TX/RX/MCLK 引到排针', 't20w');
  txt(scene, 1280, 396, '想听声音：外挂 WM8978 或接 SPDIF', 't20w');

  box(56, 446, 1812, 346, 'var(--surface)', 'var(--guide)');
  head(80, 484, '判据与常见错法');
  txt(scene, 80, 522, '判据一：比率方向。44.1→48 是 0x03AC_CCCC；写成 0x045A_8ECD 就是反了，会变调且持续漂移。', 't20w');
  txt(scene, 80, 556, '判据二：标尺一致性。ASR76K × 76 kHz 与处理时钟偏差 >5%，滤波器一定选错。', 't20w');
  txt(scene, 80, 590, '判据三：AIDE 与 AODF 不会同时长期为 1；若都在闪，说明搬数据的节奏与转换速率不匹配。', 't20w');
  txt(scene, 80, 624, '判据四：只写 ASREA 不写 ANCA（=0），通道永远不会动 —— 使能位与通道数是两个开关。', 't20w');
  txt(scene, 80, 658, 'Linux 侧：aplay -l 看不到声卡是正常的；ASRC 只有在 ASoC 的 dai link 里被引用才会被配置。', 't20w');
  txt(scene, 80, 692, '真要练手：外挂 I2S codec 做 44.1k↔48k 直通，或 SPDIF 输入接播放器，用 ASRC 输出给 SAI。', 't20w');
  txt(scene, 80, 726, '这块板上更现实的做法：只读寄存器、算比率、验证标尺 —— 把数学吃透，接线以后再说。', 't20w');
  txt(scene, 80, 760, '最后提醒：ASRC 在 AIPS-1 后面，用户态直接访问会 abort；要用内核驱动或特权态，别拿 /dev/mem 硬来。', 't20w');
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawWhy();
  else if (s === 1) drawFifo();
  else if (s === 2) drawRatio();
  else if (s === 3) drawMath();
  else if (s === 4) drawRegs();
  else if (s === 5) drawStartup();
  else drawVerify();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () {
  state.step = INIT.step; state.lane = INIT.lane; draw();
});
fitCanvas($('viewport'), $('canvas'), draw);
</script>
