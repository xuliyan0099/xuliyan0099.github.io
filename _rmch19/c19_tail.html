<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0, lane: 0 };
var state = { step: INIT.step, lane: INIT.lane };

var STEPS = [
  { h: 'CSI 只是数字搬运工', hint: '3 个 FIFO · 2 条 DMA',
    note: 'CSI 收到像素、按位宽打包成 32 位字、通过内嵌 DMA 写进内存，仅此而已。它不做 debayer、不做缩放、不做白平衡；6ULL 上没有 IPU，图像处理要靠 PXP 和软件。' },
  { h: '8 位接在 DATA[9:2]', hint: '位宽 · pad · 板级',
    note: '位宽决定接哪几根数据线，8 位传感器是接 DATA[9:2] 而不是 DATA[7:0]。专用 pad 只有 DATA00–07，再往上都是借 LCD、ENET、UART 的脚，要同时改复用和门控。' },
  { h: '寄存器与打包', hint: 'CSICR1/2/3 · 阈值',
    note: '十六个寄存器都在 0x021C_4000 段。CSICR1 复位值 0x4000_0800 已经替你选好了外部 VSYNC 与 HSYNC 高有效；打包方向、16 位交换、补零三个开关决定内存里的字节序。' },
  { h: '内存里的字节序', hint: '打包 / 交换 / 补零',
    note: '打包方向、16 位交换、补零三个开关决定像素在内存里的排法；RGB565 与 YUV422 一个字的组成不同，配错就是偏色但不是全错。' },
  { h: 'DMA 四个参数', hint: 'FB1/FB2 · stride',
    note: '两个帧缓冲起始地址、一个 stride、一个宽高，DMA 就能自己写满整幅图并在两帧之间轮转。stride 是唯一容易算错又不容易发现的参数，错了图像会整幅斜切。' },
  { h: '四类故障对号入座', hint: '斜切 / 偏色 / 撕裂',
    note: '整幅斜切＝stride 少算；蓝绿互换＝16 位交换位配反；上下撕裂＝只用一个 FB；全黑无 SOF＝门控或极性错。四类故障各对应一个寄存器。' },
  { h: '启动顺序与判据', hint: 'REFLASH · CSISR · 水位',
    note: '先配引脚与门、再定位宽与极性、再定阈值与请求、最后 REFLASH 并开 CSI_ENABLE。通路有没有通，只看三个数：SOF 有没有来、DMA done 有没有置、CR19 的最高水位离 128 还有多远。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }

function drawRole() {
  txt(scene, 56, 146, 'CSI 只做三件事：收像素、打包成 32 位字、用内嵌 DMA 搬进内存', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '三个 FIFO，两条 DMA');
  txt(scene, 80, 252, 'RX FIFO 256×64，按字算 128 个字', 't20w');
  txt(scene, 80, 288, '进来的字节按 PACK_DIR 拼成 32 位', 't20w');
  txt(scene, 80, 324, 'RX 那条 DMA 写 AHB，直接落帧缓冲', 't20w');
  txt(scene, 80, 360, 'STAT FIFO 另一条，线性搬统计值', 't20w');
  txt(scene, 80, 396, '两条都能 INCR4 / 8 / 16 突发', 't20w');
  txt(scene, 80, 432, '搬完一帧置 DMA_TSF_DONE_FBn', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'CSI 明确不做的三件事');
  txt(scene, 680, 252, '不做 debayer：Bayer 原样落内存', 't20w');
  txt(scene, 680, 288, '不做缩放与旋转，那是 PXP 的活', 't20w');
  txt(scene, 680, 324, '不做白平衡，只把统计值给你算', 't20w');
  txt(scene, 680, 360, '6ULL 没有 IPU，别照抄 6Q 的链路', 't20w');
  txt(scene, 680, 396, '出图：CSI → 内存 → PXP → LCDIF', 't20w');
  txt(scene, 680, 432, '所以画质好坏在传感器，不在 CSI', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, 'MCLK 不由 CSI 产生');
  txt(scene, 1280, 252, '表 19-1 的注：MCLK 由 CCM 直接给', 't20w');
  txt(scene, 1280, 288, 'CSI_MCLK 只是一个输出 pad（ALT0）', 't20w');
  txt(scene, 1280, 324, '全章十六个寄存器里没有 MCLK 分频位', 't20w');
  txt(scene, 1280, 360, '出不了主时钟，去查 CCM 的根和门', 't20w');
  txt(scene, 1280, 396, '在 CSI 寄存器里翻，永远翻不到', 't20w');
  txt(scene, 1280, 432, '这是本章第一个「找错模块」的坑', 't20w');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, '六个能力，决定了你能接什么摄像头');
  txt(scene, 80, 522, '① 两套时序：传统接口靠 VSYNC/HSYNC 三根线，CCIR656 把同步塞进码流，只用 PIXCLK + DATA[9:2]。', 't20w');
  txt(scene, 80, 556, '② 位宽：YCbCr/YUV/RGB 可 8/16/24 位，Bayer 可 8/10/16 位；一颗芯片同一时刻只走一种。', 't20w');
  txt(scene, 80, 590, '③ 双缓冲：两帧交替写，CPU 慢一点也不撕裂 —— 这是「零拷贝出图」的基础。', 't20w');
  txt(scene, 80, 624, '④ 统计：只对 8 位 Bayer 生效，输出 G/R/B/F 四个 16 位和，给 AE/AWB 算曝光和白平衡。', 't20w');
  txt(scene, 80, 658, '⑤ 单一中断脚进门，八类事件在 CSISR 里再分：帧头、帧尾、换场、满、溢出、搬完、CCIR 错、AHB 错。', 't20w');
  txt(scene, 80, 692, '⑥ 溢出保护：FIFO 满了丢整 128 字，内存里保留上一次的值 —— 不会写出半帧垃圾，但会静默丢一块。', 't20w');
  txt(scene, 80, 726, '⑦ 两路 8 位传感器可同时接 [7:0] 与 [15:8]，TWO_8BIT_SENSOR=1，适合双目或双摄标定。', 't20w');
  txt(scene, 80, 760, '记住定位：CSI 保证「原始数据一字不差落进内存」，其余全部由后级负责。', 't20w');
}

function drawWires() {
  txt(scene, 56, 146, '位宽决定接哪几根线：8 位传感器要接 CSI_DATA[9:2]，这是第一个会接错的地方', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '五条接法，一条都不许猜');
  txt(scene, 80, 252, '1 路 8 位 → DATA[9:2]', 't20s');
  txt(scene, 80, 288, '1 路 10 位 → DATA[9:0]', 't20s');
  txt(scene, 80, 324, '1 路 16 位 → DATA[15:0]', 't20s');
  txt(scene, 80, 360, '2 路 8 位 → [7:0] 与 [15:8]', 't20s');
  txt(scene, 80, 396, '24 位 → DATA[23:0] + PARALLEL24_EN', 't20s');
  txt(scene, 80, 432, '整体错 2 位 = 整幅偏色 / 错位', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '专用 pad 只有前 8 根');
  txt(scene, 680, 252, 'CSI_DATA00–07 是专用脚，ALT0', 't20w');
  txt(scene, 680, 288, '球位 E4 / E3 / E2 / E1 / D4 / D3 / D2 / D1', 't20s');
  txt(scene, 680, 324, 'DATA0/1 也可借 LCD_DATA17/16（ALT3）', 't20w');
  txt(scene, 680, 360, 'DATA8–15 借 LCD_DATA18–23 与 UART3/4/5', 't20w');
  txt(scene, 680, 396, 'DATA16–23 借 ENET1 与 LCD_DATA08–15', 't20w');
  txt(scene, 680, 432, '借来的脚要同时改复用和 CCM 的门', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '这块板上已经接好了');
  txt(scene, 1280, 252, 'P1 是 18 针摄像头座（丝印 CAMERA）', 't20w');
  txt(scene, 1280, 288, '只引了 DATA0–7，走 8 位模式', 't20w');
  txt(scene, 1280, 324, 'CSI_MCLK 经 R13 串到连接器', 't20w');
  txt(scene, 1280, 360, 'SCCB 走 I2C2_SCL/SDA，不是 I2C1', 't20w');
  txt(scene, 1280, 396, 'CSI_RESET 与 CSI_PWDN 是两根 GPIO', 't20w');
  txt(scene, 1280, 432, '核心板侧：VSYNC F2、HSYNC F3、PIXCLK E5', 't20s');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, '三种时序模式 + 五个极性位');
  txt(scene, 80, 522, '门控模式（GCLK_MODE=1）：PIXCLK 只在 HSYNC 有效期间被当作时钟，行外的脉冲一律不采。', 't20w');
  txt(scene, 80, 556, '非门控（GCLK_MODE=0）：忽略 HSYNC，所有 PIXCLK 都有效 —— 多数并口传感器用这个。', 't20w');
  txt(scene, 80, 590, 'HSYNC_POL 只在门控模式下有意义（0 低有效 / 1 高有效），复位值就是 1。', 't20w');
  txt(scene, 80, 624, 'REDGE 选采样沿：0 下降沿、1 上升沿。配错就是整行错一个像素，图像看起来像被横着拽了一下。', 't20w');
  txt(scene, 80, 658, 'INV_PCLK 反相时钟、INV_DATA 反相数据：只有板上加了反相器或排线太长时才动。', 't20w');
  txt(scene, 80, 692, 'CCIR656 隔行（CCIR_EN=1、VIDEO_MODE=1）：奇偶场先后到达，软件必须重排，COF 中断提醒你换场。', 't20w');
  txt(scene, 80, 726, 'CCIR656 逐行（VIDEO_MODE=0）：整幅当一个场，F 位被忽略 —— VGA 摄像头基本都走这个。', 't20w');
  txt(scene, 80, 760, '判据：行不同步先查 GCLK_MODE 与 HSYNC_POL；整幅偏色先查位宽接法；整行错一位先查 REDGE。', 't20w');
}

function drawRegs() {
  txt(scene, 56, 146, '十六个寄存器都在 0x021C_4000 段；复位值 0x4000_0800 已经替你选好了极性', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '地址表（偏移 + 复位）');
  txt(scene, 80, 252, '0x00 CR1 / 0x04 CR2 / 0x08 CR3', 't20s');
  txt(scene, 80, 288, '0x0C STATFIFO、0x10 RFIFO（只读）', 't20s');
  txt(scene, 80, 324, '0x14 RXCNT 复位 0x0000_9600', 't20s');
  txt(scene, 80, 360, '0x18 CSISR 复位 0x0000_4000', 't20s');
  txt(scene, 80, 396, '0x20/0x24 STAT DMA 地址与长度', 't20s');
  txt(scene, 80, 432, '0x28/2C FB1/FB2，0x30 stride，0x34 宽高', 't20s');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '复位值只看两位');
  txt(scene, 680, 252, 'bit30 EXT_VSYNC=1：外部 VSYNC 模式', 't20w');
  txt(scene, 680, 288, 'bit11 HSYNC_POL=1：HSYNC 高有效', 't20w');
  txt(scene, 680, 324, '其余全 0：8 位、不交换、不补零、CCIR 关', 't20w');
  txt(scene, 680, 360, '所以「复位就能用」只对一种接法成立', 't20w');
  txt(scene, 680, 396, '内部 VSYNC 或低有效 HSYNC 必须改这两位', 't20w');
  txt(scene, 680, 432, '读回 CSICR1 先核对 bit30 与 bit11', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '打包三个开关');
  txt(scene, 1280, 252, 'PACK_DIR=0：先来的当最低字节', 't20w');
  txt(scene, 1280, 288, '0x11,22,33,44 → 0x4433_2211', 't20s');
  txt(scene, 1280, 324, 'PACK_DIR=1 → 0x1122_3344', 't20s');
  txt(scene, 1280, 360, 'SWAP16_EN=1：0x1122_3344 → 0x3344_1122', 't20s');
  txt(scene, 1280, 396, 'ZERO_PACK_EN=1：3 字节 + 1 个 0 拼成字', 't20w');
  txt(scene, 1280, 432, '补零只对 8 位模式有效', 't20w');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, 'CSICR2 与 CSICR3：突发类型、阈值、重载');
  txt(scene, 80, 522, '突发编码：CSICR2[31:30] 管 RX、[29:28] 管 STAT。X0 = INCR8、01 = INCR4、11 = INCR16，复位 0 就是 INCR8。', 't20w');
  txt(scene, 80, 556, 'RX 阈值 CSICR3[6:4]：000→4、001→8、010→16、011→24、100→32、101→48、110→64、111→96 个字。', 't20w');
  txt(scene, 80, 590, 'STAT 阈值 CSICR3[10:8]：000→4、001→8、010→12、011→16、100→24、101→32、110→48、111→64。', 't20w');
  txt(scene, 80, 624, 'DMA_REQ_EN_RFF 是 bit12、SFF 是 bit11：不置 1，DMA 一条请求都不会发，FIFO 只能靠 CPU 读。', 't20w');
  txt(scene, 80, 658, 'DMA_REFLASH_RFF bit14 / SFF bit13：写 1 重新装载 DMA，硬件自动清零；启动前必须走一遍。', 't20w');
  txt(scene, 80, 692, 'TWO_8BIT_SENSOR bit3：16 位传感器或两路 8 位都要置 1，且必须在启动 DMA 之前定下来。', 't20w');
  txt(scene, 80, 726, '统计网格：CSICR2[26] DRM 选 8×6 还是 8×12，[20:19] BTS 定 Bayer 起点（GR/RG/BG/GB）。', 't20w');
  txt(scene, 80, 760, '权衡：阈值越高中断越少，但 96 字对 128 字的 FIFO 只剩 32 字余量，突发一慢就溢出。', 't20w');
}

function drawDma() {
  txt(scene, 56, 146, '两个帧缓冲、一个 stride、一个宽高，DMA 就能自己写满整幅图并在两帧之间轮转', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '四个参数缺一不可');
  txt(scene, 80, 252, 'FB1 0x021C_4028、FB2 0x021C_402C', 't20s');
  txt(scene, 80, 288, '只有 [31:2] 有效 → 天然 4 字节对齐', 't20w');
  txt(scene, 80, 324, 'FBUF_PARA 0x30：行间隔 stride', 't20w');
  txt(scene, 80, 360, 'IMAG_PARA 0x34：高 16 位宽、低 16 位高', 't20w');
  txt(scene, 80, 396, 'RXCNT 0x14：22 位，单位是「字」', 't20w');
  txt(scene, 80, 432, 'CR18 bit31 CSI_ENABLE 才真正开门', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'stride 最容易算错');
  txt(scene, 680, 252, '定义：帧缓冲行宽 − 图像宽', 't20w');
  txt(scene, 680, 288, '手册这两处单位被排版吞掉了', 't20w');
  txt(scene, 680, 324, '最常用结论：行宽等于图像宽就写 0', 't20w');
  txt(scene, 680, 360, '行宽按 32 字节对齐，AXI 突发更顺', 't20w');
  txt(scene, 680, 396, '错的症状：每行固定偏移，图像斜切', 't20w');
  txt(scene, 680, 432, '判据：斜切量正好是 stride 的整数倍', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '双缓冲怎么切换');
  txt(scene, 1280, 252, '写完 FB1 置 bit19，写完 FB2 置 bit20', 't20w');
  txt(scene, 1280, 288, '硬件自动轮转，两次之后回到 FB1', 't20w');
  txt(scene, 1280, 324, 'CR18 bit4=1：改成按场同步切，而不是搬完切', 't20w');
  txt(scene, 1280, 360, 'bit5 选「VSYNC 边沿」或「每帧第一个数据」', 't20w');
  txt(scene, 1280, 396, '切早了会置 bit28 BASEADDR_CHANGE_ERROR', 't20w');
  txt(scene, 1280, 432, '补救：关 enable → REFLASH → 重新开', 't20w');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, '算一笔账：320×240 的 8 位 Bayer');
  txt(scene, 80, 522, '像素 76800 个 = 76800 字节 = 19200 个 32 位字；IMAG_PARA 写 0x0140_00F0（宽 320、高 240）。', 't20w');
  txt(scene, 80, 556, 'DMA 一帧正好搬 19200 字，搬完置 DMA_TSF_DONE_FBn —— 这个数就是校验帧完整的锚点。', 't20w');
  txt(scene, 80, 590, 'RXCNT 复位 0x9600 = 38400 字，是 320×480 或 640×240 的量；它只做 EOF 计数，不改也不影响搬图。', 't20w');
  txt(scene, 80, 624, '若把行宽补到 336 像素（84 字，32 字节对齐），stride = 336 − 320 = 16 像素；行宽等于宽就写 0。', 't20w');
  txt(scene, 80, 658, '换 RGB565：一像素 2 字节，一行 320 像素 = 160 字；但 IMAG_PARA 仍写像素数，不写字数。', 't20w');
  txt(scene, 80, 692, 'MASK_OPTION[19:18]：00 从第一整帧开始写、01 enable=1 就写、10 从第二整帧、11 来了就写（不看 enable）。', 't20w');
  txt(scene, 80, 726, '起步建议 00：宁可丢第一帧，也不要让内存里出现「上半帧新、下半帧旧」的拼接。', 't20w');
  txt(scene, 80, 760, '记住：IMAG_PARA 的单位是像素，DMA 内部按位宽折算成字；这两个单位混用是最常见的账算错。', 't20w');
}

function drawBringup() {
  txt(scene, 56, 146, '启动顺序错一步就白屏；通路通没通，全在 CSISR 与 CR19 两个寄存器里', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '七步启动');
  txt(scene, 80, 252, '① IOMUXC 配脚 + CCM 开 CSI / I2C2 门', 't20w');
  txt(scene, 80, 288, '② CSICR1：位宽、极性、PACK_DIR', 't20w');
  txt(scene, 80, 324, '③ CSICR2：突发类型', 't20w');
  txt(scene, 80, 360, '④ CSICR3：阈值 + TWO_8BIT + REQ_EN', 't20w');
  txt(scene, 80, 396, '⑤ FB1 / FB2 / stride / 宽高 / RXCNT', 't20w');
  txt(scene, 80, 432, '⑥ REFLASH=1 等清零 → CR18 开门', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'CSISR 判据');
  txt(scene, 680, 252, 'bit0 DRDY：FIFO 里有字（读 FIFO 即清）', 't20w');
  txt(scene, 680, 288, 'bit16 SOF / bit17 EOF：帧头帧尾', 't20w');
  txt(scene, 680, 324, 'bit18 RxFF_INT：到阈值（读 FIFO 清）', 't20w');
  txt(scene, 680, 360, 'bit19 / bit20：FB1 / FB2 搬完', 't20w');
  txt(scene, 680, 396, 'bit24 RF_OR / bit25 SF_OR：溢出，写 1 清', 't20w');
  txt(scene, 680, 432, 'bit7 HRESP_ERR：AHB 应答错，总线被抢', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '四个坑');
  txt(scene, 1280, 252, '坑一：CSISR 复位 0x4000，bit14 天生是 1', 't20w');
  txt(scene, 1280, 288, '别用「读到非 0」判断有事件发生', 't20w');
  txt(scene, 1280, 324, '坑二：不 REFLASH 就开 DMA，DMA 不动', 't20w');
  txt(scene, 1280, 360, '坑三：只开 CR18 不开 REQ_EN，内存永远空', 't20w');
  txt(scene, 1280, 396, '坑四：改了 PIXEL_BIT / 位宽必须重走 REFLASH', 't20w');
  txt(scene, 1280, 432, '补充：溢出丢的是整 128 字，不是 1 个字', 't20w');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, '溢出诊断的固定流程，以及 6ULL 的边界');
  txt(scene, 80, 522, '第一步读 CSISR 的 bit24 / bit25：置位就说明 DMA 没跟上，不是传感器坏了。', 't20w');
  txt(scene, 80, 556, '第二步读 CR19 低 8 位，那是本次运行的最高 FIFO 水位；写 0xFF 清零，跑一段再复测。', 't20w');
  txt(scene, 80, 590, '水位逼近 128 → 降 RFF_LEVEL（96→64→32）、突发提到 INCR16、再查 AHB 上谁在抢带宽。', 't20w');
  txt(scene, 80, 624, '水位不高却仍丢数据 → 看 bit7 HRESP_ERR：AHB 应答失败，通常被更高优先级的主设备压住。', 't20w');
  txt(scene, 80, 658, '反向验证：关 CSI_ENABLE，只留 MCLK 与 PIXCLK，用逻辑分析仪量比例，确认传感器真的在出数。', 't20w');
  txt(scene, 80, 692, '6ULL 边界：CSI 里没有 ISP、没有 debayer；Bayer 出图要么软件转，要么交给 PXP，别等 CSI 出 RGB。', 't20w');
  txt(scene, 80, 726, '给 LCDIF 预览时的链路是 CSI → 内存 → PXP（转 RGB565/缩放）→ LCDIF，CSI 只保证原始帧完整。', 't20w');
  txt(scene, 80, 760, '三条同时成立才算打通：读得到 SOF、DMA_TSF_DONE 会置、CR19 水位稳定低于 96。', 't20w');
}

function drawBytes() {
  txt(scene, 56, 146, '像素进内存前要被拼成 32 位字：打包方向、16 位交换、补零这三个开关决定最终排法', 't24w');

  box(56, 176, 560, 236, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '三个开关');
  txt(scene, 80, 252, 'PACK_DIR：先低字节还是先高字节', 't20w');
  txt(scene, 80, 288, 'SWAP16：16 位半字是否对调', 't20w');
  txt(scene, 80, 324, 'ZERO_PAD：空出来的高位补零', 't20w');
  txt(scene, 80, 360, '三个都在 CSICR1/2 里', 't20w');
  txt(scene, 80, 396, '配一组就够了，别逐个试', 't20w');

  box(656, 176, 560, 236, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'RGB565 长什么样');
  txt(scene, 680, 252, '每像素 2 B：RRRRRGGG GGGBBBBB', 't20w');
  txt(scene, 680, 288, '两个像素正好拼一个 32 位字', 't20w');
  txt(scene, 680, 324, '低半字＝第一个像素', 't20w');
  txt(scene, 680, 360, '高半字＝第二个像素', 't20w');
  txt(scene, 680, 396, '交换位错了 → 红蓝互换', 't20w');

  box(1256, 176, 612, 236, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, 'YUV422 长什么样');
  txt(scene, 1280, 252, '常见 YUYV：Y0 U Y1 V', 't20w');
  txt(scene, 1280, 288, '或 UYVY：U Y0 V Y1', 't20w');
  txt(scene, 1280, 324, '一个字里塞两个像素', 't20w');
  txt(scene, 1280, 360, '顺序错 → 偏色、边缘发绿', 't20w');
  txt(scene, 1280, 396, '先确认传感器输出顺序', 't20w');

  box(56, 432, 1812, 360, 'var(--surface)', 'var(--guide)');
  head(80, 470, '怎么定这三个位：从“看得见的错”倒推');
  txt(scene, 80, 508, '红蓝互换：RGB565 的 SWAP16 配反了；改一位即可，不用重编驱动。', 't20w');
  txt(scene, 80, 542, '整体偏绿或偏紫：多半是 YUV422 的字节顺序与传感器不一致，交换两个字节就正。', 't20w');
  txt(scene, 80, 576, '图像有彩色噪点但结构清楚：位宽或补零位不对，高位没补零被当成有效像素。', 't20w');
  txt(scene, 80, 610, '最稳的做法：先用 16 位 RGB565 传感器验证通路，再换 YUV 传感器；RGB565 的排法最直观。', 't20w');
  txt(scene, 80, 644, '别用“看起来差不多”判断：把纯红、纯绿、纯蓝三个画面各抓一帧，看内存里的字是否与预期一致。', 't20w');
  txt(scene, 80, 678, '判据：纯红一帧的内存字应能按 RGB565 拆出 R=31、G=0、B=0；拆不出就说明字节序错了。', 't20w');
  txt(scene, 80, 712, '记录一组“已知正确”的寄存器值，换传感器时只改位宽与极性，别把字节序一起动。', 't20w');
}

function drawFaults() {
  txt(scene, 56, 146, 'CSI 的故障几乎都长得很有特征：看到画面是什么样，就能倒推出哪个参数错了', 't24w');

  box(56, 176, 560, 236, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '画面斜切');
  txt(scene, 80, 252, '症状：整幅图像向右下斜', 't20w');
  txt(scene, 80, 288, '原因：stride 小于实际行宽', 't20w');
  txt(scene, 80, 324, 'stride 应 = 行字节数（可加对齐）', 't20w');
  txt(scene, 80, 360, '320 像素 × 2 B = 640 B', 't20w');
  txt(scene, 80, 396, '写 512 就会斜切', 't20w');

  box(656, 176, 560, 236, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '画面撕裂');
  txt(scene, 680, 252, '症状：上下半幅来自不同时刻', 't20w');
  txt(scene, 680, 288, '原因：只配了 FB1、没有双缓冲', 't20w');
  txt(scene, 680, 324, '或两帧地址相同', 't20w');
  txt(scene, 680, 360, 'FB1/FB2 交替才不撕', 't20w');
  txt(scene, 680, 396, '也可等 SOF 再换缓冲', 't20w');

  box(1256, 176, 612, 236, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '全黑 / 无中断');
  txt(scene, 1280, 252, '症状：CSISR 里 SOF 一直不置', 't20w');
  txt(scene, 1280, 288, '原因一：DVAL/门控没打开', 't20w');
  txt(scene, 1280, 324, '原因二：VSYNC 极性反了', 't20w');
  txt(scene, 1280, 360, '原因三：CSI_ENABLE 没置', 't20w');
  txt(scene, 1280, 396, '用示波器看 VSYNC 最直接', 't20w');

  box(56, 432, 1812, 360, 'var(--surface)', 'var(--guide)');
  head(80, 470, '按“信号 → 寄存器 → 内存”三段查');
  txt(scene, 80, 508, '第一段看引脚：VSYNC/HSYNC/PCLK/DATA 有没有波形，电平对不对，门控有没有开。', 't20w');
  txt(scene, 80, 542, '第二段看寄存器：CSISR 的 SOF、DMA done、FIFO 溢出三个位，能区分“没数据”和“数据丢了”。', 't20w');
  txt(scene, 80, 576, '第三段看内存：抓一帧直接 dump 前 64 字节，按 RGB565 拆开看是否符合预期颜色。', 't20w');
  txt(scene, 80, 610, '三段都过还不对，才怀疑传感器配置（分辨率、输出格式、时钟极性），这时才去改 I2C 侧。', 't20w');
  txt(scene, 80, 644, '顺序很重要：先证“有信号”，再证“寄存器有反应”，最后才证“内存内容对”—— 反着查会绕远。', 't20w');
  txt(scene, 80, 678, '判据：FIFO 溢出位置 1 说明请求没跟上，先把 watermark 调低或提高 DMA 优先级，再谈画质。', 't20w');
  txt(scene, 80, 712, '记录每类故障对应的那一个寄存器，下次遇到同样画面就能三分钟定位。', 't20w');
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawRole();
  else if (s === 1) drawWires();
  else if (s === 2) drawRegs();
  else if (s === 3) drawBytes();
  else if (s === 4) drawDma();
  else if (s === 5) drawFaults();
  else drawBringup();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () {
  state.step = INIT.step; state.lane = INIT.lane; draw();
});
fitCanvas($('viewport'), $('canvas'), draw);
</script>
