<script>

svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

  ['PLL2 · 528', '×22 → 528 MHz + 4 PFD', '总线、DDR、NAND/NOR'],
  ['PLL3 · USB1', '×20 → 480 MHz，带 4 个 PFD', 'UART、音频等定频接口'],
  ['PLL4 · Audio', '分数倍频，650–1300 MHz', '分辨率 <1 Hz，出 /1/2/4'],
  ['PLL5 · Video', '分数倍频，低抖动视频钟', '输出 /1/2/4/8/16'],
  ['PLL6 · ENET', '20+5/6 → 500 MHz', '出 25/50/100/125 MHz'],
  ['PLL7 · USB2', '×20 → 480 MHz', '只给 USBPHY2，不对外']
];

var INIT = { step: 0, lane: 0 };
var state = { step: INIT.step, lane: INIT.lane };

var STEPS = [
  { h: '五个模块各管一段', hint: 'CCM / LPCG / PMU / GPC / SRC',
    note: '这颗芯片的低功耗不是「关个外设时钟」那么简单，而是把控制权分给五个模块：CCM 管时钟从哪来、怎么分频；LPCG 管每个模块那一路分支开不开；PMU 管芯片内部六个稳压器的输出电压；GPC 管「整个域断电」和「谁能把它叫醒」；SRC 管复位与启动配置。搞混这五个的分工，调功耗时就会在错误的寄存器上折腾。' },
  { h: '七个 PLL 与时钟根', hint: '源 → PLL/PFD → 根 → 门控',
    note: '时钟只有两个物理源头：核心板上的 24 MHz 晶振和 32.768 kHz 晶振（后者专供 SNVS）。24 MHz 进 7 个 PLL，其中 PLL2、PLL3 各带四个 PFD，PFD 用纯数字插值把 VCO 分出 18/N 倍频率，所以能在不重新锁定的情况下瞬间换频。PLL 输出再进「时钟根」：每个根是一级选源加一级分频，最后经 LPCG 的 2 位门控送到模块。' },
  { h: '三种低功耗模式', hint: 'WAIT 关 PLL，STOP 只剩 32k',
    note: '手册用三列把功耗模式摊开：System IDLE、Low Power IDLE、SUSPEND，对应的 CCM LPM 位是 WAIT、WAIT、STOP。差别不在 CPU 睡不睡，而在「哪些东西还活着」：低功耗 IDLE 里 PLL 全关、AHB 掉到 3 MHz、IPG 1.5 MHz、PER 1 MHz，靠 24M RC 振荡器撑着；到 SUSPEND 连 XTAL 和 RC 都关，只剩 SNVS 的 32k 与 RTC，DRAM 必须提前进自刷新。' },
  { h: 'PMU 六个稳压器与 DVFS', hint: '降频必须同时降压，否则白省',
    note: 'PMU 把外部两三路电源变成芯片需要的全部轨：LDO_ARM、LDO_SOC 是可编程的数字 LDO（25 mV 一步，三种模式：内部旁路、电源门控、模拟稳压），LDO_1P1 供 PLL 与 USB PHY，LDO_2P5 供 DDR IO 等模拟电路并带一个 2.525 V 弱稳压器，USB LDO 把 5 V 变 3.0 V，SNVS LDO 供 RTC。DVFS 的本质就是「频率档位和电压档位成对改」；只降频不降压，动态功耗省一半、静态漏电一分不少。' },
  { h: '在 MINI 板上对号', hint: '晶振、供电轨、ONOFF 三处',
    note: '核心板上 Y2 是 24 MHz 无源晶振（C12/C13 18 pF，R31–R33 0 Ω），接 XTALI/XTALO；Y1 是 32.768 kHz，配 C3 18 pF，只供 SNVS 的 RTC。供电侧 VDD_ARM_IN 与 VDD_SOC_IN 经 L1 2.2 µH 加 R82 0 Ω 并成一条 VDD_ARM_SOC_IN——这正是手册说的「典型应用共用一路电源，全速时两个 LDO 都旁路」。ONOFF 按键经 R26 100K 进 SNVS_LP，再由 Q4/Q6 驱动 PMIC_ON_REQ。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function arrow(x1, y1, x2, y2) {
  svgEl(scene, 'line', { x1: x1, y1: y1, x2: x2, y2: y2, stroke: 'var(--text-2)', 'stroke-width': 4 });
  var a = Math.atan2(y2 - y1, x2 - x1), L = 18, W = 9;
  svgEl(scene, 'path', {
    d: 'M' + x2 + ' ' + y2 + ' L' + (x2 - L * Math.cos(a) + W * Math.sin(a)) + ' ' + (y2 - L * Math.sin(a) - W * Math.cos(a)) +
      ' L' + (x2 - L * Math.cos(a) - W * Math.sin(a)) + ' ' + (y2 - L * Math.sin(a) + W * Math.cos(a)) + ' Z',
    fill: 'var(--text-2)', stroke: 'none'
  });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }

  txt(scene, 80, 258, 'Y2 24 MHz 接 XTALI/XTALO', 't24w');

  txt(scene, 684, 258, 'VDD_ARM_IN 与 VDD_SOC_IN', 't24w');
  txt(scene, 684, 296, '经 L1 2.2 µH + R82 0 Ω 并成一条', 't24w');
  txt(scene, 684, 334, '网名 VDD_ARM_SOC_IN', 't24w');
  txt(scene, 684, 372, '对应手册「共用一路电源」的典型方案', 't24w');
  txt(scene, 684, 410, '全速时两个数字 LDO 都旁路', 't24w');
  txt(scene, 684, 448, '降压只能靠外部 DCDC 调压', 't24w');

function draw() {
  var s = STEPS[state.step];
  $('hint').textContent = s.hint;
  $('note').textContent = s.note;
  scene.textContent = '';
  if (state.step === 0) drawRoles();
  else if (state.step === 1) drawTree();
  else if (state.step === 2) drawModes();
  else if (state.step === 3) drawPmu();
  else drawBoard();
}

var step = stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
void step;
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () {
  state.step = INIT.step; state.lane = INIT.lane; draw();
});
fitCanvas($('viewport'), $('canvas'), draw);
</script>
