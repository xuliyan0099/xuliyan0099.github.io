<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0 };
var state = { step: INIT.step };

var STEPS = [
  { h: '用时间量温度', hint: '计数越大越冷',
    note: '把与温度相关的电压充放电成时间，再用计数器量化 —— 所以读数是“反向”的。' },
  { h: '单次还是自动', hint: 'MEASURE_FREQ',
    note: '写 0 只测一次，写 N 表示每 N 个 RTC 拍重测；上限 0xFFFF 约等于 2 秒。' },
  { h: '校准公式', hint: '两个熔丝点定斜率',
    note: 'ROOM_COUNT@25 °C 与 HOT_COUNT@HOT_TEMP 定出一条直线，其余全靠插值。' },
  { h: '三个门限', hint: '低 / 高 / 恐慌',
    note: '低与恐慌在 TS2，高在 TS0；恐慌要连续 4 次超限才动作，防误复位。' },
  { h: '寄存器地图', hint: '0x020C_8000+0x180',
    note: '三组寄存器各带 SET/CLR/TOG 别名；复位值 0x1 表示默认是断电状态。' },
  { h: '软件流程', hint: '上电→启动→等完成',
    note: '清 POWER_DOWN、置 MEASURE_TEMP、轮询 FINISHED、读计数、再断电。' },
  { h: '热管理闭环', hint: '降频与回温',
    note: '高限触发降频，然后把低限抬到“安全温度”，等回温中断再恢复 —— 这就是滑动窗口。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}
function three(a, b, c) {
  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(a[0], 214, a[1]); for (var i = 0; i < a[2].length; i++) txt(scene, a[0], 252 + i * 36, a[2][i], a[3] || 't20w');
  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(b[0], 214, b[1]); for (var j = 0; j < b[2].length; j++) txt(scene, b[0], 252 + j * 36, b[2][j], b[3] || 't20w');
  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(c[0], 214, c[1]); for (var k = 0; k < c[2].length; k++) txt(scene, c[0], 252 + k * 36, c[2][k], c[3] || 't20w');
}
function prose(title, lines) {
  wide(456, 330);
  txt(scene, 80, 490, title, 't24');
  for (var i = 0; i < lines.length; i++) txt(scene, 80, 522 + i * 34, lines[i], 't20w');
}

function drawTop() {
  txt(scene, 56, 146, '芯片里有温度计：不是 ADC，而是把温度变成“数多少个时钟”，于是读数与温度成反比', 't24w');
  three([80, '测量原理', ['温度系数电压 → 充放电时间', '用 480 MHz PLL 计数', '32 kHz RTC 定测量频率', 'bandgap 提供基准电压', '计数值 TEMP_CNT 即结果', '计数越大表示越冷'], 't20w'],
        [680, '四路实例', ['TEMPSENSE0–3 各一套', '偏移 +0x180 起每 16 字节', '可分别测不同热点', '每路独立门限与中断', '也各自带 SET/CLR/TOG', '常用 0 号就够'], 't20w'],
        [1280, '三个前提', ['bandgap 必须已稳定', '480 MHz PLL 必须已锁定', '32 kHz RTC 必须已在跑', '三者任一没就绪读数就没意义', '所以要先等时钟初始化完', '再开始测温']]);
  prose('“计数越大越冷”是最反直觉的一点：它数的是充放电周期数，温度越高、电压变化越快、周期越短、数得越少', [
    '所以所有门限比较都是反的：高温柔限对应“计数小于某值”，低温门限对应“计数大于某值”；写反了就永远不会触发。',
    '模块对外只给一个 12 位计数值（TEMP_CNT），换算成摄氏度必须靠熔丝里的两个校准点 —— 没有校准点，这个数只是“相对量”。',
    '四路实例并不等于四个物理传感器，具体布局取决于芯片版图；对本板做整机热评估，读 0 号已经足够。',
    '它不适合做精密测温：分辨力约 1 个计数、精度靠校准点插值，典型误差在几个 °C 量级，用于“热保护”而不是“温度计”。',
    '想测结温趋势（比如满载后是否过热），看计数的单调变化比看绝对值更有价值。',
    '一句话：TEMPMON 是安全器件，不是仪表；判据要按“是否触发保护”来设计，而不是按“温度是否准到 0.1 °C”。']);
}

function drawMode() {
  txt(scene, 56, 146, '一次转换要软件踢一脚；想让它自己反复测，就把重复间隔写进 TEMPSENSE1', 't24w');
  three([80, '单次模式', ['TS1 的 MEASURE_FREQ 写 0', '置 TS0[1] MEASURE_TEMP', 'FINISHED[2] 由硬件置位', '读 TEMP_CNT[19:8]', '下一次要再置一次', '适合作一次性探测'], 't20w'],
        [680, '自动模式', ['MEASURE_FREQ = N', '每 N 个 RTC 拍重测一次', 'N=1 就是 32 kHz 一次', 'N=0xFFFF ≈ 2 秒一次', '实际间隔 = N × 30.5 µs', '转换期间不需软件干预'], 't20w'],
        [1280, '功耗与等待', ['TS0[0]=1 是断电（默认）', '测量前必须清 0', '测完应再置 1 省电', '转换需要若干 µs 级时间', '要轮询 FINISHED 而不是硬等', '上电时先等 PLL 锁']]);
  prose('算重复间隔很简单：MEASURE_FREQ × (1/32768) 秒。写 0xFFFF 就是 65535 × 30.5 µs ≈ 2.0 秒', [
    '自动模式的价值是“不用 CPU 参与”：热保护可以在待机时靠它自己反复测，超限就中断。',
    '但自动模式要求 RTC 在跑：如果 RTC 停了（比如省电关掉了 32 kHz），重复间隔就不存在了，只剩单次可用。',
    '每次转换开始前 FINISHED 会被清 0，转换结束后置 1；轮询它比“延时固定时间”可靠，因为转换时间随温度与电压有波动。',
    'POWER_DOWN 默认是 1（复位值 0x0000_0001）：所以上电后直接读 TEMP_CNT 会得到旧值或 0，必须先清这一位。',
    '若把 MEASURE_TEMP 与 POWER_DOWN 同时置 1，多数实现表现为“不测量”，别指望它自己纠正。',
    '判据：单次模式连续测三次，FINISHED 每次都从 0 变 1，且三次计数相差在几个 count 内，说明模拟前端稳定。']);
}

function drawCalib() {
  txt(scene, 56, 146, '两个熔丝点决定整条直线：25 °C 的计数与高温点的计数，斜率由这两点算出', 't24w');
  three([80, '熔丝字段', ['OCOTP_ANA1[31:20] ROOM_COUNT', '对应 25.0 °C', 'OCOTP_ANA1[19:8] HOT_COUNT', '对应 HOT_TEMP', 'OCOTP_ANA1[7:0] HOT_TEMP', '每 LSB = 1 °C'], 't20s'],
        [680, '公式', ['T = T2 − (N − N2) × k', 'k = (T2 − 25.0)/(N1 − N2)', 'N 是本次读数 TEMP_CNT', 'N1 = ROOM_COUNT', 'N2 = HOT_COUNT', 'T2 = HOT_TEMP'], 't20s'],
        [1280, '为什么是反的', ['温度升 → 计数降', '所以 N1 > N2', '分母为正、斜率取正', '若算出来斜率是负的', '说明两点读反了', '检查字段顺序']]);
  prose('代进数字看得更清楚（下面用示例值，实际要用你板子的熔丝）：ROOM=2500@25 °C、HOT=1800@85 °C', [
    '斜率 k = (85 − 25)/(2500 − 1800) = 60/700 ≈ 0.0857 °C/count。',
    '若读到 N = 2100，则 T = 85 − (2100 − 1800) × 0.0857 = 85 − 25.7 ≈ 59.3 °C —— 落在两点之间，插值成立。',
    '若读到 N = 2500，恰好回到 25 °C；读到 1800 就是 85 °C。这两个点就是“自检锚点”：算出来对不上，先查熔丝读得对不对。',
    '反向用法：想要 70 °C 报警，就解出 N = N2 + (85 − 70)/k ≈ 1800 + 175 ≈ 1975，把 1975 写进门限寄存器。',
    '熔丝是逐片校准的：换一颗芯片，ROOM/HOT/HOT_TEMP 都会变；把别的片子的值抄过来，误差可能十几度。',
    '判据：室温下算出的温度应接近实测室温（±3 °C 内）；偏差巨大先怀疑 HOT_TEMP 字段为 0（未烧熔丝）。']);
}

function drawAlarm() {
  txt(scene, 56, 146, '三个门限分工明确：低限防过冷、高限触发降频、恐慌限直接复位芯片', 't24w');
  three([80, '高限', ['TS0[31:20] ALARM_VALUE', '计数小于它 = 温度过高', '中断可用来降频', '写 12 位，别溢出到 TEMP_CNT', '与 TEMP_CNT 同宽 12 位', '复位为 0，需自己设'], 't20s'],
        [680, '低限与恐慌', ['TS2[11:0] LOW_ALARM_VALUE', '计数大于它 = 温度过低', 'TS2[27:16] PANIC_ALARM_VALUE', '连续 4 次超限才触发', '触发后可让 SRC 复位整片', 'SRC 里要单独使能'], 't20s'],
        [1280, '滑动门限玩法', ['启动：低限设最低码', '高限设系统最高工作温度', '高温中断后：降频', '同时把低限抬到“回温温度”', '等低限中断表示已冷却', '再恢复频率与门限']]);
  prose('Panic 的“连续 4 次”是关键设计：单次毛刺不会复位芯片，必须持续过热 —— 这让它敢直接接管复位', [
    '一旦 panic 连续成立且 SRC 里使能了温度复位，硬件会直接拉复位：软件此时已“不可信”，所以没有商量余地。',
    '这也意味着调试时不要随手把 panic 门限写成很小的值：满载跑几分钟就可能被硬件复位，日志都来不及写。',
    '高限的正确用法不是“报警”，而是“降频”：先降 CPU/DDR 频率，再看温度是否回落；回落不了再考虑关外设。',
    '低限在降温阶段当“回温确认”：把它设成比高限低 5–10 °C 的值（对应计数更大），触发时就说明已经凉下来了。',
    '高低门限之间的“回差”必须留够：如果设成同一温度，会在门限附近反复中断（热抖动），把 CPU 拖死。',
    '判据：把高限设成比当前计数略小，应立即触发中断；把低限设成比当前计数略大，也应立即触发 —— 两个方向都验一遍，避免写反。']);
}

function drawMap() {
  txt(scene, 56, 146, '三组寄存器，每组四个地址：本体 + SET + CLR + TOG，写别名可以免读改写', 't24w');
  three([80, '地址', ['基址 0x020C_8000', 'TS0 在 +0x180（SET +0x184）', 'TS0_CLR +0x188 / TOG +0x18C', 'TS1 在 +0x190（每 4 字节一别名）', 'TS2 在 +0x290', '四路实例再各偏移 16 字节'], 't20s'],
        [680, 'TS0 位域', ['[31:20] ALARM_VALUE 高限', '[19:8] TEMP_CNT 上次读数', '[2] FINISHED 有效标志', '[1] MEASURE_TEMP 启动', '[0] POWER_DOWN 断电', '复位值 0x0000_0001'], 't20s'],
        [1280, 'TS1 / TS2', ['TS1[15:0] MEASURE_FREQ', '0 = 单次，0xFFFF ≈ 2 s', 'TS2[27:16] PANIC_ALARM', 'TS2[11:0] LOW_ALARM', 'TS2 复位值 0', 'SET/CLR/TOG 同名后缀']]);
  prose('SET/CLR/TOG 三个别名是这颗芯片的通用套路：写 SET 只置位、写 CLR 只清位、写 TOG 翻转，读都返回本体值', [
    '好处是多任务/中断并发时不用“读-改-写”：置启动位写 TS0_SET 的 bit1，清断电位写 TS0_CLR 的 bit0，互不干扰。',
    '注意别名只影响写语义：读任意别名都返回同一个本体寄存器，所以调试时读哪个都一样。',
    'TS0 复位值 0x1 意味着 bit0 POWER_DOWN=1：芯片刚上电时温度传感器是关着的，这解释“为什么读不到数”。',
    'TEMP_CNT 只有 12 位（[19:8]），而 ALARM_VALUE 也是 12 位（[31:20]）：所以门限能表达的范围与读数一致，不会出现“门限比读数宽”的怪事。',
    '四路实例的基址按 +16 字节递增：i=0 是 +0x180，i=1 是 +0x190…… 但 TS1 本体正好也在 +0x190，别把“实例 1 的 TS0”与“实例 0 的 TS1”搞混。',
    '判据：写 TS0_CLR 的 bit0 后读 TS0 应见 bit0=0；写 TS0_SET 的 bit0 后应回 1 —— 两个方向都验，确认别名地址没算错。']);
}

function drawFlow() {
  txt(scene, 56, 146, '一次可靠测量的固定流程：上电、启动、等完成、读数、断电；任何一步顺序错了都拿不到有效值', 't24w');
  three([80, '单次流程', ['① 确认 PLL/RTC 已就绪', '② 写 TS0_CLR bit0 上电', '③ 写 TS0_SET bit1 启动', '④ 轮询 TS0[2] FINISHED', '⑤ 读 TS0[19:8] TEMP_CNT', '⑥ 写 TS0_SET bit0 断电'], 't20s'],
        [680, '自动流程', ['① 同上上电', '② 写 TS1[15:0] 间隔', '③ 置 MEASURE_TEMP 一次', '④ 之后硬件自己重测', '⑤ FINISHED 每次置位', '⑥ 不需要时断电关掉'], 't20w'],
        [1280, '常见错误', ['没清 POWER_DOWN 就读', '读到 0 或旧值', 'PLL 未锁定就测', '结果偏差极大', '忘了清 FINISHED 判断', '把旧值当新值用']]);
  prose('“读到 0”几乎总是同一种原因：POWER_DOWN 还停在 1，传感器根本没通电，TEMP_CNT 自然是复位值', [
    '上电顺序上还有一个隐含依赖：480 MHz PLL 必须先锁定。若你在 PLL 配置前就测温，计数会偏得离谱，且看起来“很像真的”。',
    '轮询要带超时：转换时间随工艺与温度变化，正常是微秒级；若等了几毫秒还没 FINISHED，说明时钟或电源有问题。',
    '自动模式下不需要每次重写 MEASURE_TEMP：第一次置位后硬件按 MEASURE_FREQ 自己循环，除非你清掉或断电。',
    '测完立刻断电是好习惯：省电，也避免模拟前端长期工作引入的漂移与噪声。',
    '要把温度上报给用户空间，通常走一次单次测量 + 计算的路径；热保护则走自动模式 + 中断的路径，两条不要混用。',
    '判据：同一环境下连续三次单次测量，TEMP_CNT 波动应在几个 count 内；若每次差几百，先查 PLL 与 bandgap 是否稳定。']);
}

function drawThermal() {
  txt(scene, 56, 146, '真正的用法是闭环：高温→降频→等回温→恢复频率，门限随阶段移动，panic 只在彻底失控时才用', 't24w');
    three([80, '闭环四步', ['① 高限中断：降频/降电压', '② 把低限抬到回温点', '③ 等低限中断（已冷却）', '④ 恢复频率、重置门限', '循环往复', '这就是动态热管理'], 't20w'],
        [680, 'panic 兜底', ['连续 4 次超限才触发', '可让 SRC 直接复位芯片', '需在 SRC 里使能', '适合无人值守设备', '触发前应保证日志已落盘', '否则只能看到“重启了”'], 't20w'],
        [1280, '判据与陷阱', ['回差要留 5–10 °C', '否则门限抖动打断', '降频要真降（改 CCM）', '只报日志等于没做', '门限与计数方向别写反', '换片要重读熔丝']]);
  prose('把“温度”当输入、把“频率”当输出的闭环，才是这颗模块存在的理由；只打印温度不算热管理', [
    '顺序应当是：先降频（改 CCM 的 AHB/ARM 分频），再观察温度是否回落；很多板子的过热其实是 DDR 或 GPU 负载，单降 CPU 频率不够。',
    '回差的意义：高温触发后立即把低限设到“低 10 °C 的计数”，只有当温度真的降下来才会再触发低限中断，避免在门限上反复横跳。',
    'panic 连续 4 次的机制给了你一次“自救窗口”：第 1–3 次超限时应该立刻降频、关外设、写日志；第 4 次就硬件复位了。',
    '如果产品必须无人值守，panic 复位是合理的；如果是交互设备，panic 复位会让用户以为“死机重启”，体验很差，应尽量靠降频压住。',
    '换芯片或换散热方案后，所有门限都要按新熔丝重算：抄别人的门限值是最常见的“看起来有保护、其实没保护”。',
    '判据：满载 10 分钟，温度上升到某点后稳定不再升（说明降频生效）；撤掉散热片再跑，应在 panic 前触发降频而不是直接复位。']);
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawTop();
  else if (s === 1) drawMode();
  else if (s === 2) drawCalib();
  else if (s === 3) drawAlarm();
  else if (s === 4) drawMap();
  else if (s === 5) drawFlow();
  else drawThermal();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () { state.step = INIT.step; draw(); });
fitCanvas($('viewport'), $('canvas'), draw);
</script>
</body>
</html>
