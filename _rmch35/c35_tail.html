<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0, lane: 0 };
var state = { step: INIT.step, lane: INIT.lane };

var STEPS = [
  { h: 'MMDC 是什么', hint: 'CORE + PHY · 400 MHz · x16 DDR3L',
    note: '内核管 AXI 与命令，PHY 管时序与校准；400 MHz DDR 时钟 = 800 MT/s，x16 单颗，最多两个片选。' },
  { h: '寄存器分三组', hint: '0x021B_0000 · core/PHY/debug',
    note: 'core 组改时序、PHY 组改延迟线、debug 组看带宽；改任何 core 寄存器前都要走 CON_REQ/CON_ACK。' },
  { h: '十三步上电', hint: 'MDSCR · MDCTL[SDE] · ZQ 512 拍',
    note: '上电顺序是 JEDEC 定的：配参数 → ZQ → 使能片选（硬件自己发 RESET/CKE 时序）→ 写 MR → 开刷新。' },
  { h: '时序怎么换算', hint: '1 clock = 1.894 ns @528 MHz',
    note: '手册字段全是「时钟数 − 1」，颗粒手册给的是 ns；先除以 tCK 上取整，再减一，逐项填进 MDCFG0/1。' },
  { h: '写均衡', hint: 'MPWLGCR · 1/8 cycle · WL_CYC_DEL',
    note: '让 DQS 对齐 CK。硬件只解 1 个周期内，超过要靠 WL_CYC_DEL 手动补；结果是 8 位小数周期。' },
  { h: '读校准', hint: 'DQS gating · 窗口中点 · ±100 ps',
    note: '读方向没有源同步时钟，只能靠 preamble 开窗再找窗口中点；两级：半周期粗调 + 1/256 周期精调。' },
  { h: '板级与判据', hint: 'fly-by · memtester · 带宽',
    note: 'DDR 是整板最脆的总线：走线 skew、ODT、VREF 任一不对，表现都是「跑一会儿就挂」而不是立刻坏。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}

function drawTop() {
  txt(scene, 56, 146, 'MMDC 分 CORE 与 PHY：CORE 管 AXI 与命令，PHY 管延迟线与校准', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '能力边界');
  txt(scene, 80, 252, '只支持 DDR3/DDR3L 与 LPDDR2', 't20w');
  txt(scene, 80, 288, '数据宽度固定 x16（单颗）', 't20w');
  txt(scene, 80, 324, '两个片选，各同容量', 't20w');
  txt(scene, 80, 360, '最大 4 GB 地址空间', 't20w');
  txt(scene, 80, 396, 'DDR3 突发长度固定 8', 't20w');
  txt(scene, 80, 432, '不支持 DDR2/DDR1/LPDDR1', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '速度');
  txt(scene, 680, 252, 'DDR 时钟最高 400 MHz', 't20w');
  txt(scene, 680, 288, '= 800 MT/s，1 clock 2.5 ns', 't20w');
  txt(scene, 680, 324, 'i.MX6ULL 常见 528 MHz（1056）', 't20w');
  txt(scene, 680, 360, '此时 1 clock ≈ 1.894 ns', 't20w');
  txt(scene, 680, 396, 'AXI 64 位、突发最长 16', 't20w');
  txt(scene, 680, 432, '读队列 16 项、写队列 8 项', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '为什么难');
  txt(scene, 1280, 252, '数据与 DQS 是同源双向的', 't20w');
  txt(scene, 1280, 288, '读没有时钟，只能靠 preamble 开窗', 't20w');
  txt(scene, 1280, 324, '写要 DQS 对齐 CK（写均衡）', 't20w');
  txt(scene, 1280, 360, '颗粒与 SoC 之间还有走线延迟', 't20w');
  txt(scene, 1280, 396, '所以必须靠 PHY 校准，不能拍脑袋', 't20w');
  txt(scene, 1280, 432, '校准参数写错：能启动、跑一会挂', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, 'DDR 是整板最脆的总线：它不是「配对了就通」，而是「校准到窗口里才稳」', 't24');
  txt(scene, 80, 522, 'DDR3 的读数据是源同步的：颗粒用 DQS 边沿发数据，控制器必须把 DQS 延迟到数据眼中间采样，早一点晚一点都是误码。', 't20w');
  txt(scene, 80, 556, 'PHY 里每字节 lane 都有一条延迟线，粗细两级：粗调以半周期为单位（HC_DEL），精调是 1/256 周期（DL_ABS_OFFSET）。', 't20w');
  txt(scene, 80, 590, '校准不是可选项：同一颗颗粒换一块 PCB，最佳延迟就变了；所以量产板上一定要跑一次写均衡 + 读校准，把结果烧进启动镜像。', 't20w');
  txt(scene, 80, 624, 'i.MX6ULL 的 DDR 引脚全部「No Muxing」：DRAM_* 一组专用球，不用配 IOMUX，但也意味着接错了没法用别的脚救。', 't20w');
  txt(scene, 80, 658, '一句话：MMDC 的配置分两半 —— 前一半算时序（ns 换成时钟数），后一半校准延迟（找到窗口中点），缺一半都跑不稳。', 't20w');
}

function drawMap() {
  txt(scene, 56, 146, 'MMDC0 基址 0x021B_0000：core 组在低偏移，PHY 组在 0x0800 起，debug 组在 0x0410', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, 'core 关键寄存器');
  txt(scene, 80, 252, 'MDCTL +0x00 复位 0311_0000', 't20s');
  txt(scene, 80, 288, 'MDCFG0 +0x0C 复位 3236_22D3', 't20s');
  txt(scene, 80, 324, 'MDCFG1 +0x10 复位 B6B1_8A23', 't20s');
  txt(scene, 80, 360, 'MDCFG2 +0x14 复位 00C7_0092', 't20s');
  txt(scene, 80, 396, 'MDMISC +0x18 复位 0000_1600', 't20s');
  txt(scene, 80, 432, 'MDSCR +0x1C 命令/配置握手', 't20s');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '其余 core');
  txt(scene, 680, 252, 'MDPDC +0x04：掉电与 CKE 宽度', 't20s');
  txt(scene, 680, 288, 'MDOTC +0x08：ODT 时序', 't20s');
  txt(scene, 680, 324, 'MDREF +0x20：刷新控制', 't20s');
  txt(scene, 680, 360, 'MDRWD +0x2C：读写命令延迟', 't20s');
  txt(scene, 680, 396, 'MDOR +0x30：出复位延迟', 't20s');
  txt(scene, 680, 432, 'MDASP +0x40：CS0_END 分区', 't20s');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, 'PHY 组 0x0800 起');
  txt(scene, 1280, 252, 'MPZQHWCTRL +0x00：ZQ 校准', 't20s');
  txt(scene, 1280, 288, 'MPWLGCR +0x08：写均衡使能', 't20s');
  txt(scene, 1280, 324, 'MPWLDECTRL0/1 +0x0C/10', 't20s');
  txt(scene, 1280, 360, 'MPRDDLCTL +0x48 复位 4040_4040', 't20s');
  txt(scene, 1280, 396, 'MPRDDLHWCTL +0x60 读校准', 't20s');
  txt(scene, 1280, 432, 'MPDCCR +0xC0 占空比调整', 't20s');

  wide(456, 330);
  txt(scene, 80, 490, '改 core 寄存器必须先进配置模式：MDSCR[CON_REQ]=1，等 CON_ACK=1，改完清 CON_REQ', 't24');
  txt(scene, 80, 522, '为什么：core 寄存器跑了影子副本，运行中直接写会和正在进行的命令打架；握手把 AXI 新请求挡在门外，寄存器才有确定的写入时机。', 't20w');
  txt(scene, 80, 556, '注意上电第一次配置时不用等 CON_ACK：此时 MMDC 还没使能（MDCTL[SDE]=0），握手位不会被硬件拉起，手册明确说了可以跳过轮询。', 't20w');
  txt(scene, 80, 590, 'PHY 寄存器不进配置模式也能读，但改延迟线后必须触发「测量」（MPMUR0[FRC_MSR]=1），否则延迟线还用旧值，读了也白读。', 't20w');
  txt(scene, 80, 624, 'MDCTL 复位 0x0311_0000 解出来：ROW=011（14 位行）、COL=001（10 位列）、SDE=0；DDR3 还要把 BL(19) 置 1（突发 8）、DSIZ 保持 0（x16）。', 't20w');
  txt(scene, 80, 658, '调试组 MADPSR0–5 值得记住：它们能统计读写字节数、bank 命中率与平均延迟 —— 怀疑带宽不够时先用它们量，而不是猜。', 't20w');
}

function drawInit() {
  txt(scene, 56, 146, '上电序列是 JEDEC 定的：MMDC 使能片选那一刻，硬件才开始发 RESET 与 CKE 时序', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '前六步（可乱序）');
  txt(scene, 80, 252, '① MDSCR 置 CON_REQ', 't20w');
  txt(scene, 80, 288, '② 配 MDCFG0/1/2 与 MDOTC', 't20w');
  txt(scene, 80, 324, '③ 配 MDMISC（DDR 类型等）', 't20w');
  txt(scene, 80, 360, '④ 配 MDOR 出复位延迟', 't20w');
  txt(scene, 80, 396, '⑤ 配 MDCTL 密度与突发长度', 't20w');
  txt(scene, 80, 432, '⑥ 做一次 MMDC 的 ZQ 校准', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '后七步');
  txt(scene, 680, 252, '⑦ MDCTL[SDE_0]=1 使能 CS0', 't20w');
  txt(scene, 680, 288, '⑧ MDSCR 发 MRS：ZQ/ODT/PRE', 't20w');
  txt(scene, 680, 324, '⑨ MDSCR 写颗粒 MR0–MR3', 't20w');
  txt(scene, 680, 360, '⑩ 配 MDPDC 与 MAPSR', 't20w');
  txt(scene, 680, 396, '⑪ 配 MPZQHWCTRL 周期 ZQ', 't20w');
  txt(scene, 680, 432, '⑫ 开 MDREF 周期刷新', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '硬件要求');
  txt(scene, 1280, 252, 'DRAM_RESET 必须外部下拉', 't20w');
  txt(scene, 1280, 288, 'DRAM_SDCKE 必须外部下拉', 't20w');
  txt(scene, 1280, 324, 'JEDEC 要求上电时两者为低', 't20w');
  txt(scene, 1280, 360, 'ZQCL 上电后 512 拍静默', 't20w');
  txt(scene, 1280, 396, '普通 ZQCL 256 拍、ZQCS 64 拍', 't20w');
  txt(scene, 1280, 432, '期间只有 CK 可以动', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '第 13 步「清 CON_REQ」才是终点：在此之前 MMDC 只认寄存器，不接 AXI', 't24');
  txt(scene, 80, 522, '使能片选这一笔写下去，硬件才开始按 JEDEC 拉 RESET、拉 CKE、发预充电、发 MRS —— 软件不需要逐条摆波形，但也因此必须先把参数全配对。', 't20w');
  txt(scene, 80, 556, '这就是「初始化脚本」的本质：一串寄存器值 + 一次 SDE 置位。U-Boot 与 DDR Stress Test 工具做的都是同一件事，只是把校准结果也写进去。', 't20w');
  txt(scene, 80, 590, '常见错误：先置 SDE 再配 MDCFG，硬件按默认时序发了 MRS，颗粒进了错误模式，之后再改寄存器也不会重新发 MRS —— 只能整板断电重来。', 't20w');
  txt(scene, 80, 624, '校准时另有要求：先把 MDREF[REF_SEL] 写成 11 关掉周期刷新，再用 MDSCR[CMD]=2 手动刷新一次，然后才能跑延迟线校准。', 't20w');
  txt(scene, 80, 658, '顺序的判据：读 MDCTL 看 SDE 位、读 MDSCR 看 CON_ACK、量 CK 与 CKE 是否有波形；三者都对才继续往下配 MR。', 't20w');
}

function drawTiming() {
  txt(scene, 56, 146, '手册字段都是「时钟数 − 1」：先把颗粒手册的 ns 除以 tCK 上取整，再减一', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, 'MDCFG0 位域');
  txt(scene, 80, 252, 'tRFC[31:24]：刷新到激活', 't20s');
  txt(scene, 80, 288, 'tXS[23:16]：退出自刷新', 't20s');
  txt(scene, 80, 324, 'tXP[15:13]：退出掉电', 't20s');
  txt(scene, 80, 360, 'tXPDLL[12:9]：DLL 冻结', 't20s');
  txt(scene, 80, 396, 'tFAW[8:4]：四激活窗口', 't20s');
  txt(scene, 80, 432, 'tCL[3:0]：CL 值直接查表', 't20s');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'MDCFG1 参数');
  txt(scene, 680, 252, 'tRCD：激活到读写', 't20w');
  txt(scene, 680, 288, 'tRP：预充电时间', 't20w');
  txt(scene, 680, 324, 'tRC：同 bank 行周期', 't20w');
  txt(scene, 680, 360, 'tRAS：行激活最短时间', 't20w');
  txt(scene, 680, 396, 'tWR：写恢复到预充电', 't20w');
  txt(scene, 680, 432, 'tMRD/tCWL：模式寄存器与写延迟', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '换算示例');
  txt(scene, 1280, 252, '528 MHz 时 tCK = 1.894 ns', 't20s');
  txt(scene, 1280, 288, 'tRFC 260 ns → 137 拍 → 0x88', 't20s');
  txt(scene, 1280, 324, 'tRAS 35 ns → 19 拍 → 0x12', 't20s');
  txt(scene, 1280, 360, 'tRP 13.5 ns → 8 拍 → 0x07', 't20s');
  txt(scene, 1280, 396, 'tWR 15 ns → 8 拍 → 0x07', 't20s');
  txt(scene, 1280, 432, 'tFAW 30 ns → 16 拍 → 0x0F', 't20s');

  wide(456, 330);
  txt(scene, 80, 490, '「减一」不是笔误：字段编码 0x0 表示 1 个时钟，所以 137 拍要写 0x88（136）', 't24');
  txt(scene, 80, 522, '这类编码在手册里逐项列着（tRFC 一栏从 0x0=1 clock 排到 0xFF=256 clocks），照表换算就不会差一拍 —— 而差一拍足以让刷新期间丢数据。', 't20w');
  txt(scene, 80, 556, 'CL 是例外：它按「周期数」直接编码（0x0=3 cycles … 0x9=12），所以 CL=8 写 0x5，不需要减一。看到编码表要分清楚是「时钟数减一」还是「周期数查表」。', 't20w');
  txt(scene, 80, 590, '算 tRFC 要用颗粒真正的 tRFC 值：512 Mb 与 8 Gb 的 tRFC 差两倍以上，按容量猜会算出离谱的值，先去查颗粒 datasheet。', 't20w');
  txt(scene, 80, 624, '所有 timing 都以 DDR 时钟为基准（mmdc_axi_clk_root），不是 AXI 时钟、也不是 IPG；换频率后必须整套重算，这也是 DVFS 要重跑初始化的原因。', 't20w');
  txt(scene, 80, 658, '校验办法：把每个字段读回来乘回去，看是否 ≥ 颗粒手册要求的最小 ns；只要有一项低于最小值，就是「能开机、压测必挂」。', 't20w');
}

function drawWL() {
  txt(scene, 56, 146, '写均衡：把 DQS 相对 CK 挪到颗粒能采到的那一格，结果是一个 8 位小数周期', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '写均衡三步');
  txt(scene, 80, 252, '① MRS 让颗粒进写均衡模式', 't20w');
  txt(scene, 80, 288, '② MDSCR[WL_EN]=1 打开 DQS 输出', 't20w');
  txt(scene, 80, 324, '③ MPWLGCR[HW_WL_EN]=1 启动', 't20w');
  txt(scene, 80, 360, '硬件先等 25+15 拍再发一个脉冲', 't20w');
  txt(scene, 80, 396, '每 1/8 周期采一次 DQ 的 0/1', 't20w');
  txt(scene, 80, 432, '找到跳变后再做 1/256 精调', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '总延迟公式');
  txt(scene, 680, 252, 'DL_ABS_OFFSET/256 × 周期', 't20s');
  txt(scene, 680, 288, '+ WL_HC_DEL × 半周期', 't20s');
  txt(scene, 680, 324, '+ WL_CYC_DEL × 周期', 't20s');
  txt(scene, 680, 360, '8 位小数 + 1 位半周期 + 整数周期', 't20w');
  txt(scene, 680, 396, '0x20 = 32/256 = 1/8 周期', 't20s');
  txt(scene, 680, 432, '最多可补 3 个整周期', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '硬件能力边界');
  txt(scene, 1280, 252, '自动只解 1 个周期以内', 't20w');
  txt(scene, 1280, 288, '超出必须人工写 WL_CYC_DEL', 't20w');
  txt(scene, 1280, 324, '例如结果 100/256 但实际超 2 拍', 't20w');
  txt(scene, 1280, 360, '则 WL_CYC_DEL = 2', 't20w');
  txt(scene, 1280, 396, '还要同步写 MDMISC[WALAT]', 't20w');
  txt(scene, 1280, 432, '否则控制器按错周期发命令', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '写均衡只解决「DQS 什么时候发」，不解决「数据什么时候到」—— 后者是写延迟校准与 ODT 的事', 't24');
  txt(scene, 80, 522, '写均衡的原理：颗粒在写均衡模式下把 DQS 当输入、把 DQ 的 prime 位回吐；控制器逐格加延迟，直到看到 0→1 的跳变，跳变点就是 CK 到达颗粒的时刻。', 't20w');
  txt(scene, 80, 556, '所以它本质是在测「CK 走到颗粒用了多久」。结果 100/256 表示 0.39 个周期；若 PCB 走线更长、超过一整周期，硬件看到的是同一个 0/1 图案，无法分辨，必须人工补 WL_CYC_DEL。', 't20w');
  txt(scene, 80, 590, 'MDMISC[WALAT] 是「写延迟」字段，必须与 WL_CYC_DEL 一致：前者告诉控制器发完写命令后等几拍再发数据，后者告诉 PHY 把 DQS 推后几拍。两者错位就是整块数据错。', 't20w');
  txt(scene, 80, 624, 'fly-by 拓扑下 clock 到各颗颗粒的距离不同，写均衡必须对每颗（每个 CS）分别做；一颗板贴两片时，两片的结果可能差半拍以上。', 't20w');
  txt(scene, 80, 658, '判据：跑完读 MPWLGCR[HW_WL_ERR#]，任何一位置 1 都说明该字节没找到跳变 —— 先怀疑 DQS/DQ 走线或焊接，而不是继续调参数。', 't20w');
}

function drawRD() {
  txt(scene, 56, 146, '读方向没有随路时钟可用：先用 preamble 开窗（gating），再在窗口里找中点', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '两级校准');
  txt(scene, 80, 252, '第一级：DQS gating 开窗', 't20w');
  txt(scene, 80, 288, 'MPDGCTRL0/1 的 DG_HC_DEL', 't20s');
  txt(scene, 80, 324, 'MAC 半周期粗调，最多 7 个周期', 't20w');
  txt(scene, 80, 360, '第二级：read calibration', 't20w');
  txt(scene, 80, 396, 'MPRDDLCTL 的 RD_DL_ABS_OFFSET', 't20s');
  txt(scene, 80, 432, '1/256 周期精调，按字节独立', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '找窗口中点');
  txt(scene, 680, 252, '写已知图案（MPR 或预置值）', 't20w');
  txt(scene, 680, 288, '逐步加延迟读回比对', 't20w');
  txt(scene, 680, 324, '下边界：开始读对的位置', 't20w');
  txt(scene, 680, 360, '上边界：开始读错的位置', 't20w');
  txt(scene, 680, 396, '把中点写回 MPRDDLCTL', 't20w');
  txt(scene, 680, 432, '写回后还要 FRC_MSR 触发测量', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '精调与状态');
  txt(scene, 1280, 252, '读精调 ±100 ps，最多 6 档', 't20w');
  txt(scene, 1280, 288, 'MPRDDQBY0/1DL 每字节独立', 't20s');
  txt(scene, 1280, 324, '写精调最多 3 档，约 30–35 ps', 't20w');
  txt(scene, 1280, 360, 'MPWRDQBY0–3DL', 't20s');
  txt(scene, 1280, 396, 'MPRDDLHWST0 存上下边界', 't20s');
  txt(scene, 1280, 432, 'MPWLHWERR 存写均衡错误位', 't20s');

  wide(456, 330);
  txt(scene, 80, 490, '校准的本质是把「数据眼」量出来，再取中点 —— 不是找一个能跑的值，而是找窗口的正中', 't24');
  txt(scene, 80, 522, '为什么取中点：温度和电压会让延迟漂移，落在中点时上下都有余量；贴着边界虽然此刻能跑，跑热了或掉压就立刻错。', 't20w');
  txt(scene, 80, 556, '两个边界都要扫：只找一个「能读对」的点没有意义，因为窗口可能只有一个延迟格宽，噪声一来就翻。', 't20w');
  txt(scene, 80, 590, 'DQS gating 与 read calibration 是两级串联：gating 决定「门什么时候开」，calibration 决定「门内哪个沿采样」。gating 没开对，后面怎么调都读错。', 't20w');
  txt(scene, 80, 624, 'MPMUR0[FRC_MSR]=1 是「让延迟线重新测自己」：延迟线是按 PVT 实时标定的，只改寄存器不会自动生效，必须触发测量。', 't20w');
  txt(scene, 80, 658, '判据：校准后读 MPRDDLHWST0 的上下边界，两者差值应有若干格；差值只有 1–2 格说明窗口太窄，该改 PCB 或降频，而不是继续调。', 't20w');
}

function drawBoard() {
  txt(scene, 56, 146, '上板三件事：拓扑与走线、端接与 ODT、电源与参考电压 —— 参数只是最后一层', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '拓扑');
  txt(scene, 80, 252, '点对点：一颗颗粒最稳', 't20w');
  txt(scene, 80, 288, 'fly-by：多颗共用 CK/ADDR', 't20w');
  txt(scene, 80, 324, 'fly-by 下每颗要各自写均衡', 't20w');
  txt(scene, 80, 360, 'CK 到最远颗粒的飞行时间 < 1 周期', 't20w');
  txt(scene, 80, 396, 'DQS 与 DQ 组内等长 ±几 mil', 't20w');
  txt(scene, 80, 432, '地址/命令相对 CK 等长', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '端接与 ODT');
  txt(scene, 680, 252, '颗粒 ODT 由 MR1 配置', 't20w');
  txt(scene, 680, 288, '控制器侧由 MPODTCTRL 控制', 't20s');
  txt(scene, 680, 324, '写时开颗粒 ODT，读时开控制器', 't20w');
  txt(scene, 680, 360, '两侧同时开会导致幅度减半', 't20w');
  txt(scene, 680, 396, 'ZQ 电阻 240 Ω 到地，精度 1%', 't20w');
  txt(scene, 680, 432, 'ZQ 校准把驱动阻抗调到 240/N', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '电源与参考');
  txt(scene, 1280, 252, 'DDR3L 1.35 V，DDR3 1.5 V', 't20w');
  txt(scene, 1280, 288, 'VREF = VDDQ/2，单独走线', 't20w');
  txt(scene, 1280, 324, 'VREF 要靠近颗粒并加去耦', 't20w');
  txt(scene, 1280, 360, 'VTT 端接电源要能吸/灌电流', 't20w');
  txt(scene, 1280, 396, '上电顺序：VDD → VDDQ → VREF', 't20w');
  txt(scene, 1280, 432, 'RESET/CKE 必须外部下拉', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '「能启动但跑一会就挂」几乎都是余量问题：要么窗口太窄，要么电源/参考在温度上来后漂了', 't24');
  txt(scene, 80, 522, '先分清两类故障：立刻错（参数或接线错，读 MR 都不对）与跑热后错（余量不足，校准点贴着边界）。前者改配置，后者改硬件或降频。', 't20w');
  txt(scene, 80, 556, '正点原子这类板子把 DDR 布在 SoC 同一面、走线短，写均衡结果通常在半拍以内；若你的板子算出结果接近 1 个周期，就该怀疑拓扑或走线。', 't20w');
  txt(scene, 80, 590, 'ODT 是双向的：控制器写的时候颗粒端接，控制器读的时候自己端接；MPODTCTRL 与颗粒 MR1 要配对，两边都开等于把信号幅度砍一半。', 't20w');
  txt(scene, 80, 624, '降频是最有效的验证手段：528 MHz 不稳、400 MHz 稳，说明是时序余量而不是功能错误；此时先看眼图与校准窗口，别急着换颗粒。', 't20w');
  txt(scene, 80, 658, '一个常被忽略的点：DDR 的 ZQ 校准需要 240 Ω 精密电阻，且每颗颗粒一个 ZQ 脚；电阻焊错或阻值偏 10%，驱动强度就整体偏，误码率随之上升。', 't20w');
}

function drawVerify() {
  txt(scene, 56, 146, '判据顺序：先确认能读 MR（接线对）→ 再看校准窗口 → 再跑压测 → 最后量带宽', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '四级验证');
  txt(scene, 80, 252, '① 读 MDCTL 与 MDSCR 握手', 't20w');
  txt(scene, 80, 288, '② 读颗粒 MR0/MR1 的 ID 模式', 't20w');
  txt(scene, 80, 324, '③ 跑写均衡与读校准看错误位', 't20w');
  txt(scene, 80, 360, '④ memtester 覆盖全容量', 't20w');
  txt(scene, 80, 396, '再跑长时间 + 高温复测', 't20w');
  txt(scene, 80, 432, '最后用 MADPSR 量实际带宽', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '症状对应');
  txt(scene, 680, 252, '读 MR 全 0/全 FF：接线或电源', 't20w');
  txt(scene, 680, 288, '能读 MR 但读写错：校准没做', 't20w');
  txt(scene, 680, 324, '固定地址错：行列或 CS 分区错', 't20w');
  txt(scene, 680, 360, '随机位错：窗口太窄或 ODT 错', 't20w');
  txt(scene, 680, 396, '跑热后错：余量/电源漂移', 't20w');
  txt(scene, 680, 432, '整块卡死：刷新没开或 tRFC 错', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '调试寄存器');
  txt(scene, 1280, 252, 'MADPSR0：读写字节计数', 't20s');
  txt(scene, 1280, 288, 'MADPSR1：bank 命中/未命中', 't20s');
  txt(scene, 1280, 324, 'MADPSR2：平均读延迟', 't20s');
  txt(scene, 1280, 360, 'MPRDDLST：读延迟线状态', 't20s');
  txt(scene, 1280, 396, 'MPWLDLST：写延迟线状态', 't20s');
  txt(scene, 1280, 432, 'MASBS0：单步地址快照', 't20s');

  wide(456, 330);
  txt(scene, 80, 490, 'DDR 排障最忌「改一堆参数再看」：每次只改一个量，并且先存下原始值', 't24');
  txt(scene, 80, 522, '第一步永远是读：读 MDCTL 确认 SDE 与行列位宽，读 MDSCR 确认 CON_ACK，再用 MDSCR 的 MRR 命令读颗粒 MR0 —— 读得到就说明命令通路与时钟都活着。', 't20w');
  txt(scene, 80, 556, '第二步看校准：写均衡的 MPWLGCR[HW_WL_ERR] 与读校准的 MPRDDLHWST 边界值。错误位为 0、窗口有若干格，才进入压测。', 't20w');
  txt(scene, 80, 590, '第三步压测：memtester 全容量跑 3 轮以上，再用 DDR Stress Test 做随地址/随数据的图案；只在某个地址段错，就是行列译码或 CS 分区的问题。', 't20w');
  txt(scene, 80, 624, '第四步带宽：用 MADPSR 的字节计数配时间算实测 MB/s，再和「频率 × 位宽 × 2」比 —— i.MX6ULL x16 528 MHz 理论 2.1 GB/s，实测 400–700 MB/s 属正常。', 't20w');
  txt(scene, 80, 658, '最后一条：任何 DDR 配置改动都要重跑全部校准并重新压测；只改一个 timing 就上线，是嵌入式里最贵的省事。', 't20w');
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawTop();
  else if (s === 1) drawMap();
  else if (s === 2) drawInit();
  else if (s === 3) drawTiming();
  else if (s === 4) drawWL();
  else if (s === 5) drawRD();
  else drawBoard();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () {
  state.step = INIT.step; state.lane = INIT.lane; draw();
});
fitCanvas($('viewport'), $('canvas'), draw);
</script>
