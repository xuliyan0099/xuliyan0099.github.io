<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0 };
var state = { step: INIT.step };

var STEPS = [
  { h: '复位与启动的总闸', hint: 'POR / WARM / COLD',
    note: 'SRC 决定这次复位有多深、从哪儿启动，以及复位之后谁能读到“为什么复位”。' },
  { h: '三种复位深度', hint: 'WARM 保 DDR',
    note: 'WARM 要等 MMDC 应答，等不到就退化成 COLD；这个等待窗可配 16/32/64 个晶振拍。' },
  { h: '谁把我复位的', hint: '读 SRSR',
    note: '八个来源各一位：上电、看门狗、JTAG、CSU、用户复位、温度传感器，读一次就知道。' },
  { h: '掩掉看门狗', hint: '0101 才有效',
    note: 'SCR 里 4 位掩码要写成 0101 才掩，写别的都当 1010（不掩），这是防误写的双保险。' },
  { h: '寄存器地图', hint: '0x020D_8000',
    note: 'SCR 在 0x00、SBMR1 在 0x04、SRSR 在 0x08，GPR1–10 从 0x20 起排到 0x44。' },
  { h: '启动模式怎么定', hint: '两脚 + 32 位配置',
    note: 'BOOT_MODE0/1 是专用脚，BOOT_CFG 走 LCD_DATA 的 ALT6；熔丝读完才锁存。' },
  { h: '板上的判据', hint: '先读原因再动手',
    note: '复位后第一件事读 SRSR：分不清是掉电、看门狗还是手动复位，后面全是猜。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}
function three(a, b, c) {
  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(a[0], 214, a[1]); for (var i = 0; i < a[2].length; i++) txt(scene, a[0], 252 + i * 36, a[2][i], a[3] || 't20w');
  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(b[0], 214, b[1]); for (var j = 0; j < b[2].length; j++) txt(scene, b[0], 252 + j * 36, b[2][j], b[3] || 't20w');
  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(c[0], 214, c[1]); for (var k = 0; k < c[2].length; k++) txt(scene, c[0], 252 + k * 36, c[2][k], c[3] || 't20w');
}
function prose(title, lines) {
  wide(456, 330);
  txt(scene, 80, 490, title, 't24');
  for (var i = 0; i < lines.length; i++) txt(scene, 80, 522 + i * 34, lines[i], 't20w');
}

function drawTop() {
  txt(scene, 56, 146, 'SRC 是整颗芯片的“复位总管”：它决定这次复位多深、复位后从哪启动、以及谁该被记一笔', 't24w');
  three([80, '它管三件事', ['接收所有复位源', '按类型重置对应电源域', '锁存 BOOT_MODE 与配置脚', '记录复位原因供软件查询', '产生 PMIC 与稳压器的控制', '配合 SNVS 做开关机流程'], 't20w'],
        [680, '复位不是只有一种', ['POR：上电复位，全片重来', 'WARM：保 DDR 内容的重启', 'COLD：不复位 SNVS 的深复位', 'WARM 失败会退化成 COLD', '不同类型复位的域不一样', '搞错类型会丢数据或丢时间'], 't20w'],
        [1280, '电源侧的配合', ['PMIC_ON_REQ：高或高阻=开', '拉低=请求断电', 'PMIC_STBY_REQ 控待机', '按钮 5 s 验证才动作', 'SNVS 域独立供电', '没电池则断电即丢时间']]);
  prose('这一章的核心不是“怎么复位”，而是“复位之后怎么知道发生过什么”：SRSR 就是那颗黑匣子', [
    'POR 与 COLD 的区别在软件眼里很微妙：两者都会让 CPU 从复位向量重新开始，但 COLD 可能保留 SNVS 的单调计数器与 RTC。',
    'WARM 才是真正特殊的一种：它不清 DDR，靠 MMDC 的应答走完流程，所以能在“软重启”后保住显存/帧缓冲里的内容。',
    '因此嵌入式里判断“为什么重启”必须读 SRSR，而不是猜：同一个现象可能来自掉电、看门狗、JTAG 调试器、甚至温度传感器。',
    'PMIC_ON_REQ 的极性要记住：高电平或高阻都算“开”，只有拉低才是“关”—— 所以外部上拉缺失会导致“关机指令无效”。',
    '这一章与第 48 章 SNVS 是连着的：SNVS 的按钮与关机请求最终要通过 SRC 转成对 PMIC 的请求，两者合起来才是一条完整开关机链。',
    '一句话：复位是硬件的确定性，SRSR 是软件的可观测性；两者缺一，调试就只能靠拔电重插。']);
}

function drawTypes() {
  txt(scene, 56, 146, '三种深度：POR 最彻底（连 DDR 一起重来），WARM 想保住 DDR 内容，COLD 介于两者之间', 't24w');
  three([80, 'POR', ['来自 ipp_reset_b / POR_B 脚', '上电、掉电恢复都走它', '整个芯片全部复位', 'MMDC 也被复位', 'SRSR[0] 记这一笔', '是最“干净”的起点'], 't20w'],
        [680, 'WARM', ['SCR[0] 使能后才可用', '保留 DDR 内容', '必须等 MMDC 应答', '超时则退化为 COLD', '超时窗 16/32/64 晶振拍', 'SCR[6:5] 选择'], 't20w'],
        [1280, 'COLD', ['深复位但不碰 SNVS LP', '由用户复位脚等源触发', 'SRSR[3] 记“用户复位”', '不经 MMDC 握手', '比 POR 快', '常作软重启实现']]);
  prose('WARM 的收益与风险都很具体：省掉 DDR 重新训练的时间，代价是“MMDC 不应答就可能卡死”，所以必须有超时兜底', [
    'SCR 复位值 0x0000_0521：bit0=1 表示 WARM 已使能、[6:5]=01 表示等 16 个 XTALI 拍、[10:7]=1010 表示看门狗未被掩。',
    'WARM 流程里 SRC 会拉住 MMDC，等它把 DDR 置于自刷新并回一个 ack；这个 ack 若因 DDR 已经“半死”而永不到来，超时机制就把它转成 COLD。',
    '所以“软重启后花屏/数据错”往往不是复位没做，而是 WARM 保住了脏的 DDR 内容；需要确定性就干脆用 COLD。',
    '而“WARM 一直卡住不返回”多半是 DDR 时钟被提前关掉或 MMDC 已挂死，此时把 bypass 计数设小（16 拍）能让它快速退化。',
    '反过来，如果你的应用要求“重启后屏上内容还在”（比如快速唤醒显示），就必须确保 MMDC 真的进了自刷新，而不是靠运气。',
    '判据：复位后读 SRSR 与相关状态，WARM 与 COLD 的记录位不同；再用示波器看 DDR 时钟在复位期间是否保持，就能验证路径。']);
}

function drawSrsr() {
  txt(scene, 56, 146, 'SRSR 每一位对应一个复位源：复位后第一件事就是读它，把“为什么重启”钉死', 't24w');
  three([80, '八个来源', ['[0] ipp_reset_b：上电复位', '[2] csu_reset_b：CSU 复位', '[3] ipp_user_reset_b：用户复位', '[4] wdog_rst_b：看门狗超时', '[5] jtag_rst_b：JTAG 高阻复位', '[6] jtag_sw_rst：JTAG 软复位'], 't20s'],
        [680, '其余两位与复位值', ['[7] wdog3_rst_b：看门狗 3 超时', '[8] tempsense_rst_b：温度传感器', '[1] 保留', '复位值 0x0000_0001', '即上电后 bit0 必为 1', '写 1 可清（R/W）'], 't20s'],
        [1280, '读法建议', ['读整字再逐位判断', '多位同时置说明“多重触发”', 'bit0 与 bit3 同时置要小心', '常见：掉电+用户复位并存', '清之前先把日志存下来', '否则下一次就查不到了']]);
  prose('注意 SRSR 是可写清的：清掉之后就再也无法回溯，所以固件应该在启动最早期把它抄进保留内存或打印出来', [
    '典型判据：上电冷启动 bit0 应为 1；按下复位键后 bit3 应为 1；程序跑飞被看门狗咬后 bit4 应为 1 —— 三种情况各不相同。',
    '如果 bit0 与 bit3 同时置位，通常说明“按复位键”同时触发了电源域动作（按键走 PMIC 而非纯复位脚），看原理图确认按键接到了哪。',
    'bit2（CSU）与 bit8（温度传感器）在实际板上少见，但一旦出现说明有安全模块或热保护介入，不能当噪声忽略。',
    'JTAG 的两位要分软复位与高阻复位：前者是你从调试器点了 reset，后者是调试器把 JTAG 脚拉到高阻导致 TAP 进入复位。',
    '配合 GPR 寄存器更完整：你可以把“上次启动的软件版本”“重启计数”写进 GPR，跨复位保留（GPR 在复位域里保持）。',
    '判据：故意用看门狗咬一次、按一次复位键、拔一次电，分别记下 SRSR 的值；三种值都不同，说明判据可靠，可以写进看门狗驱动。']);
}

function drawMask() {
  txt(scene, 56, 146, '看门狗可以被 SRC 掩掉：4 位写 0101 才生效，写任何别的值都被当作 1010（不掩）', 't24w');
  three([80, '两个掩码字段', ['mask_wdog_rst[10:7]：主看门狗', 'mask_wdog3_rst[31:28]：看门狗 3', '0101 = 掩掉该复位源', '1010 = 不掩（默认）', '其他值硬件自动改成 1010', '所以只有精确的 0101 有用'], 't20s'],
        [680, '掩掉之后', ['复位不再发生', '但 WRSR 状态位仍会置', '该位只能硬件复位清', '软件服务看门狗也清不掉', '所以“掩掉”不等于“没事”', '日志里会留下痕迹'], 't20w'],
        [1280, '为什么要这么设计', ['防误写：单比特翻转不会误掩', '必须 4 位一起正确', '调试期可临时掩掉', '量产后应恢复 1010', '否则真死机也不重启', '这是安全与可用性的取舍']]);
  prose('手册的警告值得抄下来：掩掉期间若真发生超时，状态位会一直挂在那里，只有硬件复位能让它落下', [
    '典型调试场景：在 JTAG 里打断点，看门狗超时把芯片复位，调试会话每次都断 —— 此时临时掩掉看门狗是合理的。',
    '但掩掉之后程序真的跑飞就再也不会自动重启，所以“掩掉”的代码必须只在调试构建里出现，量产构建要显式写回 1010。',
    '更麻烦的是状态位：掩掉期间超时事件发生 → WRSR 置位 → 你之后即使恢复掩码并喂狗，这个位仍然为 1，读起来像“又超时了”。',
    '因此排查时要区分“当前是否在超时”与“历史是否超时过”：前者看计数器与喂狗节奏，后者只能靠一次硬件复位清掉。',
    '同理 wdog3（WDOG3）在某些封装上还带“只复位 M4 还是全局复位”的选项（SCR[24]），复用到 i.MX6ULL 上要看具体实现。',
    '判据：写 0101 后读回应为 0101；写 0110 后读回应为 1010 —— 用这个“写错值自愈”的行为验证你确实写进了正确字段。']);
}

function drawMap() {
  txt(scene, 56, 146, '0x020D_8000 起只有十来个寄存器，但每一个都跨复位活着，是“重启后仍可读”的少数存储', 't24w');
  three([80, '控制与状态', ['+0x00 SCR：复位控制（复位 0x0521）', '+0x04 SBMR1：启动配置', '+0x08 SRSR：复位原因（复位 0x1）', '+0x14 SISR：中断状态', '+0x1C SBMR2：第二组启动配置', 'SBMR1/2 都只读'], 't20s'],
        [680, 'GPR1–10', ['+0x20 … +0x44，共 10 个', '全部 32 位读写', '跨复位保持内容', '常用来存“启动参数”', '或存“上次异常原因”', '等于 40 字节的钉子户'], 't20s'],
        [1280, 'SCR 复位值解码', ['0x0521 = 0000 0101 0010 0001', '[0]=1：WARM 复位已使能', '[5]=1：[6:5]=01，等 16 拍', '[10:7]=1010：看门狗不掩', '[31:28]=0：看门狗3 不掩', '其余位为 0']]);
  prose('GPR 是这块芯片上最实用的“跨复位便签”：没有后备电池也能在复位之间传话，写日志比它更慢', [
    '复位后想告诉 bootloader“上次是异常重启”，最省事的做法就是把标记写进 GPR，再在下一阶段读出来处理。',
    'GPR 只有 40 字节，别拿来存大块数据；它适合存魔数、版本号、重启计数与一两个地址指针。',
    '[0] warm_reset_enable 默认就是 1，这解释了很多板子“复位后 DDR 内容还在”的现象；想强制全清就用 POR 或 COLD。',
    'SBMR1 的复位值取决于启动脚与熔丝，所以“读出来是多少”就是“这块板实际怎么启动”的直接证据。',
    'GPR10[28] 是特殊开关：置 1 后 ROM 会把 GPR9 当作 SBMR1 用，于是软件可以临时改启动源（例如从 SD 卡切到 USB 下载）。',
    '判据：读 SCR 应为 0x0000_0521（未改动时）、SRSR 非 0、SBMR1 与板上拨码一致；三者都对，说明 SRC 处于正常状态。']);
}

function drawBoot() {
  txt(scene, 56, 146, '启动方式由两根专用脚加 32 位配置决定：先锁存，再由 ROM 按 SBMR 解码', 't24w');
  three([80, '两根模式脚', ['BOOT_MODE0 / BOOT_MODE1', '专用脚，不复用', '上电后由 SRC 锁存', '00/01/10/11 四种组合', '决定“从哪类介质启动”', '板上常用拨码或电阻选'], 't20s'],
        [680, '32 位配置', ['BOOT_CFG[31:0] 进 SBMR1', '其中 24 位来自 LCD_DATA00–23', 'ALT6 复用，仅上电时采样', '其余位来自熔丝或固定值', 'gpio_bt_sel 熔丝选来源', '置 1 用熔丝，清 0 用 GPIO'], 't20s'],
        [1280, '锁存时机', ['OCOTP 熔丝读完成才锁存', '之前脚上的电平必须稳定', '所以上电时序里不能抖', '锁存后脚可改作他用', 'GPR10[28]=1 可改启动源', '此时 ROM 用 GPR9 当 SBMR1']]);
  prose('板上最容易翻车的一点：LCD_DATA00–23 同时是 LCD 的数据线，上电时被当启动配置采样，之后才还给显示', [
    '这 24 根脚在复位期间是输入，采样完成后才切回 LCD 输出；因此外部电路在上面挂的负载不能把电平拉偏，否则启动介质会被“读错”。',
    '典型故障：LCD 排线插上后无法从 eMMC 启动 —— 因为排线把某几根配置脚拉低，ROM 以为要从别的介质启动。',
    'BOOT_MODE 两根专用脚没有复用问题，但它们是“边沿/电平在 POR 期间采样”，所以按键或跳线帽在复位瞬间必须接触良好。',
    'gpio_bt_sel 熔丝决定优先级：烧了就用熔丝值（量产常用，避免被人改拨码），没烧就用 GPIO（开发板常用，方便切换）。',
    '想在不改拨码的情况下改启动源做一次 USB 下载：置 GPR10[28]，把 GPR9 写成想要的 SBMR1 值，再触发复位 —— ROM 就会照 GPR9 走。',
    '判据：读 SBMR1 与板上拨码/熔丝预期比对；不一致时先怀疑采样时刻电平，而不是怀疑 ROM。']);
}

function drawBoard() {
  txt(scene, 56, 146, '这块板上 SRC 的三条现实路径：复位键、看门狗、PMIC 开关机；三者都会在 SRSR 留下不同记录', 't24w');
  three([80, '复位键', ['按键一般接 POR_B 或 PMIC', '走 POR 则 bit0 置位', '走 PMIC 则等同断电重上', '按键需硬件去抖', '长按 5 s 才判定关机', '短按只产生中断'], 't20w'],
        [680, '看门狗', ['WDOG1 超时 → bit4', 'WDOG3 超时 → bit7', '可被 SCR 掩掉', '掩掉后状态位仍留痕', '硬件复位才清', '量产别长期掩着'], 't20w'],
        [1280, '开关机链', ['SNVS 收按钮与关机请求', 'SRC 转成 PMIC_ON_REQ', '高/高阻 = 开，低 = 关', 'PMIC_STBY_REQ 控待机', '断电时 SNVS 域靠电池', '上电后 SRC 全片复位']]);
  prose('调试顺序建议固定下来：先读 SRSR 与 SCR，再读 SBMR1，最后才怀疑你的代码 —— 这三步能排掉一大半“玄学重启”', [
    '第一步 SRSR：区分上电、手动复位、看门狗、JTAG；不同原因对应的排查方向完全不同。',
    '第二步 SCR：确认 WARM 是否使能、看门狗是否被掩 —— 很多“复位后 DDR 数据错”与“死机不重启”都出在这两个位。',
    '第三步 SBMR1：确认启动介质与板上拨码一致；不一致就先解决采样电平问题，别去改代码。',
    '如果你在做低功耗：关机走 SNVS 的 TOP 位，SRC 只负责把请求转给 PMIC；唤醒则靠按钮或 RTC 闹钟，走的是另一条路径。',
    '量 PMIC_ON_REQ 时注意它是“高或高阻都算开”：万用表读到的中间电平可能就是外部上拉与内部驱动的分压，别误判。',
    '判据：手动复位、看门狗复位、断电重启各做一次，SRSR 值三次不同且与预期一致；此后任何异常重启都能一眼归类。']);
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawTop();
  else if (s === 1) drawTypes();
  else if (s === 2) drawSrsr();
  else if (s === 3) drawMask();
  else if (s === 4) drawMap();
  else if (s === 5) drawBoot();
  else drawBoard();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () { state.step = INIT.step; draw(); });
fitCanvas($('viewport'), $('canvas'), draw);
</script>
