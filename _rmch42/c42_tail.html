<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0 };
var state = { step: INIT.step };

var STEPS = [
  { h: '不是普通 SPI', hint: '四线 · XIP · 双沿',
    note: 'QuadSPI 不是把 SPI 时序交给软件，而是把 flash 挂进地址空间，让 CPU 直接读。' },
  { h: '两条通道', hint: 'IP 命令 / AHB 映射',
    note: '擦写走 IP 命令通道，执行代码与读数据走 AHB 映射；两条通道抢同一个序列引擎。' },
  { h: '寄存器地图', hint: '0x021E_0000',
    note: 'MCR 默认把模块关着（MDIS=1），不清零它，后面所有配置都写不进去。' },
  { h: 'LUT 序列引擎', hint: '64 个表项 · 16 条序列',
    note: '每条 flash 命令由一个 CMD 加若干操作数拼成，硬件照着表一条条发。' },
  { h: 'IP 命令怎么发', hint: 'IPCR · IDATSZ',
    note: '写 IPCR 的 SEQID 就等于扣扳机；之后全靠 SR 与 FR 判断成败。' },
  { h: 'AHB 读与预取', hint: 'BUF0–3CR · ADATSZ',
    note: '命中 AHB 缓冲就零等待，未命中就 stall 等 flash；顺序读才跑得满带宽。' },
  { h: 'DDR 采样与实战', hint: 'DQS · 擦写判据',
    note: '双沿能把带宽翻倍，代价是采样窗口更窄；本芯片不支持数据学习，只能靠 DQS。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}

function drawTop() {
  txt(scene, 56, 146, 'QuadSPI 把一片串行 NOR 变成「可执行、可映射的内存」：上电第一条指令就能从它取', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '和普通 SPI 的差别');
  txt(scene, 80, 252, '普通 SPI：软件逐字节拼时序', 't20w');
  txt(scene, 80, 288, 'QuadSPI：硬件序列引擎代发', 't20w');
  txt(scene, 80, 324, '普通 SPI：读一次要 CPU 搬', 't20w');
  txt(scene, 80, 360, 'QuadSPI：映射后 ldr 就是读', 't20w');
  txt(scene, 80, 396, '普通 SPI：单线，几十 Mbit/s', 't20w');
  txt(scene, 80, 432, 'QuadSPI：四线双沿，可到百 Mbit/s', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '硬件能力');
  txt(scene, 680, 252, '单线 / 双线 / 四线', 't20w');
  txt(scene, 680, 288, 'SDR 与 DDR（每边沿出数据）', 't20w');
  txt(scene, 680, 324, '3 字节 / 4 字节地址', 't20w');
  txt(scene, 680, 360, 'TX FIFO 512 B、RX 128 B', 't20w');
  txt(scene, 680, 396, '每 master 1 KB 的 AHB 缓冲', 't20w');
  txt(scene, 680, 432, '支持数据选通（DQS）采样', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '在这块板上的位置');
  txt(scene, 1280, 252, '控制器基址 0x021E_0000', 't20s');
  txt(scene, 1280, 288, '映射窗口 0x6000_0000 起', 't20s');
  txt(scene, 1280, 324, '每片最多 128 MB（27 位地址）', 't20w');
  txt(scene, 1280, 360, 'Linux 里叫 qspi@21e0000', 't20s');
  txt(scene, 1280, 396, '常挂 NOR，做启动介质或文件系统', 't20w');
  txt(scene, 1280, 432, '两片同型号可并行访问', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '为什么这章要单独讲：它是 i.MX6ULL 上唯一能把 flash 当内存读的接口', 't24');
  txt(scene, 80, 522, '这块芯片没有 DDR 之外的通用外部总线：NAND 要软件 ECC 与坏块管理，eMMC 走 uSDHC。QSPI 的特别之处是「地址映射」：flash 的字节出现在 0x6000_0000 起的地址上。', 't20w');
  txt(scene, 80, 556, '地址映射带来 XIP（就地执行）：uboot 与内核可以直接在 QSPI NOR 上跑，不需要先拷进 DDR。代价是 NOR 的读带宽只有几十 MB/s，所以运行时代码通常还是搬进 DDR。', 't20w');
  txt(scene, 80, 590, '四个引脚承载一切：SCLK、CS、以及 IO0–IO3。单线模式只用 IO0 出、IO1 入；四线模式四条双向，每个时钟沿搬 4 位，双沿就是 8 位。', 't20w');
  txt(scene, 80, 624, '一个容易忽略的点：这条总线上没有「设备地址」，只有片选。两片 flash 靠 CS0/CS1 区分，并行模式下两片各出半个字节拼成一个字节，所以两片必须同型号、同内容布局。', 't20w');
  txt(scene, 80, 658, '一句话：QuadSPI = 序列引擎 + 地址映射窗口 + 四线物理层，三件东西共用一套引脚。', 't20w');
}

function drawChannels() {
  txt(scene, 56, 146, '两条通道共用一个引擎：IP 命令负责「改 flash」，AHB 映射负责「读 flash」', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, 'IP 命令通道');
  txt(scene, 80, 252, '软件写寄存器触发', 't20w');
  txt(scene, 80, 288, '适合擦除、编程、读状态', 't20w');
  txt(scene, 80, 324, '数据经 TX / RX FIFO', 't20w');
  txt(scene, 80, 360, '一次最多 IDATSZ 字节', 't20w');
  txt(scene, 80, 396, 'SR[IP_ACC] 表示占用中', 't20s');
  txt(scene, 80, 432, '不会被 CPU 的 cache 干扰', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'AHB 映射通道');
  txt(scene, 680, 252, 'CPU 直接读 0x6000_0000', 't20s');
  txt(scene, 680, 288, '一次 32 位或 64 位', 't20w');
  txt(scene, 680, 324, '用于取指、读数据、XIP', 't20w');
  txt(scene, 680, 360, '自动触发 AHB 命令', 't20w');
  txt(scene, 680, 396, '命中缓冲则零等待', 't20w');
  txt(scene, 680, 432, '未命中则总线 stall', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '冲突与仲裁');
  txt(scene, 1280, 252, '同一时刻只有一条通道在用引脚', 't20w');
  txt(scene, 1280, 288, 'IP 命令进行中：SR[IP_ACC]=1', 't20s');
  txt(scene, 1280, 324, '此时 AHB 请求被挂起等授权', 't20w');
  txt(scene, 1280, 360, 'SR[AHBGNT] 表示已交给 AHB', 't20s');
  txt(scene, 1280, 396, '所以擦写时别在同一片 flash 上取指', 't20w');
  txt(scene, 1280, 432, '否则 CPU 会停住等擦除结束', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '两条通道的分工不是「新旧两种模式」，而是「写用 IP、读用 AHB」', 't24');
  txt(scene, 80, 522, '擦除和编程只能走 IP：因为 NOR 的写序列是「先发 WREN、再发命令加地址加数据、最后轮询状态」，这套带状态机的流程只有 IPCR 能触发。', 't20w');
  txt(scene, 80, 556, '读可以走 AHB：读是纯组合语义「给地址、取数据」，正好能映射成一次总线访问。CPU 的取指单元、DMA、甚至 memcpy 都会自动变成 AHB 命令。', 't20w');
  txt(scene, 80, 590, '共享引擎的代价是「互斥」：一次 IP 命令可能要几毫秒（扇区擦除），这期间 AHB 请求全被挡住。所以「从 QSPI 执行代码 + 在同一片 QSPI 上擦写」是自相矛盾的用法。', 't20w');
  txt(scene, 80, 624, '工程上的做法：擦写前把中断向量和执行代码搬到 OCRAM 或 DDR；或者用两片 flash，A 片跑代码、B 片存数据，靠不同片选错开。', 't20w');
  txt(scene, 80, 658, '判据：IP 命令前后读 SR，看 IP_ACC 是否从 1 回 0、FR 是否有 IP 命令错误位；有错先查 SFAR 与 LUT 序列。', 't20w');
}

function drawMap() {
  txt(scene, 56, 146, '寄存器分四段：控制与命令、AHB 缓冲配置、状态与中断、LUT 与锁', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '控制与命令');
  txt(scene, 80, 252, 'MCR +0x000 模块总控', 't20s');
  txt(scene, 80, 288, 'IPCR +0x008 触发 IP 命令', 't20s');
  txt(scene, 80, 324, 'FLSHCR +0x00C 片选与保持时序', 't20s');
  txt(scene, 80, 360, 'SFAR +0x100 flash 内地址', 't20s');
  txt(scene, 80, 396, 'TBDR 发送数据、RBDR 接收数据', 't20s');
  txt(scene, 80, 432, '以上都在 MDIS=0 后才可写', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'AHB 缓冲配置');
  txt(scene, 680, 252, 'BUF0CR–BUF3CR +0x010 起', 't20s');
  txt(scene, 680, 288, '给 4 个 AHB master 分缓冲', 't20w');
  txt(scene, 680, 324, 'BFGENCR +0x020 通用预取', 't20s');
  txt(scene, 680, 360, 'BUF0IND–BUF2IND +0x030 起', 't20s');
  txt(scene, 680, 396, '记录每个缓冲的顶部索引', 't20w');
  txt(scene, 680, 432, '缓冲共 4 KB，按需切分', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '状态、中断与 LUT');
  txt(scene, 1280, 252, 'SR +0x15C 忙、占用、FIFO 水位', 't20s');
  txt(scene, 1280, 288, 'FR +0x160 各类错误标志', 't20s');
  txt(scene, 1280, 324, 'RBCT +0x150 接收水位', 't20s');
  txt(scene, 1280, 360, 'RSER +0x164 中断使能', 't20s');
  txt(scene, 1280, 396, 'LUTKEY +0x300 写 0x5AF05AF0', 't20s');
  txt(scene, 1280, 432, 'LUT0–LUT63 +0x310 起', 't20s');

  wide(456, 330);
  txt(scene, 80, 490, 'MCR 的复位值是 0x000F_4000，其中 bit14（MDIS）为 1，也就是上电默认关模块', 't24');
  txt(scene, 80, 522, 'MCR 关键位：bit14 MDIS（0 才工作）、bit7 DDR_EN、bit6 DQS_EN、bit24 DQS_LOOPBACK_EN、bit30 DQS_PHASE_EN、bit11/bit10 清 TX/RX FIFO、bit1/bit0 两个软复位。', 't20w');
  txt(scene, 80, 556, '先把 MDIS 清零不只是「开时钟」：手册明确规定，部分配置寄存器只在 MDIS=1 时才能写。顺序是「保持 disable 配参数 → 清 MDIS 启动 → 用前再软复位」。', 't20w');
  txt(scene, 80, 590, 'SR 是只读的体检表：BUSY 序列在跑；IP_ACC 表示 IP 命令占用；AHB_ACC 表示 AHB 命令占用；AHBGNT 表示总线已交给 AHB；RXFULL/TXFULL 是溢出警告。', 't20w');
  txt(scene, 80, 624, 'FR 是可写的错误清除寄存器：写 1 清标志。常见位是 IP 命令错误、AHB 命令错误、接收溢出、发送下溢 —— 一旦置位，说明序列本身有问题，不是 flash 坏了。', 't20w');
  txt(scene, 80, 658, '判据：配置完读回 MCR 确认 MDIS=0，再读 FLSHCR 与 LUT 首项确认「写进去了」；读不回就是 MDIS 没清或 LUT 还锁着。', 't20w');
}

function drawLut() {
  txt(scene, 56, 146, 'LUT 是这张卡的核心：64 个 32 位表项，装 16 条序列，每条最多 8 个操作', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '表项怎么排');
  txt(scene, 80, 252, 'LUT0–LUT63，共 64 个', 't20s');
  txt(scene, 80, 288, '每 4 个构成一条序列', 't20w');
  txt(scene, 80, 324, '起始项：LUT0、4、8 … 60', 't20s');
  txt(scene, 80, 360, '每个表项装 2 条指令', 't20w');
  txt(scene, 80, 396, '一条序列最多 8 条指令', 't20w');
  txt(scene, 80, 432, '同时最多定义 16 条序列', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '一个表项的位域');
  txt(scene, 680, 252, 'INSTR1 [31:26] 指令码', 't20s');
  txt(scene, 680, 288, 'PAD1 [25:24] 线宽：1/2/4', 't20s');
  txt(scene, 680, 324, 'OPRND1 [23:16] 操作数', 't20s');
  txt(scene, 680, 360, 'INSTR0 [15:10] 低半条', 't20s');
  txt(scene, 680, 396, 'PAD0 [9:8]、OPRND0 [7:0]', 't20s');
  txt(scene, 680, 432, '高半条先执行，低半条后执行', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '读一条命令的拆法');
  txt(scene, 1280, 252, 'CMD 0x03：读，单线发', 't20s');
  txt(scene, 1280, 288, 'ADDR：24 位或 32 位', 't20s');
  txt(scene, 1280, 324, 'MODE：可选，给 flash 的模式字', 't20w');
  txt(scene, 1280, 360, 'DUMMY：空转周期，快读要 8 个', 't20w');
  txt(scene, 1280, 396, 'READ：四线收数据', 't20s');
  txt(scene, 1280, 432, 'STOP：结束，抬片选', 't20s');

  wide(456, 330);
  txt(scene, 80, 490, '序列不是「一条命令一个寄存器」，而是「一条命令一串微操作」，这是理解 QuadSPI 的钥匙', 't24');
  txt(scene, 80, 522, '串行 flash 的协议本质上是「按顺序说一串话」：先喊命令字，再说地址，可能还要等几个周期，最后才是数据。硬件把这串话拆成若干原子操作，LUT 就是台词本。', 't20w');
  txt(scene, 80, 556, 'OPRND 的语义由前一条指令决定：CMD 后是指令码、ADDR 后是地址位宽、DUMMY 后是空转周期、MODE 后是模式字节。同一个 8 位字段，含义完全不同。', 't20w');
  txt(scene, 80, 590, 'PAD 决定这条操作走几条线：命令与地址通常单线发（兼容性最好），数据段才切四线。四线发命令能提速，但要求 flash 支持 0xEB/0x6B 这类四线命令。', 't20w');
  txt(scene, 80, 624, 'LUT 是受保护的：先往 LUTKEY 写 0x5AF05AF0，紧接着写 LCKCR 才能解锁；锁定后写 LUT 无效但也不报错，表现为「命令发出去没反应」。', 't20w');
  txt(scene, 80, 658, '判据：配完 LUT 后读回首项，与写入值逐位比对；再用 ID 命令（0x9F）读 flash 的厂商与容量字节，与 datasheet 对上就说明整条链路通了。', 't20w');
}

function drawIp() {
  txt(scene, 56, 146, 'IP 命令的执行只有三个动作：写 SFAR、填 FIFO、写 IPCR 扣扳机', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, 'IPCR 的字段');
  txt(scene, 80, 252, 'SEQID [27:24] 用哪条序列', 't20s');
  txt(scene, 80, 288, '0–15 共 16 条', 't20w');
  txt(scene, 80, 324, 'PAR_EN [23] 并行双片使能', 't20s');
  txt(scene, 80, 360, 'IDATSZ [15:0] 数据字节数', 't20s');
  txt(scene, 80, 396, '写 SEQID 就是启动', 't20w');
  txt(scene, 80, 432, '写之前必须 SR[IP_ACC]=0', 't20s');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '数据怎么进出');
  txt(scene, 680, 252, '发送：写 TBDR，512 B FIFO', 't20s');
  txt(scene, 680, 288, '接收：读 RBDR，128 B 缓冲', 't20s');
  txt(scene, 680, 324, 'RBCT 设水位，够了就置 RXWE', 't20w');
  txt(scene, 680, 360, '读走一项靠写 FR[RBDF]=1', 't20s');
  txt(scene, 680, 396, 'RBSR[RDBFL] 看还剩几项', 't20s');
  txt(scene, 680, 432, '溢出会置 RXFULL 并丢数据', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '编程一条的最小流程');
  txt(scene, 1280, 252, '① 发 WREN，等 WEL=1', 't20w');
  txt(scene, 1280, 288, '② 填 SFAR 与 LUT 序列号', 't20w');
  txt(scene, 1280, 324, '③ 往 TBDR 写至少 4 字节', 't20w');
  txt(scene, 1280, 360, '④ 写 IPCR 启动编程', 't20w');
  txt(scene, 1280, 396, '⑤ 轮询 RDSR 直到 WIP=0', 't20w');
  txt(scene, 1280, 432, '⑥ 回读该页逐字节比对', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, 'IP 命令是「阻塞式」的：写 IPCR 之后那几毫秒（擦除甚至几百毫秒）由硬件自己熬', 't24');
  txt(scene, 80, 522, '所以软件只能轮询 SR：BUSY 为 1 就说明序列在跑，IP_ACC 为 1 说明这条通道被占。轮询期间 CPU 可以去干别的，但不要再去碰同一片 flash。', 't20w');
  txt(scene, 80, 556, 'IDATSZ 是这条命令要搬的字节数，不是 FIFO 深度：编程超过一页（常见 256 B）时，硬件会在页内自动推进地址，但跨页要软件自己拆成多条命令 —— 因为 NOR 的页编程不能跨页。', 't20w');
  txt(scene, 80, 590, '发送 FIFO 的坑：手册要求编程时至少先写 4 字节再触发，否则序列引擎可能拿不到操作数就启动，表现为「编程命令发出但 flash 没动」。', 't20w');
  txt(scene, 80, 624, '接收侧的坑：RX 只有 32 项 × 4 B = 128 B，且读走必须写 FR[RBDF] 手动弹出。IDATSZ 大于 128 时，要么中途及时读走，要么用 AHB 通道读。', 't20w');
  txt(scene, 80, 658, '判据：命令前后各读一次 SR；命令后看 FR 有没有 IP 错误；再看 flash 的 RDSR 里 WIP 与 E_FAIL，三者都干净才算成功。', 't20w');
}

function drawAhb() {
  txt(scene, 56, 146, 'AHB 映射读把「读 flash」伪装成「读内存」，代价是未命中时 CPU 会被 stall', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '窗口怎么分');
  txt(scene, 80, 252, '0x6000_0000 起，27 位地址', 't20s');
  txt(scene, 80, 288, '每片最大 128 MB', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '按 4 线 50 MHz 单沿算，理论带宽 25 MB/s；实际因为命令与地址要单线发，多在 15–20 MB/s', 't24');
  txt(scene, 80, 522, '账是这么算的：4 × 50 MHz × 1 bit = 200 Mbit/s = 25 MB/s。但每次读要先单线发命令与 24 位地址、再空转几拍，这段「无效时间」占比越高，有效带宽越低。', 't20w');
  txt(scene, 80, 556, '开 DDR 后同样 50 MHz 可在两个边沿各搬一次，理论翻倍到 50 MB/s，但采样窗口只剩半个周期，对走线与负载敏感 —— 这就是下一节 DQS 要解决的问题。', 't20w');
  txt(scene, 80, 590, '缓冲的意义在于「摊薄无效时间」：一次 AHB 命令不只取 4 字节，而是按 ADATSZ 一次搬一大块进缓冲，后续连续地址都命中，命令与地址的开销被摊到几十个字节上。', 't20w');

  txt(scene, 80, 658, '判据：用 memcpy 顺序读 1 MB 计时反推带宽；再随机读 64 B 计时对比 —— 两者差距就是「预取是否生效」的直接证据。', 't20w');
}

function drawDdr() {
  txt(scene, 56, 146, 'DDR 让带宽翻倍，也让采样窗口减半；DQS 是唯一可靠的采样参考', 't24w');

  txt(scene, 80, 324, 'MCR[7] DDR_EN 选模式', 't20s');
  txt(scene, 80, 360, '带宽翻倍，窗口减半', 't20w');
  txt(scene, 80, 396, 'flash 侧也要支持 DDR 读', 't20w');
  txt(scene, 80, 432, '常用 0xED / 0x0D 这类双沿命令', 't20s');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'DQS 采样');
  txt(scene, 680, 252, 'MCR[6] DQS_EN 开启', 't20s');
  txt(scene, 680, 288, 'flash 出 DQS，控制器用它采样', 't20w');
  txt(scene, 680, 324, 'MCR[24] 回环：DQS 从焊盘回来', 't20s');
  txt(scene, 680, 360, 'MCR[30] 相位：SDR 置 1、DDR 清 0', 't20s');
  txt(scene, 680, 396, '回环时该焊盘要强制为输入', 't20w');
  txt(scene, 680, 432, '否则两路输出打架', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '本芯片的短板');
  txt(scene, 1280, 252, 'DLPSMP：手册标注未实现', 't20s');
  txt(scene, 1280, 288, '没有数据学习，不能自动找窗口', 't20w');
  txt(scene, 1280, 324, '只能靠固定延迟或 DQS', 't20w');
  txt(scene, 1280, 360, '换板、换 flash 要重测延迟', 't20w');
  txt(scene, 1280, 396, '四线要等长，SCLK 要短', 't20w');
  txt(scene, 1280, 432, '串阻与负载都会推迟边沿', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '固定延迟采样的调法：写一组不同延迟配置，逐个做「读一片并比对」，全对的那个延迟就是可用窗口', 't24');
  txt(scene, 80, 522, '做法很土但有效：把 1 MB 已知内容写进 flash，配上延迟值 N，读回来逐字节比对；N 从 0 加到上限，记录哪些 N 全对、哪些开始出错，窗口的中点最稳。', 't20w');
  txt(scene, 80, 556, '这个窗口会随温度与电压移动：常温调的延迟到了 -20 ℃ 或 85 ℃ 可能就出界。所以量产板要在高低温各测一遍，取三者交集，或者直接用 DQS 采样把窗口交给 flash。', 't20w');
  txt(scene, 80, 590, '板级约束比寄存器重要：SCLK 到每片 flash 的走线要等长，IO0–IO3 与 DQS 也要等长；串阻太大会把边沿磨圆，四线同时翻转时的地弹会让采样点抖动。', 't20w');
  txt(scene, 80, 624, 'DDR 模式还要注意地址对齐：AHB 64 位读时，低 32 位是偶数项、高 32 位是奇数项；并行双片时两片各出半个字节，字节序必须按手册组装，弄反了就是「数据能读但全错位」。', 't20w');
  txt(scene, 80, 658, '判据：先用 ID 命令确认通信正常，再跑 1 MB 比对确认延迟窗口，最后做 -20/25/85 ℃ 三点复测；三点都过才算这颗 flash 调好了。', 't20w');
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawTop();
  else if (s === 1) drawChannels();
  else if (s === 2) drawMap();
  else if (s === 3) drawLut();
  else if (s === 4) drawIp();
  else if (s === 5) drawAhb();
  else drawDdr();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () { state.step = INIT.step; draw(); });
fitCanvas($('viewport'), $('canvas'), draw);
</script>
