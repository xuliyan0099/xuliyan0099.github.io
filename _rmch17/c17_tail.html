<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0, lane: 0 };
var state = { step: INIT.step, lane: INIT.lane };

var STEPS = [
  { h: 'NAND 的纠错引擎', hint: '2–40 bit · GF(8192)',
    note: 'NAND 便宜但会翻位，出厂就有坏块、用久了更会。BCH 就是给它兜底的那颗硬件：每块数据算出 t*13 位的校验一起写进 spare 区，读回来先算 syndrome，有错就定位、翻转、修正，全程不用 CPU。' },
  { h: '页布局：四个 layout', hint: 'DATA0 / META / NBLOCKS',
    note: '一颗 NAND 的页怎么切块、每块纠几位、metadata 单独保护还是并进第一块，全部由四个 layout 寄存器描述；片选号通过 LAYOUTSELECT 索引到某一套布局。复位值本身就是一张 4K+218 的可用布局。' },
  { h: '寄存器只有二十个', hint: '0x00 … 0xF0',
    note: 'CTRL 管复位、时钟、中断与内存到内存模式；STATUS0 报结果；MODE 管空白页判据；三个指针给内存到内存用；LAYOUTSELECT 与四对 LAYOUT 寄存器描述页格式。全部 32 位，SET/CLR/TOG 三个别名跟在主寄存器后面。' },
  { h: '不接 NAND 也能练', hint: '内存到内存 + 环路',
    note: 'BCH 有 memory-to-memory 模式：给三个指针、选布局、写 M2M_ENABLE，它就在 DDR 里做一次编码或解码，完全不碰 GPMI。造几个错位再解码，就能把纠错链路整个跑通——这是这块板子上最实际的练法。' },
  { h: '结果怎么读', hint: 'STATUS0 · STATUS1 · IRQ',
    note: '一次操作完成后先读 STATUS0/1 再清中断位：STATUS_BLK0 给出第一块的错误数（0xFE 不可纠、0xFF 空白页），COMPLETED_CE 告诉你是哪个片选，CORRECTED/UNCORRECTABLE 是两个总标志。清早了，后续完成会被挂住。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }

function drawWhat() {
  txt(scene, 56, 146, 'NAND 天生会坏，BCH 把「坏」变成「可修」—— 每次读写都在它身上过一遍', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '为什么非要它');
  txt(scene, 80, 252, 'NAND 出厂有坏块，擦写会累积翻位', 't20w');
  txt(scene, 80, 288, '不纠错就得用更贵的颗粒或更小容量', 't20w');
  txt(scene, 80, 324, '块 ≤ 约 1900 B，典型 512 / 1024', 't20w');
  txt(scene, 80, 360, '纠 2–40 位，ECC0 是直通不纠', 't20w');
  txt(scene, 80, 396, '校验位 = t × 13（或 t × 14）bit', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '它到底在算什么');
  txt(scene, 680, 252, 'GF(2^13 = 8192) 或 GF(2^14)', 't20w');
  txt(scene, 680, 288, '编码：数据除生成多项式，余数即校验', 't20w');
  txt(scene, 680, 324, '解码四段：syndrome → KES → Chien → 修正', 't20w');
  txt(scene, 680, 360, 'KES 解 2t 个方程，得错误位置多项式', 't20w');
  txt(scene, 680, 396, 'Chien 逐个试根，找到位置就翻那一位', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '性能账：它是瓶颈');
  txt(scene, 1280, 252, 'BCH 吞吐约 7/4 周期/字节', 't20w');
  txt(scene, 1280, 288, 'GPMI 读约 1/2 周期/字节', 't20w');
  txt(scene, 1280, 324, '所以一页读完，时间多半花在纠错', 't20w');
  txt(scene, 1280, 360, '两者时钟不同源，可各自调频去匹配', 't20w');
  txt(scene, 1280, 396, 'CPU 不参与算校验、查错、改错', 't20w');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, '写和读的分工，一句话说清');
  txt(scene, 80, 522, '写：GPMI 发命令，BCH 一边把数据送给 GPMI，一边算校验，块尾自动把校验塞进数据流——GPMI 看到的是连续字节流。', 't20w');
  txt(scene, 80, 556, '读：GPMI 收到的数据全部先写进系统内存，BCH 同时算 syndrome；发现错误就在内存里做 read-modify-write，把位翻回来。', 't20w');
  txt(scene, 80, 590, '所以内存里的 buffer 是「先脏后修」的：中断来之前别去读那页数据，可能还是错的。', 't20w');
  txt(scene, 80, 624, '流水线是块级并行的：块 0 在算 KES，块 1 还在搬，块 2 已在算 syndrome —— 图 17-2 画的就是这个错位。', 't20w');
  txt(scene, 80, 658, '限制记三条：块大小必须是 4 字节的整数倍且内存对齐；不支持部分页写；读只能整页或只读第一块。', 't20w');
  txt(scene, 80, 692, 'metadata 放在页首，0–255 字节，可以并进第一块共用校验，也可以 DATA0_SIZE=0 让它单独有一套校验。', 't20w');
  txt(scene, 80, 726, '它和第 15 章的 APBH 是一伙的：GPMI 与 BCH 都挂在那条 APBH 总线上，数据流不经过 AIPS。', 't20w');
  txt(scene, 80, 760, '所以「NAND 慢」通常是三个数叠出来的：颗粒本身、GPMI 搬运、BCH 纠错——先把这三个分开量。', 't20w');
}

function drawLayout() {
  txt(scene, 56, 146, '页怎么切、每块纠几位，全写在 layout 寄存器里；四套布局由片选号选', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '一套布局七个参数');
  txt(scene, 80, 252, 'META_SIZE：页首 metadata 字节数 0–255', 't20w');
  txt(scene, 80, 288, 'DATA0_SIZE：第一块数据字节数（4 倍数字段）', 't20w');
  txt(scene, 80, 324, 'ECC0：第一块的纠错级别', 't20w');
  txt(scene, 80, 360, 'NBLOCKS：后续块个数', 't20w');
  txt(scene, 80, 396, 'DATAN_SIZE / ECCN：后续块的大小与级别', 't20w');
  txt(scene, 80, 432, 'GF0 / GFN：用 GF(8192) 还是 GF(16384)', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '复位值就是一张现成布局');
  txt(scene, 680, 252, 'LAYOUT0 = 0x070A_4080', 't20w');
  txt(scene, 680, 288, 'NBLOCKS=7、META=0x0A、ECC0=16', 't20w');
  txt(scene, 680, 324, 'DATA0_SIZE=0x80 即 512 字节', 't20w');
  txt(scene, 680, 360, 'LAYOUT1 = 0x10DA_4080', 't20w');
  txt(scene, 680, 396, 'PAGE_SIZE=0x10DA=4314=4096+218', 't20w');
  txt(scene, 680, 432, 'DATAN_SIZE=0x80、ECCN=16、GF(2^13)', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '4K+218 的预算怎么算');
  txt(scene, 1280, 252, '(218 − 10) × 8 = 1664 bit 可用校验', 't20w');
  txt(scene, 1280, 288, '1664 / 13 / 8 ≈ 16 → 上限 ECC16', 't20w');
  txt(scene, 1280, 324, '但 metadata 也得有校验', 't20w');
  txt(scene, 1280, 360, '取 ECC14：1664 − 14×13×8 = 208 bit', 't20w');
  txt(scene, 1280, 396, '208 / 13 = 16 → metadata 也给 ECC16', 't20w');
  txt(scene, 1280, 432, '写进去 14 还是 16，差的是整数倍', 't20w');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, '几个只能踩一次才知道的细节');
  txt(scene, 80, 522, 'DATA0_SIZE / DATAN_SIZE 在寄存器里是「4 字节字数」：512 字节写 0x80，1024 字节写 0x100，不是 0x200。', 't20w');
  txt(scene, 80, 556, 'PAGE_SIZE 才是字节数：4K+218 就是 4314 = 0x10DA；4K+128 是 4224 = 0x1080。', 't20w');
  txt(scene, 80, 590, 'GF13_0_GF14_1 是 1 位选择：0 用 GF(8192)（校验 t×13），1 用 GF(16384)（校验 t×14）。', 't20w');
  txt(scene, 80, 624, 'metadata 并进第一块时，第一块的 ECC 要同时覆盖「metadata + DATA0」；分开保护就写 DATA0_SIZE=0。', 't20w');
  txt(scene, 80, 658, '四套布局对应四颗不同的 NAND；LAYOUTSELECT 每 2 位对应一个片选，复位 0xE4E4_E4E4 是「每片选对应 0/1/2/3 轮转」。', 't20w');
  txt(scene, 80, 692, '换颗粒必须重算布局：ECC 写大了装不进 spare，写小了纠不动；两种都表现为「用一段时间后大量不可纠」。', 't20w');
  txt(scene, 80, 726, '校验位不够时硬件会用 0 补齐（手册 17.2.3.2 的例子）：不是错，但意味着 spare 有余量不等于纠错更强。', 't20w');
  txt(scene, 80, 760, '记忆点：页布局是「预算问题」——先算 spare 位，再定 ECC 级别，最后才写寄存器。', 't20w');
}

function drawRegs() {
  txt(scene, 56, 146, 'BCH 只有二十个寄存器，地址从 0x0180_8000 起，SET/CLR/TOG 别名跟在主寄存器后', 't24w');

  var ROWS = [
    ['CTRL', '0x00', '0xC000_0000', 'bit31 SFTRST、bit30 CLKGATE 复位为 1；bit0 COMPLETE_IRQ 写 1 清'],
    ['STATUS0', '0x10', '0x0000_0010', 'HANDLE / COMPLETED_CE / STATUS_BLK0 / CORRECTED / UNCORRECTABLE'],
    ['MODE', '0x20', '0x0000_0000', 'ERASE_THRESHOLD：空白页判据，SLC 写 0，MLC 才需要放宽'],
    ['ENCODEPTR', '0x30', '0x0000_0000', '内存到内存：编码结果（校验）放哪'],
    ['DATAPTR', '0x40', '0x0000_0000', '内存到内存：数据 buffer 地址'],
    ['METAPTR', '0x50', '0x0000_0000', '内存到内存：metadata buffer 地址'],
    ['LAYOUTSELECT', '0x70', '0xE4E4_E4E4', '每 2 位一个片选，指向四套 layout 之一'],
    ['FLASH0LAYOUT0', '0x80', '0x070A_4080', '第一块参数：NBLOCKS / META_SIZE / ECC0 / DATA0_SIZE'],
    ['FLASH0LAYOUT1', '0x90', '0x10DA_4080', '后续块与整页：PAGE_SIZE / ECCN / DATAN_SIZE / GF'],
    ['FLASH1..3', '0xA0–0xF0', '同上', '另外三颗闪存的同构布局，用不到就保持复位值']
  ];
  ROWS.forEach(function (r, i) {
    var y = 184 + i * 44;
    box(56, y, 300, 40, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 76, y + 28, r[0], 't24');
    box(366, y, 170, 40, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 386, y + 28, r[1], 't20w');
    box(546, y, 210, 40, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 566, y + 28, r[2], 't20w');
    box(766, y, 1102, 40, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 786, y + 28, r[3], 't20w');
  });

  box(56, 646, 1812, 146, 'var(--surface)', 'var(--guide)');
  head(80, 682, '别名怎么用');
  txt(scene, 80, 716, '主寄存器 +0x00，SET +0x04，CLR +0x08，TOG +0x0C：写 CLR 地址的某位即清那一位，省掉读改写。', 't20w');
  txt(scene, 80, 750, '所以「清 SFTRST 与 CLKGATE」只要往 CTRL_CLR 写 0xC000_0000 一次，不用先读再算。', 't20w');
  txt(scene, 80, 782, '注意这种别名是硬件实现的原子操作，比自己 read-modify-write 安全，中断里尤其有用。', 't20w');
}

function drawM2M() {
  txt(scene, 56, 146, '不接 NAND：把 BCH 当一台 ECC 计算器，在 DDR 里编码、解码、造错、纠正', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '五步跑通环路');
  txt(scene, 80, 252, '① 清 CTRL 的 SFTRST 与 CLKGATE', 't20w');
  txt(scene, 80, 288, '② 写 DATAPTR / METAPTR / ENCODEPTR', 't20w');
  txt(scene, 80, 324, '③ 选 M2M_LAYOUT（用哪套布局）', 't20w');
  txt(scene, 80, 360, '④ M2M_ENCODE=1 编码，=0 解码', 't20w');
  txt(scene, 80, 396, '⑤ 写 M2M_ENABLE=1 才开始干活', 't20w');
  txt(scene, 80, 432, '执行中不能有 GPMI 事务在跑', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '编码得到什么');
  txt(scene, 680, 252, 'DATAPTR 里的数据按块切', 't20w');
  txt(scene, 680, 288, '每块算出 t×13 位校验', 't20w');
  txt(scene, 680, 324, '写进 METAPTR / ENCODEPTR 区域', 't20w');
  txt(scene, 680, 360, '布局里 NBLOCKS / SIZE 决定切几块', 't20w');
  txt(scene, 680, 396, '同样参数解码时必须一致', 't20w');
  txt(scene, 680, 432, '编码级别 ≠ 解码级别 → 结果必错', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '怎么造一个错来验证');
  txt(scene, 1280, 252, '编码 → 把数据 buffer 某字节改一位', 't20w');
  txt(scene, 1280, 288, '再跑解码，STATUS_BLK0 应报 1', 't20w');
  txt(scene, 1280, 324, '读回数据，被翻的那一位应复原', 't20w');
  txt(scene, 1280, 360, '改 t+1 位 → UNCORRECTABLE 置位', 't20w');
  txt(scene, 1280, 396, '全 0xFF → STATUS_BLK0=0xFF 空白页', 't20w');
  txt(scene, 1280, 432, '这就是最省钱的一次「真机验证」', 't20w');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, '三条容易撞的墙');
  txt(scene, 80, 522, '墙一：缓冲区必须 4 字节对齐、大小是 4 的倍数；不对齐时硬件不报错，只是结果对不上。', 't20w');
  txt(scene, 80, 556, '墙二：M2M 与 GPMI 事务互斥。写 M2M_ENABLE 前确认没有正在跑的 NAND 操作，否则两边一起错。', 't20w');
  txt(scene, 80, 590, '墙三：解码用的布局必须与编码时完全相同（块大小、ECC 级别、GF、metadata 处理方式四项全同）。', 't20w');
  txt(scene, 80, 624, '验证顺序：先编码、记下校验、立刻解码（应 0 错），再人为翻一位（应 1 错），最后翻 t+1 位（应不可纠）。', 't20w');
  txt(scene, 80, 658, '跑通这套，你就同时验证了布局寄存器、ECC 级别、指针与状态读取四件事，比接 NAND 省事得多。', 't20w');
  txt(scene, 80, 692, '顺带一个观察：M2M 模式让 BCH 变成通用 ECC 引擎，理论上也能给别的存储介质做校验。', 't20w');
  txt(scene, 80, 726, '但它不算 CRC，也不算哈希：BCH 只纠位翻转，不保证「内容没被替换」。', 't20w');
  txt(scene, 80, 760, '所以安全启动那套用的是 HAB 的签名，不是 BCH —— 别把「纠错」当成「防篡改」。', 't20w');
}

function drawVerify() {
  txt(scene, 56, 146, '一次操作的结果全在 STATUS0/1 里；先读结果，再清中断，顺序反了会卡住流水', 't24w');

  box(56, 176, 560, 236, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '① 块级错误数');
  txt(scene, 80, 252, 'STATUS_BLK0[15:8]：第一块错几位', 't20w');
  txt(scene, 80, 288, '0x00 无错、0x01…0x28 可纠', 't20w');
  txt(scene, 80, 324, '0xFE 不可纠、0xFF 空白页', 't20w');
  txt(scene, 80, 360, '后续块在 STATUS1 对应字段', 't20w');
  txt(scene, 80, 396, '这一栏就是「这页还能不能用」的判据', 't20w');

  box(656, 176, 560, 236, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '② 两个总标志');
  txt(scene, 680, 252, 'CORRECTED=1：至少纠了一位', 't20w');
  txt(scene, 680, 288, 'UNCORRECTABLE=1：这页废了', 't20w');
  txt(scene, 680, 324, 'ALLONES=1：整笔数据全是 1', 't20w');
  txt(scene, 680, 360, 'COMPLETED_CE：哪个片选的结果', 't20w');
  txt(scene, 680, 396, 'HANDLE：GPMI 传下来的 12 位标识', 't20w');

  box(1256, 176, 612, 236, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '③ 中断与错误');
  txt(scene, 1280, 252, 'COMPLETE_IRQ(bit0)：完成；写 1 清', 't20w');
  txt(scene, 1280, 288, '清之前必须先读 STATUS0/1', 't20w');
  txt(scene, 1280, 324, '否则后续完成会被一直挂住', 't20w');
  txt(scene, 1280, 360, 'BM_ERROR_IRQ(bit3)：AXI 地址非法', 't20w');
  txt(scene, 1280, 396, '多半是指针没对齐或指到了空洞', 't20w');

  box(56, 432, 1812, 360, 'var(--surface)', 'var(--guide)');
  head(80, 470, '板级真相与最小验证');
  txt(scene, 80, 508, '读 0x0180_8000 应为 0xC000_0000（还在复位里）；清 SFTRST/CLKGATE 后应读回 0x0000_0000。', 't20w');
  txt(scene, 80, 542, '读 0x0180_8080 = 0x070A_4080、0x0180_8090 = 0x10DA_4080 —— 这两个值就是「4K+218 页」的现成布局。', 't20w');
  txt(scene, 80, 576, '读 0x0180_8070 = 0xE4E4_E4E4：每 2 位片选轮转指向四套布局，改它之前先想清楚哪颗片选对应哪套。', 't20w');
  txt(scene, 80, 610, '核心板上 eMMC（U3）走 SD2，NAND 位是 48-pin TSOP（U4）：出厂若走 eMMC，BCH 在系统里没有用户。', 't20w');
  txt(scene, 80, 644, '所以这块板上最靠谱的练习就是 M2M 环路：不依赖颗粒，只依赖 DDR 和寄存器。', 't20w');
  txt(scene, 80, 678, '最小验证脚本四行：清复位 → 编码 → 翻一位 → 解码，看 STATUS_BLK0 从 0 变 1、数据被修回。', 't20w');
  txt(scene, 80, 712, 'Linux 侧：有 NAND 时 dmesg 会打 gpmi/bch 的 ECC 强度；无 NAND 时这条链路完全静默。', 't20w');
  txt(scene, 80, 746, '排查顺序：CTRL 复位位 → 布局寄存器读回 → STATUS0 错误数 → BM_ERROR_IRQ（指针问题）。', 't20w');
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawWhat();
  else if (s === 1) drawLayout();
  else if (s === 2) drawRegs();
  else if (s === 3) drawM2M();
  else drawVerify();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () {
  state.step = INIT.step; state.lane = INIT.lane; draw();
});
fitCanvas($('viewport'), $('canvas'), draw);
</script>
</body>
