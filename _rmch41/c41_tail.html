<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }

.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0 };
var state = { step: INIT.step };

var STEPS = [
  { h: '三级流水线', hint: 'PS + AS + OUT',
    note: 'PS 取源图并缩放，AS 提供叠加层，OUT 负责输出格式与抖动。' },
  { h: '数据怎么流', hint: '缩放 → 合成 → 旋转',
    note: '合成必须在 RGB 空间做，所以 YUV 源要先过 CSC1，再回 YUV 只需 CSC2。' },
  { h: '寄存器地图', hint: '0x021C_C000',
    note: '低段是控制与坐标，0x0B0 起是 PS，0x150 起是 AS，0x1A0 起是色彩矩阵。' },
  { h: '缩放：先抽点再插值', hint: '1/8 × 2 = 16 倍',
    note: '抽点负责大比例缩小，双线性负责最后 2 倍；PS_SCALE 是 4.12 定点数。' },
  { h: '叠加与 alpha', hint: 'AS_CTRL · 色键',
    note: 'AS 只支持 RGB；alpha 可来自像素、可固定、可相乘，还能用色键抠图。' },
  { h: '色彩空间与 LUT', hint: 'CSC1 / CSC2 · 256 项',
    note: '两组矩阵：一组为合成服务、一组为输出服务；LUT 用来做 gamma 或调色。' },
  { h: '完整配置与判据', hint: '一次搬运 · 双缓冲',
    note: '摄像头 YUV → 旋转缩放 → LCD RGB 的寄存器顺序，以及怎么验证它真的在跑。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}

function drawTop() {
  txt(scene, 56, 146, 'PXP 是一块「像素流水线」：一次配置、一次搬运，就把源图变成缩放旋转后的目标图', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '三级引擎');
  txt(scene, 80, 252, 'PS：处理面（源图）', 't20w');
  txt(scene, 80, 288, '缩放 + 色彩转换', 't20w');
  txt(scene, 80, 324, 'AS：透明面（叠加层）', 't20w');
  txt(scene, 80, 360, '只支持 RGB，带 alpha/色键', 't20w');
  txt(scene, 80, 396, 'OUT：输出面', 't20w');
  txt(scene, 80, 432, '格式、抖动、坐标窗口', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '能力清单');
  txt(scene, 680, 252, '缩放最大 16 倍缩小', 't20w');
  txt(scene, 680, 288, '旋转 90 / 180 / 270', 't20w');
  txt(scene, 680, 324, 'YUV 422/420/444 输入', 't20w');
  txt(scene, 680, 360, 'RGB565/888/ARGB 输出', 't20w');
  txt(scene, 680, 396, '256 项 LUT 调色', 't20w');
  txt(scene, 680, 432, '有序抖动到 RGBW4444CFA', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '它解决什么');
  txt(scene, 1280, 252, 'CPU 拷贝一帧 800×480 要几十毫秒', 't20w');
  txt(scene, 1280, 288, 'PXP 一遍搬完不占核', 't20w');
  txt(scene, 1280, 324, '摄像头预览、UI 合成、旋转显示', 't20w');
  txt(scene, 1280, 360, '没有 GPU 的芯片靠它做 2D', 't20w');
  txt(scene, 1280, 396, '代价：只能做「一层叠加」', 't20w');
  txt(scene, 1280, 432, '多图层要靠 CPU 或多次搬运', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, 'PXP 的定位很明确：两路输入（PS + AS）、一路输出，别把它当成 GPU', 't24');
  txt(scene, 80, 522, 'i.MX6ULL 没有 3D，也没有通用 2D 加速器；PXP 就是那颗「能缩放、能旋转、能贴一层图」的固定功能引擎。做 UI 时它的角色是「把摄像头画面塞进屏幕」，而不是画界面。', 't20w');
  txt(scene, 80, 556, '它最有价值的三个动作：摄像头 YUV 转 RGB（省掉软件色彩转换）、按屏幕分辨率缩放（省掉软件采样）、把 OSD 文字/图标叠上去（省掉软件 alpha 混合）。', 't20w');
  txt(scene, 80, 590, '反过来，一旦你要「三层以上叠加」「任意形状裁剪」「逐像素特效」，PXP 就做不了 —— 它的 alpha 引擎只有一个 AS 层，这是硬件限制。', 't20w');
  txt(scene, 80, 624, '基址 0x021C_C000，占 16 KB；和 eLCDIF（0x021C_8000）是邻居，两者常配合：PXP 写帧缓冲，eLCDIF 扫描出去。', 't20w');
  txt(scene, 80, 658, '一句话：PXP = 缩放器 + 色彩转换 + 单层叠加 + 旋转，一次启动把一串寄存器变成一个动作。', 't20w');
}

function drawFlow() {
  txt(scene, 56, 146, '数据流是单向的：PS 缩放 → CSC1 转 RGB → 与 AS 合成 → 旋转 → CSC2 → 输出', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, 'YUV 源的标准路径');
  txt(scene, 80, 252, 'PS 取 YUV 422/420', 't20w');
  txt(scene, 80, 288, '缩放引擎先缩', 't20w');
  txt(scene, 80, 324, 'CSC1 转 RGB888', 't20w');
  txt(scene, 80, 360, '与 AS 做 alpha 混合', 't20w');
  txt(scene, 80, 396, '旋转引擎转', 't20w');
  txt(scene, 80, 432, 'CSC2 转回目标空间', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '纯 RGB 路径');
  txt(scene, 680, 252, 'CSC1 可旁路', 't20w');
  txt(scene, 680, 288, 'CSC2 也可旁路', 't20w');
  txt(scene, 680, 324, '没有 AS 时全程 RGB', 't20w');
  txt(scene, 680, 360, '缩放与旋转照做', 't20w');
  txt(scene, 680, 396, 'LUT 可选', 't20w');
  txt(scene, 680, 432, '最快的一条路径', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '硬约束');
  txt(scene, 1280, 252, 'AS 只支持 RGB', 't20w');
  txt(scene, 1280, 288, 'YUV 与 AS 混合必须先转 RGB', 't20w');
  txt(scene, 1280, 324, '合成只在 RGB 空间成立', 't20w');
  txt(scene, 1280, 360, '转回 YUV 由 CSC2 做', 't20w');
  txt(scene, 1280, 396, '两个旋转引擎：全流水或只转 PS', 't20w');
  txt(scene, 1280, 432, '只转 PS 时 AS 不跟着转', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '流水线的顺序是固定的，软件只能在每一级选「开/关/参数」，不能改接线', 't24');
  txt(scene, 80, 522, '这就是为什么寄存器要按「PS → CSC1 → AS → 旋转 → CSC2 → OUT」的顺序配：任何一级的参数都作用在它下游，配早配晚都会让某一级用旧值跑。', 't20w');
  txt(scene, 80, 556, '两级 CSC 的分工：CSC1 是「为了合成」——所有混合都在 RGB 里做；CSC2 是「为了输出」——显示器/编码器要什么就给什么。如果最终就是 RGB 屏，CSC2 可以旁路。', 't20w');
  txt(scene, 80, 590, '旋转引擎的位置在合成之后：这意味着「只转 PS」模式下，AS 层保持不转，贴合的坐标要自己算 —— 常见于「摄像头画面旋转、UI 图标不转」的场景。', 't20w');
  txt(scene, 80, 624, '缩放位置在 CSC1 之前：所以缩放是在 YUV 域做的，色度子采样会先被处理；这也解释了为什么 YUV 缩放的边缘会比 RGB 缩放略「软」。', 't20w');
  txt(scene, 80, 658, '判据：配完后读 CTRL 位确认各引擎使能，再等 STAT 的完成位；如果输出是黑屏，先查「PS 的像素格式与实际缓冲格式是否一致」。', 't20w');
}

function drawMap() {
  txt(scene, 56, 146, 'PXP 的寄存器按功能分段：0x000 全局、0x020 输出、0x0B0 处理面、0x150 叠加面', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '全局与输出');
  txt(scene, 80, 252, 'CTRL +0x000 复位 C701_0000', 't20s');
  txt(scene, 80, 288, 'STAT +0x010 完成/中断', 't20s');
  txt(scene, 80, 324, 'OUT_CTRL +0x020 格式/抖动', 't20s');
  txt(scene, 80, 360, 'OUT_BUF +0x030 目标地址', 't20s');
  txt(scene, 80, 396, 'OUT_PITCH +0x050 行跨度', 't20s');
  txt(scene, 80, 432, 'OUT_LRC +0x060 输出尺寸', 't20s');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '处理面 PS');
  txt(scene, 680, 252, 'PS_CTRL +0x0B0 格式', 't20s');
  txt(scene, 680, 288, 'PS_BUF +0x0C0 Y/RGB 地址', 't20s');
  txt(scene, 680, 324, 'PS_UBUF/VBUF +0xD0/E0', 't20s');
  txt(scene, 680, 360, 'PS_PITCH +0x0F0', 't20s');
  txt(scene, 680, 396, 'PS_SCALE +0x110 复位 1000_1000', 't20s');
  txt(scene, 680, 432, 'PS_OFFSET +0x120', 't20s');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '叠加与色彩');
  txt(scene, 1280, 252, 'AS_CTRL +0x150 alpha 模式', 't20s');
  txt(scene, 1280, 288, 'AS_BUF +0x160 / AS_PITCH +0x170', 't20s');
  txt(scene, 1280, 324, 'CSC1_COEF +0x1A0/1B0/1C0', 't20s');
  txt(scene, 1280, 360, 'CSC2_CTRL +0x1D0 起六系数', 't20s');
  txt(scene, 1280, 396, 'LUT_CTRL +0x240、LUT_ADDR +0x250', 't20s');
  txt(scene, 1280, 432, 'ALPHA_A_CTRL +0x290', 't20s');

  wide(456, 330);
  txt(scene, 80, 490, '坐标寄存器是「窗口」不是「位置」：ULC/LRC 决定处理哪一块，输出尺寸由 OUT_LRC 决定', 't24');
  txt(scene, 80, 522, 'OUT_PS_ULC/LRC（0x070/0x080）圈定源图要处理的那块；OUT_AS_ULC/LRC（0x090/0x0A0）圈定叠加层贴到屏幕的哪块。', 't20w');
  txt(scene, 80, 556, 'PITCH 是行跨度而不是宽度：它等于「一行占多少字节」。屏幕宽度不是 32 字节对齐时，PITCH 必须比 width×bpp 大，否则每一行都会错位。', 't20w');
  txt(scene, 80, 624, 'CTRL 复位 0xC701_0000 很值得读：高位的默认值说明「上电时某些通路已被使能/旁路」，改之前先读出来，只动你要动的位 —— 这也是 PXP 提供 SET/CLR/TOG 三套地址的原因。', 't20w');
  txt(scene, 80, 658, '核对：读 PS_CTRL/OUT_CTRL 的格式位是否等于你实际填的缓冲格式；这是「颜色不对」的第一嫌疑人。', 't20w');
}

function drawScale() {
  txt(scene, 56, 146, '缩放是两级串联：先整数抽点（最多 1/8），再双线性插值（最多 2 倍），合起来 16 倍', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '两级');
  txt(scene, 80, 252, '第一级：decimation 抽点', 't20w');
  txt(scene, 80, 288, '整数比例，最大 1/8', 't20w');
  txt(scene, 80, 324, '第二级：bilinear 插值', 't20w');
  txt(scene, 80, 360, '最大 2 倍（放大或缩小）', 't20w');
  txt(scene, 80, 396, '两级独立编程', 't20w');
  txt(scene, 80, 432, '合计最大 16 倍缩小', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '定点格式');
  txt(scene, 680, 252, 'PS_SCALE 复位 1000_1000', 't20s');
  txt(scene, 680, 288, '高 16 位：Y 比例', 't20w');
  txt(scene, 680, 324, '低 16 位：X 比例', 't20w');
  txt(scene, 680, 360, '4.12 定点：0x1000 = 1.0', 't20w');
  txt(scene, 680, 396, '0x0800 = 0.5（放大 2 倍）', 't20w');
  txt(scene, 680, 432, '0x2000 = 2.0（缩小 2 倍）', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '偏移与取整');
  txt(scene, 1280, 252, 'PS_OFFSET 加初始相位', 't20w');
  txt(scene, 1280, 288, '两个 16 位：Y / X 偏移', 't20w');
  txt(scene, 1280, 324, '用来「多算一点源数据」', 't20w');
  txt(scene, 1280, 360, '小图放大时尤其明显', 't20w');
  txt(scene, 1280, 396, '非整数比例必然有误差', 't20w');
  txt(scene, 1280, 432, '误差表现为边缘模糊或跳动', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '为什么分两级：单一双线性最多 2 倍，多出来的比例必须靠抽点先砍掉', 't24');
  txt(scene, 80, 522, '举例：1920 宽缩到 800，比例 0.4167。抽点先取 1/2（0.5），剩 0.833 交给双线性；如果你直接写 0.4167，硬件只能按 2 倍内的范围截断，结果就是「缩放比例没生效」。', 't20w');
  txt(scene, 80, 556, '抽点是有代价的：它直接丢行/丢列，高频细节丢失，再插值也补不回来。所以「缩到 1/4 以下」的画面会明显变软 —— 这不是 bug，是算法。', 't20w');
  txt(scene, 80, 590, '4.12 定点精度 1/4096 ≈ 0.024%：整数倍缩放没有误差，任意比例会有累积相位误差，表现为某些行多取一像素。', 't20w');
  txt(scene, 80, 624, '放大也要小心：双线性只有 2 倍，把 320×240 放大到 800×480（2.5 倍）超出能力，实际会先按 2 倍算再靠输出窗口裁剪，看起来像「只放大了中间一块」。', 't20w');
  txt(scene, 80, 658, '判据：输出图与源图按比例比对，测量一个已知尺寸的方块在屏幕上的像素宽度，应等于 源宽 × 比例（允许 ±1 像素的相位误差）。', 't20w');
}

function drawAlpha() {
  txt(scene, 56, 146, 'AS 层只有一个，但它有三种 alpha 来源和色键抠图 —— 足够做文字、图标、OSD', 't24w');

  head(680, 214, 'alpha 三种来源');
  txt(scene, 680, 252, '来自像素的 alpha 通道', 't20w');
  txt(scene, 680, 288, '来自一个固定的全局值', 't20w');
  txt(scene, 680, 324, '像素 alpha × 全局值', 't20w');
  txt(scene, 680, 360, '0 = 全透明、255 = 全不透明', 't20w');
  txt(scene, 680, 396, '固定值适合淡入淡出', 't20w');
  txt(scene, 680, 432, '逐像素适合图标边缘', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '色键抠图');
  txt(scene, 1280, 252, 'CLRKEYLOW/HIGH 定范围', 't20s');
  txt(scene, 1280, 288, '范围内像素变透明', 't20w');
  txt(scene, 1280, 324, 'PS 与 AS 各有一套', 't20w');
  txt(scene, 1280, 360, '复位 LOW=00FF_FFFF', 't20s');
  txt(scene, 1280, 396, '复位 HIGH=0：即默认不命中', 't20w');
  txt(scene, 1280, 432, '常用于「纯色背景」素材', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '复位值 0x00FF_FFFF / 0x0000_0000 是有讲究的：low > high，区间为空，等于「色键默认关闭」', 't24');
  txt(scene, 80, 522, '要启用色键，得把 LOW 与 HIGH 换成真正的一小段颜色区间（比如 0x00F0_F0F0 到 0x00FF_FFFF 表示接近纯白）。区间越大越容易误抠掉不该透明的像素。', 't20w');
  txt(scene, 80, 556, 'AS 层是「叠加在上面的图」：它的 RGB 与 alpha 一起参与混合，最终像素 = AS×a + PS×(1−a)。所以 PS 是底、AS 是贴纸，顺序不能反。', 't20w');
  txt(scene, 80, 590, '窗口坐标是绝对屏幕坐标：OUT_AS_ULC 是左上角、OUT_AS_LRC 是右下角（含端点还是不含要看手册，通常 LRC 是「最后一个像素的坐标」）。差一个像素会表现为边框少一列。', 't20w');
  txt(scene, 80, 624, '做 OSD 文字时最常见的做法：把字模渲染到一张 ARGB 小图（每像素 alpha 只有 0/255），用「像素 alpha」模式贴到屏幕对应位置 —— 比软件混合省几十毫秒。', 't20w');
  txt(scene, 80, 658, '判据：把全局 alpha 从 255 调到 0，屏幕上叠加层应完整淡出；若不淡出，说明选的是「像素 alpha」模式且图像 alpha 通道全是 255。', 't20w');
}

function drawCSC() {
  txt(scene, 56, 146, '两组色彩矩阵各司其职：CSC1 为合成把 YUV 变 RGB，CSC2 为输出把 RGB 变目标空间', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, 'CSC1');
  txt(scene, 80, 252, 'COEF0 +0x1A0 复位 0400_0000', 't20s');
  txt(scene, 80, 288, 'COEF1 +0x1B0 复位 0123_0208', 't20s');
  txt(scene, 80, 324, 'COEF2 +0x1C0 复位 079B_076C', 't20s');
  txt(scene, 80, 360, '每寄存器两个 16 位系数', 't20w');
  txt(scene, 80, 396, 'YUV/YCbCr → RGB', 't20w');
  txt(scene, 80, 432, '目的：让合成发生在 RGB 里', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'CSC2');
  txt(scene, 680, 252, 'CTRL +0x1D0 复位 0000_0001', 't20s');
  txt(scene, 680, 288, 'COEF0–5 +0x1E0…0x230', 't20s');
  txt(scene, 680, 324, '六个系数，3×3 矩阵', 't20w');
  txt(scene, 680, 360, 'RGB → 任意 RGB/YUV', 't20w');
  txt(scene, 680, 396, '输出给屏或编码器', 't20w');
  txt(scene, 680, 432, '不做转换就旁路', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, 'LUT 与抖动');
  txt(scene, 1280, 252, 'LUT_CTRL +0x240 复位 8001_0000', 't20s');
  txt(scene, 1280, 288, 'LUT_ADDR +0x250 索引', 't20s');
  txt(scene, 1280, 324, 'LUT_DATA +0x260 数据', 't20s');
  txt(scene, 1280, 360, '256 项，可放 gamma 表', 't20w');
  txt(scene, 1280, 396, '抖动：RGB888 → 565/4444', 't20w');
  txt(scene, 1280, 432, 'CTRL 里要先开 DITHER', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '矩阵系数是「可写」的：所以 PXP 也能做简单的色彩校正（提亮、偏色、去饱和）', 't24');
  txt(scene, 80, 522, '标准 BT.601 的 YUV→RGB 系数是 1.164 / 1.596 / 0.813 / 0.391 / 2.018，手册给出的复位值就是这套的定点近似。换 BT.709 或换色域就要重写这 9 个数，否则颜色会偏。', 't20w');
  txt(scene, 80, 556, '系数是定点有符号数，具体 Q 格式随寄存器定义；直接照抄「标准公式 × 2^n」比自己试更可靠 —— 一位系数错，整屏偏绿或偏紫。', 't20w');
  txt(scene, 80, 590, 'LUT 的两种用法：输入侧做 gamma 展开（把 sRGB 素材线性化），输出侧做 gamma 压缩（适配屏的响应）。256 项只够单通道，实际是三通道共用一张表或按通道轮写。', 't20w');
  txt(scene, 80, 624, '抖动解决的是「位深不够」：RGB888 降到 RGB565 时，绿色少 2 位、红蓝少 3 位，直接截断会出现色带；有序抖动把误差打散成噪声，肉眼看到的是渐变而不是台阶。', 't20w');
  txt(scene, 80, 658, '判据：把 CSC 全旁路、直接 RGB 直通，画面应与源图逐像素一致；若有偏色，说明旁路没真正生效（CTRL 的 bypass 位没置）。', 't20w');
}

function drawFlowFull() {
  txt(scene, 56, 146, '一次完整动作：摄像头 YUV422 帧 → 旋转 90° 并缩放到屏幕尺寸 → 输出 RGB565 到 LCD 缓冲', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '配置顺序');
  txt(scene, 80, 252, '① 关 CTRL 使能位', 't20w');
  txt(scene, 80, 288, '② 配 PS 格式/缓冲/PITCH', 't20w');
  txt(scene, 80, 324, '③ 配 PS_SCALE 与旋转', 't20w');
  txt(scene, 80, 360, '④ 配 CSC1 与 AS（可选）', 't20w');
  txt(scene, 80, 396, '⑤ 配 OUT 格式/地址/PITCH', 't20w');
  txt(scene, 80, 432, '⑥ 置使能，等 STAT 完成', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '算例：800×480 屏');
  txt(scene, 680, 252, '源 1280×720 YUV422', 't20w');
  txt(scene, 680, 288, '旋转 90 → 720×1280', 't20w');
  txt(scene, 680, 324, '缩到 480×854 再裁', 't20w');
  txt(scene, 680, 360, '或直接缩到 480×270 居中', 't20w');
  txt(scene, 680, 396, '输出 RGB565 → PITCH=960', 't20w');
  txt(scene, 680, 432, '800×480×2 B ≈ 750 KiB', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '双缓冲');
  txt(scene, 1280, 252, 'OUT_BUF +0x030 当前帧', 't20s');
  txt(scene, 1280, 288, 'OUT_BUF2 +0x040 下一帧', 't20s');
  txt(scene, 1280, 324, '两个都写 = 自动交替', 't20w');
  txt(scene, 1280, 360, '避免撕裂就靠它', 't20w');
  txt(scene, 1280, 396, '切帧要在消隐期做', 't20w');
  txt(scene, 1280, 432, '否则屏上出现半新半旧', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, 'PXP 只写内存，不管屏幕什么时候扫：撕裂是「PXP 写帧缓冲」与「LCD 读帧缓冲」不同步造成的', 't24');
  txt(scene, 80, 522, '双缓冲解法：PXP 写 BUF2 时，LCD 正在扫 BUF；等垂直消隐到来，eLCDIF 切到 BUF2。这样屏幕上永远是完整的一帧。', 't20w');
  txt(scene, 80, 556, '配套的还有缓存一致性：PXP 是 DMA 主设备，写进 DDR 后 CPU 若还从 cache 读同一块，会读到旧数据。要 clean/invalidate，或用非 cache 的帧缓冲。', 't20w');
  txt(scene, 80, 590, '面积账：800×480×2 B = 750 KB，双缓冲 1.5 MB。i.MX6ULL 常配 512 MB DDR，够用；但如果同时跑摄像头三缓冲，就要算清楚 DDR 带宽（PXP 读写各一遍）。', 't20w');
  txt(scene, 80, 624, '带宽账：1280×720 YUV422 读 + 800×480 RGB565 写，约 1.8 MB + 0.77 MB；30 fps 就是约 77 MB/s，占 DDR 带宽的 4% 左右，可以接受。', 't20w');
  txt(scene, 80, 658, '判据：连续跑 1000 帧，STAT 无错误位、输出画面无撕裂、DDR 带宽占用稳定；再看 CTRL 的「下一个块地址」是否被正确写回。', 't20w');
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawTop();
  else if (s === 1) drawFlow();
  else if (s === 2) drawMap();
  else if (s === 3) drawScale();
  else if (s === 4) drawAlpha();
  else if (s === 5) drawCSC();
  else drawFlowFull();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () { state.step = INIT.step; draw(); });
fitCanvas($('viewport'), $('canvas'), draw);
</script>
