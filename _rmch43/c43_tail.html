<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0 };
var state = { step: INIT.step };

var STEPS = [
  { h: '给 ROM 打补丁', hint: '总线层偷换数据',
    note: 'ROMC 不改 ROM 内容，只在「读 ROM」这条路径上把返回值换掉。' },
  { h: '地址空间', hint: '16 KB 在 0x0',
    note: '异常向量与安全代码钉在低端 16 KB，其余容量从 0x0040_4000 起。' },
  { h: '寄存器地图', hint: '0x021A_C000',
    note: '三个寄存器就够跑：ENL 开比较器、A 放地址、D 放替换值，CNTL 定功能。' },
  { h: '16 个比较器', hint: '8 数据 + 8 指令',
    note: '类型优先、同类型编号大的赢；SR 的 SW 位是唯一的冲突信号。' },
  { h: '数据修正', hint: '整字替换',
    note: '命中就读出 D 寄存器的整个 32 位，读一个字节也换整字 —— 这是最大的坑。' },
  { h: '指令补丁', hint: 'SWI 陷进去',
    note: '把一条指令换成 SWI，注释号当索引去查函数指针表，跳到 RAM 里的新实现。' },
  { h: '外部启动与判据', hint: '两次修正改 PC',
    note: '0x0 换成 ldr pc,[pc,#12]，0x14 再换成外部地址，PC 就被骗到外部代码。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}

function drawTop() {
  txt(scene, 56, 146, 'ROMC 是 Boot ROM 的补丁层：出厂就固化的代码也能被替换，靠的是总线上的数据替换', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '它夹在哪');
  txt(scene, 80, 252, 'AHB-Lite 与 ROM 之间', 't20w');
  txt(scene, 80, 288, '侦听总线上的读事务', 't20w');
  txt(scene, 80, 324, '命中就把返回值换掉', 't20w');
  txt(scene, 80, 360, '写操作完全不参与', 't20w');
  txt(scene, 80, 396, '寄存器走独立 IP 总线', 't20w');
  txt(scene, 80, 432, '特权态、只能 32 位写', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '能做什么');
  txt(scene, 680, 252, '16 个地址比较器', 't20w');
  txt(scene, 680, 288, '8 个指令补丁点', 't20w');
  txt(scene, 680, 324, '8 个整字数据修正', 't20w');
  txt(scene, 680, 360, '补 Reset 向量 → 外部启动', 't20w');
  txt(scene, 680, 396, '4 MB 窗口内寻址', 't20w');
  txt(scene, 680, 432, '对全部 AHB master 生效', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '板子上为什么用');
  txt(scene, 1280, 252, 'Boot ROM 是硅片里固化的', 't20w');
  txt(scene, 1280, 288, '流片后发现的 bug 只能这样救', 't20w');
  txt(scene, 1280, 324, '量产不用换芯片', 't20w');
  txt(scene, 1280, 360, '安全启动用它禁掉补丁', 't20w');
  txt(scene, 1280, 396, '也能把某段逻辑短路掉', 't20w');
  txt(scene, 1280, 432, '代价：补丁表要 nailed 在 RAM', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '它不是缓存也不是 MPU：不参与地址翻译，只在「读 ROM」这条路径上偷换数据', 't24');
  txt(scene, 80, 522, 'ROMC 是硬件级热补丁：ROM 里一段代码有 bug，量产后无法改硅片，就用比较器盯住那个地址，读到这里时把 SWI 指令塞回总线，CPU 跳到 RAM 里的新实现。', 't20w');
  txt(scene, 80, 556, '这与软件补丁不同：软件补丁改的是 RAM 里的副本，而 Boot ROM 的代码根本改不了副本，只能靠总线层替换返回值。', 't20w');
  txt(scene, 80, 590, '它也用于「禁用某段 ROM 功能」：把某地址的数据修正成 0 或一条跳转，等于把原来的逻辑短路掉，比改代码省事。', 't20w');
  txt(scene, 80, 624, '注意它只影响读：写 ROM 无效，ROMC 也不拦写；但它对所有 AHB master 生效（含 DMA），所以补丁是全局的。', 't20w');
  txt(scene, 80, 658, '一句话：ROMC = 16 个比较器 + 8 个数据替换寄存器 + SWI 生成器，三件东西合起来才能改一段固化的代码。', 't20w');
}

function drawSpace() {
  txt(scene, 56, 146, 'ROM 的前 16 KB 钉在 0x0000_0000：异常向量必须在 0x0，安全代码必须与向量同区', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '地址布局');
  txt(scene, 80, 252, '0x0000_0000 起 16 KB', 't20s');
  txt(scene, 80, 288, 'ROM 基址 0x0040_0000', 't20s');
  txt(scene, 80, 324, '0x0040_4000 起是余下容量', 't20s');
  txt(scene, 80, 360, '容量 16 KB – 4 MB，1 KB 步进', 't20w');
  txt(scene, 80, 396, '不足 16 KB 时高位地址别名', 't20w');
  txt(scene, 80, 432, 'MMU 决定谁能读', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '为什么非要 16 KB');
  txt(scene, 680, 252, '向量表必须在 0x0', 't20w');
  txt(scene, 680, 288, '安全代码要与向量同区', 't20w');
  txt(scene, 680, 324, 'ARM 平台安全码最小值约 16 KB', 't20w');
  txt(scene, 680, 360, '这段只 supervisor 可读', 't20w');
  txt(scene, 680, 396, '其余容量按普通内存映射', 't20w');
  txt(scene, 680, 432, '不是「全部 ROM 都在 0x0」', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '对写代码的含义');
  txt(scene, 1280, 252, 'Boot ROM 固定占低端', 't20w');
  txt(scene, 1280, 288, '自写代码落在 0x0040_0000 以上', 't20s');
  txt(scene, 1280, 324, '链接脚本别指望从 0x0 起', 't20w');
  txt(scene, 1280, 360, '补丁地址必须在 4 MB 窗口内', 't20w');
  txt(scene, 1280, 396, '比较器只看 [21:2] 这 20 位', 't20s');
  txt(scene, 1280, 432, '越界地址根本不会命中', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '三个数字别混：ROM 物理容量、比较器窗口 4 MB、映射位置 —— 它们由不同的逻辑决定', 't24');
  txt(scene, 80, 522, '比较器窗口是 4 MB：地址寄存器只用 ADDRX[21:2] 二十位，正好覆盖 2^20 个字即 4 MB；地址再大也不会命中，所以补丁只能管这一块。', 't20w');
  txt(scene, 80, 556, '物理容量是 16 KB 到 4 MB：小于 16 KB 时，超出容量的地址会「别名」回低端 16 KB 内的内容，读到的不是全 0 也不是错误，而是重复的旧数据。', 't20w');
  txt(scene, 80, 590, '映射位置分两段：低 16 KB 在 0x0000_0000，其余在 0x0040_4000 起。所以「ROM 有多大」和「ROM 在哪」是两件事，写链接脚本时两段都要考虑。', 't20w');
  txt(scene, 80, 624, 'MMU 决定权限：这段 ROM 是否只给 supervisor 读，不由 ROMC 决定，而由页表属性决定 —— 安全启动的隔离靠的是 MMU，不是 ROMC。', 't20w');
  txt(scene, 80, 658, '判据：读 0x0 与 0x0040_0000 都应拿到合法指令；若读到同一段内容，说明容量不足 16 KB 发生了别名。', 't20w');
}

function drawMap() {
  txt(scene, 56, 146, '寄存器分四组：数据、地址、使能与控制、状态，基址 0x021A_C000', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '数据与地址');
  txt(scene, 80, 252, 'ROMPATCH0D–7D：0xC0F0 起倒排', 't20s');
  txt(scene, 80, 288, 'ROMPATCH0A–15A：0xC100–0xC13C', 't20s');
  txt(scene, 80, 324, '每个比较器一个 A 寄存器', 't20w');
  txt(scene, 80, 360, '只有 0–7 号配了 D 寄存器', 't20w');
  txt(scene, 80, 396, 'A 与 D 靠编号配对', 't20w');
  txt(scene, 80, 432, '复位值全 0', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '控制与使能');
  txt(scene, 680, 252, 'CNTL 0xC0F4，复位 0x0840_0000', 't20s');
  txt(scene, 680, 288, 'DIS[29] 一键关掉全部补丁', 't20s');
  txt(scene, 680, 324, 'DATAFIX[7:0] 逐位选功能', 't20s');
  txt(scene, 680, 360, 'ENL 0xC0FC，只有 [15:0] 可写', 't20s');
  txt(scene, 680, 396, 'ENH 0xC0F8 整个只读', 't20s');
  txt(scene, 680, 432, '上电 ENL 全 0：比较器全关', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '状态');
  txt(scene, 1280, 252, 'SR 0xC208', 't20s');
  txt(scene, 1280, 288, 'SOURCE[3:0] 最近命中的编号', 't20s');
  txt(scene, 1280, 324, 'SW[17] 多次命中冲突，写 1 清', 't20s');
  txt(scene, 1280, 360, '复位值全 0', 't20w');
  txt(scene, 1280, 396, '读 SR 是最快的自检手段', 't20w');
  txt(scene, 1280, 432, '只读位多，别照着手册改', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, 'CNTL 复位值 0x0840_0000 里的两个 1 是「保留位恒为 1」，不是配置位，别去动它', 't24');
  txt(scene, 80, 522, '最小可用配置只有三步：ENL 置对应位打开比较器、A 寄存器放目标地址（含 bit0 选 ARM/THUMB）、CNTL 的 DATAFIX 位决定它是改数据还是改指令。', 't20w');
  txt(scene, 80, 556, '写寄存器必须是 32 位存储且特权态：用 8 位或 16 位写会被忽略，这是最常见的「配了没反应」—— 现象是没有错误、也没有效果。', 't20w');
  txt(scene, 80, 590, 'ENL 只有低 16 位可写，因为本芯片只实现 16 个比较器；ENH 全只读 0，往它写既不报错也不生效，属于「看了会以为能用」的陷阱。', 't20w');
  txt(scene, 80, 624, '上电默认 ENL 全 0，此时 ROMC 完全透明：ROM 读到的就是出厂内容。所以调试「补丁没生效」时，第一件事就是读 ENL 确认位是否真的置上了。', 't20w');
  txt(scene, 80, 658, '判据：配置后读回 A、D、CNTL、ENL 四个寄存器与写入值逐位比对；再用调试器读目标地址，看返回值是否变成 D 里的内容。', 't20w');
}

function drawComparators() {
  txt(scene, 56, 146, '16 个比较器：0–7 可做数据修正（也可做指令补丁），8–15 只能做指令补丁', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '分工');
  txt(scene, 80, 252, '0–7：默认指令补丁', 't20w');
  txt(scene, 80, 288, 'CNTL.DATAFIX 某位置 1 → 改数据', 't20s');
  txt(scene, 80, 324, '8–15：只能指令补丁', 't20w');
  txt(scene, 80, 360, '一个比较器只干一件事', 't20w');
  txt(scene, 80, 396, '最多 8 个数据点 + 8 个指令点', 't20w');
  txt(scene, 80, 432, '也可以 16 个全做指令补丁', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '优先级规则');
  txt(scene, 680, 252, '1. 数据修正压过指令补丁', 't20w');
  txt(scene, 680, 288, '2. 同类型里编号大的赢', 't20w');
  txt(scene, 680, 324, '例：4 改数据 / 7 改指令 → 4 胜', 't20w');
  txt(scene, 680, 360, '例：4 与 7 都改数据 → 7 胜', 't20w');
  txt(scene, 680, 396, '替换值取对应 D 寄存器', 't20w');
  txt(scene, 680, 432, '编号就是隐式优先级', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '冲突怎么看出来');
  txt(scene, 1280, 252, 'SR.SW=1 表示发生过多次命中', 't20s');
  txt(scene, 1280, 288, 'SR.SOURCE 记录胜者编号', 't20s');
  txt(scene, 1280, 324, 'SW 写 1 清，SOURCE 随事件更新', 't20w');
  txt(scene, 1280, 360, '冲突多半是地址少写一位', 't20w');
  txt(scene, 1280, 396, '查 A 寄存器是否撞区', 't20w');
  txt(scene, 1280, 432, '再查 DATAFIX 分工是否重复', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '两条规则合起来：类型优先、同类编号大的赢 —— 所以编号是隐式优先级，排补丁表时要利用它', 't24');
  txt(scene, 80, 522, '把「必须生效」的补丁放在同类型里编号更大的比较器上，否则会被编号更小的邻居盖掉；反过来，想故意覆盖别人就先占大号。', 't20w');
  txt(scene, 80, 556, '冲突的典型来源是地址算错：ADDRX 只有 [21:2] 参与比较，bit1 与 bit0 各有含义，若把「字节地址」直接写进去，就会命中错误的字甚至两个比较器。', 't20w');
  txt(scene, 80, 590, '写地址的正确姿势：先把目标字节地址按字对齐（清低 2 位），再做「地址 ÷ 4」放进 ADDRX 的低 20 位；THUMB 补丁另置 bit0，半字选择另置 bit1。', 't20w');
  txt(scene, 80, 624, 'SR.SOURCE 只记「最近一次」，不记历史；连续两次不同命中会把它覆盖。要排查冲突就每次读后立刻记下来，别指望回看。', 't20w');
  txt(scene, 80, 658, '判据：读 SR 的 SW 与 SOURCE，与预期编号一致；再把「可疑邻居」比较器临时关掉复测，看行为是否变化。', 't20w');
}

function drawDataFix() {
  txt(scene, 56, 146, '数据修正只做一件事：命中地址就读出 D 寄存器的整个 32 位，不做部分保留', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '机制');
  txt(scene, 80, 252, '命中读地址就整字替换', 't20w');
  txt(scene, 80, 288, '读 byte / half 也返回整字', 't20w');
  txt(scene, 80, 324, 'A[1:0] 在数据修正里被忽略', 't20s');
  txt(scene, 80, 360, '替换值只在读数据总线上', 't20w');
  txt(scene, 80, 396, 'hready 拉高后才结束访问', 't20w');
  txt(scene, 80, 432, '写操作完全不受影响', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '适合改什么');
  txt(scene, 680, 252, '32 位常数表项', 't20w');
  txt(scene, 680, 288, '一条 32 位指令', 't20w');
  txt(scene, 680, 324, '把函数首条改成跳转', 't20w');
  txt(scene, 680, 360, '修出厂数据的错值', 't20w');
  txt(scene, 680, 396, '屏蔽某段自检结果', 't20w');
  txt(scene, 680, 432, '共 8 个位置，够关键修补', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '三个坑');
  txt(scene, 1280, 252, '结构体里改 1 字节会连带改邻居', 't20w');
  txt(scene, 1280, 288, 'D 只写目标值会把其余字节清零', 't20w');
  txt(scene, 1280, 324, '编译器常量折叠后改表无效', 't20w');
  txt(scene, 1280, 360, '大小端搞反会读出字节反转', 't20w');
  txt(scene, 1280, 396, '只对读生效，写不进 ROM', 't20w');
  txt(scene, 1280, 432, '调试器读也算读，会看到替换值', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '整字替换是硬规则：读 1 个字节也把整 4 字节换成 D 的值，没打算动的 3 个字节一起变', 't24');
  txt(scene, 80, 522, '正确做法是「读原字 → 改目标字段 → 写回 D」：先从 ROM 读出原来的 32 位，只改你要改的那几个 bit，再整字写进 D，这样邻近字节保持原值。', 't20w');
  txt(scene, 80, 556, '由此可知数据修正只适合独立字：改一个常数、一条指令都安全；改结构体里的单个字段就会误伤同字的其他字段，这种场景应该改用指令补丁去改访问它的代码。', 't20w');
  txt(scene, 80, 590, '编译器可能把常量折进指令立即数，此时改数据表根本没被读到；判断方法是反汇编目标函数，看它是否真的从那个地址 load。', 't20w');
  txt(scene, 80, 624, '另一个隐蔽点：调试器/仿真器读同一地址也会被修正，容易误判「ROM 里本来就是新值」；要验原值必须在补丁关闭时读。', 't20w');
  txt(scene, 80, 658, '判据：关闭比较器读一次得原值，打开后再读得新值；byte/half/word 三种宽度读出来都是同一个整字。', 't20w');
}

function drawOpcode() {
  txt(scene, 56, 146, '指令补丁把一条指令换成 SWI：CPU 以为在跑原代码，实际陷进 SVC，由软件跳到新实现', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '生成什么');
  txt(scene, 80, 252, 'ARM：32 位 SWI', 't20w');
  txt(scene, 80, 288, 'opcode 0xEF 在 [31:24]', 't20s');
  txt(scene, 80, 324, '注释 [23:0]，低 5 位是编号', 't20s');
  txt(scene, 80, 360, 'THUMB：16 位，0xDF 在 [15:8]', 't20s');
  txt(scene, 80, 396, 'A[0]=1 表示 THUMB 补丁', 't20s');
  txt(scene, 80, 432, '其余注释位清零', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '半字放哪边');
  txt(scene, 680, 252, 'THUMB 只占半个字', 't20w');
  txt(scene, 680, 288, 'A[1] 选低半字或高半字', 't20s');
  txt(scene, 680, 324, '小端：bit1=0 → [15:0]', 't20s');
  txt(scene, 680, 360, '大端：规则反过来', 't20w');
  txt(scene, 680, 396, '另一半被清零', 't20w');
  txt(scene, 680, 432, '只覆盖半个字，另一个字不动', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '软件侧约定');
  txt(scene, 1280, 252, '注释 > 16：普通系统调用', 't20w');
  txt(scene, 1280, 288, '注释 < 16：ROMC 补丁', 't20w');
  txt(scene, 1280, 324, '用注释号索引函数指针表', 't20w');
  txt(scene, 1280, 360, '表放可写内存，可换上下文', 't20w');
  txt(scene, 1280, 396, 'SPSR 的 T 位判 ARM/THUMB', 't20s');
  txt(scene, 1280, 432, '最多 16 个补丁点', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '为什么用 SWI：ROMC 只能替换「当前读到的那个字」，改不了 PC，SWI 是唯一能就地改变控制流的单条指令', 't24');
  txt(scene, 80, 522, '处理器的配合是硬件自动的：SWI 把 CPSR 存进 SPSR_SVC、把返回地址存进 LR_SVC、进 SVC 模式、跳到 0x8 向量 —— 所以 handler 一定拿得到「从哪来」。', 't20w');
  txt(scene, 80, 556, 'handler 的第一件事是区分来源：读 SPSR 的 T 位判断 ARM/THUMB，再从 LR 往回取指令字（ARM 取 -4，THUMB 取 -2），掩掉 opcode 只留注释。', 't20w');
  txt(scene, 80, 590, '注释号只有 5 位有效，所以最多 16 个补丁点，与比较器数一致；>16 的注释留给操作系统自己的系统调用，两边靠这个阈值划清界限。', 't20w');
  txt(scene, 80, 624, '函数指针表放在可写内存的意义：不同进程/不同阶段可以换一张表，同一个 ROM 补丁点就能跳到不同的实现 —— 这是它比「直接改代码」灵活的地方。', 't20w');
  txt(scene, 80, 658, '判据：handler 里打印注释号与 LR，确认命中预期比较器；再核对表项指向的新函数确实被执行（打点或计数器）。', 't20w');
}

function drawBoot() {
  txt(scene, 56, 146, '外部启动是「两次数据修正」串起来的：0x0 换成 ldr pc，0x14 再换成外部入口地址', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '触发条件');
  txt(scene, 80, 252, '复位时 boot_int 为低', 't20w');
  txt(scene, 80, 288, 'ROMC 对 0x0 做数据修正', 't20w');
  txt(scene, 80, 324, '换成 0xE59FF00C', 't20s');
  txt(scene, 80, 360, '即 ldr pc,[pc,#12]', 't20s');
  txt(scene, 80, 396, 'PC=8 时算出源地址 0x14', 't20w');
  txt(scene, 80, 432, '这是一条标准的 ARM 指令', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '第二步');
  txt(scene, 680, 252, '读 0x14 又命中修正', 't20w');
  txt(scene, 680, 288, '返回外部启动地址', 't20w');
  txt(scene, 680, 324, '低 2 位被清零', 't20w');
  txt(scene, 680, 360, 'PC 拿到该地址', 't20w');
  txt(scene, 680, 396, '从那里取指执行', 't20w');
  txt(scene, 680, 432, '原 Boot ROM 分支被绕过', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '为什么绕两步');
  txt(scene, 1280, 252, '直接改 0x0 成跳转也行', 't20w');
  txt(scene, 1280, 288, '但地址要装进一条指令里', 't20w');
  txt(scene, 1280, 324, '指令只有 32 位，装不下大地址', 't20w');
  txt(scene, 1280, 360, '所以先跳到一个「数据槽」', 't20w');
  txt(scene, 1280, 396, '0x14 就是那个槽', 't20s');
  txt(scene, 1280, 432, 'PC 相对寻址只需 12 偏移', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '这条链条值得一步步跟：0x0 → ldr pc,[pc,#12] → 读 0x14 → 外部地址 → PC，四步里有两步是 ROMC 在替换', 't24');
  txt(scene, 80, 522, 'PC 相对取址的细节：ARM 模式下读 PC 时它已经指向「当前指令 + 8」，所以 ldr pc,[pc,#12] 访问的是 8+12=20=0x14，不是 0x0C。', 't20w');
  txt(scene, 80, 556, '低 2 位清零的用意是保证字对齐：ARM 指令必须 4 字节对齐，若外部启动代码入口带偏移就会被截断；所以入口要按字对齐放，别放在奇地址。', 't20w');
  txt(scene, 80, 590, '这一步属于 Boot ROM 的启动策略，不是用户代码能改的：用户能做的是「让 boot_int 有效」或「在补丁关闭前把补丁表填好」，具体引脚/熔丝要看芯片启动章节。', 't20w');
  txt(scene, 80, 624, '安全相关的一点：进安全世界前应置 CNTL.DIS=1 关掉全部补丁，但外部启动这条链不受 DIS 影响 —— 手册明确写了 DIS 不管 External Boot。', 't20w');
  txt(scene, 80, 658, '判据：单步跟 0x0 → 0x14 → 目标地址，三次读的返回值都要符合预期；再读 SR.SOURCE 确认命中的是比较器几号。', 't20w');
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawTop();
  else if (s === 1) drawSpace();
  else if (s === 2) drawMap();
  else if (s === 3) drawComparators();
  else if (s === 4) drawDataFix();
  else if (s === 5) drawOpcode();
  else drawBoot();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () { state.step = INIT.step; draw(); });
fitCanvas($('viewport'), $('canvas'), draw);
</script>
</body>
