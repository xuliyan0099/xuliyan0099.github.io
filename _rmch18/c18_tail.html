<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0, lane: 0 };
var state = { step: INIT.step, lane: INIT.lane };

var STEPS = [
  { h: '一棵树的五道关', hint: '2 个源 · 7 颗 PLL',
    note: '全芯片只有两个原生频率：24 MHz 晶振与 32.768 kHz 时钟。其余所有频率都是它们经过 PLL 倍频、PFD 分数分频、根分频、门控之后的结果。看时钟问题就按这条链走一遍，五道关里总有一道是关着的。' },
  { h: '七颗 PLL 怎么算', hint: 'DIV / NUM / FRAC',
    note: 'ARM PLL 是 24 乘以 7 位 DIV 再除以 2；SYS 与 USB 只有一位，0 给 480、1 给 528；音频与视频是分数 PLL，靠 NUM/DENOM 凑小数；PFD 则是在不重锁 PLL 的前提下再分出一个频率。每一颗都对应一个寄存器，地址在 0x020C_8000 段。' },
  { h: '分频链与根', hint: 'CBCDR · CACRR · CSCMR1',
    note: 'PLL 出来的是高频率，真正给总线和外设的是根。ARM 走 CACRR，AXI/AHB/IPG 走 CBCDR，串行的 UART/SAI/USDHC/ECSPI 各有自己的 mux 与 podf。复位值其实已经写好了一条 528/264/132/66 的链，读出来就能验算。' },
  { h: '112 个门', hint: 'CCGR0–6 · LPCG',
    note: '每个模块面前都有一个门，由 CCGR 的两位字段控制，再和模块自身的 enable、SRC 复位使能、熔丝硬连四路相与。门关了，寄存器照样读得到，外设就是不动——这是排查时钟问题时最容易被忽略的一层。' },
  { h: '改时钟的顺序', hint: 'step_clk · CDHIPR',
    note: '改 ARM 频率要先切到台阶时钟、再改 PLL、等锁、改分频、等握手、最后切回来；改总线分频要先屏蔽 MMDC 握手、再写、再等 busy 清零。五个无毛刺 mux 可以在运行时切，其余 mux 必须先关门，否则毛刺会打进后面的逻辑。' },
  { h: '实测与板级真相', hint: 'CLKO · STOP · 无 PMIC',
    note: '三个寄存器一读就能知道树对不对：CCR 的 COSC_EN、PLL 的 LOCK、CBCDR 的分频。要看频率就把根引到 CLKO 上用示波器量。这块板的 ARM 与 SOC 共用一路电源、没有可编程 PMIC，所以只能降频不能降压；低功耗还有三个默认值坑。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }

function drawTree() {
  txt(scene, 56, 146, '时钟从一颗 24 MHz 晶振出发，过七颗 PLL、十几个根、112 个门，最后才到外设', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '最底层只有两个源');
  txt(scene, 80, 252, 'Y2 24 MHz → OSC，所有 PLL 的粮', 't20w');
  txt(scene, 80, 288, 'Y1 32.768 kHz → CKIL，RTC 与时基', 't20w');
  txt(scene, 80, 324, 'PLL 只做一件事：把 24 M 倍上去', 't20w');
  txt(scene, 80, 360, '倍完再分频，分成十几个「根」', 't20w');
  txt(scene, 80, 396, '根再过 LPCG 的门，才到模块', 't20w');
  txt(scene, 80, 432, '外设没时钟，可能坏在五处中的一处', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '七颗 PLL 各管一段');
  txt(scene, 680, 252, 'PLL1 ARM：CPU 自己吃', 't20w');
  txt(scene, 680, 288, 'PLL2 SYS 528：总线 + PFD 母体', 't20w');
  txt(scene, 680, 324, 'PLL3 USB1 480：USB + PFD 母体', 't20w');
  txt(scene, 680, 360, 'PLL4 Audio / PLL5 Video', 't20w');
  txt(scene, 680, 396, 'PLL6 ENET：25 / 50 / 100 / 125', 't20w');
  txt(scene, 680, 432, 'PLL7 USB2：只直连 PHY，不给根', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '三把锁，缺一就白改');
  txt(scene, 1280, 252, 'PLL LOCK：倍频稳没稳', 't20w');
  txt(scene, 1280, 288, 'PFD STABLE：分相生效没生效', 't20w');
  txt(scene, 1280, 324, 'CDHIPR BUSY：分频握手完没完', 't20w');
  txt(scene, 1280, 360, '只等一个就切，会掉回 24 MHz', 't20w');
  txt(scene, 1280, 396, '三个都等到，才算改完', 't20w');
  txt(scene, 1280, 432, '读寄存器比写寄存器更重要', 't20w');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, '一根时钟到外设，要过五道关');
  txt(scene, 80, 522, '① 源：OSC 24 M 与 CKIL 32 k —— 全芯片只有这两个「原生」频率，其余都是派生出来的。', 't20w');
  txt(scene, 80, 556, '② PLL：倍频，输出 480 / 528 / 786.432 / 996 这一档的高频率，顺带产生 4 个 PFD。', 't20w');
  txt(scene, 80, 590, '③ PFD：从 PLL 里再分数分频，得到 352 / 396 / 508.2 / 720 这类中间频率，改它不用重锁 PLL。', 't20w');
  txt(scene, 80, 624, '④ 根：mux 选源 + PODF 分频，得到 ARM / AXI / AHB / IPG / PERCLK / UART / SAI / USDHC…', 't20w');
  txt(scene, 80, 658, '⑤ LPCG：门。CGR、模块 enable、SRC、熔丝四路与在一起，缺任何一路都不出时钟。', 't20w');
  txt(scene, 80, 692, '表 18-4 的「默认频率」是复位值：此刻 PLL 还在 POWERDOWN，所以只有 24 M 分出来的 12 / 6 / 3。', 't20w');
  txt(scene, 80, 726, 'ROM 起来点上 PLL2 之后才是 528 / 264 / 132 / 66 —— 表里的默认值不是你板子上的值。', 't20w');
  txt(scene, 80, 760, '6ULL 的 ARM 上限是 528（表 18-4），别照抄 6Q 那套 996 的图，那是另一颗芯片的标尺。', 't20w');
}

function drawPll() {
  txt(scene, 56, 146, 'ARM PLL 靠一个 7 位分频，SYS/USB 一位就定生死，分数 PLL 要靠 NUM/DENOM 凑小数', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 212, 'ARM PLL：7 位分频');
  txt(scene, 80, 248, '地址 0x020C_8000', 't20w');
  txt(scene, 80, 282, 'Fout = 24 × DIV_SELECT / 2', 't20s');
  txt(scene, 80, 316, 'DIV 有效 54–108 → 648–1296 MHz', 't20w');
  txt(scene, 80, 350, '528 写 44，792 写 66，996 写 83', 't20w');
  txt(scene, 80, 384, '6ULL 只许到 44（表 18-4 上限 528）', 't20w');
  txt(scene, 80, 418, '复位 0x0001_3063：断电 + BYPASS + 99', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 212, 'SYS / USB：一位定生死');
  txt(scene, 680, 248, 'SYS 0x020C_8030：0→480，1→528', 't20w');
  txt(scene, 680, 282, '复位 0x0001_3001 = 528，但断电', 't20w');
  txt(scene, 680, 316, 'USB1 0x020C_8010：0→480，1→528', 't20w');
  txt(scene, 680, 350, 'USB 只能 480，那位别乱写 1', 't20w');
  txt(scene, 680, 384, 'bit6 EN_USB_CLKS 才把九相给 PHY', 't20w');
  txt(scene, 680, 418, '写了 1，PHY 那侧就少一半时钟', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 212, '分数 PLL：NUM / DENOM');
  txt(scene, 1280, 248, 'AUDIO 0x020C_8070，DIV 27–54', 't20w');
  txt(scene, 1280, 282, 'Fout = 24 × (DIV + NUM/DENOM)', 't20s');
  txt(scene, 1280, 316, '786.432 = 24 × (32 + 768/1000)', 't20w');
  txt(scene, 1280, 350, '722.5344 = 24 × (30 + 1056/10000)', 't20w');
  txt(scene, 1280, 384, 'POST_DIV：00 ÷4、01 ÷2、10 ÷1', 't20w');
  txt(scene, 1280, 418, '先落到 650–1300，再除下来', 't20w');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, 'PFD 是「不用重锁 PLL」的第二个频率');
  txt(scene, 80, 522, '公式 Fout = Fvco × 18 / FRAC，FRAC 取 12–35；528 的 PFD 就是 528×18/FRAC，480 就是 480×18/FRAC。', 't20w');
  txt(scene, 80, 556, '528 复位值 0x1018_101B 算出来：352(FRAC 27) / 594(16) / 396(24) / 594(16)。', 't20w');
  txt(scene, 80, 590, '480 复位值算出来：720(12) / 540(16) / 508.2(17) / 454.7(19) —— 与手册图上的标注一致。', 't20w');
  txt(scene, 80, 624, '但图 18-4 给 528 标的 PFD2=400M、PFD3=200M，与复位值算出的 396/594 对不上：以公式和寄存器为准。', 't20w');
  txt(scene, 80, 658, 'PFD 的价值在于「不重锁 PLL」：改 FRAC 就能换频，所以 DVFS 切频才敢用它；代价是多一个 STABLE 位要等。', 't20w');
  txt(scene, 80, 692, '规矩：PLL 上电或重锁之后，对应 PFDx_CLKGATE 必须 1→0 走一遍，否则这个 PFD 根本不出时钟。', 't20w');
  txt(scene, 80, 726, '另一个坑：动 PLL 之前先把所有消费者搬走或 BYPASS。手册的原话是「否则等于把总线掐了」。', 't20w');
  txt(scene, 80, 760, '记忆点：PLL 管「倍」，PFD 管「分」，根管「再分 + 选源」，三层各有一个锁要等。', 't20w');
}

function drawRoots() {
  txt(scene, 56, 146, '复位值已经把分频写好了：PLL2 一上电，总线自动就是 528 / 264 / 132 / 66', 't24w');

  var ROWS = [
    ['ARM_CLK_ROOT', 'CACRR  ARM_PODF ÷1–8', '÷1', '24×44/2 = 528，CPU 只吃这一路'],
    ['AXI_CLK_ROOT', 'CBCDR  AXI_PODF ÷1–8', '÷2', 'periph_clk 528 直接下来 → 264'],
    ['AHB_CLK_ROOT', 'CBCDR  AHB_PODF ÷1–8', '÷4', '也从 periph_clk 分 → 132'],
    ['IPG_CLK_ROOT', 'CBCDR  IPG_PODF ÷1–4', '÷2', 'AHB 再二分 → 66；÷3/÷4 与 SDMA 冲突'],
    ['PERCLK_ROOT', 'CSCMR1  SEL + PODF ÷1–64', 'IPG÷1', '定时器 / PWM / I2C 吃它 → 66'],
    ['USDHCn_ROOT', 'CSCMR1 SEL + CSCDR1 PODF', 'PFD2÷3', '396÷3 → 132；SD2 上是 eMMC'],
    ['UART_CLK_ROOT', 'CSCDR1  SEL + PODF ÷1–64', '480÷6', '串口波特率的基准 → 80']
  ];
  ROWS.forEach(function (r, i) {
    var y = 190 + i * 44;
    box(56, y, 300, 40, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 74, y + 27, r[0], 't20s');
    box(366, y, 380, 40, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 384, y + 27, r[1], 't20w');
    box(756, y, 150, 40, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 774, y + 27, r[2], 't20w');
    box(916, y, 952, 40, 'var(--page)', 'var(--guide)', 2);
    txt(scene, 934, y + 27, r[3], 't20w');
  });

  box(56, 508, 1812, 310, 'var(--surface)', 'var(--guide)');
  head(80, 546, '为什么说复位值「已经算好了」');
  txt(scene, 80, 580, 'CBCDR 复位 0x0001_8D00 逐位解出来就是 AXI ÷2、AHB ÷4、IPG ÷2 —— 528 一进来就是 264/132/66。', 't20w');
  txt(scene, 80, 614, '所以你一个分频寄存器都不写，总线也是对的；反而乱写才会挂。', 't20w');
  txt(scene, 80, 648, 'periph_clk 的备源：CBCMR[19:18] 选 PLL2 / PFD2 / PFD0 / PFD2÷2，这是「同级别换源」。', 't20w');
  txt(scene, 80, 682, '真正的备胎是 periph_clk2：CBCMR[13:12] 选 PLL3_sw 或 OSC 24 M，改 PLL2 前必须切到这里。', 't20w');
  txt(scene, 80, 716, '串行根各吃各的：SAI 选 PLL3 PFD2 / PLL5 / PLL4；CAN 选 PLL3 的 60 或 80 M；ECSPI 选 60 M 或 OSC。', 't20w');
  txt(scene, 80, 750, '算例：396÷2=198（SD） 480÷6=80（UART） 480÷8=60（ECSPI） 786.432÷64=12.288（SAI MCLK）', 't20w');
  txt(scene, 80, 784, '分频写错最常见的后果不是挂，而是「频率正好差一倍」——示波器一量就知道，不用猜。', 't20w');
}

function drawGates() {
  txt(scene, 56, 146, '七个门控寄存器、112 个 2 位字段：一个外设一个门，关错比不关更贵', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '112 个门怎么编址');
  txt(scene, 80, 252, 'CCGR0–6，每个寄存器 16 个 CG', 't20w');
  txt(scene, 80, 288, '每个 CG 两位，n 号从 bit 2n 起', 't20w');
  txt(scene, 80, 324, '00 全关、01 只 RUN 开', 't20w');
  txt(scene, 80, 360, '11 除 STOP 全开、10 保留', 't20w');
  txt(scene, 80, 396, '复位全 F，所以不配也能跑', 't20w');
  txt(scene, 80, 432, '费电，但不会莫名其妙不出时钟', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '关错门比不关更贵');
  txt(scene, 680, 252, '关之前先停模块，手册明说', 't20w');
  txt(scene, 680, 288, 'MMDC 的 CG 设 01 会挂整机', 't20w');
  txt(scene, 680, 324, '它和 fabric 共用一根根，不能独关', 't20w');
  txt(scene, 680, 360, 'CCM 与 SRC 的 IPG 时钟没有门，永远在跑', 't20w');
  txt(scene, 680, 396, '所以「寄存器读得到、外设不动」', 't20w');
  txt(scene, 680, 432, '多半是门关了，不是总线断了', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '常用门速查');
  txt(scene, 1280, 252, 'GPIO1 CCGR1[13] / GPIO2 CCGR0[15]', 't20s');
  txt(scene, 1280, 288, 'I2C1 CCGR2[3] / UART1 CCGR5[12]', 't20s');
  txt(scene, 1280, 324, 'ECSPI1 CCGR1[0] / SAI1 CCGR5[14]', 't20s');
  txt(scene, 1280, 360, 'USDHC1 CCGR6[1] / ENET CCGR0[6]', 't20s');
  txt(scene, 1280, 396, 'BCH CCGR4[12–15] / ADC1 CCGR1[8]', 't20s');
  txt(scene, 1280, 432, 'GPT1 CCGR1[10] / WDOG1 CCGR3[8]', 't20s');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, 'LPCG 是四输入与门，少一路就没时钟');
  txt(scene, 80, 522, '① CGR：CCM 按当前低功耗模式给出的门，就是 CCGR 里那两位。', 't20w');
  txt(scene, 80, 556, '② 模块自己的 enable：例如 GPT 的 ipg_enable_clk，可以用 CMEOR 那一位盖掉。', 't20w');
  txt(scene, 80, 590, '③ SRC 在复位过程里临时打开，保证复位逻辑自己有钟。', 't20w');
  txt(scene, 80, 624, '④ 熔丝硬连：出厂就定死，软件改不了。', 't20w');
  txt(scene, 80, 658, '四路与在一起，再和时钟同步一级才出门 —— 所以关门不会切出半个脉冲。', 't20w');
  txt(scene, 80, 692, '写法：字段 2 位，必须读-改-写 x = (x & ~(3 << 2n)) | (v << 2n)；整字覆盖会顺手关掉别人。', 't20w');
  txt(scene, 80, 726, '一次全开就写 0xFFFF_FFFF（就是它的复位值），调试阶段最稳；省电是功能跑通之后的事。', 't20w');
  txt(scene, 80, 760, '记住 CMEOR 的存在：门全开了模块还不响应时，先看这位是不是把模块的使能给盖住了。', 't20w');
}

function drawSwitch() {
  txt(scene, 56, 146, '改时钟不是写一个寄存器：先搬消费者、再切台阶、再改、等锁、最后切回来', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '改 ARM 频率六步');
  txt(scene, 80, 252, '① CCSR[2]=1：切到 step_clk', 't20w');
  txt(scene, 80, 288, '② PLL1 POWERDOWN=1，改 DIV', 't20w');
  txt(scene, 80, 324, '③ POWERDOWN=0，等 LOCK=1', 't20w');
  txt(scene, 80, 360, '④ 写 CACRR 的新分频', 't20w');
  txt(scene, 80, 396, '⑤ 等 CDHIPR[16] 清零', 't20w');
  txt(scene, 80, 432, '⑥ CCSR[2]=0：切回 pll1_main', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'step_clk 是谁');
  txt(scene, 680, 252, 'CCSR[8] STEP_SEL：0 = OSC 24 M', 't20w');
  txt(scene, 680, 288, '1 = secondary_clk', 't20w');
  txt(scene, 680, 324, 'CCSR[3] SECONDARY：0 = PFD2 400', 't20w');
  txt(scene, 680, 360, '1 = PLL2 528', 't20w');
  txt(scene, 680, 396, '拿 24 M 当台阶，频率会掉一半', 't20w');
  txt(scene, 680, 432, '升频时优先拿 PLL2 当台阶', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '改总线分频的顺序');
  txt(scene, 1280, 252, '先置 CCDR[17]=1，屏蔽 MMDC 握手', 't20w');
  txt(scene, 1280, 288, '手册说这位可以一直保持 1', 't20w');
  txt(scene, 1280, 324, '再写 CBCDR 的 AXI / AHB / IPG', 't20w');
  txt(scene, 1280, 360, '等 CDHIPR 对应的 BUSY 位清零', 't20w');
  txt(scene, 1280, 396, 'DMA 正跑时别改 AXI，会丢事务', 't20w');
  txt(scene, 1280, 432, '改完读回三个分频复核', 't20w');

  box(56, 456, 1812, 330, 'var(--surface)', 'var(--guide)');
  head(80, 494, '只有五个 mux 是无毛刺的，其余都要先关门');
  txt(scene, 80, 522, '无毛刺的五个：periph_clk(CDHIPR[5])、periph2_clk(CDHIPR[3])、axi_alt、pll3_sw、pll1_sw。', 't20w');
  txt(scene, 80, 556, '这五个切换时两个输入都必须活着，切换过程不出窄脉冲，所以允许在运行时换源。', 't20w');
  txt(scene, 80, 590, '其余是异步 mux：必须先把输出门掉（关 LPCG），切完再开，否则毛刺会打进后面的逻辑。', 't20w');
  txt(scene, 80, 624, '关 PLL 的硬规矩：所有消费者搬走或 BYPASS，再 POWERDOWN；顺序颠倒等于掐总线。', 't20w');
  txt(scene, 80, 658, '改 PLL 的正确姿势：BYPASS → POWERDOWN → 写 DIV → POWERUP → 等 LOCK → 撤 BYPASS。', 't20w');
  txt(scene, 80, 692, '判据一：改了没生效 = CDHIPR 一直 1，或写进了保留位；判据二：改完挂死 = 还有人吃这颗 PLL。', 't20w');
  txt(scene, 80, 726, '易错：PODF 的 0 才是 ÷1。把它读成 ÷0，就会觉得频率「差一倍」而反复改。', 't20w');
  txt(scene, 80, 760, '顺序记成一句话：先让人下车，再换车头，最后让人上车。中途谁还在车上，谁就被甩出去。', 't20w');
}

function drawMeasure() {
  txt(scene, 56, 146, '三个数一读就知道树对不对；CLKO 是最便宜的探头；这块板只能降频、不能降压', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '先读三个数');
  txt(scene, 80, 252, 'CCR 0x020C_4000 复位 0x0401_167F', 't20s');
  txt(scene, 80, 288, '其中 bit12 COSC_EN=1、OSCNT=127', 't20w');
  txt(scene, 80, 324, 'CSR 0x020C_4008，bit5 COSC_READY', 't20w');
  txt(scene, 80, 360, 'PLL_ARM 0x020C_8000，bit31 LOCK', 't20w');
  txt(scene, 80, 396, '读出 DIV=44 → 24×44/2 = 528', 't20w');
  txt(scene, 80, 432, 'CBCDR 0x020C_4014 反算 132 / 66', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'CLKO 是最便宜的探头');
  txt(scene, 680, 252, 'CCOSR 0x020C_4060：bit7 EN', 't20w');
  txt(scene, 680, 288, '[6:4] ÷1–8，[3:0] 选根', 't20w');
  txt(scene, 680, 324, 'IPG=1100、PERCLK=1101、AHB=1011', 't20w');
  txt(scene, 680, 360, 'CLKO1 出在 P14（JTAG_TMS）ALT3', 't20w');
  txt(scene, 680, 396, 'CLKO2 出在 N15（JTAG_TDO）ALT3', 't20w');
  txt(scene, 680, 432, '量到 66÷8 = 8.25 M 就说明树对了', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '板级真相');
  txt(scene, 1280, 252, 'Y2 24 MHz 接 XTALI/XTALO（T16/T17）', 't20w');
  txt(scene, 1280, 288, 'Y1 32.768 kHz 接 RTC_XTALI（T11）', 't20w');
  txt(scene, 1280, 324, 'VDD_ARM_IN 与 VDD_SOC_IN 并成一路', 't20w');
  txt(scene, 1280, 360, '经 L1 2.2 µH + R82 0Ω 进芯片', 't20w');
  txt(scene, 1280, 396, '原理图只有 PMIC_ON_REQ / STBY_REQ', 't20w');
  txt(scene, 1280, 432, '没有 I2C 可编程 PMIC → 不能降压', 't20w');

  box(56, 446, 1812, 342, 'var(--surface)', 'var(--guide)');
  head(80, 508, '所以这块板的 DVFS 只能降频；低功耗还有三个默认值坑');
  txt(scene, 80, 542, '降频不降压只省动态功耗的一部分：待机电流不会因此掉一半，别把 6Q 的 DVFS 表往这块板上套。', 't20w');
  txt(scene, 80, 575, '坑一：CLPCR 的 LPM[1:0] 复位是 01（WAIT），不是 RUN；想测 RUN 得先写 00。', 't20w');
  txt(scene, 80, 608, '坑二：VSTBY(bit8) 不置，进 STOP 永远不拉 PMIC_STBY_REQ，电源侧看不到任何动作。', 't20w');
  txt(scene, 80, 641, '坑三：BYPASS_MMDC_CH0(bit19) 手册要求必须写 1 —— 这颗 MMDC_CH0 根本没接。', 't20w');
  txt(scene, 80, 674, '进 STOP：先关外设门 → LPM=10 → WFI；出来要等 STBY_COUNT 个 CKIL 与 OSCNT 计完。', 't20w');
  txt(scene, 80, 707, '出 STOP 慢 5 ms 是正常的：OSCNT 128 个 32 k 周期约 3.9 ms，再加电源从待机电压爬回来。', 't20w');
  txt(scene, 80, 740, 'Linux 侧：clk_summary 里 pll1_sw / periphclk / ahb / ipg / perclk 五个数一对，就知道树对不对。', 't20w');
  txt(scene, 80, 773, '排查顺序固定：COSC_READY → PLL LOCK → CDHIPR → 根频率 → 门 → 引脚复用。按这个顺序走，不会绕圈。', 't20w');
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawTree();
  else if (s === 1) drawPll();
  else if (s === 2) drawRoots();
  else if (s === 3) drawGates();
  else if (s === 4) drawSwitch();
  else drawMeasure();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () {
  state.step = INIT.step; state.lane = INIT.lane; draw();
});
fitCanvas($('viewport'), $('canvas'), draw);
</script>
