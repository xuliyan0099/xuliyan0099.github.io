<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0, lane: 0 };
var state = { step: INIT.step, lane: INIT.lane };

var STEPS = [
  { h: '64 个邮箱的 CAN', hint: 'CAN 2.0B · 1 Mbps · 6 帧 FIFO',
    note: 'FLEXCAN 是完整的 CAN 2.0B 控制器：64 个邮箱、6 帧接收 FIFO、0–8 字节数据、最高 1 Mbps。它只管协议，总线电平要靠外部收发器。' },
  { h: '板上有收发器', hint: 'CAN1 · 120 Ω · 端子',
    note: 'ALPHA 板有 CAN 接线端子与 120 Ω 终端，MINI 板有带 RS 脚的收发器。这是全书第一个能真正挂上总线、收到别人帧的模块。' },
  { h: '寄存器地图', hint: '0x0209_0000 · 0x80 起是邮箱',
    note: 'MCR 复位 0x5980_000F（默认就在 Freeze、RFEN 打开）。0x00–0x4C 是控制与状态，0x80 起是 64 个 16 字节邮箱，0x880 起是 64 个个体掩码。' },
  { h: '位时序五个字段', hint: 'PRESDIV · PSEG1 · PSEG2',
    note: '一位 = (PROPSEG+1)+(PSEG1+1)+(PSEG2+1) 个时间份额，Sclock = fCANCLK/(PRESDIV+1)。24 MHz 要 500 kbps 就凑 48，即 12 份额 × ÷4。' },
  { h: '邮箱与中断', hint: 'CODE · ID · DLC · IFLAG',
    note: '每个邮箱 16 字节：CODE/SRR/IDE/RTR/DLC/时间戳 + ID + 8 字节数据。CODE 决定这个邮箱是收是发，IFLAG 每位对应一个邮箱。' },
  { h: '上总线九步', hint: 'Freeze · 回环 · ACK',
    note: 'CAN 配置必须在 Freeze 模式下写，写完清 HALT 才上线。先用 LPB 回环自测，再接第二个节点测 ACK —— ACK 错就是「总线上只有我一个」。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}

function drawRole() {
  txt(scene, 56, 146, 'FLEXCAN 把 CAN 协议全做在硬件里：仲裁、CRC、ACK、错误计数，软件只管邮箱', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '能力');
  txt(scene, 80, 252, 'CAN 2.0B，标准帧与扩展帧', 't20w');
  txt(scene, 80, 288, '数据帧与远程帧都支持', 't20w');
  txt(scene, 80, 324, '数据长度 0–8 字节', 't20w');
  txt(scene, 80, 360, '位速率最高 1 Mbps', 't20w');
  txt(scene, 80, 396, '64 个邮箱，每个可配收或发', 't20w');
  txt(scene, 80, 432, '接收 FIFO 6 帧深，带 ID 过滤', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '硬件替你做的事');
  txt(scene, 680, 252, '位填充、CRC 生成与校验', 't20w');
  txt(scene, 680, 288, '仲裁：ID 小的先赢，输家自动重发', 't20w');
  txt(scene, 680, 324, 'ACK 位检测与错误帧', 't20w');
  txt(scene, 680, 360, 'TX/RX 错误计数与主动/被动/离线', 't20w');
  txt(scene, 680, 396, '总线活动唤醒、只听模式、回环自测', 't20w');
  txt(scene, 680, 432, '16 位自由计时器给每帧打时间戳', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '它不负责的事');
  txt(scene, 1280, 252, '不管收发器：TX/RX 是 TTL 电平', 't20w');
  txt(scene, 1280, 288, '不管终端电阻：120 Ω 要板上焊', 't20w');
  txt(scene, 1280, 324, '不做高层协议：CANopen/J1939 在软件', 't20w');
  txt(scene, 1280, 360, '不做报文调度：邮箱顺序要自己排', 't20w');
  txt(scene, 1280, 396, '不做位速率自动检测：波特率必须两边一致', 't20w');
  txt(scene, 1280, 432, '不做电气隔离：隔离要外加', 't20w');

  wide(456, 330);
  head(80, 494, '为什么 CAN 是车载软件的必修课：它的可靠性来自「每个节点都在监听」');
  txt(scene, 80, 522, 'CAN 是广播总线：一帧发出去，所有节点都收到。每个收到正确帧的节点都要在 ACK 槽里回一个显性位，缺一个就报 ACK 错。', 't20w');
  txt(scene, 80, 556, '这条规则带来一个硬判据：单节点上总线，发一帧必然 ACK 错，错误计数一路涨到 128 进入被动错误，再涨到 256 进 Bus Off。', 't20w');
  txt(scene, 80, 590, '所以「发不出去」最常见的原因不是代码，而是总线上没有第二个活的节点，或者收发器没供电、终端电阻缺失。', 't20w');
  txt(scene, 80, 624, '仲裁靠 ID：两个节点同时发，ID 数值小的（显性位多的）赢，输的那个立刻退让并在下一空闲重发，报文不会丢。', 't20w');
  txt(scene, 80, 658, '邮箱机制是「内容寻址」：接收邮箱配好 ID 与掩码，硬件自己比对，匹配才写入并置 IFLAG，CPU 不必轮询每一位。', 't20w');
  txt(scene, 80, 692, '64 个邮箱可以当 64 条独立通道用：比如 4 个发（电机/刹车/仪表/诊断）、若干个收（每帧一个邮箱），也可以全交给 6 帧 FIFO。', 't20w');
  txt(scene, 80, 726, '和 ENET 的区别：CAN 没有 MAC 地址、没有交换机，只有 ID 优先级与广播；一帧最多 8 字节，靠「短帧 + 高优先级」保证实时。', 't20w');
  txt(scene, 80, 760, '本章的主线：先把位时序配对，再把邮箱配对，最后用回环 + 双节点两步验证 —— 三步错一步都通不了。', 't20w');
}

function drawBoard() {
  txt(scene, 56, 146, '本板有 CAN 收发器和端子，是全书第一个能真挂总线、真收别人帧的模块', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '芯片侧焊盘（三组可选）');
  txt(scene, 80, 252, 'F16 = CAN1_TX（ENET1_RX_DATA0 组）', 't20w');
  txt(scene, 80, 288, 'E17 = CAN1_RX（ENET1_RX_DATA1 组）', 't20w');
  txt(scene, 80, 324, 'G14 = CAN1_RX（ENET2 组）', 't20w');
  txt(scene, 80, 360, 'H15 = CAN1_TX（ENET2 组）', 't20w');
  txt(scene, 80, 396, 'B3 = CAN1_TX（USDHC1 组）', 't20w');
  txt(scene, 80, 432, 'B2 = CAN1_RX（USDHC1 组）', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '底板侧');
  txt(scene, 680, 252, 'ALPHA：CAN_H/CAN_L 到 2 位接线端子', 't20w');
  txt(scene, 680, 288, '端子旁并一只 120 Ω（R 标 120R）', 't20w');
  txt(scene, 680, 324, '网络名 CAN1_TX / CAN1_RX 接收发器', 't20w');
  txt(scene, 680, 360, 'MINI：U5 收发器，带 RS 引脚', 't20w');
  txt(scene, 680, 396, 'CANL/CANH 到端子，RS 用于斜率控制', 't20w');
  txt(scene, 680, 432, '两颗芯片都只引出 CAN1 到物理接口', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '硬件三个前提');
  txt(scene, 1280, 252, '收发器要供电：3.3 V 或 5 V', 't20w');
  txt(scene, 1280, 288, '总线两端各一只 120 Ω，不是每个节点', 't20w');
  txt(scene, 1280, 324, 'CAN_H 与 CAN_L 不能接反', 't20w');
  txt(scene, 1280, 360, '共地：两边 GND 必须连（非隔离时）', 't20w');
  txt(scene, 1280, 396, 'RS 脚别悬空（MINI 板尤其）', 't20w');
  txt(scene, 1280, 432, '两端波特率必须完全一致', 't20w');

  wide(456, 330);
  head(80, 494, '本板的接线现实：先量电平，再看波形，最后才发帧');
  txt(scene, 80, 522, 'ALPHA 板的 CAN 端子上电后应量到 CAN_H ≈ 2.5 V、CAN_L ≈ 2.5 V（隐性电平），两线差分接近 0 V。', 't20w');
  txt(scene, 80, 556, '若量到 0 V 或 5 V 固定，先查收发器供电与 RS/STB 引脚，别急着怀疑芯片 —— 收发器不工作时代码再对也发不出去。', 't20w');
  txt(scene, 80, 590, 'MINI 板的 U5 带 RS 脚：RS 接高电平会进待机，很多人「代码没问题但一条帧都没有」就是这里被拉高。', 't20w');
  txt(scene, 80, 624, '终端电阻：ALPHA 板端子旁默认就有一只 120 Ω；总线只在这块板上时它是唯一终端，另一只应在对面节点或另配。', 't20w');
  txt(scene, 80, 658, '两个节点的 ID 与波特率必须一致；CAN 没有自动协商，一边 500k 一边 250k，双方都只会看到错误帧。', 't20w');
  txt(scene, 80, 692, '接 USB-CAN 分析仪是最快的验证：分析仪发一帧，板子只要配好接收邮箱就能在 IFLAG 里看到，不必先写发送。', 't20w');
  txt(scene, 80, 726, '反过来，板子发、分析仪收，能看到帧就证明位时序、收发器、终端电阻三件全对。', 't20w');
  txt(scene, 80, 760, '本章的板级判据就三条：CAN_H/CAN_L 有 2.5 V、分析仪能收到帧、错误计数保持 0。', 't20w');
}

function drawRegs() {
  txt(scene, 56, 146, '基址 0x0209_0000：0x00–0x4C 是控制与状态，0x80 起是 64 个邮箱，0x880 起是个体掩码', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '控制与状态');
  txt(scene, 80, 252, '+0x00 MCR 复位 0x5980_000F', 't20s');
  txt(scene, 80, 288, '+0x04 CTRL1：位时序与模式', 't20s');
  txt(scene, 80, 324, '+0x08 TIMER：16 位自由计时器', 't20s');
  txt(scene, 80, 360, '+0x1C ECR：Tx/Rx 错误计数', 't20s');
  txt(scene, 80, 396, '+0x20 ESR1：状态与错误标志', 't20s');
  txt(scene, 80, 432, '+0x34 CTRL2 / +0x38 ESR2', 't20s');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '中断与掩码');
  txt(scene, 680, 252, '+0x24 IMASK2 / +0x28 IMASK1', 't20s');
  txt(scene, 680, 324, '+0x2C IFLAG2 / +0x30 IFLAG1', 't20s');
  txt(scene, 680, 360, 'IMASK1 位 0–4 对应 MB0–4', 't20w');
  txt(scene, 680, 396, '位 5/6/7 在 FIFO 模式下变语义', 't20w');
  txt(scene, 680, 432, '位 31–8 对应 MB31–MB8', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '邮箱与掩码');
  txt(scene, 1280, 252, '+0x80–0x47C：64 × 16 字节邮箱', 't20s');
  txt(scene, 1280, 288, '第 n 个邮箱地址 = 0x80 + 16n', 't20s');
  txt(scene, 1280, 324, '+0x880–0x97C：RXIMR0–63', 't20s');
  txt(scene, 1280, 360, '+0x10 RXMGMASK 全局掩码', 't20s');
  txt(scene, 1280, 396, '+0x48 RXFGMASK：FIFO 全局掩码', 't20s');
  txt(scene, 1280, 432, '+0x44 CRCR：最近一次接收帧的 CRC', 't20s');

  wide(456, 330);
  head(80, 494, 'MCR 的复位值是 0x5980_000F：一上电它就在 Freeze，且 FIFO 是开的');
  txt(scene, 80, 522, 'bit31 MDIS=0（模块使能）、bit30 FRZ=1、bit29 RFEN=1（FIFO 使能）、bit28 HALT=1：复位后默认进 Freeze，方便你直接写配置。', 't20w');
  txt(scene, 80, 556, 'bit27 NOT_RDY 是只读：Freeze/Stop/Disable 时都为 1；bit24 FRZ_ACK 才是「已经进 Freeze、预分频已停」的确认位。', 't20w');
  txt(scene, 80, 590, 'bit23 SUPV 复位为 1：部分寄存器只允许特权访问；Linux 里内核态天然满足，裸机要注意。', 't20w');
  txt(scene, 80, 658, 'bit16 IRMQ=1 时才启用「个体掩码 + 队列」；bit17 SRX_DIS 控制是否接收自己发的帧（自测时会用到）。', 't20w');
  txt(scene, 80, 624, 'bit25 SOFT_RST 是软复位：自清，只复位 MCR/TIMER/ECR/ESR/IMASK/IFLAG，不动 CTRL1/CTRL2 与邮箱 —— 想保留位时序时很好用。', 't20w');
  txt(scene, 80, 692, '要改 CTRL1/CTRL2/MCR 的关键位（PRESDIV、RFFN、RFEN…）必须先进 Freeze，否则写着写着就被硬件挡回。', 't20w');
  txt(scene, 80, 726, '邮箱区可以当普通 RAM 用：不用那么多邮箱时，剩余空间不会被浪费，手册明确允许。', 't20w');
  txt(scene, 80, 760, '读寄存器的顺序有讲究：ESR1 的某些错误位「读后清」，调试时先存一份原始值再分析。', 't20w');
}

function drawBits() {
  txt(scene, 56, 146, '一位 = 若干时间份额，份额 = 1/(fCANCLK/(PRESDIV+1))；把这两个数凑成目标波特率', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '五个字段');
  txt(scene, 80, 252, 'PRESDIV[31:24]：Sclock = fCANCLK/(n+1)', 't20w');
  txt(scene, 80, 288, 'PROPSEG[2:0]：传播段 (n+1) 份额', 't20w');
  txt(scene, 80, 324, 'PSEG1[21:19]：相位段 1 (n+1)', 't20w');
  txt(scene, 80, 360, 'PSEG2[18:16]：相位段 2 (n+1)', 't20w');
  txt(scene, 80, 396, 'RJW[23:22]：重同步跳宽 (n+1)', 't20w');
  txt(scene, 80, 432, 'SMP[7]：1 = 三采样多数表决', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '公式');
  txt(scene, 680, 252, '一位份额数 Q = 1+(P1+1)+(P2+1)+(PROP+1)', 't20s');
  txt(scene, 680, 288, '位时间 = Q × (PRESDIV+1) / fCANCLK', 't20s');
  txt(scene, 680, 324, '波特率 = fCANCLK / ((PRESDIV+1) × Q)', 't20s');
  txt(scene, 680, 360, '采样点 = (1+PROP+PSEG1) / Q', 't20w');
  txt(scene, 680, 396, 'CAN 惯例采样点 87.5%（Q=8 时 7/8）', 't20w');
  txt(scene, 680, 432, 'RJW 一般取 1–2 份额', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '24 MHz 三个算例');
  txt(scene, 1280, 252, '500 kbps：48 = 12 份额 × ÷4', 't20w');
  txt(scene, 1280, 288, 'PRESDIV=3、PROP=2、PSEG1=6、PSEG2=1', 't20s');
  txt(scene, 1280, 324, '250 kbps：96 = 12 × ÷8 → PRESDIV=7', 't20w');
  txt(scene, 1280, 360, '1 Mbps：24 = 12 × ÷2 → PRESDIV=1', 't20w');
  txt(scene, 1280, 396, '若 fCANCLK=66 MHz，500k 要 132=12×÷11', 't20w');
  txt(scene, 1280, 432, '同一块板两颗芯片的 fCANCLK 可能不同', 't20w');

  wide(456, 330);
  head(80, 494, '为什么采样点定在 87.5%：让所有节点的「共同点」落在同一位位置');
  txt(scene, 80, 522, 'CAN 的位是「名义位」，各节点时钟有偏差，靠每个跳变边沿做重同步把误差摊到 PROP 段与两个相位段里。', 't20w');
  txt(scene, 80, 556, '采样点太靠前，线上的传播延迟与转发器延迟还没稳定；太靠后，留给 PSEG2 补偿的时间不够。87.5% 是折中。', 't20w');
  txt(scene, 80, 590, '12 份额的分配：PROP=2（3 份额）、PSEG1=6（7 份额）、PSEG2=1（2 份额）；采样点在 (3+7)/12 = 83.3%，接近惯例。', 't20w');
  txt(scene, 80, 624, '想精确 87.5% 就用 8 份额：PROP=0（1）、PSEG1=5（6）、PSEG2=1（2），采样点 7/8。但 24 MHz/8 份额最小只能到 3 Mbps 以上才整除。', 't20w');
  txt(scene, 80, 658, 'RJW 决定一次重同步最多能跳几个份额：跳太大抖动大，跳太小遇到晶振偏差大的节点会采样错。一般 RJW=1。', 't20w');
  txt(scene, 80, 692, 'SMP=1 三采样只对低速有用：1 Mbps 时三个采样点跨越的时间已经接近一位，反而容易误判。', 't20w');
  txt(scene, 80, 726, '误差判据：示波器量一帧的时间（标准帧 108–135 位），与「位数 × 位时间」对不上，就是整除没凑好或 fCANCLK 弄错了。', 't20w');
  txt(scene, 80, 760, '记住这条：PRESDIV 与 Q 的乘积必须是 fCANCLK/波特率的整数倍，凑不出整数就换 CAN_CLK_ROOT。', 't20w');
}

function drawMb() {
  txt(scene, 56, 146, '邮箱 16 字节：CODE 决定「收还是发」，ID 加掩码决定「收什么」，IFLAG 决定「怎么通知你」', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '四个字');
  txt(scene, 80, 252, '+0x0：CODE[31:24] SRR[22] IDE[21] RTR[20] DLC[19:16]', 't20s');
  txt(scene, 80, 288, '+0x0 低 16 位：时间戳', 't20s');
  txt(scene, 80, 324, '+0x4：PRIO[31:29] + 标准 ID[28:18]', 't20s');
  txt(scene, 80, 360, '+0x4 扩展 ID[28:0]（29 位）', 't20s');
  txt(scene, 80, 396, '+0x8：DATA0–3', 't20s');
  txt(scene, 80, 432, '+0xC：DATA4–7', 't20s');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '接收 CODE');
  txt(scene, 680, 252, '0b0000 INACTIVE：不参与匹配', 't20w');
  txt(scene, 680, 288, '0b0100 EMPTY：激活且空，等帧', 't20w');
  txt(scene, 680, 324, '0b0010 FULL：已收一帧未读', 't20w');
  txt(scene, 680, 360, '0b0110 OVERRUN：未读又来了新帧', 't20w');
  txt(scene, 680, 396, '0b1010 RANSWER：远程应答邮箱', 't20w');
  txt(scene, 680, 432, '读 C/S 字后 CODE 自动回 EMPTY', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '发送 CODE');
  txt(scene, 1280, 252, '0b1000 INACTIVE：不参与仲裁', 't20w');
  txt(scene, 1280, 288, '0b1001 ABORT：主动中止', 't20w');
  txt(scene, 1280, 324, '0b1100 DATA：发一次数据帧', 't20w');
  txt(scene, 1280, 360, '0b1100 + RTR=1：发远程请求帧', 't20w');
  txt(scene, 1280, 396, '发完自动回 INACTIVE（RTR 则回 EMPTY）', 't20w');
  txt(scene, 1280, 432, '写 CODE 就相当于「把信投进邮筒」', 't20w');

  wide(456, 330);
  head(80, 494, '掩码：写 1 的位参与比较，写 0 的位不关心');
  txt(scene, 80, 522, 'RXIMR 是每个邮箱的个体掩码，RXMGMASK 是全局掩码；MCR[IRMQ]=1 时个体掩码生效，=0 时退回 14/15 号与全局掩码。', 't20w');
  txt(scene, 80, 556, '标准 ID 只占 11 位，所以掩码写 0x7FF 表示「11 位全比」，写 0x7F0 表示「比较高 7 位，低 4 位随意」。', 't20w');
  txt(scene, 80, 590, '例：收 0x123 精确帧 → ID=0x123、掩码=0x7FF；收 0x12x 一组 → ID=0x120、掩码=0x7F0。', 't20w');
  txt(scene, 80, 624, '扩展 ID 29 位，掩码也 29 位；IDE 位必须一起比（EACEN=1 时 RTR 也比），否则标准/扩展帧会串。', 't20w');
  txt(scene, 80, 658, 'IFLAG1 一位对一邮箱：MB0–4 是独立位，MB5/6/7 在 FIFO 开启后变成「有帧/将满/溢出」，MB8–31 在 bit31..8。', 't20w');
  txt(scene, 80, 692, '中断服务要「先读 C/S 再读数据」：读 C/S 会释放邮箱（CODE 回 EMPTY），顺序反了可能读到半新半旧的帧。', 't20w');
  txt(scene, 80, 726, 'FIFO 用 RFFN 定过滤器数量：RFFN=0 → 8 个过滤器占 MB0–7；RFFN 越大过滤器越多，可用邮箱越少。', 't20w');
  txt(scene, 80, 760, '优先级方案三种：最低 ID 优先、最低邮箱号优先、最高优先级字段优先（MCR[LPRIO_EN]）。', 't20w');
}

function drawInit() {
  txt(scene, 56, 146, '九步上线：进 Freeze → 配位时序 → 配邮箱 → 清 HALT → 回环自测 → 双节点验证', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '九步');
  txt(scene, 80, 250, '① 清 MCR[MDIS]，置 MCR[FRZ]', 't20w');
  txt(scene, 80, 286, '② 置 MCR[HALT]，等 FRZ_ACK=1', 't20w');
  txt(scene, 80, 322, '③ 写 CTRL1：PRESDIV/段/RJW', 't20w');
  txt(scene, 80, 358, '④ 写掩码与邮箱：CODE/ID/DLC/数据', 't20w');
  txt(scene, 80, 394, '⑤ 需要 FIFO 就配 RFEN 与 RFFN', 't20w');
  txt(scene, 80, 430, '⑥ 清 HALT，等 NOT_RDY=0', 't20w');
  txt(scene, 80, 466, '⑦ 置 IMASK，开邮箱中断', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '两级自测');
  txt(scene, 680, 250, 'A. 回环：CTRL1[LPB]=1', 't20w');
  txt(scene, 680, 286, 'TX 内部接到 RX，ACK 自己给', 't20w');
  txt(scene, 680, 322, '发一帧能在自己邮箱收到', 't20w');
  txt(scene, 680, 358, '过了说明位时序、邮箱、中断都对', 't20w');
  txt(scene, 680, 394, 'B. 双节点：LPB=0，接分析仪', 't20w');
  txt(scene, 680, 430, '发帧被 ACK → 线上真有第二个节点', 't20w');
  txt(scene, 680, 466, '两步都过才算「上总线成功」', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '六个坑');
  txt(scene, 1280, 250, '坑一：不进 Freeze 就写 PRESDIV', 't20w');
  txt(scene, 1280, 286, '坑二：忘清 HALT，一直不发帧', 't20w');
  txt(scene, 1280, 322, '坑三：ID 掩码写错，收到别处邮箱', 't20w');
  txt(scene, 1280, 358, '坑四：波特率与对端不一致', 't20w');
  txt(scene, 1280, 394, '坑五：单节点硬发，错误计数涨到 Bus Off', 't20w');
  txt(scene, 1280, 430, '坑六：收发器 RS/STB 被拉高', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '把判据分成两层：配置对、线上对', 't24');
  txt(scene, 80, 522, '配置对的判据：回环模式下自发自收成功，ESR1 的 SYNCH=1、错误计数保持 0、IFLAG 对应位被置起。', 't20w');
  txt(scene, 80, 556, '线上对的判据：LPB=0 时发帧不再报 ACK_ERR，且分析仪能抓到同样的 ID 与数据；两端都收到对方的帧。', 't20w');
  txt(scene, 80, 590, '如果回环都过不了，问题一定在芯片侧：位时序算错、邮箱 CODE 没写、IMASK/IFLAG 搞混、或者压根没清 HALT。', 't20w');
  txt(scene, 80, 624, '如果回环过、单节点发就报 ACK 错，那不是 bug 而是物理事实：CAN 需要至少两个节点，接线端子只接了一根线也一样。', 't20w');
  txt(scene, 80, 658, '错误计数是最好的诊断工具：TXERRCNT 每次 ACK 错 +8，到 96 进警告、128 进被动、256 Bus Off，涨得越快说明越没对上。', 't20w');
  txt(scene, 80, 692, '最后提醒：改波特率、改掩码、改 FIFO 都要重新进 Freeze；运行时改这些位会被硬件静默忽略，表现为「写了没反应」。', 't20w');
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawRole();
  else if (s === 1) drawBoard();
  else if (s === 2) drawRegs();
  else if (s === 3) drawBits();
  else if (s === 4) drawMb();
  else drawInit();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () {
  state.step = INIT.step; state.lane = INIT.lane; draw();
});
fitCanvas($('viewport'), $('canvas'), draw);
</script>
