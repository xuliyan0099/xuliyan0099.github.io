<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0, lane: 0 };
var state = { step: INIT.step, lane: INIT.lane };

var STEPS = [
  { h: '一颗 A7 的全部家当', hint: '核 / 缓存 / GIC / 总线',
    note: '这 4 页没有寄存器，只有一张「配置清单」：单核 Cortex-A7、32 KB L1 指令 + 32 KB L1 数据、128 KB 统一 L2、集成 GIC 支持 128 个共享外设中断、128 bit AXI 主口、SCU 与通用定时器。别小看这页纸——你后面所有「为什么这里慢」「为什么中断号到 159」的问题，答案都在这些数字里。' },
  { h: '缓存层级决定实测差异', hint: 'L1 32K × 2、L2 128K',
    note: 'L1 是每核私有、哈佛结构（指令和数据分开），L2 是统一缓存、容量 128 KB、数据 RAM 延迟 2 个周期。i.MX6ULL 只有单核，所以 SCU 在这里几乎不起作用，真正影响性能的是 L2 的共享带宽和写回策略：一份 128 KB 的表刚好塞满 L2，再大就会持续回写到 DDR，速度掉一个台阶。' },
  { h: '五个时钟名，两个根', hint: 'AXI 与 APB 都是 1:2',
    note: 'Arm 平台的时钟只有五个名字：clk_ahb、clk_apb_dbg、clk_atb、ipg_clk、trace_clk_in，前四个分别挂在 ahb_clk_root 与 ipg_clk_root 上。关键约束是两条 1:2 分频：AXI 主口跑内核的一半，APB 调试口也跑内核的一半。528 MHz 内核 → 264 MHz AXI，这就是 DDR 带宽的上限来源。' },
  { h: '低功耗按域切，不按模块切', hint: 'CPU+L1 / SCU+L2 / L2 RAM / ETM',
    note: '手册把这颗 A7 的电源域分成四块：CPU 与各自的 L1、SCU 与 L2 控制器、L2 的 RAM 阵列、调试（含 ETM）。所以「关核」和「关 L2」是两件事，L2 RAM 可以单独掉电。低功耗还有两手：本地通用定时器配全局系统计数器做定时事件，以及 overdrive / non-overdrive 两档 DVFS。' },
  { h: '在板子上核对这几条', hint: 'cpuinfo / lscpu / cpufreq',
    note: '手册里的数字在 Linux 下都能对上：/proc/cpuinfo 看 processor 只有 0、Features 里有 neon/vfpv4、CPU part 0xc07；lscpu 报 L1d/L1i 各 32K、L2 128K；cpufreq 的频率表通常是 198/396/528 MHz 三档。三个地方对不上，就说明你拿的不是这颗芯片的默认配置。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function arrow(x1, y1, x2, y2) {
  svgEl(scene, 'line', { x1: x1, y1: y1, x2: x2, y2: y2, stroke: 'var(--text-2)', 'stroke-width': 4 });
  var a = Math.atan2(y2 - y1, x2 - x1), L = 18, W = 9;
  svgEl(scene, 'path', {
    d: 'M' + x2 + ' ' + y2 + ' L' + (x2 - L * Math.cos(a) + W * Math.sin(a)) + ' ' + (y2 - L * Math.sin(a) - W * Math.cos(a)) +
      ' L' + (x2 - L * Math.cos(a) - W * Math.sin(a)) + ' ' + (y2 - L * Math.sin(a) + W * Math.cos(a)) + ' Z',
    fill: 'var(--text-2)', stroke: 'none'
  });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }

function drawParts() {
  txt(scene, 56, 148, '四页纸只有一张配置清单：单核 A7 + 32K/32K L1 + 128K L2 + 128 个共享中断', 't24w');

  var CARDS = [
    ['Cortex-A7 · 单核', 'MP020-BU-50000 r0p5', 'ARMv7-A，含虚拟化与大物理地址', 'NEON(SIMDv2) + FPU(VFPv4-D32)', 'LPA 只在本平台内生效'],
    ['L1 缓存 · 哈佛', '32 KB 指令 + 32 KB 数据', '每核私有，指令与数据分开', '命中 1–2 拍，未命中进 L2', '自修改代码要清 I-cache'],
    ['L2 缓存 · 统一', '128 KB，数据 RAM 延迟 2 拍', '指令与数据共用', '单核下 SCU 几乎不起作用', '超过 128 KB 的表会持续回写'],
    ['GIC · 集成', '128 个共享外设中断', '私有中断另计：SGI/PPI', '与第 3 章的中断号表对应', '中断号 ≥32 的都在共享区'],
    ['总线 · AXI 128 bit', '跑内核的一半速度', '528 MHz 核 → 264 MHz AXI', '16 B/拍 × 264 MHz ≈ 4.2 GB/s', '这是 DDR 带宽的理论天花板'],
    ['定时器 · 通用', '本地 generic timer + 全局计数', '事件靠 architected timer', '不占用外设定时器', '与 GPT/EPIT 是两套东西']
  ];
  CARDS.forEach(function (c, i) {
    var col = i % 3, row = Math.floor(i / 3);
    var x = 56 + col * 612, y = 176 + row * 216;
    box(x, y, 584, 200, 'var(--page)', i === 0 ? 'var(--observe-line)' : 'var(--guide)', i === 0 ? 4 : 2);
    txt(scene, x + 20, y + 38, c[0], 't28');
    txt(scene, x + 20, y + 72, c[1], 't20w');
    txt(scene, x + 20, y + 104, c[2], 't20w');
    txt(scene, x + 20, y + 136, c[3], 't20w');
    txt(scene, x + 20, y + 168, c[4], 't20w');
  });

  box(56, 640, 1812, 142, 'var(--surface)', 'var(--guide)');
  txt(scene, 80, 678, '一句话：这颗「平台」不是 CPU 一个块，而是 CPU + 两级缓存 + GIC + 定时器 + 总线接口打包在一起的一套东西。', 't24w');
  txt(scene, 80, 714, '所以改 DDR 时序、改时钟分频、改中断路由，都是在动这个平台的外围，而不是动 CPU 内部——CPU 内部你只能通过协处理器和 CP15 去碰。', 't20w');
  txt(scene, 80, 750, 'r0p5 这个修订号也会出现在 /proc/cpuinfo 的 CPU revision 字段里，对不上就说明厂商换了料。', 't20w');
}

function drawCache() {
  txt(scene, 56, 148, 'L1 管延迟，L2 管容量；128 KB 是这个平台上最该记住的数', 't24w');

  box(56, 186, 560, 240, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 224, 'L1 · 32 KB + 32 KB');
  txt(scene, 80, 262, '哈佛结构：I-cache 与 D-cache 物理分开', 't20w');
  txt(scene, 80, 296, '各自 4 路组相联（Cortex-A7 固定结构）', 't20w');
  txt(scene, 80, 330, 'D-cache 写回 + 写分配，脏行靠 evict 回写', 't20w');
  txt(scene, 80, 364, '自修改代码必须先 clean D-cache 再 invalidate I', 't20w');
  txt(scene, 80, 398, 'DMA 前后要做 clean/invalidate，否则读到旧行', 't20w');

  box(644, 186, 560, 240, 'var(--page)', 'var(--line)', 2);
  head(668, 224, 'L2 · 128 KB 统一');
  txt(scene, 668, 262, '指令 + 数据共用，单核独占', 't20w');
  txt(scene, 668, 296, '数据 RAM 延迟 2 个周期（Table 12-3）', 't20w');
  txt(scene, 668, 330, '写回式，不写穿；一致性靠软件或 SCU', 't20w');
  txt(scene, 668, 364, '128 KB 表刚好塞满，超一点就开始回写', 't20w');
  txt(scene, 668, 398, '禁用 L2 只用于排查，正常运行必开', 't20w');

  box(1232, 186, 636, 240, 'var(--page)', 'var(--alert-line)', 4);
  head(1256, 224, '换算成实测能感觉到的差别');
  txt(scene, 1256, 262, '528 MHz 内核 / 264 MHz AXI / 16 B 每拍', 't20w');
  txt(scene, 1256, 296, '→ 峰值 ≈ 4.2 GB/s，且是读写共享', 't20w');
  txt(scene, 1256, 330, '一张 128 KB 的查找表：常在 L2 里，几拍就回', 't20w');
  txt(scene, 1256, 364, '一张 1 MB 的表：每次几乎都从 DDR 取', 't20w');
  txt(scene, 1256, 398, '同一份代码，数据规模翻 8 倍，耗时可能翻 3 倍', 't20w');

  box(56, 460, 1812, 300, 'var(--surface)', 'var(--guide)');
  head(80, 500, '四条缓存纪律（在裸机与驱动里都要守）');
  txt(scene, 80, 540, '① DMA 发送前：clean D-cache，让 DDR 里的副本是新的；否则外设拿到的是旧数据。', 't20w');
  txt(scene, 80, 574, '② DMA 接收后：invalidate D-cache，否则 CPU 读到的是缓冲区里的旧行。', 't20w');
  txt(scene, 80, 608, '③ 改完代码再跑：clean + invalidate I-cache + ISB，不然执行的是旧指令。', 't20w');
  txt(scene, 80, 642, '④ 关闭 MMU 时缓存策略由 CP15 的 SCTLR 位控制；开着 MMU 时由页表属性控制，两者别混。', 't20w');
  txt(scene, 80, 682, '记住一条判据：同样的代码在大数组上「莫名变慢」，先怀疑缓存，而不是先怀疑编译器。', 't20w');
  txt(scene, 80, 716, '这块板没有第二级共享缓存冲突问题（单核），但 L2 被显示/网络 DMA 抢带宽时，CPU 侧延迟会明显上升。', 't20w');
}

function drawClocks() {
  txt(scene, 56, 148, 'Arm 平台只有五个时钟名，全部由 ahb_clk_root 与 ipg_clk_root 派生', 't24w');

  box(56, 176, 340, 48, 'var(--surface)', 'var(--line)', 2);
  txt(scene, 80, 208, '时钟名', 't24');
  box(412, 176, 420, 48, 'var(--surface)', 'var(--line)', 2);
  txt(scene, 436, 208, '时钟根', 't24');
  box(848, 176, 1020, 48, 'var(--surface)', 'var(--line)', 2);
  txt(scene, 872, 208, '说明与约束', 't24');

  var ROWS = [
    ['clk_ahb', 'ahb_clk_root', 'AHB 总线时钟，CPU 与片上外设的总线节奏'],
    ['clk_apb_dbg', 'ahb_clk_root', 'APB 调试口，固定 1:2 于内核（528 → 264 MHz）'],
    ['clk_atb', 'ahb_clk_root', 'ATB 追踪总线，给 ETM/Coresight 用'],
    ['ipg_clk', 'ipg_clk_root', '外设寄存器访问的 IPG 时钟，通常远低于 AHB'],
    ['trace_clk_in', 'ahb_clk_root', '外部追踪时钟输入，调试时用']
  ];
  ROWS.forEach(function (r, i) {
    var y = 236 + i * 56, hi = i === 1 ? 'var(--alert-line)' : 'var(--line)';
    box(56, y, 340, 48, 'var(--page)', hi, i === 1 ? 4 : 2);
    txt(scene, 80, y + 32, r[0], 't24');
    box(412, y, 420, 48, 'var(--page)', 'var(--line)', 2);
    txt(scene, 436, y + 32, r[1], 't20w');
    box(848, y, 1020, 48, 'var(--page)', 'var(--line)', 2);
    txt(scene, 872, y + 32, r[2], 't20w');
  });

  box(56, 540, 1812, 236, 'var(--surface)', 'var(--guide)');
  head(80, 578, '两条 1:2 分频，决定了这颗芯片的「理论带宽」');
  txt(scene, 80, 618, 'AXI 主口 = 内核 / 2：528 MHz 内核 → 264 MHz AXI，128 bit 宽 → 16 B × 264 M ≈ 4.2 GB/s 峰值。', 't20w');
  txt(scene, 80, 652, 'APB 调试口 = 内核 / 2：这就是为什么在 528 MHz 上调试，单步与读内存感觉比预期慢一倍。', 't20w');
  txt(scene, 80, 686, '这两个比例是硬件固定的，不是 CCM 里可调的分频——CCM 只能改根时钟本身，不能改 1:2 这个关系。', 't20w');
  txt(scene, 80, 722, '所以要提带宽，只有两条路：提内核频率（上限 528），或者减少每拍的浪费（对齐访问、合并传输、别做非对齐小包）。', 't20w');
}

function drawPower() {
  txt(scene, 56, 148, 'A7 平台的电源域按结构切：核、控制器、RAM 阵列、调试各自独立', 't24w');

  var DOM = [
    ['① CPU + L1', '核与两级 L1 缓存同域', '掉电即丢上下文与 L1 内容'],
    ['② SCU + L2', '逻辑部分，可与 L2 阵列分开', '关它之前先把 L2 内容处理掉'],
    ['③ L2 RAM 阵列', '128 KB 数据 RAM 单独一轨', '掉电即丢；唤醒后是一片废数据'],
    ['④ Debug + ETM', '调试与追踪逻辑', '调试域掉电后 JTAG 只能看到空壳']
  ];
  DOM.forEach(function (d, i) {
    var x = 56 + i * 460, y = 176;
    box(x, y, 432, 190, 'var(--page)', 'var(--line)', 2);
    txt(scene, x + 20, y + 40, d[0], 't28');
    txt(scene, x + 20, y + 84, d[1], 't20w');
    txt(scene, x + 20, y + 120, d[2], 't20w');
  });

  box(56, 400, 892, 180, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 438, '定时事件：本地定时器 + 全局计数');
  txt(scene, 80, 476, '每个核有 architected timer（CNTFRQ / CNTV），配全局系统计数器', 't20w');
  txt(scene, 80, 510, '它不占 GPT/EPIT，也不依赖 32k——所以休眠里能当唤醒源', 't20w');
  txt(scene, 80, 544, 'Linux 里就是 clocksource/clockevent 的首选，dmesg 有 arch_timer', 't20w');

  box(976, 400, 892, 180, 'var(--page)', 'var(--alert-line)', 4);
  head(1000, 438, '两档 DVFS');
  txt(scene, 1000, 476, 'overdrive：高频档，需要更高 VDD_ARM，散热与功耗都上去', 't20w');
  txt(scene, 1000, 510, 'non-overdrive：常规档，同频下电压更低，漏电更小', 't20w');
  txt(scene, 1000, 544, '切换必须频率与电压成对改，顺序错了会跑飞（见第 10 章）', 't20w');

  box(56, 600, 1812, 182, 'var(--surface)', 'var(--guide)');
  head(80, 638, '为什么这页对写驱动的人有用');
  txt(scene, 80, 676, '你要做低功耗，先明确要关哪一域：关核 → CPU 域；保上下文丢 L2 → 关 L2 阵列；只想停调试 → 关 ETM 域。三者入口不同。', 't20w');
  txt(scene, 80, 710, '这也是为什么 suspend 里「唤醒后变量变成随机值」：栈在 DDR，L2 里的脏行没回写就被断电，回来读到的是 DDR 的旧值。', 't20w');
  txt(scene, 80, 744, '判据：进 suspend 前必须 flush 所有 L2 脏行（clean+invalidate），否则数据一致性由运气决定。', 't20w');
}

function drawVerify() {
  txt(scene, 56, 148, '三条命令核对手册里的数字，全对上才算这颗芯片', 't24w');

  box(56, 176, 588, 300, 'var(--page)', 'var(--line)', 2);
  head(80, 214, '① /proc/cpuinfo');
  txt(scene, 80, 252, 'cat /proc/cpuinfo | head -20', 't24');
  txt(scene, 80, 288, 'processor : 0 → 单核，没有 processor 1', 't20w');
  txt(scene, 80, 320, 'CPU part : 0xc07 → Cortex-A7', 't20w');
  txt(scene, 80, 352, 'Features : 含 neon / vfpv4 / half / thumb2', 't20w');
  txt(scene, 80, 384, 'CPU revision / variant 对应 r0p5', 't20w');
  txt(scene, 80, 420, '对不上 → 不是同一批芯片或内核裁剪过', 't20w');

  box(668, 176, 588, 300, 'var(--page)', 'var(--line)', 2);
  head(692, 214, '② lscpu 与缓存');
  txt(scene, 692, 252, 'lscpu', 't24');
  txt(scene, 692, 288, 'L1d cache: 32 KiB', 't20w');
  txt(scene, 692, 320, 'L1i cache: 32 KiB', 't20w');
  txt(scene, 692, 352, 'L2 cache: 128 KiB', 't20w');
  txt(scene, 692, 384, 'ls /sys/devices/system/cpu/cpu0/cache/', 't24');
  txt(scene, 692, 420, 'index0/1 → L1，index2 → L2，size 字段可读', 't20w');

  box(1280, 176, 588, 300, 'var(--page)', 'var(--alert-line)', 4);
  head(1304, 214, '③ 频率与超频档');
  txt(scene, 1304, 252, 'cat .../cpufreq/scaling_available_frequencies', 't20w');
  txt(scene, 1304, 288, '常见三档：198000 396000 528000', 't20w');
  txt(scene, 1304, 320, 'cat .../cpuinfo_cur_freq → 当前实际频率', 't20w');
  txt(scene, 1304, 352, 'governor=ondemand 时会自己跳档', 't20w');
  txt(scene, 1304, 384, '固定测性能：performance + 528000', 't20w');
  txt(scene, 1304, 420, '频率上不去 → 先看稳压器与过温，不是先改驱动', 't20w');

  box(56, 500, 1812, 200, 'var(--surface)', 'var(--guide)');
  head(80, 538, '手册与实测的对照表');
  txt(scene, 80, 576, '表 12-3 说 L2 数据 RAM 延迟 2 拍 —— 实测没法直接量，但可以用「同样循环、数据从 64 KB 涨到 256 KB」的耗时台阶间接验证。', 't20w');
  txt(scene, 80, 610, '表 12-1 说 AXI 是内核的一半 —— 用 DDR 顺序读写带宽测（memcpy 大块）通常落在 1.5–3 GB/s，远低于 4.2 的理论峰值。', 't20w');
  txt(scene, 80, 644, '128 个共享中断对应 GIC 的 ID 32–159 —— 在 /proc/interrupts 里能直接看到这些编号被谁占用。', 't20w');
  txt(scene, 80, 678, '这三条都是「手册写的数」与「你能测到的数」之间的桥；对不上时，先怀疑自己的测量方法，再怀疑硬件。', 't20w');
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawParts();
  else if (s === 1) drawCache();
  else if (s === 2) drawClocks();
  else if (s === 3) drawPower();
  else drawVerify();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () {
  state.step = INIT.step; state.lane = INIT.lane; draw();
});
fitCanvas($('viewport'), $('canvas'), draw);
</script>
</body>
</html>
