<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0 };
var state = { step: INIT.step };

var STEPS = [
  { h: '一颗 A7 的全部家当', hint: '核 / 缓存 / GIC / 总线',
    note: '单核 Cortex-A7（r0p5）、32 KB L1 指令 + 32 KB L1 数据、128 KB 统一 L2、GIC 支持 128 个共享中断、128 bit AXI 主口。' },
  { h: '缓存层级决定实测差异', hint: 'L1 32K×2、L2 128K',
    note: 'L1 哈佛结构、每核私有；L2 统一、数据 RAM 延迟 2 拍；128 KB 的表刚好塞满 L2，再大就持续回写。' },
  { h: '缓存维护与 DMA 一致性', hint: 'CP15 c7',
    note: 'I-cache 与 D-cache 分开清；DMA 前后必须 clean / invalidate，按 set/way 还是按地址要分清。' },
  { h: 'GIC 与中断号分配', hint: 'SGI/PPI/SPI',
    note: '0–15 是软件中断、16–31 是私有外设中断、32 起才是共享外设中断，共 128 个共享。' },
  { h: '五个时钟名，两个根', hint: 'AXI 与 APB 都是 1:2',
    note: 'clk_ahb、clk_apb_dbg、clk_atb、ipg_clk、trace_clk_in；AXI 与 APB 调试口都跑内核的一半。' },
  { h: '低功耗按域切，不按模块切', hint: 'CPU+L1 / SCU+L2 / L2 RAM / ETM',
    note: '四块域可分别断电；另有本地与全局定时器，以及 overdrive / non-overdrive 两档 DVFS。' },
  { h: '在板子上核对这几条', hint: 'cpuinfo / lscpu / cpufreq',
    note: 'CPU part 0xc07、Features 有 neon/vfpv4、L1d/L1i 各 32K、L2 128K、频率表 198/396/528 MHz。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}
function three(a, b, c) {
  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(a[0], 214, a[1]); for (var i = 0; i < a[2].length; i++) txt(scene, a[0], 252 + i * 36, a[2][i], a[3] || 't20w');
  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(b[0], 214, b[1]); for (var j = 0; j < b[2].length; j++) txt(scene, b[0], 252 + j * 36, b[2][j], b[3] || 't20w');
  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(c[0], 214, c[1]); for (var k = 0; k < c[2].length; k++) txt(scene, c[0], 252 + k * 36, c[2][k], c[3] || 't20w');
}
function prose(title, lines) {
  wide(456, 330);
  txt(scene, 80, 490, title, 't24');
  for (var i = 0; i < lines.length; i++) txt(scene, 80, 522 + i * 34, lines[i], 't20w');
}

function drawParts() {
  txt(scene, 56, 146, '这四页纸只有一张配置清单：单核 A7 + 32K/32K L1 + 128K L2 + 128 个共享中断 —— 后面所有“为什么慢”都在这', 't24w');
  three([80, '核', ['单核 Cortex-A7', 'MP020-BU-50000 r0p5', 'ARMv7-A，含虚拟化', 'NEON(SIMDv2) + VFPv4-D32', 'CPU part 编号 0xC07', '大物理地址扩展'], 't20w'],
        [680, '缓存', ['L1：32 KB 指令', 'L1：32 KB 数据', '哈佛结构，每核私有', 'L2：128 KB 统一', '数据 RAM 延迟 2 拍', '单核下 SCU 几乎无用'], 't20w'],
        [1280, '总线与中断', ['AXI 主口 128 bit', '跑内核的一半速度', 'GIC 集成 128 个共享中断', '私有中断另计', '通用定时器在平台内', '与 GPT/EPIT 是两套']]);
  prose('把这六个数字记住，你就能提前判断性能与中断行为：单核、32K 两级、128K L2、128 bit AXI、128 个共享中断', [
    '“单核”意味着没有核间同步问题，但也意味着没有任何并行余量：所有缓存维护都是“停住自己”。',
    '“L2 128 KB、延迟 2 拍”是关键：它比 DDR 快一个数量级，但只装得下一张不大的表。',
    'AXI 128 bit @ 内核一半速度，是 DDR 带宽的理论天花板（16 B/拍 × 264 MHz 量级）。',
    'GIC 的 128 个共享中断是“中断号 ≥ 32”的那一段，这正是外设中断编号从 32 开始数的原因。',
    '通用定时器（architected timer）不占外设定时器资源，这是内核 clocksource 优先用它的理由。',
    '一句话：这不是寄存器章，而是“把所有性能与中断现象对上号”的索引章。']);
}

function drawCache() {
  txt(scene, 56, 146, 'L1 是哈佛结构、L2 是统一缓存；容量小、延迟低，但一旦工作集超过 128 KB 就立刻掉档', 't24w');
  three([80, '两级结构', ['L1I 32 KB / L1D 32 KB', 'L2 128 KB 统一', '指令与数据共用 L2', 'L2 数据 RAM 延迟 2 拍', 'L2 控制器可配', '写回 vs 写通可选'], 't20w'],
        [680, '容量效应', ['一张 128 KB 的表刚好占满', '再大就持续回写 DDR', '回写带宽成为瓶颈', '实测：翻倍数据 → 掉档', '典型的“大于 L2 变慢”', '这解释了多数性能拐点'], 't20w'],
        [1280, '单核的含义', ['SCU 在这里几乎不起作用', '没有核间缓存一致性问题', '但仍要与 DMA 保持一致', 'DMA 不经过 cache', '所以必须手动维护', '这是最容易出错的地方']]);
  prose('“128 KB”这个数字值得单独记：它就是这张芯片上“快”与“慢”的分界线，很多库的性能拐点都落在这里', [
    '原因很直接：L2 装满后再访问就要淘汰旧行、回写 DDR，而 DDR 延迟是 L2 的几十倍。',
    '所以做数据密集型算法时，把工作集切到 128 KB 以内（分块、分片）往往比换算法更有效。',
    'L1 的 32 KB 更严格：一个循环体超过 32 KB 就会 I-cache 抖动，表现为“代码没变、性能忽高忽低”。',
    '写回（write-back）策略下，脏行只在被淘汰时才写内存，所以“写完立刻量 DDR 流量”可能看不到数据。',
    '单核虽然没有缓存一致性问题，但 DMA 仍然绕开 cache，这一条在本章后面单独讲。',
    '判据：用固定步长的数组遍历测带宽，数据从 64 KB 增到 256 KB 时应看到一个明显的台阶式下降。']);
}

function drawMaint() {
  txt(scene, 56, 146, '缓存维护分“指令”和“数据”两套：指令改了要清 I-cache，数据交给 DMA 前要 clean，取回后要 invalidate', 't24w');
  three([80, '指令侧', ['改完代码要清 I-cache', 'CP15 c7 的 invalidate', '按全体或按地址', '否则执行到旧指令', '自修改代码必做', 'JIT/动态加载最常见'], 't20s'],
        [680, '数据侧', ['clean：脏行写回内存', 'invalidate：丢弃本地副本', 'clean+invalidate 最常用', '按 set/way 或按 MVA', '按 set/way 影响全局', '按 MVA 只影响该地址'], 't20s'],
        [1280, 'DMA 一致性', ['发 DMA 前：clean 缓冲', '收 DMA 后：invalidate', '否则读到 cache 旧值', '或 DMA 读到未落盘数据', '缓冲区也可放非缓存区', '两种方案各有代价']]);
  prose('把顺序记成一句口诀：发出去之前“刷下去”，收回来之后“作废掉”—— 两个方向都不能省', [
    '“发出去”是 CPU 写数据、DMA 读内存：必须 clean，让脏行落到 DDR，否则 DMA 读到旧值。',
    '“收回来”是 DMA 写内存、CPU 读数据：必须 invalidate，丢掉 cache 里的旧副本，否则 CPU 读到旧值。',
    '最保险的是 clean+invalidate：既落盘又作废，方向搞反也不会错，代价是多一次写回。',
    '“按 set/way”会遍历整个缓存，适合大范围操作但要停住中断；“按 MVA”只处理指定地址，精确但次数多。',
    'L2 由 PL310 兼容控制器单独维护（具体基址见第 3 章内存映射），L1 与 L2 往往都要做，别只做一半。',
    '判据：故意只 clean 不 invalidate，接收 DMA 数据后 CPU 读到的应是旧值 —— 能复现这个“旧值”就说明你理解了。']);
}

function drawGic() {
  txt(scene, 56, 146, '中断号分三段：0–15 软件中断、16–31 私有外设中断、32 起才是共享外设中断，共 128 个', 't24w');
  three([80, '三段编号', ['0–15：SGI 软件中断', '16–31：PPI 私有外设', 'PPI 含本地定时器/看门狗', '32–159：SPI 共享外设', '共 128 个共享中断', '这就是外设从 32 起数的原因'], 't20s'],
        [680, '配置要点', ['每个中断可设优先级', '可设触发类型（电平/边沿）', '可分组到安全/非安全', '可单独使能/屏蔽', '可设目标核（单核即自己）', 'SGI 用于核内自触发'], 't20w'],
        [1280, '与驱动的关系', ['Linux 里 virq = hwirq + 32', '设备树 interrupts 属性', '写的常是 SPI 号', 'PPI 由每个核自己处理', 'SGI 不用于外设', '别把号段搞混']]);
  prose('“中断号从 32 开始”不是约定俗成，而是硬件编号：前 32 个被 SGI 和 PPI 占了，外设只能用剩下的', [
    'SGI 0–15 是软件写寄存器触发的“核间中断”，单核系统里几乎只用于自测或异常注入。',
    'PPI 16–31 是“每个核各有一份”的私有中断：本地定时器、私有看门狗都在这段。',
    'SPI 32–159 才是共享外设中断：UART、GPIO、DMA 都在这里，共 128 个 —— 与本章开头那个数字对应。',
    '配置上最容易错的是触发类型：电平触发要求外设在中途保持电平，边沿触发则要求清中断源，配错会丢中断或风暴。',
    '安全分组（第 11 章）决定某个中断能不能进非安全世界；把它分到组 0 后 Linux 就完全收不到了。',
    '判据：`cat /proc/interrupts` 里每个外设的数字应 ≥32；若看到 PPI 号段（16–31）出现，说明是核内定时器。']);
}

function drawClocks() {
  txt(scene, 56, 146, '平台只有五个时钟名，两个 1:2 约束：AXI 主口与 APB 调试口都跑内核频率的一半', 't24w');
  three([80, '五个名字', ['clk_ahb：AXI 主口', 'clk_apb_dbg：调试 APB', 'clk_atb：调试跟踪总线', 'ipg_clk：寄存器访问', 'trace_clk_in：外部跟踪', '前四个挂两个根'], 't20s'],
        [680, '两个 1:2', ['AXI = 内核 / 2', 'APB 调试 = 内核 / 2', '528 MHz → 264 MHz', '这是带宽上限来源', '改内核频率要同步改', '否则时序不满足'], 't20w'],
        [1280, '实测含义', ['DDR 带宽被 AXI 卡住', '不是 DDR 本身慢', '寄存器访问看 ipg_clk', '调试口慢不等于芯片慢', '换频率要重算分频', '别只看核频率']]);
  prose('“AXI 只有内核一半”这条约束解释了大量“频率上去了但性能没上去”的困惑：瓶颈在总线，不在核', [
    '内核从 528 MHz 提到 792 MHz，AXI 也从 264 到 396，看似成比例，但 DDR 时序与总线仲裁会先饱和。',
    'ipg_clk（寄存器访问时钟）通常更低，所以“读寄存器”是慢操作，寄存器密集型代码会被它卡住。',
    'clk_atb 与 trace_clk_in 是调试/跟踪专用，正常运行时基本无关，但调试器连着时会占带宽。',
    'clk_apb_dbg 单独 1:2 分频是为了让调试访问不扰乱主总线节奏 —— 所以调试器读内存总是“慢一点”。',
    '改任何一路分频都要重新核对它的所有使用者；CCM 里 root 的改动是全局的（第 10 章）。',
    '判据：量 AXI 时钟应恰为内核一半；若不等，说明 CCM 里分频被改过，性能异常就有了解释。']);
}

function drawLowPower() {
  txt(scene, 56, 146, '低功耗按“域”切而不是按“模块”切：CPU+L1、SCU+L2 控制器、L2 RAM、调试（ETM）四块各自独立', 't24w');
  three([80, '四块域', ['CPU 与私有 L1', 'SCU 与 L2 控制器', 'L2 的 RAM 阵列', '调试逻辑与 ETM', '可分别断电', '关核 ≠ 关 L2'], 't20w'],
        [680, '定时器', ['本地通用定时器', '全局系统计数器', 'architected timer', '不占外设定时器', '内核 clocksource', '与 GPT/EPIT 不同'], 't20w'],
        [1280, 'DVFS 两档', ['overdrive', 'non-overdrive', '两档频率/电压表', '档位在 CCM/PMU 里配', '换档要同时改压', '否则跑不稳']]);
  prose('“关核”和“关 L2”是两件独立的事：L2 RAM 可以单独掉电，而控制器仍活着，这让“半休眠”成为可能', [
    '典型用法：核进 WFI、L2 RAM 掉电，但 L2 控制器保留配置，唤醒后不用重新初始化缓存。',
    '要注意掉电后 L2 里的数据就没了，唤醒后必须 invalidate，否则读到的是随机值。',
    '调试域单独供电是为了“核睡了还能调试”，量产产品里通常整块关掉以省电并关闭攻击面（第 11 章 SJC）。',
    'overdrive / non-overdrive 是两套频率-电压表：overdrive 更高频但要求更高电压与更好散热。',
    '换档必须“先升压后升频、先降频后降压” —— 顺序反了会在临界点出错，这是 DVFS 最基本的纪律。',
    '判据：进 WFI 后量电流应明显下降；唤醒后跑缓存压力测试不出现数据错误，说明 L2 维护做对了。']);
}

function drawBoard() {
  txt(scene, 56, 146, '手册里的数字在 Linux 下都能对上：三个地方对不上，就说明你拿的不是这颗芯片的默认配置', 't24w');
  three([80, 'cpuinfo', ['processor 只有 0', 'Features 含 neon / vfpv4', 'CPU part 0xc07', 'Hardware 是 Freescale', 'Revision 对应 r0p5', '对不上就查型号'], 't20s'],
        [680, 'lscpu', ['L1d 32 KiB', 'L1i 32 KiB', 'L2 128 KiB', '单核单线程', 'ARMv7 32 位', 'NEON 32 个寄存器'], 't20s'],
        [1280, 'cpufreq', ['频率表 198/396/528 MHz', 'governor 可切', 'scaling_available', '两档 DVFS 生效', '温度高会限频', '看 stats 时间占比']]);
  prose('这三个命令就是本章的“验收单”：cpuinfo 验核、lscpu 验缓存、cpufreq 验频率，三条都对上才算认清了平台', [
    'CPU part 0xc07 是 Cortex-A7 的固定编号，看到别的值（比如 0xc09）说明不是 A7，架构完全不同。',
    'Features 里有 neon 与 vfpv4，说明 NEON 与 VFPv4 都可用；没有的话编译器生成的向量指令会全部走软件模拟。',
    'lscpu 报的 L1d/L1i 各 32 KiB、L2 128 KiB 与手册一致；若报 256 KB，说明你查的是别的型号的页。',
    'cpufreq 的频率表常见 198/396/528 三档，正好对应 non-overdrive 与 overdrive 的组合。',
    '温度升高时内核会主动限频，这时测出的性能下降是“热策略”而不是“代码变差”。',
    '判据：三条命令的输出与本章数字逐项一致；若 CPU part 或缓存不符，先怀疑你手上不是 6ULL。']);
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawParts();
  else if (s === 1) drawCache();
  else if (s === 2) drawMaint();
  else if (s === 3) drawGic();
  else if (s === 4) drawClocks();
  else if (s === 5) drawLowPower();
  else drawBoard();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () { state.step = INIT.step; draw(); });
fitCanvas($('viewport'), $('canvas'), draw);
</script>
</body>
</html>
