<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0, lane: 0 };
var state = { step: INIT.step, lane: INIT.lane };

var STEPS = [
  { h: '它能驱动什么', hint: 'MPU · VSYNC · DOTCLK · DVI',
    note: '四种接口一套寄存器：并口命令屏、VSYNC 同步屏、RGB 屏、BT.656 视频编码器，全靠 CTRL 的模式位切换。' },
  { h: '寄存器地图', hint: '0x021C_8000 · 复位 C000_0000',
    note: 'CTRL 组每个寄存器都有 SET/CLR/TOG 三个别名，可以只改一位；复位值是 C000_0000，先清 SFTRST 和 CLKGATE 才有反应。' },
  { h: 'RGB 时序怎么算', hint: 'HSW/HBP/HFP · VSW/VBP/VFP',
    note: '屏手册给的是六个 porch 参数，手册寄存器要的是「总周期 + 脉冲宽 + 后沿等待」，一一换算，不能照抄。' },
  { h: '一个完整算例', hint: '800×480@60 · 928×525 · 29.5 MHz',
    note: '把屏参数折算成 TRANSFER_COUNT、VDCTRL1/2/3/4 的实际数值，再核对 pix_clk 与带宽够不够。' },
  { h: 'FIFO 与 DMA', hint: 'LFIFO 512 像素 · 双缓冲 · underflow',
    note: '总线主自己搬数据，LFIFO 只有 512 个 32bpp 像素的余量；欠载一次就是一条可见的横纹或撕裂。' },
  { h: '位域逐条看', hint: 'CTRL · CTRL1 · VDCTRL0–4',
    note: '真正容易配错的是 VDCTRL0 的单位位、VDCTRL3 的两个 wait、VDCTRL4 的有效像素数，以及 BYPASS_COUNT。' },
  { h: '上板与排障', hint: 'STAT 读数 · 黑屏花屏偏移',
    note: '先看 STAT 的 PRESENT 与 LFIFO_COUNT，再分「没时钟/没数据/时序错/极性反」四类，别一上来就怀疑屏。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}

function drawTop() {
  txt(scene, 56, 146, 'eLCDIF 是四种接口共用一套寄存器：并口命令、VSYNC、RGB(DOTCLK)、BT.656', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '四种模式');
  txt(scene, 80, 252, 'MPU：6800/8080 并口命令屏', 't20w');
  txt(scene, 80, 288, 'VSYNC：外部给场同步，逐帧写', 't20w');
  txt(scene, 80, 324, 'DOTCLK：RGB 屏，连续刷新', 't20w');
  txt(scene, 80, 360, 'DVI：BT.656 4:2:2 送 TV 编码器', 't20w');
  txt(scene, 80, 396, '由 CTRL 的四个模式位选择', 't20w');
  txt(scene, 80, 432, 'DOTCLK/DVI 必须开 BYPASS_COUNT', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '两个时钟域');
  txt(scene, 680, 252, 'apb_clk：寄存器与 AXI 主访问', 't20w');
  txt(scene, 680, 288, 'pix_clk：像素节拍，来自 CCM', 't20w');
  txt(scene, 680, 324, 'pix_clk 决定刷新率与像素带宽', 't20w');
  txt(scene, 680, 360, '两域之间靠 FIFO 跨接', 't20w');
  txt(scene, 680, 396, '改 pix_clk 后所有时序都要重算', 't20w');
  txt(scene, 680, 432, '显示器数据是可以 DMA 的', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '四个 FIFO');
  txt(scene, 1280, 252, 'LFIFO 256×64 位 = 512 个 32bpp', 't20w');
  txt(scene, 1280, 288, 'TXFIFO 38×16：跨到显示域', 't20w');
  txt(scene, 1280, 324, 'RXFIFO 32×16：MPU 读回', 't20w');
  txt(scene, 1280, 360, 'IntFIFO 38×2：DVI 插值', 't20w');
  txt(scene, 1280, 396, 'LFIFO 见底就 underflow', 't20w');
  txt(scene, 1280, 432, '一帧 800×480×4B ≈ 1.5 MB', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, 'eLCDIF 的定位：一块「会自己搬像素」的并口时序发生器，不是 GPU', 't24');
  txt(scene, 80, 522, '它没有图层混合之外的图形功能，也不做缩放：帧缓冲由 CPU/GPU/PXP 画好，eLCDIF 只负责按 dotclk 把像素按时序推出去。', 't20w');
  txt(scene, 80, 556, '作为总线主，它自己发 AXI 读请求搬帧缓冲，CPU 不需要参与每个像素；这也是它能连续刷新的原因。', 't20w');
  txt(scene, 80, 590, '四种模式共用流水线，区别只在于时序信号从哪来：MPU 用 CS/RS/WR 握手，VSYNC 用外部场同步，DOTCLK 自己产生行场同步。', 't20w');
  txt(scene, 80, 624, 'i.MX6ULL 上屏幕通常是 DOTCLK（RGB）模式，触摸走 I2C，背光走 PWM，复位与待机各一根 GPIO —— 这些都不归 eLCDIF 管。', 't20w');
  txt(scene, 80, 658, '一句话：算对时序、喂满 FIFO、配好像素格式，屏就亮；三者任一错，表现都是黑屏或花屏，所以排障必须按这三条走。', 't20w');
}

function drawMap() {
  txt(scene, 56, 146, '寄存器基址 0x021C_8000，CTRL 组每个寄存器后面还跟着 SET/CLR/TOG 三个别名', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '关键偏移');
  txt(scene, 80, 252, 'CTRL      +0x00 复位 C000_0000', 't20s');
  txt(scene, 80, 288, 'CTRL1     +0x10 复位 000F_0000', 't20s');
  txt(scene, 80, 324, 'CTRL2     +0x20 复位 0020_0000', 't20s');
  txt(scene, 80, 360, 'TRANSFER_COUNT +0x30', 't20s');
  txt(scene, 80, 396, 'CUR_BUF +0x40  NEXT_BUF +0x50', 't20s');
  txt(scene, 80, 432, 'TIMING +0x60  VDCTRL0 +0x70', 't20s');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'VDCTRL 组');
  txt(scene, 680, 252, 'VDCTRL0 +0x70：极性/单位/宽度', 't20s');
  txt(scene, 680, 288, 'VDCTRL1 +0x80：VSYNC 周期', 't20s');
  txt(scene, 680, 324, 'VDCTRL2 +0x90：HSYNC 脉冲/周期', 't20s');
  txt(scene, 680, 360, 'VDCTRL3 +0xA0：两个后沿等待', 't20s');
  txt(scene, 680, 396, 'VDCTRL4 +0xB0：有效像素数', 't20s');
  txt(scene, 680, 432, 'STAT +0x1B0、THRES +0x200', 't20s');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, 'SET/CLR/TOG 别名');
  txt(scene, 1280, 252, 'CTRL 后面 +4/+8/+C 三份别名', 't20w');
  txt(scene, 1280, 288, '写 1 到 SET 只置那几位', 't20w');
  txt(scene, 1280, 324, '写 1 到 CLR 只清那几位', 't20w');
  txt(scene, 1280, 360, '写 1 到 TOG 只翻转那几位', 't20w');
  txt(scene, 1280, 396, '读别名返回同一份物理寄存器', 't20w');
  txt(scene, 1280, 432, 'CTRL1/CTRL2/VDCTRL0 也有别名', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '复位值 C000_0000 是「最深睡眠」：SFTRST=1、CLKGATE=1，不先清这两位，写什么都没反应', 't24');
  txt(scene, 80, 522, 'CTRL[31] SFTRST 必须清 0 才进入正常工作，CTRL[30] CLKGATE 必须清 0 才给时钟；这两位复位都是 1，是这类 IP 的标准上电姿态。', 't20w');
  txt(scene, 80, 556, 'CTRL1 复位 000F_0000：BYTE_PACKING_FORMAT 默认 0xF（32 位字四个字节都有效）；CTRL2 复位 0020_0000 表示 outstanding 请求数默认 2 笔。', 't20w');
  txt(scene, 80, 590, 'TRANSFER_COUNT 复位 0001_0000：V_COUNT=1、H_COUNT=0，等于「一帧一行、零像素」，不重新写就是空转。', 't20w');
  txt(scene, 80, 624, 'SET/CLR/TOG 别名的价值：中断标志只清不读改写，避免「读-改-写」把别的位一起覆盖 —— 这和 GPIO 的 ISR、GPT 的 SR 是同一套设计。', 't20w');
  txt(scene, 80, 658, '写寄存器时优先用别名：置位用 +4 的 SET，清位用 +8 的 CLR，比整字读改写少一次竞态，也不会误伤 RUN 这种「写了就启动」的位。', 't20w');
}

function drawTiming() {
  txt(scene, 56, 146, 'RGB 屏手册给的是六个 porch，寄存器要的是「总周期 + 脉冲宽 + 后沿等待」', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '横向参数');
  txt(scene, 80, 252, 'H_ACTIVE：有效像素，如 800', 't20w');
  txt(scene, 80, 288, 'HSW：行同步脉冲宽度', 't20w');
  txt(scene, 80, 324, 'HBP：行后沿（同步到有效）', 't20w');
  txt(scene, 80, 360, 'HFP：行前沿（有效到同步）', 't20w');
  txt(scene, 80, 396, 'H_TOTAL = 800+48+40+40 = 928', 't20s');
  txt(scene, 80, 432, '单位都是 pix_clk 周期', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '纵向参数');
  txt(scene, 680, 252, 'V_ACTIVE：有效行数，如 480', 't20w');
  txt(scene, 680, 288, 'VSW：场同步脉冲，单位「行」', 't20w');
  txt(scene, 680, 324, 'VBP：场后沿（同步到第一行）', 't20w');
  txt(scene, 680, 360, 'VFP：场前沿（末行到同步）', 't20w');
  txt(scene, 680, 396, 'V_TOTAL = 480+3+29+13 = 525', 't20s');
  txt(scene, 680, 432, '单位是行，不是 pix_clk', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '对应到寄存器');
  txt(scene, 1280, 252, 'HSW → VDCTRL2[31:18]', 't20s');
  txt(scene, 1280, 288, 'H_TOTAL → VDCTRL2[17:0]', 't20s');
  txt(scene, 1280, 324, 'HBP → VDCTRL3[27:16] wait', 't20s');
  txt(scene, 1280, 360, 'V_TOTAL → VDCTRL1[31:0]', 't20s');
  txt(scene, 1280, 396, 'VSW → VDCTRL0[7:0] + 单位位', 't20s');
  txt(scene, 1280, 432, 'H_ACTIVE → VDCTRL4[15:0]', 't20s');

  wide(456, 330);
  txt(scene, 80, 490, '三个「总周期」不是有效像素：屏上不显示的那段时间也必须算进 dotclk 与行数', 't24');
  txt(scene, 80, 522, '一行 928 个 pix_clk 里只有 800 个在传像素，其余 128 个是消隐；一帧 525 行里只有 480 行有效，其余 45 行是场消隐。', 't20w');
  txt(scene, 80, 556, '所以 pix_clk 的下限是 H_TOTAL × V_TOTAL × 刷新率，不是 H_ACTIVE × V_ACTIVE × 刷新率 —— 差的那 20% 就是消隐。', 't20w');
  txt(scene, 80, 590, 'VDCTRL3 的 HORIZONTAL_WAIT_CNT 从 HSYNC 有效沿数到第一个有效像素，等于 HBP；VERTICAL_WAIT_CNT 从 VSYNC 沿数到第一行，等于 VBP，单位随 VSYNC_PERIOD_UNIT。', 't20w');
  txt(scene, 80, 624, '极性位必须和屏对上：VSYNC_POL/HSYNC_POL/ENABLE_POL 默认 0 是低有效，DOTCLK_POL 默认 0 是下降沿发数据、上升沿采样。反了就是整体偏移一行或一片黑。', 't20w');
  txt(scene, 80, 658, '核对办法：示波器量 HSYNC 与第一个有效像素之间的 dotclk 个数，应等于 HBP；量 VSYNC 与第一行之间的行数，应等于 VBP。数字对不上就是 wait 写错了。', 't20w');
}

function drawCalc() {
  txt(scene, 56, 146, '算例：800×480、60 Hz、总周期 928×525，pix_clk 取 29.5 MHz', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '先算像素时钟');
  txt(scene, 80, 252, '928 × 525 = 487,200 周期/帧', 't20s');
  txt(scene, 80, 288, '× 60 Hz = 29.23 MHz 下限', 't20s');
  txt(scene, 80, 324, '取 29.5 MHz → 60.6 Hz', 't20s');
  txt(scene, 80, 360, '取整到 CCM 能给的档位', 't20w');
  txt(scene, 80, 396, '带宽 29.5 M × 3 B ≈ 88 MB/s', 't20s');
  txt(scene, 80, 432, 'DDR3L 轻松满足，但要留余量', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '再填寄存器');
  txt(scene, 680, 252, 'TRANSFER_COUNT = 480<<16 | 800', 't20s');
  txt(scene, 680, 288, '  = 0x01E0_0320', 't20s');
  txt(scene, 680, 324, 'VDCTRL4 = 800（有效像素）', 't20s');
  txt(scene, 680, 360, 'VDCTRL2 = 48<<18 | 928', 't20s');
  txt(scene, 680, 396, '  = 0x00C0_03A0', 't20s');
  txt(scene, 680, 432, 'VDCTRL1 = 525 = 0x0000_020D', 't20s');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '极性/等待/使能');
  txt(scene, 1280, 252, 'VDCTRL0 = 3 | 1<<17 | 1<<20 | 1<<21', 't20s');
  txt(scene, 1280, 288, '  | 1<<28 = 0x1032_0003', 't20s');
  txt(scene, 1280, 324, 'VDCTRL3 = 40<<16 | 29 = 0x0028_001D', 't20s');
  txt(scene, 1280, 360, 'CTRL = 1<<19|1<<17|1<<5|1<<0', 't20s');
  txt(scene, 1280, 396, '  = 0x000A_0021，SFTRST/CLKGATE 清 0', 't20s');
  txt(scene, 1280, 432, 'VDCTRL3[29]=MUX_SYNC 保持 0', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '把数值代回去验算一遍，比在板上猜黑屏原因便宜得多', 't24');
  txt(scene, 80, 522, '验算一：VDCTRL2 高 14 位脉冲宽 48，低 18 位周期 928，两者相减 880，再减 800 有效，剩 40 就是 HFP，与屏手册一致。', 't20w');
  txt(scene, 80, 556, '验算二：VDCTRL1 周期 525，减去 VSW 3、VBP 29、480 有效行，剩 13 就是 VFP；四项加起来必须恰好等于周期，差一行都会滚屏。', 't20w');
  txt(scene, 80, 590, '验算三：pix_clk 29.5 MHz ÷ 487,200 = 60.55 Hz，落在屏的 50–70 Hz 范围内；若算出 48 Hz，屏会闪，先回去改 pix_clk 而不是改时序。', 't20w');
  txt(scene, 80, 624, '注意 CTLR[17] DOTCLK_MODE 与 [19] BYPASS_COUNT 必须同时置 1：前者选接口，后者让计数器不因 TRANSFER_COUNT 用完就停，否则只刷一帧就黑。', 't20w');
  txt(scene, 80, 658, '配完先别开 RUN：把 VDCTRL4 的 SYNC_SIGNALS_ON 置 1，让同步信号先跑一帧，再置 RUN 送数据 —— 这是手册对「屏要求同步先于数据」的官方做法。', 't20w');
}

function drawFifo() {
  txt(scene, 56, 146, '总线主自己搬像素，LFIFO 只有 512 个 32bpp 的余量，欠载一次就是一条可见横纹', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '容量换算');
  txt(scene, 80, 252, 'LFIFO 256 项 × 64 位', 't20w');
  txt(scene, 80, 288, '= 512 个 32bpp 像素', 't20w');
  txt(scene, 80, 324, '800 宽时不足一行（800 像素）', 't20w');
  txt(scene, 80, 360, '所以必须持续供数，不能靠攒', 't20w');
  txt(scene, 80, 396, '空一次 → underflow 中断', 't20w');
  txt(scene, 80, 432, '空一半 → panic 提优先级', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '双缓冲');
  txt(scene, 680, 252, 'CUR_BUF：正在发的帧', 't20w');
  txt(scene, 680, 288, 'NEXT_BUF：下一帧地址', 't20w');
  txt(scene, 680, 324, '帧末自动 CUR = NEXT', 't20w');
  txt(scene, 680, 360, '必须双字对齐（8 字节）', 't20w');
  txt(scene, 680, 396, 'NEXT 没更新就重发旧帧', 't20w');
  txt(scene, 680, 432, '换帧要在场消隐内完成', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '限流三个旋钮');
  txt(scene, 1280, 252, 'OUTSTANDING_REQS：1/2/4/8/16', 't20w');
  txt(scene, 1280, 288, 'BURST_LEN_8：16 或 8 个 QWORD', 't20w');
  txt(scene, 1280, 324, '手册推荐 4 笔 × 16 足够', 't20w');
  txt(scene, 1280, 360, 'THRES[PANIC]：3/4 空 = 128', 't20w');
  txt(scene, 1280, 396, 'THRES[FASTCLOCK]：动态升频', 't20w');
  txt(scene, 1280, 432, 'CTRL1[RECOVER_ON_UNDERFLOW]', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, 'underflow 不是「偶发玄学」，是带宽算错的直接证据：先算需求，再谈优化', 't24');
  txt(scene, 80, 522, '需求 = H_TOTAL × V_TOTAL × 刷新 × 每像素字节。800×480×60×3 B ≈ 70 MB/s（含消隐），加 PXP 与摄像头后 DDR 带宽要翻倍预留。', 't20w');
  txt(scene, 80, 556, 'LFIFO 只有一行多一点的深度，DDR 的一次仲裁延迟就可能抽空它；把 OUTSTANDING_REQS 从 2 提到 4、burst 保持 16，是最省事的两步。', 't20w');
  txt(scene, 80, 590, 'PANIC 阈值写 128 的作用：当 LFIFO 空到 3/4 时向总线抬优先级，让 eLCDIF 的读请求插到 CPU 前面 —— 这比事后改时序有效。', 't20w');
  txt(scene, 80, 624, 'CTRL1[RECOVER_ON_UNDERFLOW] 置 1 可以让下一帧自动恢复，不至于欠载一次就永久错位；但这是止痛药，不是病因。', 't20w');
  txt(scene, 80, 658, '判据：跑起来读 STAT[8:0] LFIFO_COUNT，稳定在 100–300 之间算健康；长期贴着 0 就是带宽紧，长期满 511 说明总线太闲、反而浪费。', 't20w');
}

function drawReg() {
  txt(scene, 56, 146, '最容易配错的四处：VDCTRL0 的单位位、VDCTRL3 的两个 wait、VDCTRL4 的有效数、CTRL 的 BYPASS', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, 'CTRL 关键位');
  txt(scene, 80, 252, '31 SFTRST：1=复位，写 0 才工作', 't20s');
  txt(scene, 80, 288, '30 CLKGATE：1=断时钟', 't20s');
  txt(scene, 80, 324, '19 BYPASS_COUNT：DOTCLK 必须 1', 't20s');
  txt(scene, 80, 360, '18/17 VSYNC_MODE/DOTCLK_MODE', 't20s');
  txt(scene, 80, 396, '5 MASTER：1=总线主搬帧', 't20s');
  txt(scene, 80, 432, '0 RUN：置 1 才开始传', 't20s');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, 'VDCTRL0 位域');
  txt(scene, 680, 252, '29 VSYNC_OEB：0=输出', 't20s');
  txt(scene, 680, 288, '28 ENABLE_PRESENT：RGB 屏要 1', 't20s');
  txt(scene, 680, 324, '27/26/25/24 四个极性位', 't20s');
  txt(scene, 680, 360, '21 VSYNC_PERIOD_UNIT：1=行', 't20s');
  txt(scene, 680, 396, '20 VSYNC_PULSE_WIDTH_UNIT：1=行', 't20s');
  txt(scene, 680, 432, '7:0 VSYNC_PULSE_WIDTH', 't20s');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '其他三处');
  txt(scene, 1280, 252, 'VDCTRL2[31:18] HSW，[17:0] 周期', 't20s');
  txt(scene, 1280, 288, 'VDCTRL3[27:16] H wait，[15:0] V wait', 't20s');
  txt(scene, 1280, 324, 'VDCTRL3[28] VSYNC_ONLY：DOTCLK 必 0', 't20s');
  txt(scene, 1280, 360, 'VDCTRL4[18] SYNC_SIGNALS_ON：DOTCLK 必 1', 't20s');
  txt(scene, 1280, 396, 'VDCTRL4[31:29] DOTCLK_DLY 2–8 ns', 't20s');
  txt(scene, 1280, 432, 'CTRL1[19:16] BYTE_PACKING 默认 F', 't20s');

  wide(456, 330);
  txt(scene, 80, 490, '两个「单位位」是本章最隐蔽的坑：VSYNC 的宽度和周期到底按 pix_clk 数还是按行数', 't24');
  txt(scene, 80, 522, 'DOTCLK 模式必须把 VDCTRL0 的 bit21 与 bit20 都写 1：这样 VSYNC_PERIOD 与 VSYNC_PULSE_WIDTH 都以「行」为单位，直接填 525 和 3。', 't20w');
  txt(scene, 80, 556, '若留在默认 0（按 pix_clk 计），同样填 525 就变成 525 个像素 = 不到一行，屏会整片滚动或干脆不同步 —— 这是「表里全对、就是不对」的头号原因。', 't20w');
  txt(scene, 80, 590, 'VDCTRL3[28] VSYNC_ONLY 在 DOTCLK 模式必须为 0、VSYNC 模式必须为 1；填反后同步信号会走错通路，现象是「有时能亮、一动就花」。', 't20w');
  txt(scene, 80, 624, 'DOTCLK_DLY 是给高速屏的补偿：2/4/6/8 ns 四档，等于把时钟相对数据往后推。走线长、屏采样沿靠边缘时，这一档能把偶发噪点消掉。', 't20w');
  txt(scene, 80, 658, '另外 TIMING(+0x60) 只对 MPU/VSYNC 有效，DOTCLK/DVI 完全不受它影响 —— 别在 RGB 屏上调 TIMING 找问题，那是在改一个不参与的木匠参数。', 't20w');
}

function drawBoard() {
  txt(scene, 56, 146, '上板要配的其实是三摊事：24 根数据线的复用、pix_clk 的来源、屏的复位与背光', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '数据与同步线');
  txt(scene, 80, 252, 'LCD_DATA00–23：ALT0，24 位', 't20w');
  txt(scene, 80, 288, 'LCD_CLK：ALT0，作 DOTCLK', 't20w');
  txt(scene, 80, 324, 'LCD_VSYNC/HSYNC：ALT0', 't20w');
  txt(scene, 80, 360, 'LCD_ENABLE：ALT0，即 DE', 't20w');
  txt(scene, 80, 396, 'LCD_RESET：ALT0，复位屏', 't20w');
  txt(scene, 80, 432, '全部 ALT0 —— 复位默认就是屏功能', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '被借用的脚');
  txt(scene, 680, 252, 'LCD_BUSY = LCD_VSYNC 的 ALT1（输入）', 't20w');
  txt(scene, 680, 288, 'LCD_CS = LCD_RESET 的 ALT1', 't20w');
  txt(scene, 680, 324, 'LCD_RS = LCD_HSYNC 的 ALT1', 't20w');
  txt(scene, 680, 360, 'LCD_WR_RWN = LCD_CLK 的 ALT1', 't20w');
  txt(scene, 680, 396, 'LCD_RD_E = LCD_ENABLE 的 ALT1', 't20w');
  txt(scene, 680, 432, 'MPU 屏与 RGB 屏共用同一批球', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '屏外的东西');
  txt(scene, 1280, 252, '背光：PWM（如 GPIO1_IO08）', 't20w');
  txt(scene, 1280, 288, '触摸：I2C2 的 4 针接口', 't20w');
  txt(scene, 1280, 324, '触摸复位/中断：两根 GPIO', 't20w');
  txt(scene, 1280, 360, '屏复位：LCD_RESET 或独立 GPIO', 't20w');
  txt(scene, 1280, 396, 'pix_clk：CCM 的 lcdif_pix_clk', 't20w');
  txt(scene, 1280, 432, '三者任一没配，都表现为黑屏', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '25 根线全走 ALT0，意味着「先配 IOMUX 再谈时序」，而且不能再拿这些脚做别的', 't24');
  txt(scene, 80, 522, 'RGB 屏占 24 根数据 + 4 根同步 + 1 根复位，共 29 个球；i.MX6ULL 的 LCD 组同时是 NAND 与 CSI 的候选脚，接了 RGB 屏就基本放弃 NAND。', 't20w');
  txt(scene, 80, 556, 'pix_clk 来自 CCM 的 lcdif_pix_clk_root（PLL5 视频 PLL 分频），不是随便一个 IPG 时钟；改错源会出现「频率对但相位乱」，花屏但气得死人。', 't20w');
  txt(scene, 80, 590, '上电顺序：先给屏供电与背光 → 拉 LCD_RESET 至少 10 ms（按屏手册）→ 配 IOMUX 与 eLCDIF → 置 SYNC_SIGNALS_ON → 再 RUN，跳步会出现半屏或全黑。', 't20w');
  txt(scene, 80, 624, '如果用了 PXP 做缩放/叠加，eLCDIF 的 CTRL[6] ENABLE_PXP_HANDSHAKE 与 PXP 的握手要一起开，否则两路会抢同一块 DDR 带宽。', 't20w');
  txt(scene, 80, 658, '板级排查技巧：先不接屏，用示波器量 VSYNC/HSYNC/DOTCLK 三根 —— 三根都有波形说明 eLCDIF 活了，问题在屏供电、复位或数据线；没波形就回去查 CCM 与 RUN。', 't20w');
}

function drawVerify() {
  txt(scene, 56, 146, '判据顺序：STAT 认身份 → 同步信号有没有 → FIFO 在不在动 → 最后才怀疑时序与屏', 't24w');

  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(80, 214, '四步定位');
  txt(scene, 80, 252, '① STAT[31] PRESENT 应为 1', 't20w');
  txt(scene, 80, 288, '② 量 VSYNC/HSYNC/DOTCLK 波形', 't20w');
  txt(scene, 80, 324, '③ STAT[8:0] LFIFO_COUNT 在变', 't20w');
  txt(scene, 80, 360, '④ 读 CTRL1 的 underflow flag', 't20w');
  txt(scene, 80, 396, '前三步过了，才轮到查 porch 与极性', 't20w');
  txt(scene, 80, 432, '最后才是屏本身的供电与初始化', 't20w');

  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(680, 214, '症状对应');
  txt(scene, 680, 252, '全黑：没 pix_clk 或 RUN 没置', 't20w');
  txt(scene, 680, 288, '白屏/雪花：数据线没接对或没配', 't20w');
  txt(scene, 680, 324, '整幅水平滚动：VSYNC 周期算错', 't20w');
  txt(scene, 680, 360, '左边一条竖带：HBP/wait 少算了', 't20w');
  txt(scene, 680, 396, '偶尔横纹：underflow，带宽不够', 't20w');
  txt(scene, 680, 432, '颜色反相：RGB 顺序或 swizzle 错', 't20w');

  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(1280, 214, '常见误配');
  txt(scene, 1280, 252, '忘清 SFTRST/CLKGATE：写全无效', 't20w');
  txt(scene, 1280, 288, 'DOTCLK 模式忘开 BYPASS_COUNT', 't20w');
  txt(scene, 1280, 324, 'VDCTRL0 单位位留 0：按像素算行', 't20w');
  txt(scene, 1280, 360, 'VDCTRL4 忘填有效像素数', 't20w');
  txt(scene, 1280, 396, 'WORD_LENGTH 与屏位深不匹配', 't20w');
  txt(scene, 1280, 432, 'BYTE_PACKING 与帧缓冲排布不符', 't20w');

  wide(456, 330);
  txt(scene, 80, 490, '把「屏不亮」拆成四层，比换屏、换线、换驱动靠谱得多', 't24');
  txt(scene, 80, 522, '第一层时钟：读 CCM 对应门控与分频，量 dotclk 频率，应等于 pix_clk；量不到就回去查 PLL5 与门控。', 't20w');
  txt(scene, 80, 556, '第二层同步：量 VSYNC 周期应是 V_TOTAL × 行时间，HSYNC 周期应是 H_TOTAL 个 dotclk；用示波器的频率读数直接反推，能立刻看出单位位写错。', 't20w');
  txt(scene, 80, 590, '第三层数据：LFIFO_COUNT 从 0 涨到几百再回落，说明在搬数据；恒 0 是 MASTER 没开或地址没写，恒满 511 是像素没被消费（RUN 或 DOTCLK 没起来）。', 't20w');
  txt(scene, 80, 624, '第四层画面：前两层都对而画面错，只剩 porch、极性与像素格式三件事，逐个改单项、单项验证，别一次改五个参数。', 't20w');
  txt(scene, 80, 658, '经验值：7 寸 1024×600 常见 pix_clk 51–52 MHz、H 总周期约 1344、V 总周期约 635；4.3 寸 480×272 常见 9–10 MHz 级。数字不确定就以屏手册为准，别抄别人的设备树。', 't20w');
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawTop();
  else if (s === 1) drawMap();
  else if (s === 2) drawTiming();
  else if (s === 3) drawCalc();
  else if (s === 4) drawFifo();
  else if (s === 5) drawReg();
  else drawVerify();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () {
  state.step = INIT.step; state.lane = INIT.lane; draw();
});
fitCanvas($('viewport'), $('canvas'), draw);
</script>
