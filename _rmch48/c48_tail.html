<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0 };
var state = { step: INIT.step };

var STEPS = [
  { h: '两个电源域', hint: 'HP 是唯一的门',
    note: 'HP 随芯片供电，LP 由纽扣电池常供；想碰 LP 寄存器必须经 HP 转发。' },
  { h: 'HP 的实时计数器', hint: '32.768 kHz 驱动',
    note: '64 位计数拆成两个 32 位寄存器，带闹钟与周期中断，断电即停。' },
  { h: '校准的算账', hint: '±16/32768',
    note: '每 32768 拍加减最多 16 个计数，折算成约 ±488 ppm，合每天 ±42 秒。' },
  { h: '读 RTC 的正确姿势', hint: '连读两次比对',
    note: '32 位总线 + 异步时钟，单次读可能撕裂；连读一致才可信。' },
  { h: '寄存器地图', hint: '0x020C_C000',
    note: 'HP 段在 0x00–0x30，LP 段在 0x34–0x68，版本号远在 0xBF8。' },
  { h: '单调计数器', hint: '只增不回滚',
    note: 'LP 掉电会丢低位，靠熔丝里的 ERA 高位保证“新的值一定更大”。' },
  { h: '按钮与 PMIC', hint: '长按关机',
    note: '去抖、开机延时、长按超时都在 LPCR 里；TOP 位就是软件关机。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}
function three(a, b, c) {
  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(a[0], 214, a[1]); for (var i = 0; i < a[2].length; i++) txt(scene, a[0], 252 + i * 36, a[2][i], a[3] || 't20w');
  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(b[0], 214, b[1]); for (var j = 0; j < b[2].length; j++) txt(scene, b[0], 252 + j * 36, b[2][j], b[3] || 't20w');
  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(c[0], 214, c[1]); for (var k = 0; k < c[2].length; k++) txt(scene, c[0], 252 + k * 36, c[2][k], c[3] || 't20w');
}
function prose(title, lines) {
  wide(456, 330);
  txt(scene, 80, 490, title, 't24');
  for (var i = 0; i < lines.length; i++) txt(scene, 80, 522 + i * 34, lines[i], 't20w');
}

function drawDomains() {
  txt(scene, 56, 146, 'SNVS 唯一被电池养着的模块：主电源拔了，它还在数秒、还在守密钥与计数器', 't24w');
  three([80, 'SNVS_HP', ['随芯片供电的域', 'IP 总线接口', 'LP 访问的转发门', '非安全 RTC + 闹钟 + 周期中断', '控制与状态寄存器', '断电即停、值全丢'], 't20w'],
        [680, 'SNVS_LP', ['常供域：VDD_SNVS_IN', '纽扣电池或超级电容', '单调计数器', '通用寄存器 GPR', '安全 RTC', '与 HP 电气隔离'], 't20w'],
        [1280, '访问规则', ['LP 寄存器只能经 HP 访问', '没有 HP 就没有 LP 通路', '特权策略：部分寄存器仅特权可写', '有的寄存器每个启动周期只写一次', '未授权写被丢弃、读返回 0', 'LP POR 与 HP POR 互不影响']]);
  prose('“电池域”的意义不在省电，而在“主系统死了它还记得”：时间、开机次数、密钥全在这里', [
    'HP 域随着芯片上电启动，掉电就没了：它的 RTC 用途是给系统一个可读的秒级时间，不需要跨断电保持。',
    'LP 域接 VDD_SNVS_IN，用一颗纽扣电池就能在主电源完全断开时继续跑：里面的安全 RTC 与单调计数器才是真正的“不挥发状态”。',
    '手册反复强调“LP 寄存器不能直接访问，必须经 HP”：这不是软件抽象，是物理隔离 —— HP 掉电后 LP 的输入被全部忽略。',
    '两条复位线是分开的：HP 硬复位来自 ipg_hard_async_reset_b，LP 复位来自 lp_por_b 与软件复位；所以给芯片复位不会清掉 LP 里的单调计数器。',
    '板上常见的错误是 VDD_SNVS_IN 直接并到主 3.3 V：这样主电源一断，LP 域跟着掉，时间与计数器全归零，等于白做了这个模块。',
    '判据：断电 30 秒再上电，读安全 RTC 应继续走；若回到 0，先量 VDD_SNVS_IN 上是否还有电，再查电池座是否虚焊。']);
}

function drawRtc() {
  txt(scene, 56, 146, 'HP 的 RTC 是一个 64 位计数器：低位 32 位在 +0x28、高位在 +0x24，拼起来才是完整时间', 't24w');
  three([80, '基本参数', ['时钟：32.768 kHz', '一拍 = 30.5 µs', '每秒 32768 拍', '64 位约够 5.8 万年', 'RTC_EN[0] 使能', 'HPTA_EN[1] 闹钟使能'], 't20s'],
        [680, '两个中断', ['闹钟：与 HPTAMR/HPTALR 相等', '周期中断：选某一位翻转', 'PI_FREQ[7:4] 选 0–15 位', 'PI_EN[3] 打开周期中断', '两者都要求 RTC_EN=1', '闹钟不能唤醒已断电的系统'], 't20s'],
        [1280, '写值的约束', ['RTC_EN=0 才能写计数寄存器', 'HPTA_EN=0 才能写闹钟', 'HPCALB_EN=0 才能写校准值', '使能位变化要 3 个 IP 拍 + 2 个 RTC 拍', '写时间建议多加 2 补偿启动延迟', '先清使能、读回确认、再写']]);
  prose('算一下分辨率和量程：32.768 kHz 意味着 1 秒 = 32768 个计数，64 位计数够跑几万年，所以别拿它当毫秒表用', [
    '周期中断不是“定时器”，而是“某一比特的跳变”：选 bit0 就是每拍一次（32 kHz），选 bit15 就是每 32768 拍一次（1 Hz）。',
    '所以想要 1 Hz 的秒中断，PI_FREQ 写 15；想要 2 Hz 写 14；这是按位选频，不是线性分频，跳着写会得到很怪频率。',
    '闹钟比较的是“整个 64 位值”，没有掩码：把闹钟设成当前值 + N，就得到 N 个 30.5 µs 之后的中断，精度取决于晶振。',
    'HP RTC 断电即停、值归零，所以它只适合“系统运行期间的绝对时间”；跨断电的时间必须读 LP 的安全 RTC。',
    '两个 RTC 之间可以同步：HPCR 里有专门的同步位（security-related，手册未公开），把 LP 的 SRTC 值搬进 HP 计数器。',
    '判据：使能后读低位寄存器应每约 30.5 µs 加 1；若一个月后误差超过 1 分钟，就该启用校准字段。']);
}

function drawCalib() {
  txt(scene, 56, 146, '晶振必然有偏差：校准字段让你每 32768 拍“补”或“扣”最多 16 个计数，代价是精度只有 488 ppm 一档', 't24w');
  three([80, '5 位有符号', ['HPCALB_VAL[14:10]', '补码表示：01111 = +15', '10000 = −16', '00000 = 不校准', 'HPCALB_EN[8] 打开校准', '写值前必须先关校准'], 't20s'],
        [680, '折算成误差', ['1 个计数 / 32768 拍 = 30.5 ppm', '±16 计数 ≈ ±488 ppm', '每天 86400 s × 488 ppm', '≈ ±42 秒 / 天', '一个月可漂 ±21 分钟', '普通晶振 ±20 ppm 只需 ±1']],
        [1280, '怎么定这个值', ['用 1 PPS 或 GPS 做基准', '测 24 小时的秒数偏差', '偏差/86400 → ppm', 'ppm/30.5 → 需要的计数', '取整后写补码', '温度变化大就定期重校']]);
  prose('校准的物理含义：不是改晶振频率，而是每 32768 拍往计数器里多加或早减几个数，长期平均下来把偏差抵掉', [
    '例：RTC 一天快 20 秒，相对误差 = 20/86400 ≈ 231 ppm；231/30.5 ≈ 7.6，取 8，写 −8 的补码 11000，每天就少走约 20 秒。',
    '分辨率只有 30.5 ppm 一档（每天约 2.6 秒），所以校准只能把误差压到 ±2–3 秒/天量级，压不到“毫秒级”。',
    '写校准值的顺序是死的：先清 HPCALB_EN，再读回确认已清（要等 3 个 IP 拍 + 2 个 RTC 拍），才能写 HPCALB_VAL，最后再置使能。',
    '如果跳过“读回确认”，你会以为已经关了校准，实际写进去被硬件忽略 —— 表现为“校准怎么都不生效”。',
    '温度是最大的变量：32.768 kHz 音叉晶振的温漂约 −0.035 ppm/°C²，机柜内外差 30 °C 就能带来几十 ppm，所以要按工作温度校准。',
    '判据：校准前后各跑 24 小时，对比与基准的偏差；若两次偏差符号没变，说明校准值符号写反了（补码别按无符号写）。']);
}

function drawRead() {
  txt(scene, 56, 146, '读 RTC 会撕裂：它不是一次总线事务能拿全的 64 位值，而且低位可能在你读高位时进位', 't24w');
  three([80, '两种撕裂', ['同步寄存器采到“更新中间”的值', '32 位总线读不完 64 位', '读 MR 与 LR 之间值会进位', '拼起来就少或多 1 秒', '没有硬件锁存读', '只能靠软件重读'], 't20w'],
        [680, '标准做法', ['连读两次完整值', '两次相同 → 可信', '不同 → 再读两次', '最坏需要三轮', '读顺序：先 LR 后 MR 更常见', '两次之间不要插入长延时']],
        [1280, '为什么会这样', ['RTC 走 32 kHz，总线走 IP 时钟', '跨时钟域必然有同步延迟', '同步器可能采到跳变瞬间', '此时部分位是新值部分位是旧值', '所以单次读不可信', '这是设计约束不是 bug']]);
  prose('判据很干脆：两次读到的 64 位值一样就采信，不一样就丢掉重读 —— 但别把“重读”写成死循环，要有超时', [
    '为什么建议“先读低位再读高位”：若低位读完之后刚好进位，高位读到的已经是新值，拼出来会偏大 1；连读两次比对能抓住这种偏。',
    '反过来“先高后低”遇到进位会偏小 1，同样被两次比对抓住；两种顺序都能用，关键是两次读之间尽量贴近。',
    '真实的坑在中断里：在周期中断里读 RTC，很容易与计数器更新撞在一起，于是每次都要读两遍，中断耗时翻倍。',
    '更好的做法是“读一次 + 用周期中断校准”：知道上次读到的值，加上中断次数乘以间隔，就不必每次都双读。',
    'HPVIDR1 复位值是 0x003E_0300、HPVIDR2 是 0x0300_0000：读它们可以确认这个 SNVS 实例存在且版本对，调试时先看这两个值。',
    '判据：连续 1000 次双读，出现“两次不一致”的比例应很低（只在进位窗口出现）；若经常不一致，先怀疑总线时钟被降得太低。']);
}

function drawMap() {
  txt(scene, 56, 146, '0x020C_C000 起：HP 段在 0x00–0x30，LP 段在 0x34–0x68，两组版本号孤零零待在 0xBF8', 't24w');
  three([80, 'HP 段', ['+0x00 HPLR 锁定位', '+0x04 HPCOMR 命令', '+0x08 HPCR 控制', '+0x14 HPSR 状态', '+0x24 HPRTCMR 计数高位', '+0x28 HPRTCLR 计数低位'], 't20s'],
        [680, '闹钟与 LP 段', ['+0x2C HPTAMR / +0x30 HPTALR', '+0x34 LPLR 锁定位', '+0x38 LPCR 控制（复位 0x20）', '+0x4C LPSR 状态（复位 0x08）', '+0x5C LPSMCMR 计数器高位', '+0x60 LPSMCLR 计数器低位'], 't20s'],
        [1280, '其余与版本', ['+0x68 LPGPR 通用寄存器', '+0xBF8 HPVIDR1 = 0x003E0300', '+0xBF C HPVIDR2 = 0x03000000', 'HPCR 关键位：[0] RTC_EN', '[1] HPTA_EN，[3] PI_EN', '[7:4] PI_FREQ，[8] 校准使能']]);
  prose('HPCR 的位排布要背：低四位是“开关”，中间是“校准值”，高位是“按钮”—— 写错一半就会得到不响的闹钟', [
    'HPCR 完整排布：[27] BTN_MASK、[26:24] BTN_CONFIG、[14:10] HPCALB_VAL、[8] HPCALB_EN、[7:4] PI_FREQ、[3] PI_EN、[1] HPTA_EN、[0] RTC_EN。',
    'HPSR：[7] BI 是按钮中断（写 1 清）、[6] BTN 是按钮电平；复位值 0x8000_0000 的第 31 位是安全相关字段，别当普通位用。',
    'LPLR 与 HPLR 是“锁定位集合”：某位置 1 之后对应寄存器在本启动周期内不可再改，属于“写一次就焊死”的防误改设计。',
    'LPCR：[6] TOP 是软件关机、[5] DP_EN 选 dumb/smart PMIC、[2] MC_ENV 打开单调计数器，[19:18] 去抖、[21:20] 开机延时。',
    '注意 LP 段寄存器的复位只受 LP POR 影响：给芯片做系统复位后，LPCR 里你之前写的 DP_EN、MC_ENV 很可能还在，不要假设它已复位。',
    '判据：读 HPVIDR1 应为 0x003E_0300；若读到 0 或全 1，先怀疑基址写错（0x020C_C000，不是 0x020C_0000）。']);
}

function drawMc() {
  txt(scene, 56, 146, '单调计数器是“开机次数”的硬件账本：只许加、不许回滚，机械式的单调性靠熔丝兜底', 't24w');
  three([80, '规则', ['只能增不能减', '到最大值不回卷', '溢出置 LPSR[2] MCR', '并触发防篡改中断', 'LPSMCMR/LPSMCLR 各 32 位', '写一次即加一（不是赋值）'], 't20w'],
        [680, 'LP 掉电怎么办', ['低位是触发器，掉电即丢', '高位 MC_ERA_BITS 来自熔丝', '启动固件发现计数值无效', '就再烧一根 ERA 熔丝', '使高位变大', '于是新值必然大于旧值'], 't20w'],
        [1280, '软件怎么用', ['MC_ENV=1 才允许累加', '每次启动写一次即 +1', '读回确认已加', '锁位 MC_SL/MC_HL 置后不可改', '适合做试用次数与回滚防护', '不适合做高精度计时']]);
  prose('它不是“计时器”而是“用过的次数”：设计目标就是让任何回滚、克隆、恢复出厂都留下不可抹的痕迹', [
    '写 LPSMCMR 或 LPSMCLR 都会让计数器加 1（写什么值不重要，写这个动作才是“加一”的命令），这点与普通计数器完全不同。',
    '溢出不回卷而是报错：LPSR[2]=1 并把事件送给 LP 的防篡改监视器，进而给主机一个中断 —— 这是“次数用尽”的硬信号。',
    '熔丝兜底的逻辑：LP 域一旦掉电，低位触发器的值丢了；重启时固件发现“值无效”，就烧掉下一根 ERA 熔丝抬高高位段，从而保证单调。',
    '代价是熔丝有限：每次 LP 掉电都消耗一根，所以别把电池拔来拔去做实验，那是在烧不可恢复的资源。',
    '实际产品用法：把“开机次数”“试用天数”“固件降级次数”写进这里，比放在 Flash 里可靠 —— Flash 能被刷，这里只能加。',
    '判据：连续复位两次，读 LPSMCMR/LPSMCLR 应各增 1；若不变，查 LPCR[2] MC_ENV 是否为 1、以及 MC 是否已被锁位锁死。']);
}

function drawBtn() {
  txt(scene, 56, 146, '按钮和 PMIC 是 LP 域的另一半职责：长按关机、短按开机、断电请求，全在 LPCR 的四个字段里', 't24w');
  three([80, '四个时间参数', ['DEBOUNCE[19:18]：0/50/100/500 ms', 'ON_TIME[21:20]：0/50/100/500 ms', 'BTN_PRESS_TIME[17:16]：5/10/15 s', '11 = 长按关机禁用', 'PWR_GLITCH_EN[7]：掉电毛刺也关机', 'TOP[6]：软件直接断电'], 't20s'],
        [680, '两种 PMIC 模式', ['DP_EN[5]=1：dumb 模式', 'PMIC_ON 用电平表示开/关', 'DP_EN=0：smart 模式', 'PMIC_ON 只发脉冲', 'smart 模式只能配去抖', '本板由硬件设计决定用哪种'], 't20s'],
        [1280, '状态怎么看', ['HPSR[6] BTN：按钮当前电平', 'HPSR[7] BI：按钮中断，写 1 清', 'LPSR[18] SPO：关机请求已置', 'LPSR[17] EO：紧急关机', 'TOP 写入后断电即自清', 'BI 不清会一直中断']]);
  prose('dumb 与 smart 的唯一区别是“ON 请求是电平还是脉冲”：接错模式，板子会出现“按一下开机、再按一下没反应”', [
    'dumb 模式内部是两状态机（OFF/ON）：按下超过 ON_TIME 就进 ON 并把 pmic_en_b 拉成有效电平；再按住超过 BTN_PRESS_TIME 就进 OFF。',
    'smart 模式把 PMIC_ON 变成脉冲，其余时间交给外部 PMIC 自己维持：所以它只能配去抖，不能配开机延时与长按超时。',
    '去抖默认 50 ms：机械按键的抖动通常 5–20 ms，50 ms 足够；若按键线长、环境干扰大，可加到 100 或 500 ms。',
    'TOP 位是“软件关机”的正规入口：写 1 后 LP 发出断电请求，真正断电后该位自清；写之前务必先把文件系统同步完。',
    'PWR_GLITCH_EN 默认关闭：电源毛刺不会导致关机；在电池供电的产品上打开它，可以避免瞬间掉压造成的半死机状态。',
    '判据：按住按钮，HPSR[6] 应立刻变 1；超过 BTN_PRESS_TIME 后 LPSR[18] SPO 置位并产生中断；松开再按，BI 必须被清过才能再次触发。']);
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawDomains();
  else if (s === 1) drawRtc();
  else if (s === 2) drawCalib();
  else if (s === 3) drawRead();
  else if (s === 4) drawMap();
  else if (s === 5) drawMc();
  else drawBtn();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () { state.step = INIT.step; draw(); });
fitCanvas($('viewport'), $('canvas'), draw);
</script>
</body>
