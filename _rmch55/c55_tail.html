<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0 };
var state = { step: INIT.step };

var STEPS = [
  { h: '八个串口，一张表', hint: '地址先记牢',
    note: 'UART1–8 分散在三处地址窗口，写驱动第一件事就是把实例到基址的表列出来。' },
  { h: '偏移不是连续的', hint: '0x00 / 0x40 / 0x80',
    note: '接收与发送各占一个 0x40 的槽，中间全是空洞，误碰就是传输错误。' },
  { h: '波特率是一个比值', hint: 'UBIR 与 UBMR',
    note: 'BRM 用分数分频：波特率 = 参考时钟/(16 × (UBMR+1)/(UBIR+1))，两个都要写减一。' },
  { h: '帧格式', hint: 'UCR2 决定 8N1',
    note: '数据位、停止位、校验、流控都在这一个寄存器里，复位值不是“能用”的配置。' },
  { h: 'FIFO 与触发', hint: 'UFCR 三件事',
    note: '发送阈值、接收阈值、参考时钟分频；阈值决定中断多久来一次，直接影响延迟。' },
  { h: '状态与错误', hint: '写 1 清',
    note: '有没有数据、发完没有、溢出没有，全在 USR1/USR2；错误位都是写 1 清。' },
  { h: '初始化顺序', hint: '软复位先行',
    note: '先 SRST 再配参数，否则写到一半的配置会被状态机吃掉，表现为“配了没用”。' },
  { h: '板上判据', hint: '先回环再外接',
    note: '短接 TX/RX 自发自收，是最快的自检；再用示波器量位宽确认波特率真的对。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}
function three(a, b, c) {
  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(a[0], 214, a[1]); for (var i = 0; i < a[2].length; i++) txt(scene, a[0], 252 + i * 36, a[2][i], a[3] || 't20w');
  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(b[0], 214, b[1]); for (var j = 0; j < b[2].length; j++) txt(scene, b[0], 252 + j * 36, b[2][j], b[3] || 't20w');
  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(c[0], 214, c[1]); for (var k = 0; k < c[2].length; k++) txt(scene, c[0], 252 + k * 36, c[2][k], c[3] || 't20w');
}
function prose(title, lines) {
  wide(456, 330);
  txt(scene, 80, 490, title, 't24');
  for (var i = 0; i < lines.length; i++) txt(scene, 80, 522 + i * 34, lines[i], 't20w');
}

function drawTop() {
  txt(scene, 56, 146, 'UART 是最“老派”也最不可少的外设：八个实例，十六位寄存器，一颗 16 倍过采样时钟', 't24w');
  three([80, '实例与基址', ['UART1  0x0202_0000', 'UART2  0x021E_8000', 'UART3  0x021E_C000', 'UART4  0x021F_0000', 'UART5  0x021F_4000', 'UART6  0x021F_C000'], 't20s'],
        [680, '还有两个', ['UART7  0x0201_8000', 'UART8  0x0228_8000', '每个实例占 0x4000 空间', 'UART1 常作调试口', 'UART3/5 常用作外设', '先按板子原理图定用途'], 't20s'],
        [1280, '访问规则', ['全部寄存器是 16 位', 'ONEMS 是 24 位例外', '32 位写：高半字被丢弃', '32 位读：高半字返回 0', '空地址访问 → 传输错误', '别用 memcpy 整块拷']]);
  prose('本板最常用的就是 UART1：上电 115200 8N1 打日志，所有调试都靠它，因此这一章的每个细节都能在板上验证', [
    '32 位访问的“高半字被丢弃”很容易踩坑：如果你用 32 位写去同时改两个 16 位寄存器，第二个改动会静默丢失。',
    'RX 与 TX 之间有大段空洞（0x04–0x3F），访问这段会直接产出传输错误 —— 这反而是好事：地址算错会当场报错，不会静默写坏别的寄存器。',
    '每个实例占 0x4000 空间，但实际只用了前 0xBC，所以“基址 + 偏移”写法比“结构体整块映射”更安全。',
    'UART 的时钟来自 CCM 的 uart_clk_root，改波特率前先确认这一路的频率，否则算出来的分频值全错。',
    'UART1 与 UART2 在部分引脚上与其他外设复用，改引脚复用（IOMUXC）时要确认 ALT 模式号，别把调试串口自己关掉。',
    '一句话：先把八个基址抄进头文件，再谈寄存器，否则后面每一章都会写错地址。']);
}

function drawMap() {
  txt(scene, 56, 146, '七个关键偏移：0x00 收、0x40 发、0x80–0x8C 四个控制、0x90 FIFO、0x94/0x98 状态，其余是波特率与测试', 't24w');
  three([80, '收发与控制', ['+0x00 URXD（只读）', '+0x40 UTXD（只写）', '+0x80 UCR1 复位 0x0000', '+0x84 UCR2 复位 0x0001', '+0x88 UCR3 复位 0x0700', '+0x8C UCR4 复位 0x8000'], 't20s'],
        [680, 'FIFO 与状态', ['+0x90 UFCR 复位 0x0801', '+0x94 USR1（含状态位）', '+0x98 USR2（含状态位）', '+0x9C UESC 转义序列', '+0xA0 UTIM 老化定时', '+0xAC UIPCR 脉冲检测'], 't20s'],
        [1280, '波特率与自测', ['+0xA4 UBIR 增量分子', '+0xA8 UBMR 模分母', '+0xB0 UTS 测试寄存器', '+0xB4 UBRC 实际分频（只读）', '+0xB8 ONEMS 1 ms 计数（24 位）', '0xBC 之后为空']]);
  prose('UTS 与 UBRC 是这套 UART 的“自测插座”：UTS 可把收发内部串起来，UBRC 直接告诉你硬件算出来的分频值', [
    '调试波特率不对时，先读 UBRC：它反映的是硬件实际用的分频，与你写的 UBIR/UBMR 对不对得上，一眼就能看出“写没写进去”。',
    'UTS 提供内部回环：不用短接引脚就能自发自收，适合在板上验证“控制器本身好使”，把引脚问题排除掉。',
    'UESC 与转义序列（比如 IrDA 的 BOF）相关；普通串口不用碰，误配可能把正常字节当转义序列吃掉。',
    'UTIM 是老化定时器（aging timer），用于在没有新数据时提前触发接收中断，避免“最后几个字节卡在 FIFO 里等阈值”。',
    'ONEMS 是 24 位，计算方式为“内部参考频率 ÷ 1000”，用于把时间换算成计数；32 位访问时最高字节读回 0。',
    '判据：写 UBIR 再写 UBMR 后读 UBRC，其值应与预期分频一致；不一致说明顺序错了（没按 UBIR 先写）。']);
}

function drawBaud() {
  txt(scene, 56, 146, '波特率不是“除一个整数”，而是 BRM 生成一个分数比值：分子 UBIR、分母 UBMR', 't24w');
  three([80, '公式', ['Baud = Ref / (16 × r)', 'r = (UBMR+1)/(UBIR+1)', '16 是过采样倍数', 'Ref 是 RFDIV 之后的时钟', '两个寄存器都写“减一”', '写 0 会除零，必须避开'], 't20s'],
        [680, '整数解（80 MHz）', ['目标 115200', 'r = 80e6/(16×115200) ≈ 43.40', '取整 43 → UBMR=42', 'UBIR=0x0F（即 16）', '实际 116279，误差 +0.94%', '短帧可用，长帧会累积'], 't20s'],
        [1280, '分数解（80 MHz）', ['取 r = 43403/1000', 'UBIR = 999（0x3E7）', 'UBMR = 43402（0xA99A）', '实际 115200.4，误差 4 ppm', '代价是两个 16 位值都要算', '推荐用于 115200 以上']]);
  prose('误差为什么要算：UART 是异步的，收发双方各自用自己的时钟采样，累计 10 位就可能错位，通常要求误差 < 2%', [
    '整数解在 115200 上 +0.94% 还勉强能用，但换成 921600 就会明显累积；分数解能把误差压到几十 ppm，代价只是多两个除法。',
    '算分数解的方法：把 r 化成分数 r ≈ N/D（连分数或直接按 1/1000 精度取），然后 UBIR = D−1、UBMR = N−1。',
    '注意 UBMR 只有 16 位（最大 65535），所以 N 不能随意取大；80 MHz 下 115200 用 1000 作分母正好塞得下。',
    '写寄存器的顺序是硬要求：必须先 UBIR 后 UBMR，硬件在写 UBMR 的那一刻才把两个值一起生效。',
    '若参考时钟被 RFDIV 分过频，公式里的 Ref 要用“分频之后”的频率；很多人算错就是漏了这一步。',
    '判据：读 UBRC 得到硬件实际分频，再反推波特率；同时用示波器量一位宽度（115200 时约 8.68 µs），两者一致才算对。']);
}

function drawFrame() {
  txt(scene, 56, 146, '8N1 不是默认值，是你要显式配出来的：UCR2 的复位值 0x0001 只是“软复位在跑”', 't24w');
  three([80, 'UCR2 关键位', ['[0] SRST 软复位（自清）', '[1] RXEN 接收使能', '[2] TXEN 发送使能', '[5] WS 字长（0=8 位）', '[6] STPB 停止位（0=1 位）', '[7] PROE / [8] PREN 校验'], 't20s'],
        [680, '流控与其它', ['[10] IRTS 忽略 RTS', '[11] CTSC CTS 控制发送', '[12] CTS 当前 CTS 状态', '[14] RTSEN 硬件流控', '[15] ATEN 自动波特率', '8N1 就是只置 RXEN/TXEN'], 't20s'],
        [1280, '帧长怎么算', ['1 起始 + 数据位 + 校验 + 停止', '8N1 = 10 位/字节', '115200 → 11520 字节/秒', '理论值，实际受 FIFO 与中断影响', '9 位模式要开多机位', '校验位会多吃一位时间']]);
  prose('把 8N1 的寄存器值算出来更实用：只置 RXEN 与 TXEN，其余全 0，于是 UCR2 = 0x0006（软复位已自清）', [
    '若加偶校验：PREN=1、PROE=1 → 帧变 11 位，吞吐降到 10472 字节/秒，这一点在高速日志里能明显看出来。',
    '若用 2 位停止位：STPB=1，用于老式设备或长线，代价同样是帧变长。',
    'SRST 是自清的：写 1 后等它读回 0，再配其它位；不等就直接配，可能被软复位冲掉。',
    '流控要成对：RTSEN 表示本机输出 RTS 控制对方，CTSC 表示本机按对方 CTS 决定能不能发；只开一半会出现“发不出去”或“一直发”。',
    '9 位模式用于多机（如 RS485 地址帧），i.MX 的 UART 支持通过 UCR3/UCR4 配置唤醒与地址检测，普通点对点通信不需要。',
    '判据：写 UCR2 后读回应为 0x0006（8N1）；若读到 bit0 仍为 1，说明软复位尚未完成，此时一切配置都不可靠。']);
}

function drawFifo() {
  txt(scene, 56, 146, '32 字节 FIFO 是缓冲，阈值是“什么时候叫醒 CPU”：这两个数决定延迟与中断频率', 't24w');
  three([80, 'UFCR 三段', ['[15:10] TXTL 发送阈值', '[9:7] RFDIV 参考时钟分频', '[6] DCEDTE DCE 模式', '[5:0] RXTL 接收阈值', '复位 0x0801', 'TXTL=2、RXTL=1、RFDIV=000'], 't20s'],
        [680, '阈值怎么选', ['RXTL=1：每字节中断', '延迟最低、中断最多', 'RXTL=8：8 字节一批', '吞吐高、延迟变大', '高速日志建议 4–8', '交互命令建议 1–2'], 't20w'],
        [1280, 'RFDIV 编码', ['101 = 除 1', '100 = 除 2', '011 = 除 3', '010 = 除 4', '001 = 除 5', '000 = 除 6（递减编码）']]);
  prose('RXTL 是“水位线”：FIFO 里数据达到这个字节数才置 RRDY/RDR，不到就等，或者等老化定时器兜底', [
    '所以 RXTL 设得大，最后一个不满水位的字节会一直不触发中断 —— 这就是为什么要配 aging timer（UTIM）。',
    'TXTL 是“低水位”：FIFO 空到这个程度才请求下一批数据；设得大，会提前要数据，适合 CPU 忙、想攒批的场景。',
    'FIFO 满而 CPU 没取走 → ORE（溢出）置位，且是写 1 清；一旦溢出，丢的是“新来的”还是“旧的”取决于实现，别指望它保证。',
    'RFDIV 是递减编码（101 除 1、100 除 2……），不是二进制值，这一点与常见分频器相反，写错会导致波特率整体偏 2–6 倍。',
    'DCEDTE 只在数据终端设备（DCE）方向使用，做 USB 转串口类应用才需要，普通板级通信保持 0。',
    '判据：RXTL 设 8 后连续发 7 个字节，应“没有中断”；发第 8 个才进中断，说明阈值生效。']);
}

function drawStatus() {
  txt(scene, 56, 146, '四个状态位决定一切：有没有数据、发完没有、溢出没有、成帧对不对；错误位全是写 1 清', 't24w');
  three([80, 'USR1（+0x94）', ['[13] TRDY 发送就绪', '[9] RRDY 收到数据', '[15] PARITYERR 校验错', '[10] FRAMERR 帧错', '[8] AGTIM 老化超时', '多数位写 1 清'], 't20s'],
        [680, 'USR2（+0x98）', ['[0] RDR 有数据可读', '[3] TXDC 发送完成', '[14] TXFE 发送 FIFO 空', '[1] ORE 接收溢出', '[2] BRCD 间隔检测', '[0]/[1]/[2]/[3] 写 1 清'], 't20s'],
        [1280, '两个“完成”的区别', ['RRDY：FIFO 有数据', 'RDR：接收器有数据（更早）', 'TRDY：能再写一个', 'TXDC：整帧已移位出去', '关电/切 RS485 前要等 TXDC', '等 TRDY 就会截断最后一字节']]);
  prose('“发完”这件事必须用 TXDC，不能用 TRDY：TRDY 只表示 FIFO 里还有空位，数据可能还在移位寄存器里没出去', [
    '典型事故：写完最后一字节就切 RS485 方向（或断电、关时钟），最后一个字节被截断 —— 就是等了 TRDY 而不是 TXDC。',
    '读数据要先查 RRDY 或 RDR，再读 URXD；读 URXD 会自动弹出 FIFO，多读一次就丢掉下一个字节。',
    'ORE 一旦置位，说明你读得太慢；它不会自动恢复，必须写 1 清，否则后续判断会被污染。',
    'PARITYERR 与 FRAMERR 通常一起出现：波特率不对时，采样点漂移，先出帧错，再出校验错 —— 别一上来就怀疑校验配置。',
    'AGTIM 是老化定时器触发的“部分数据到达”标志，配合小流量场景使用；如果你没开 aging，它不会置位。',
    '判据：发一个字节后立刻读 USR2，应见 TXDC 由 0 变 1；再读 USR1 应见 TRDY=1 —— 两个都对，发送路径就通了。']);
}

function drawInit() {
  txt(scene, 56, 146, '初始化是固定六步：软复位 → 关收发 → 配帧与时序 → 配波特率 → 开 FIFO 阈值 → 开中断与使能', 't24w');
  three([80, '六步', ['① UCR2 SRST=1，等回 0', '② UCR1 UARTEN=0 先关', '③ 配 UCR2 帧格式', '④ 写 UBIR 再写 UBMR', '⑤ 配 UFCR 阈值与分频', '⑥ UCR1 使能 + 开中断'], 't20s'],
        [680, '收数据路径', ['轮询：查 RRDY 再读 URXD', '中断：开 RRDYEN 进 ISR', 'DMA：开 RXDMAEN 挂 DMA', '三者选一即可', '别同时开又同时轮询', '会重复取走字节'], 't20w'],
        [1280, '常见失败', ['忘了 UARTEN → 全无反应', '忘了 TXEN/RXEN → 只通一半', 'UBMR 先于 UBIR 写 → 不生效', '软复位没等完就配 → 被冲掉', '中断里没清标志 → 反复进中断', '轮询与中断混用 → 丢字节']]);
  prose('顺序里最容易被忽略的是“先关再配”：UARTEN 还开着时改帧格式，可能正好撞上移位中的一帧，产生一个帧错并丢掉数据', [
    '软复位之后所有控制位回默认，所以寄存器的配置必须放在软复位之后，而不是之前。',
    '轮询与中断不要混用：中断里读走字节后，轮询代码再读一次会拿到下一个字节，看起来像“丢字节”。',
    '若用 DMA，接收阈值与 DMA 突发长度要匹配，否则会出现“DMA 搬了半包”。',
    '发送侧若开了 TXTL 中断，务必在 ISR 里补数据并清中断，否则会陷入“中断风暴”。',
    '初始化完成后先做一次内部回环（UTS）或短接 TX/RX，确认“控制器通”，再插外部设备，能把问题切两半。',
    '判据：初始化后读 UCR1 应见 UARTEN=1、读 UCR2 应见 RXEN/TXEN 均 1、读 UBRC 应为预期分频 —— 三项都对再发第一个字节。']);
}

function drawBoard() {
  txt(scene, 56, 146, '上板验证只需三步：内部回环、引脚短接、示波器量位宽；每一步都把可能的故障范围砍一半', 't24w');
  three([80, '内部回环', ['UTS 把收发在内部接通', '自发自收不依赖引脚', '通 → 控制器与配置没问题', '不通 → 查 UARTEN 与波特率', '这是最快的自检', '不用动硬件'], 't20w'],
        [680, '引脚短接', ['把 TXD 与 RXD 短接', '发什么应收回什么', '不通 → 查 IOMUXC 与电平', '注意 3.3 V 与 5 V 电平', '不可直接接 RS232 电平', '会烧 IO'], 't20w'],
        [1280, '示波器', ['量一位宽度验证波特率', '115200 → 约 8.68 µs', '量空闲电平应为高', '起始位是一个低脉冲', '波形畸变 → 查地线与终端电阻', '长线加匹配']]);
  prose('8.68 µs 这个数字要背下来：115200 的位周期就是 1/115200 秒，量出来差 10% 以上，先怀疑参考时钟而不是寄存器', [
    '正点原子板的 UART1 通过 CH340 类芯片接到 USB，所以 PC 端看到的是“虚拟串口”；此时板上 TXD 的电平是 3.3 V TTL，不是 RS232 的 ±12 V。',
    '千万不要把 TTL 的 TXD 直接接到 RS232 接口：那一路有负电压，会把 IO 打坏；需要 MAX3232 之类做电平转换。',
    '如果自发自收正常但接 PC 不通，问题几乎必然在“电平/接线/驱动”，而不是 UART 寄存器 —— 这就是分步验证的价值。',
    '长线或强干扰环境下，串口误码会先表现为 FRAMERR 增多；此时降波特率、加屏蔽、加匹配电阻比改寄存器有效。',
    '用 DMA 收大数据时，要确保 DMA 缓冲是 cache 一致的，否则 CPU 看到的是旧数据（与第 46 章 SDMA 的坑同源）。',
    '判据：回环 1000 字节无误码 + 示波器位宽在 ±2% 内 + PC 端能收到日志，三项都过，这条串口就可以交付了。']);
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawTop();
  else if (s === 1) drawMap();
  else if (s === 2) drawBaud();
  else if (s === 3) drawFrame();
  else if (s === 4) drawFifo();
  else if (s === 5) drawStatus();
  else if (s === 6) drawInit();
  else drawBoard();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () { state.step = INIT.step; draw(); });
fitCanvas($('viewport'), $('canvas'), draw);
</script>
</body>
</html>
