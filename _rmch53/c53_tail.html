<style>
.t24 { font: 600 24px var(--font-sans); fill: var(--text-1); }
.t24w { font: 400 24px var(--font-sans); fill: var(--text-2); }
.t20w { font: 400 21px var(--font-sans); fill: var(--text-2); }
.t20s { font: 400 20px var(--font-mono, monospace); fill: var(--text-2); }
</style>
<script>
var $ = function (id) { return document.getElementById(id); };
var OX = 24, OY = 96;
var svg = $('figure'), scene = $('scene');
svg.setAttribute('viewBox', OX + ' ' + OY + ' 1872 872');

var INIT = { step: 0 };
var state = { step: INIT.step };

var STEPS = [
  { h: '它不转换，它指挥', hint: 'TSC + ADC',
    note: 'TSC 只出时序与模拟开关控制，真正的数值由 ADC 转换，两者必须一起配。' },
  { h: '四线还是五线', hint: '一个位选',
    note: 'BASIC_SETTING[4] 决定 4 线还是 5 线；接错模式读出的坐标会整片乱跳。' },
  { h: '三段状态机', hint: '预充/检测/测量',
    note: '预充把屏面拉到等电位，检测判断有没有手指，测量才真正读 X 与 Y。' },
  { h: '时间参数', hint: 'delay 与 precharge',
    note: '等电位要靠时间换精度：delay 太小读数偏，太大响应慢。' },
  { h: '寄存器地图', hint: '0x0204_0000',
    note: '八个寄存器，偏移 0x00/0x10/0x20/0x30/0x40/0x50/0x60/0x70/0x80，全部 32 位。' },
  { h: '软件流程', hint: '探测→测量→换算',
    note: '读回来的是 ADC 原始码，不是像素；换算、校准、镜像都得软件做。' },
  { h: '校准与判据', hint: '两点还是四点',
    note: '不校准就只能“能点”，想要点得准必须做仿射，把原始码映射到像素。' }
];

function txt(parent, x, y, s, cls, anchor) {
  return svgEl(parent, 'text', { x: x, y: y, 'text-anchor': anchor || 'start' }, cls || 'bd-label', s || '');
}
function box(x, y, w, h, fill, stroke, sw) {
  return svgEl(scene, 'rect', { x: x, y: y, width: w, height: h, rx: 16, fill: fill || 'var(--surface)', stroke: stroke || 'var(--line)', 'stroke-width': sw || 3 });
}
function head(x, y, s) { txt(scene, x, y, s, 'bd-heading'); }
function wide(y, h) {
  svgEl(scene, 'rect', { x: 56, y: y, width: 1812, height: h, rx: 16, fill: 'var(--surface)', stroke: 'var(--guide)', 'stroke-width': 3 });
}
function three(a, b, c) {
  box(56, 176, 560, 268, 'var(--page)', 'var(--observe-line)', 4);
  head(a[0], 214, a[1]); for (var i = 0; i < a[2].length; i++) txt(scene, a[0], 252 + i * 36, a[2][i], a[3] || 't20w');
  box(656, 176, 560, 268, 'var(--page)', 'var(--guide)', 2);
  head(b[0], 214, b[1]); for (var j = 0; j < b[2].length; j++) txt(scene, b[0], 252 + j * 36, b[2][j], b[3] || 't20w');
  box(1256, 176, 612, 268, 'var(--page)', 'var(--alert-line)', 4);
  head(c[0], 214, c[1]); for (var k = 0; k < c[2].length; k++) txt(scene, c[0], 252 + k * 36, c[2][k], c[3] || 't20w');
}
function prose(title, lines) {
  wide(456, 330);
  txt(scene, 80, 490, title, 't24');
  for (var i = 0; i < lines.length; i++) txt(scene, 80, 522 + i * 34, lines[i], 't20w');
}

function drawTop() {
  txt(scene, 56, 146, '触摸屏控制器是“时序指挥家”：屏上的模拟电压由它切换，数值由 ADC 去转换，它自己不算数', 't24w');
  three([80, '分工', ['TSC：状态机与时序', 'TSC 模拟：X/Y 极板切换', 'ADC：真正做转换', 'ADC 触发由 TSC 发起', '转换结果回填到 TSC', '软件只读 MEASURE_VALUE'], 't20w'],
        [680, '能干什么', ['检测有没有触摸', '测触点 X/Y 坐标', '支持 4 线与 5 线', '自动测量或软件握手', '可产生三类中断', '坐标不带屏参，需软件换算'], 't20w'],
        [1280, '用之前', ['ADC 必须已配好位宽', '8/10/12 位与平均在 ADC 侧', '模拟开关供电要正常', '屏的 X/Y 极板接到指定脚', '要配 delay 与预充时间', '否则读数飘或没反应']]);
  prose('这块控制器与 ADC 是“主从”关系：TSC 发起触发、ADC 做转换、结果再回到 TSC 的 MEASURE_VALUE 里等软件读', [
    '因此只配 TSC 不配 ADC，会得到一堆 0 或满量程；只配 ADC 不配 TSC，则没有任何触发来源 —— 两者必须一起初始化。',
    '它也不负责“去抖”与“滤波”：坐标平滑、连击判定、长按识别全在软件层，控制器只给你原始码。',
    '12 位模式下一个轴的分辨力是 1/4096，映射到 800 像素屏时约 0.2 像素；真正决定精度的是屏的线性度与校准。',
    '这套路径适合电阻屏：靠压力接触，需要四线/五线的分压测量；电容屏走的是另一套 I2C 控制器，与本模块无关。',
    '正点原子这类开发板的 4.3 寸/7 寸屏多是电阻屏 + TSC，因此这一章的内容在板子上是“能实际跑起来”的。',
    '一句话：TSC 负责“怎么测”，ADC 负责“测出多少”，软件负责“这算屏幕上的哪个点”。']);
}

function drawWire() {
  txt(scene, 56, 146, '四线与五线的差别不是接线多少，而是“参考电极是否固定”：接错模式，坐标会整片错位或干脆不动', 't24w');
  three([80, '四线', ['X+ / X− / Y+ / Y− 四条', '测 X 时给 X 极板加电压', '读 Y 极板得到分压', '测 Y 时反过来', '结构简单、成本低', '长期按压会磨损'], 't20s'],
        [680, '五线', ['多一根 wiper  sensing', '四角统一加电位', '按压力改变接触电阻', '寿命更长、抗划伤', '需要 4_5_WIRE=1', '换算模型与四线不同'], 't20s'],
        [1280, '配置位', ['BASIC_SETTING[4]', '0 = 四线（默认）', '1 = 五线', '改完要 SW_RST 生效', '接错会读不到坐标', '先看屏的排线定义']]);
  prose('本板用的是四线电阻屏：排线上 X+/X−/Y+/Y− 四根模拟线直连 TSC 的模拟输入，AD 参考电压就是屏的供电', [
    '所以屏的模拟供电（常见 3.3 V）必须稳定：它是测量的“标尺”，电源抖动会直接体现为坐标抖动。',
    '四线屏的一个固有缺陷：按压力度不同，接触电阻不同，读出的分压会整体偏移 —— 轻点与重压的坐标可以差十几个 count。',
    '这也是为什么电阻屏必须“按下后连续采多次取均值”，并且要在驱动里加“压力阈值”把悬空（未按下）的读数滤掉。',
    '五线屏把四角电位固定，测量的是 wiper 上的分压，抗磨损更好；但换算需要知道屏的物理尺寸与角电阻，模型更复杂。',
    '接线错误最典型的表现：X 轴永远读同一个值（极板没被切换），或两个轴读数互换（X/Y 接反）。',
    '判据：笔尖在屏上划一条横线，看 X 值是否单调变化、Y 值是否基本不变；两者都对，说明接线与模式都正确。']);
}

function drawFsm() {
  txt(scene, 56, 146, '状态机只有三段：预充（拉平电位）→ 检测（有没有指头）→ 测量（读 X/Y），然后回到检测', 't24w');
  three([80, '预充', ['先把屏面拉到等电位', '由 PRE_CHARGE_TIME 控制', '时间不足 → 读数偏低', '时间过长 → 响应变慢', '每次测量前都会做', '这是精度第一关'], 't20w'],
        [680, '检测', ['START_SENSE 启动', '等待 detect 信号', 'auto_measure=0 时', '只报中断，等软件决定', 'auto_measure=1 时', '立即接着测坐标'], 't20w'],
        [1280, '测量与复检', ['测完 X 再测 Y', '之后会再检测一次', '若已抬手 → 坐标作废', '这是防误触的关键', '所以有效坐标一定是“双确认”', '软件要按这个语义设计']]);
  prose('“测完再检测一次”是这颗控制器的隐藏质量保证：抬手瞬间的最后一帧不会被当成有效点', [
    '这解释了为什么某些实现里“快速划动时丢点”：划得太快，测量后复检已检测不到触摸，该点被判无效。',
    '若你需要高速划线的连续性，应在软件层做插值/预测，而不是去关掉这个复检机制（关不掉）。',
    'auto_measure 置 1 时不需要软件在中断里再踢一脚，响应更快；但注意手册要求此时必须关掉 detect 中断，否则会重复进中断。',
    'auto_measure 不是硬件自清的：设了就一直是自动模式，想回握手模式要手动清位。',
    'DISABLE 位是“软停机”：置位后硬件做完当前操作回 Idle，软件要查 SW_IDLE 确认，之后寄存器才可安全重配。',
    '判据：把手指按住不动，中断应只来一次 detect + 一组 measure；若中断持续刷屏，说明 auto_measure 与 detect 中断配重了。']);
}

function drawTiming() {
  txt(scene, 56, 146, '两个时间参数决定“准不准”与“跟不跟手”：MEASURE_DELAY_TIME 管等电位，PRE_CHARGE_TIME 管预充长度', 't24w');
  three([80, 'MEASURE_DELAY', ['BASIC_SETTING[31:8]', 'X/Y 测量前的等待', '等屏面电位均匀', '太小：分压未稳，读数偏', '太大：每点耗时增加', '通常按屏尺寸给几十 µs 级'], 't20s'],
        [680, 'PRE_CHARGE', ['在 PS_INPUT_BUFFER 里', '预充阶段时长', '决定极板充到目标电位', '与屏的 RC 常数相关', '大屏要更长', '改后建议重新校准'], 't20w'],
        [1280, '怎么定值', ['先用保守大值跑通', '再逐步减小观察稳定性', '判据：同一位置重复 20 次', 'X/Y 极差 ≤ 3 count', '超过就加大时间', '或加软件多次平均']]);
  prose('调这两个参数的实验很朴素：手指固定在一个点，连采 20 次，看极差；极差大就把时间加长，直到极差不再下降', [
    'MEASURE_DELAY_TIME 是 24 位字段（[31:8]），单位是 TSC 时钟周期；实际取值按屏的 RC 与供电阻抗估算，再实测微调。',
    '预充时间不足的典型现象：每次按下第一帧读数明显偏低，第二帧才正常 —— 因为第一帧没充够。',
    '时间加长的代价是“跟手变差”：每点耗时为“预充 + 检测等待 + 两次测量 + 复检”，这些项相加决定最大报点率。',
    '若你把 delay 拉到很大仍抖动，问题多半不在 TSC：检查屏的模拟电源纹波、地线回流，以及排线是否被电机/LCD 干扰。',
    '软件里的“多次采样取中值”能显著改善手感：电阻屏的噪声是双边的，中值比均值更抗脉冲干扰。',
    '判据：极差 ≤ 3 count 且按下第一帧与后续帧一致，说明时间参数合适；若第一帧总偏，先怀疑预充。']);
}

function drawMap() {
  txt(scene, 56, 146, '八个寄存器，偏移都是 0x10 的整数倍，全部 32 位；没有 SET/CLR 别名，靠读改写', 't24w');
    three([80, '配置类', ['+0x00 BASIC_SETTING', '　MEASURE_DELAY[31:8]', '　[4] 4_5_WIRE', '　[0] AUTO_MEASURE', '+0x10 PS_INPUT_BUFFER_ADDR', '　含 PRE_CHARGE_TIME'], 't20s'],
        [680, '流程类', ['+0x20 FLOW_CONTROL', '　[16] DISABLE 软停机', '　[12] START_SENSE', '　[8] DROP_MEASURE', '　[4] START_MEASURE', '　[0] SW_RST（自清）'], 't20s'],
        [1280, '数据与中断', ['+0x30 MEASURE_VALUE（只读）', '　X_VALUE[27:16] / Y_VALUE[11:0]', '+0x40 INT_EN / +0x50 INT_SIG_EN', '　[5] IDLE / [3] DETECT / [1] MEASURE', '+0x60 INT_STATUS（写 1 清）', '+0x70 / +0x80 DEBUG 两份']]);
  prose('地址规律记住了就不会写错：0x00 设置、0x10 预充、0x20 流程、0x30 数据、0x40 使能、0x50 信号、0x60 状态、0x70/0x80 调试', [
    'INT_EN 是“总开关”，INT_SIG_EN 才是“送到 GIC 的那一路”，两级都要打开中断才会真的进 CPU —— 只开一级是最常见的“中断不来”。',
    'MEASURE_VALUE 是纯只读的：X 在高 12 位（[27:16]）、Y 在低 12 位（[11:0]），一次 32 位读拿到两个轴，天然原子。',
    'FLOW_CONTROL 里除了 SW_RST，其余位都是硬件自清：写 1 触发一次动作，读回来已是 0，别以为没写进去。',
    'SW_RST 会复位所有硬件寄存器，但软件已写的值会被保留？手册明确说“所有软件可访问寄存器保持原设置”，所以它只是复位状态机而非清配置。',
    'DEBUG_MODE 两份是给验证用的，正常驱动不要碰；误写可能让状态机停在半路，表现为“再也检测不到触摸”。',
    '判据：读 0x00 应为你写的值、读 0x30 应在笔按下时变化、读 0x60 在中断后应见对应位置 1 —— 三个都对，地址表就没错。']);
}

function drawFlow() {
  txt(scene, 56, 146, '初始化的正确顺序是“先 ADC 再 TSC”，因为 TSC 的触发要落到一个已经配好的 ADC 上', 't24w');
  three([80, '初始化', ['① 配 ADC：12 位、通道', '② 配 TSC 模拟供电', '③ 写 BASIC_SETTING', '　delay 与 4/5 线', '④ 写 PRE_CHARGE_TIME', '⑤ 开 INT_EN 与 INT_SIG_EN'], 't20s'],
        [680, '运行', ['① 写 START_SENSE 启动探测', '② 等 DETECT 中断', '③ 若 auto=0：写 START_MEASURE', '④ 等 MEASURE 中断', '⑤ 读 0x30 取 X/Y', '⑥ 处理后重新 START_SENSE'], 't20w'],
        [1280, '停机', ['写 DISABLE[16]=1', '轮询 SW_IDLE 确认', '再改配置或断电', '切屏/休眠都要走这步', '直接断电会让状态机悬空', '下次上电需 SW_RST']]);
  prose('握手模式下“重新启动探测”这一步最容易漏：测完一次后状态机回 Idle，不写 START_SENSE 就永远没新事件', [
    '典型 bug：第一次点击正常，之后完全无响应 —— 因为中断处理里忘了再启动探测；看门狗也没报，只是触摸死了。',
    '正确顺序是：读坐标 → 交给上层 → 立刻写 START_SENSE 继续探测；若上层处理慢，就先启动探测再慢慢算。',
    'auto_measure 模式省掉了“写 START_MEASURE”这一步，但依然要（按手册要求）关掉 detect 中断，避免重复进入。',
    '采样率不够时不要盲目加频率：先把“复检”与“预充”的固定开销算清，再决定是否用多次采样换稳定。',
    '若用中断方式，注意 INT_STATUS 是写 1 清：不清就会一直进中断，看起来像“中断风暴”。',
    '判据：连续点击 20 次，每次都应产生一组 DETECT+MEASURE 中断；若第 2 次起没有，九成是忘了重启探测。']);
}

function drawCalib() {
  txt(scene, 56, 146, '控制器只给原始码：想要“点哪是哪”，必须做校准，把原始码经仿射变换映射到像素坐标', 't24w');
  three([80, '两点校准', ['采左上与右下两点', '求 X 的偏移与增益', '求 Y 的偏移与增益', '只修线性与平移', '不修旋转与梯形', '够用但边角误差大'], 't20w'],
        [680, '四点/五点', ['四角各采一点', '可解出一般仿射矩阵', '同时修旋转、镜像、梯形', '推荐用于量产', '系数存到 flash', '换屏必须重校'], 't20w'],
        [1280, '常见换算坑', ['X/Y 接反 → 斜向移动', 'X 镜像 → 左右反', '比例错 → 边角偏移', '未减去压力阈值 → 悬空乱点', '用整数运算要防溢出', '坐标系原点要对齐']]);
  prose('两点校准的式子很直白：x_pix = (x_raw − x_min) × W/(x_max − x_min)，y 同理；四点则解 6 个系数的仿射矩阵', [
    '原始码范围并不等于 0–4095：屏的边沿有边框电阻，实际可用区常是 200–3900 这样的子区间，所以要按实测 min/max 归一。',
    '电阻屏的“线性”只在中间区域好：靠边处电场畸变明显，四点校准正是为了把四角误差摊平。',
    '压力阈值必须单独做：未按下时 ADC 读到的是浮空电平（可能满量程也可能 0），不加阈值就会“没碰也在动”。',
    '温度与老化会让 min/max 缓慢漂移，因此工业产品常在开机时做一次“四角自校”或提供用户校准入口。',
    '若坐标在某个方向被压缩（划同样距离，屏幕上的位移只有一半），先查比例系数，再查是否把 12 位当 10 位用。',
    '判据：校准后点四角与中心，误差都应 ≤ 几个像素；若只有某个角偏大，说明该角接触不良或屏已损伤。']);
}

function draw() {
  while (scene.firstChild) scene.removeChild(scene.firstChild);
  var s = state.step;
  if (s === 0) drawTop();
  else if (s === 1) drawWire();
  else if (s === 2) drawFsm();
  else if (s === 3) drawTiming();
  else if (s === 4) drawMap();
  else if (s === 5) drawFlow();
  else drawCalib();
}

stepper($('prev'), $('next'), $('hint'), STEPS, function (i) { state.step = i; draw(); });
zoomable(document.querySelector('.bd-stage'));
resetButton($('reset'), function () { state.step = INIT.step; draw(); });
fitCanvas($('viewport'), $('canvas'), draw);
</script>
</body>
</html>
